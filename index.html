<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Ledger - MeenaGroups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">

  <style>
    /* --- 1. HIGH CONTRAST NEON THEME --- */
    :root { 
      --bg: #000000; 
      --surface: #0a0a0a;
      --card: #121212; 
      --input-bg: #1a1a1a;
      --primary: #00e676; /* Neon Green */
      --accent: #00b0ff;  /* Bright Blue */
      --danger: #ff1744; 
      --text: #ffffff; 
      --text-muted: #888888;
      --border: #333333; 
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
      margin: 0; padding: 0; 
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* --- 2. HEADER --- */
    header {
      padding: 40px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(to bottom, #0a0a0a, #000);
    }
    header h1 { margin: 0; font-size: 2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
    header p { margin: 5px 0 0; font-size: 0.75rem; color: var(--accent); letter-spacing: 4px; font-weight: 700; text-transform: uppercase; }

    /* --- 3. LOGIN / VERIFICATION SECTION --- */
    .view-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 30px;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      animation: fadeIn 0.5s ease-out;
    }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; color: var(--text-muted); font-size: 0.75rem; margin-bottom: 8px; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
    
    input {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      color: white; padding: 16px; border-radius: 12px; font-size: 1.1rem;
      transition: 0.3s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 176, 255, 0.1); }

    .btn-submit {
      width: 100%; padding: 18px; background: var(--primary); color: #000;
      font-weight: 900; border: none; border-radius: 12px; font-size: 1rem;
      cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
      margin-top: 10px; transition: 0.2s;
    }
    .btn-submit:active { transform: scale(0.98); }

    /* --- 4. PORTAL CONTENT --- */
    #portal-view { display: none; padding: 20px; width: 100%; max-width: 800px; margin: 0 auto; }

    .profile-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      padding: 25px; margin-bottom: 25px; position: relative; overflow: hidden;
    }
    .profile-card::after { content: ''; position: absolute; top:0; left:0; width: 4px; height: 100%; background: var(--accent); }
    .profile-card h2 { margin: 0; font-size: 1.5rem; color: #fff; }
    .profile-card p { margin: 6px 0 0; color: var(--accent); font-family: monospace; font-size: 1rem; font-weight: 700; }

    .ledger-container {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      overflow: hidden; margin-bottom: 30px; animation: slideUp 0.5s ease-out;
    }
    .ledger-header { 
      padding: 18px 20px; background: #111; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .ledger-header h3 { margin: 0; font-size: 1.1rem; color: var(--primary); }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 15px; color: var(--text-muted); border-bottom: 1px solid var(--border); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
    td { padding: 15px; border-bottom: 1px solid #1a1a1a; color: #fff; font-family: monospace; font-size: 0.95rem; }
    
    .amt-in { color: var(--primary); font-weight: 700; }
    .amt-out { color: var(--danger); font-weight: 700; }

    .summary-footer { padding: 20px; background: rgba(0,230,118,0.03); text-align: right; border-top: 1px solid var(--border); }
    .summary-footer label { color: var(--text-muted); font-size: 0.8rem; margin-right: 10px; }
    .summary-footer span { font-size: 1.3rem; font-weight: 800; color: var(--danger); }

    /* --- 5. FOOTER --- */
    footer {
      padding: 40px 20px; text-align: center; border-top: 1px solid var(--border);
      color: var(--text-muted); font-size: 0.8rem; line-height: 1.6;
    }
    footer span { color: var(--primary); font-weight: 700; }

    .logout-btn {
      background: none; border: 1px solid var(--border); color: var(--text-muted);
      padding: 10px 20px; border-radius: 50px; margin-bottom: 25px; cursor: pointer;
      font-weight: 600; font-size: 0.8rem;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 480px) {
        td, th { padding: 12px 10px; }
        .auth-card { padding: 20px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>MeenaGroups</h1>
    <p>Live Ledger Portal</p>
  </header>

  <div id="auth-section" class="view-container">
    <div class="auth-card">
      <div class="form-group">
        <label>Customer ID</label>
        <input type="text" id="custId" placeholder="Enter ID (e.g. M105)" oninput="this.value = this.value.toUpperCase()">
      </div>
      <div class="form-group">
        <label>Last Receipt Due No.</label>
        <input type="number" id="dueNo" placeholder="Enter Due # (e.g. 8)">
      </div>
      <button class="btn-submit" onclick="verifyAccess()">Access Ledger</button>
    </div>
    <p style="color: var(--text-muted); font-size: 0.7rem; margin-top: 25px; text-align: center; max-width: 280px; line-height: 1.5;">
        SECURITY NOTE: Enter your ID and the Due Number found on your latest payment receipt to verify ownership.
    </p>
  </div>

  <div id="portal-view">
    <button class="logout-btn" onclick="location.reload()">← Exit Secure View</button>
    
    <div class="profile-card">
        <h2 id="userName">--</h2>
        <p id="userId">--</p>
    </div>

    <div id="ledgerList">
        </div>
  </div>

  <footer>
    Official MeenaGroups Customer Service Portal<br>
    Powered by <span>Goorac Systems</span>
  </footer>

  <script type="module">
    // Importing configuration from the path provided
    import { db } from "./admin/config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    window.verifyAccess = async () => {
      const idInput = document.getElementById("custId").value.trim().toUpperCase();
      const dueInput = parseInt(document.getElementById("dueNo").value);

      if (!idInput || isNaN(dueInput)) {
        return alert("Please enter both your Customer ID and Last Due Number.");
      }

      const btn = document.querySelector(".btn-submit");
      btn.innerText = "Verifying...";
      btn.disabled = true;

      try {
        const docRef = doc(db, "customers", idInput);
        const snap = await getDoc(docRef);

        if (!snap.exists()) {
          throw "Invalid Customer ID. Please check your receipt.";
        }

        const data = snap.data();
        
        // Product Discovery:
        // Identify products where the latest approved payment matches the provided due number
        const matchedProducts = data.products.filter(p => {
            const payments = p.payments || [];
            if (payments.length === 0) return false;
            // Get the highest due number currently recorded for this product
            const maxDueInRecord = Math.max(...payments.map(pay => pay.dueNumber || 0));
            return maxDueInRecord === dueInput;
        });

        if (matchedProducts.length === 0) {
          throw "Verification Failed: The Due Number provided does not match our records for this ID.";
        }

        // Success: Render the view
        renderPortal(data, matchedProducts);

      } catch (e) {
        alert(e);
        btn.innerText = "Access Ledger";
        btn.disabled = false;
      }
    };

    function renderPortal(customer, products) {
      document.getElementById("auth-section").style.display = "none";
      document.getElementById("portal-view").style.display = "block";
      
      document.getElementById("userName").innerText = customer.name;
      document.getElementById("userId").innerText = `ID: ${customer.id}`;

      const container = document.getElementById("ledgerList");
      container.innerHTML = "";

      products.forEach(p => {
        // Sort payments by due number for the running balance calculation
        const sortedPayments = (p.payments || []).sort((a,b) => (a.dueNumber || 0) - (b.dueNumber || 0));
        
        let rowsHtml = "";
        let runningPaid = 0;

        sortedPayments.forEach(pay => {
            runningPaid += parseFloat(pay.amount);
            const balAfterPay = p.total - runningPaid;

            rowsHtml += `
                <tr>
                    <td>#${pay.dueNumber}</td>
                    <td>${pay.date}</td>
                    <td class="amt-in">₹${pay.amount.toLocaleString()}</td>
                    <td class="amt-out">₹${balAfterPay.toLocaleString()}</td>
                </tr>
            `;
        });

        const card = document.createElement("div");
        card.className = "ledger-container";
        card.innerHTML = `
            <div class="ledger-header">
                <h3>📦 ${p.name}</h3>
                <span style="font-size: 0.75rem; font-weight:700; color: var(--text-muted)">VALUE: ₹${p.total.toLocaleString()}</span>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Due</th>
                            <th>Date</th>
                            <th>Paid</th>
                            <th>Balance</th>
                        </tr>
                    </thead>
                    <tbody>${rowsHtml}</tbody>
                </table>
            </div>
            <div class="summary-footer">
                <label>Outstanding Balance:</label>
                <span>₹${(p.total - runningPaid).toLocaleString()}</span>
            </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
