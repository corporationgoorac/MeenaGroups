<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Portal - MeenaGroups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* * ==========================================
     * 1. PROFESSIONAL CORPORATE THEME
     * ==========================================
     */
    :root { 
      --bg: #050505; 
      --surface: #111111; 
      --card: #1a1a1a; 
      --border: #333;
      
      /* Branding Colors */
      --brand-red: #ff3b30; 
      --brand-white: #ffffff;
      
      /* Status Colors */
      --success: #34c759; /* Approved */
      --pending: #ffcc00; /* Sent to Admin */
      --draft: #0a84ff;   /* With Agent */
      
      --text-main: #ffffff;
      --text-muted: #8e8e93;
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      background: var(--bg); 
      color: var(--text-main); 
      font-family: 'Inter', sans-serif; 
      margin: 0; padding: 0; 
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* * ==========================================
     * 2. BRANDED HEADER
     * ==========================================
     */
    header {
      background: rgba(20, 20, 20, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 20px;
      position: sticky; top: 0; z-index: 50;
      display: flex; justify-content: space-between; align-items: center;
    }

    .brand-logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }
    .brand-meena { color: var(--brand-red); }
    .brand-groups { color: var(--brand-white); }

    .portal-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* * ==========================================
     * 3. AUTHENTICATION SCREEN
     * ==========================================
     */
    .auth-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.6s ease-out;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 40px 30px;
      border-radius: 24px;
      width: 100%; max-width: 380px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .login-header { text-align: center; margin-bottom: 30px; }
    .login-header h2 { margin: 0; font-size: 1.2rem; font-weight: 600; }
    .login-header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 5px; }

    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; color: var(--text-muted); font-size: 0.75rem; margin-bottom: 8px; font-weight: 600; letter-spacing: 0.5px; }
    
    .styled-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      transition: 0.2s;
    }
    .styled-input:focus { border-color: var(--brand-red); box-shadow: 0 0 0 2px rgba(255, 59, 48, 0.2); }

    .btn-primary {
      width: 100%;
      background: var(--brand-red);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s;
      margin-top: 10px;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* * ==========================================
     * 4. MAIN DASHBOARD
     * ==========================================
     */
    #dashboard-view { display: none; padding: 20px; max-width: 900px; margin: 0 auto; padding-bottom: 80px; }

    /* User Profile Header */
    .user-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
    }
    .user-info h1 { margin: 0; font-size: 1.5rem; }
    .user-info p { margin: 5px 0 0; color: var(--text-muted); font-family: monospace; }
    .btn-logout { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }

    /* Product Card */
    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 30px;
    }

    .card-top {
      padding: 20px;
      background: linear-gradient(to bottom, #1a1a1a, #111);
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .prod-name { font-weight: 700; font-size: 1.1rem; }
    .prod-val { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }

    /* Ledger Table - Updated for Mobile Fitness */
    .table-container { width: 100%; } 
    
    .ledger-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    
    .ledger-table th { 
      text-align: left; padding: 15px; color: var(--text-muted); 
      font-weight: 600; font-size: 0.7rem; border-bottom: 1px solid var(--border);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    
    .ledger-table td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
    
    /* Columns Styling */
    .col-due { font-weight: 700; color: #fff; display: block; }
    .col-date { font-size: 0.7rem; color: #666; margin-top: 3px; font-family: monospace; }
    
    .col-amt { font-family: 'Inter', sans-serif; font-weight: 600; color: #fff; }
    
    /* Balance Column (Running Total) */
    .col-bal { font-family: 'Inter', sans-serif; font-weight: 700; color: var(--text-muted); opacity: 0.8; }

    /* Status Badges */
    .status-badge { 
      display: inline-block; padding: 4px 8px; border-radius: 6px; 
      font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .st-approved { color: var(--success); background: rgba(52, 199, 89, 0.15); border: 1px solid rgba(52, 199, 89, 0.2); }
    .st-pending { color: var(--pending); background: rgba(255, 204, 0, 0.15); border: 1px solid rgba(255, 204, 0, 0.2); }
    .st-draft { color: var(--draft); background: rgba(10, 132, 255, 0.15); border: 1px solid rgba(10, 132, 255, 0.2); }

    /* Footer Stats */
    .card-footer {
      padding: 20px; background: #080808; 
      display: flex; justify-content: flex-end; align-items: center; gap: 15px;
      border-top: 1px solid var(--border);
    }
    .footer-label { font-size: 0.8rem; color: var(--text-muted); }
    .footer-val { font-size: 1.4rem; font-weight: 800; color: var(--brand-red); }

    /* * ==========================================
     * 5. FOOTER & ANIMATIONS
     * ==========================================
     */
    .site-footer {
      text-align: center; padding: 40px; color: var(--text-muted); font-size: 0.75rem;
      border-top: 1px solid var(--border); margin-top: auto;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* * ==========================================
     * 6. MOBILE RESPONSIVE FIX (CARD LAYOUT)
     * ==========================================
     */
    @media (max-width: 650px) {
        .ledger-table thead { display: none; } /* Hide Headers */
        
        .ledger-table tr {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2 Column Layout */
            gap: 8px;
            background: #151515;
            margin: 10px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #222;
        }

        .ledger-table td {
            display: block;
            padding: 2px 0;
            border: none;
        }

        /* Detail (Top Left) */
        .td-det { grid-column: 1 / span 1; }
        
        /* Status (Top Right) */
        .td-stat { grid-column: 2 / span 1; text-align: right; }
        
        /* Paid (Bottom Left) */
        .td-pay { grid-column: 1 / span 1; margin-top: 8px; }
        .td-pay::before { content: "Paid: "; color: #555; font-size: 0.7rem; }

        /* Balance (Bottom Right) */
        .td-bal { grid-column: 2 / span 1; text-align: right; margin-top: 8px; }
        .td-bal::before { content: "Bal: "; color: #555; font-size: 0.7rem; }
        
        .card-top, .card-footer { padding: 15px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-logo">
      <span class="brand-meena">MEENA</span><span class="brand-groups">GROUPS</span>
    </div>
    <div class="portal-tag">Client Portal</div>
  </header>

  <div id="auth-section" class="auth-container">
    <div class="login-card">
      <div class="login-header">
        <h2>Secure Access</h2>
        <p>Verify your identity to view detailed ledger.</p>
      </div>
      
      <div class="input-group">
        <label>Customer ID</label>
        <input type="text" id="custId" class="styled-input" placeholder="e.g. M105" oninput="this.value = this.value.toUpperCase()">
      </div>
      
      <div class="input-group">
        <label>Last Receipt Due No.</label>
        <input type="number" id="dueNo" class="styled-input" placeholder="Check your last slip">
      </div>

      <button class="btn-primary" onclick="verifyAccess()">View Ledger</button>
    </div>
  </div>

  <div id="dashboard-view">
    
    <div class="user-header">
      <div class="user-info">
        <h1 id="userName">User Name</h1>
        <p id="userId">ID: --</p>
      </div>
      <button class="btn-logout" onclick="location.reload()">Sign Out</button>
    </div>

    <div id="products-container">
      </div>

  </div>

  <footer class="site-footer">
    <div style="margin-bottom: 5px; font-weight: 600; color: #fff;">MEENA GROUPS FINANCIAL SERVICES</div>
    <div>Powered by Goorac Secure Systems</div>
  </footer>

  <script type="module">
    import { db } from "./admin/config.js";
    import { doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // --- VERIFY & LOGIN ---
    window.verifyAccess = async () => {
      const idInput = document.getElementById("custId").value.trim().toUpperCase();
      const dueInput = parseInt(document.getElementById("dueNo").value);

      if (!idInput || isNaN(dueInput)) return alert("Please enter ID and Due Number.");

      const btn = document.querySelector(".btn-primary");
      btn.innerText = "Verifying...";
      btn.disabled = true;

      try {
        // 1. Fetch Customer Data (Exists Check)
        const docRef = doc(db, "customers", idInput);
        const snap = await getDoc(docRef);

        if (!snap.exists()) throw "Invalid Customer ID.";

        const data = snap.data();
        let accessGranted = false;
        
        // 2. CHECK APPROVED PAYMENTS
        if (data.products) {
            accessGranted = data.products.some(p => {
                if(!p.payments) return false;
                return p.payments.some(pay => pay.dueNumber === dueInput);
            });
        }

        // 3. CHECK PENDING/DRAFT PAYMENTS (Agent Entries)
        if (!accessGranted) {
            const q = query(
                collection(db, "temp_entries"),
                where("customerId", "==", idInput),
                where("dueNumber", "==", dueInput)
            );
            const tempSnap = await getDocs(q);
            if (!tempSnap.empty) {
                accessGranted = true; 
            }
        }

        if (!accessGranted) throw "Verification Failed: Due Number not found in system (Draft or Approved).";

        // 4. Success: Load Data
        await loadDashboard(data, idInput);

      } catch (e) {
        alert(e);
        btn.innerText = "View Ledger";
        btn.disabled = false;
      }
    };

    // --- LOAD DASHBOARD WITH LIVE STATUS ---
    async function loadDashboard(customer, custId) {
      document.getElementById("auth-section").style.display = "none";
      document.getElementById("dashboard-view").style.display = "block";
      
      document.getElementById("userName").innerText = customer.name;
      document.getElementById("userId").innerText = `ID: ${customer.id}`;

      const container = document.getElementById("products-container");
      container.innerHTML = `<div style="text-align:center; padding:40px; color:#666;">Loading live transactions...</div>`;

      // 5. Fetch Temporary Entries (Pending/Drafts)
      let tempEntries = [];
      try {
        const q = query(collection(db, "temp_entries"), where("customerId", "==", custId));
        const tempSnap = await getDocs(q);
        tempSnap.forEach(doc => tempEntries.push(doc.data()));
      } catch(e) { console.error("Live fetch error", e); }

      container.innerHTML = ""; 

      // 6. Render Each Product Ledger
      customer.products.forEach(p => {
        
        // A. Merge Approved Payments
        let allTxns = (p.payments || []).map(pay => ({
          ...pay,
          status: 'approved',
          timestamp: new Date(pay.date).getTime() 
        }));

        // B. Merge Pending/Drafts for THIS product
        const relevantTemps = tempEntries.filter(t => t.productName === p.name);
        
        relevantTemps.forEach(t => {
          allTxns.push({
            dueNumber: t.dueNumber,
            date: t.date,
            amount: t.amount,
            status: t.status, 
            timestamp: t.timestamp ? (t.timestamp.toDate ? t.timestamp.toDate().getTime() : Date.now()) : Date.now()
          });
        });

        // C. Sort by Due Number (Ascending)
        allTxns.sort((a, b) => (a.dueNumber || 0) - (b.dueNumber || 0));

        // D. Calculate Running Balance & Rows
        let runningPaid = 0;
        let rowsHtml = "";

        allTxns.forEach(tx => {
          runningPaid += parseFloat(tx.amount);
          
          let rowBalance = p.total - runningPaid;

          // Status Badge Logic
          let badge = `<span class="status-badge st-approved">PAID</span>`;
          if(tx.status === 'pending') badge = `<span class="status-badge st-pending">PENDING</span>`;
          if(tx.status === 'draft') badge = `<span class="status-badge st-draft">PROCESSING</span>`;

          // Note: Added classes 'td-det', 'td-stat', etc. to enable mobile layout
          rowsHtml += `
            <tr>
              <td class="td-det">
                <span class="col-due">#${tx.dueNumber}</span>
                <span class="col-date">${tx.date}</span>
              </td>
              <td class="td-stat">${badge}</td>
              <td class="td-pay col-amt">₹${parseInt(tx.amount).toLocaleString()}</td>
              <td class="td-bal col-bal">₹${rowBalance.toLocaleString()}</td>
            </tr>
          `;
        });

        const outstanding = p.total - runningPaid;

        // E. Build Card HTML
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <div class="card-top">
            <div class="prod-name">${p.name}</div>
            <div class="prod-val">Val: ₹${p.total.toLocaleString()}</div>
          </div>
          <div class="table-container">
            <table class="ledger-table">
              <thead>
                <tr>
                  <th width="25%">Due Detail</th>
                  <th width="25%">Status</th>
                  <th width="25%">Paid</th>
                  <th width="25%">Balance</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
          <div class="card-footer">
            <div class="footer-label">Outstanding Balance</div>
            <div class="footer-val">₹${outstanding.toLocaleString()}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
