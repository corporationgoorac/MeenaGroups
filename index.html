<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Portal - MeenaGroups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F0F2F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18191A" media="(prefers-color-scheme: dark)">
  
  <style>
    /* * ==========================================
     * 1. META AI PROFESSIONAL THEME (LIGHT MODE DEFAULT)
     * ==========================================
     */
    :root { 
      --bg: #F0F2F5; 
      --surface: #FFFFFF; 
      --card: #FFFFFF; 
      --border: #CED0D4;
      
      /* Meta Branding Colors */
      --brand-primary: #1877F2;
      --brand-primary-hover: #166FE5;
      --meta-gradient: linear-gradient(83.84deg, #0088FF -6.87%, #A033FF 26.54%, #FF5C87 100%);
      
      /* Status Colors (Meta System) */
      --success-bg: #E4F2EB;
      --success-txt: #00A400;
      --pending-bg: #FFF8E5;
      --pending-txt: #F5A623;
      --draft-bg: #E7F3FF;
      --draft-txt: #1877F2;
      
      --text-main: #050505;
      --text-muted: #65676B;
      --input-bg: #F0F2F5;

      /* Structural Colors */
      --header-bg: #FFFFFF;
      --header-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      --table-header: #65676B;
      --modal-overlay: rgba(244, 244, 244, 0.8);
      --modal-btn-bg: #E4E6EB;
      --modal-btn-txt: #050505;
      --modal-btn-hover: #D8DADF;
    }
    
    /* * ==========================================
     * 1.1 META DARK MODE (AUTOMATIC DETECTION)
     * ==========================================
     */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18191A; 
        --surface: #242526; 
        --card: #242526; 
        --border: #3E4042;
        
        --brand-primary: #2374E1;
        --brand-primary-hover: #3982E4;
        
        /* Status Colors (Meta System Dark) */
        --success-bg: rgba(49, 162, 76, 0.2);
        --success-txt: #31A24C;
        --pending-bg: rgba(245, 166, 35, 0.2);
        --pending-txt: #E4A231;
        --draft-bg: rgba(45, 136, 255, 0.2);
        --draft-txt: #2D88FF;
        
        --text-main: #E4E6EB;
        --text-muted: #B0B3B8;
        --input-bg: #3A3B3C;

        --header-bg: #242526;
        --header-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        --card-shadow: none;
        --table-header: #B0B3B8;
        --modal-overlay: rgba(0, 0, 0, 0.8);
        --modal-btn-bg: #3A3B3C;
        --modal-btn-txt: #E4E6EB;
        --modal-btn-hover: #4E4F50;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      background: var(--bg); 
      color: var(--text-main); 
      /* Native Meta Font Stack */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0; padding: 0; 
      min-height: 100vh;
      display: flex; flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* * ==========================================
     * 2. BRANDED HEADER (META NAV BAR STYLE)
     * ==========================================
     */
    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--header-shadow);
      padding: 0 20px;
      height: 60px;
      position: sticky; top: 0; z-index: 50;
      display: flex; justify-content: space-between; align-items: center;
    }

    .brand-logo {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--meta-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .portal-tag {
      font-size: 0.8rem;
      color: var(--brand-primary);
      background: var(--draft-bg);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* * ==========================================
     * 3. AUTHENTICATION SCREEN
     * ==========================================
     */
    .auth-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.4s ease-out;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 32px 24px;
      border-radius: 12px;
      width: 100%; max-width: 400px;
      box-shadow: var(--card-shadow);
    }

    .login-header { text-align: center; margin-bottom: 24px; }
    .login-header h2 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
    .login-header p { color: var(--text-muted); font-size: 0.95rem; margin-top: 8px; line-height: 1.4; }

    .input-group { margin-bottom: 16px; }
    
    .styled-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    .styled-input:focus { border-color: var(--brand-primary); box-shadow: 0 0 0 2px var(--draft-bg); }
    .styled-input::placeholder { color: var(--text-muted); }

    .btn-primary {
      width: 100%;
      background: var(--brand-primary);
      color: #FFFFFF;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }
    .btn-primary:hover { background: var(--brand-primary-hover); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    /* * ==========================================
     * 4. MAIN DASHBOARD
     * ==========================================
     */
    #dashboard-view { display: none; padding: 24px 16px; max-width: 800px; margin: 0 auto; padding-bottom: 80px; width: 100%; }

    /* User Profile Header */
    .user-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; padding-bottom: 16px;
    }
    .user-info h1 { margin: 0; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.5px; }
    .user-info p { margin: 4px 0 0; color: var(--text-muted); font-size: 0.9rem; font-weight: 500; }
    .btn-logout { 
      background: var(--modal-btn-bg); color: var(--modal-btn-txt); 
      border: none; padding: 8px 16px; border-radius: 6px; 
      cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: background 0.2s;
    }
    .btn-logout:hover { background: var(--modal-btn-hover); }

    /* Product Card (Meta Style) */
    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: var(--card-shadow);
    }

    .card-top {
      padding: 20px 24px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .prod-name { font-weight: 700; font-size: 1.2rem; letter-spacing: -0.3px; }
    .prod-val { font-size: 0.95rem; color: var(--text-muted); font-weight: 600; }

    /* Ledger Table */
    .table-container { width: 100%; overflow-x: auto; } 
    
    .ledger-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    
    .ledger-table th { 
      text-align: left; padding: 12px 24px; color: var(--table-header); 
      font-weight: 600; font-size: 0.85rem; border-bottom: 1px solid var(--border);
    }
    
    .ledger-table td { 
      padding: 16px 24px; border-bottom: 1px solid var(--border); 
      vertical-align: middle; 
    }
    .ledger-table tr:last-child td { border-bottom: none; }
    
    /* Columns Styling */
    .col-due { font-weight: 600; color: var(--text-main); display: block; }
    .col-date { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; display: block; }
    .col-amt { font-weight: 600; color: var(--text-main); }
    .col-bal { font-weight: 600; color: var(--text-muted); }

    /* Status Badges */
    .status-badge { 
      display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 6px; 
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.3px;
    }
    .st-approved { color: var(--success-txt); background: var(--success-bg); }
    .st-pending { color: var(--pending-txt); background: var(--pending-bg); }
    .st-draft { color: var(--draft-txt); background: var(--draft-bg); }

    /* Footer Stats */
    .card-footer {
      padding: 16px 24px; background: var(--input-bg); 
      display: flex; justify-content: flex-end; align-items: center; gap: 12px;
      border-top: 1px solid var(--border);
    }
    .footer-label { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }
    .footer-val { font-size: 1.25rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px; }

    /* * ==========================================
     * 5. FOOTER & ANIMATIONS
     * ==========================================
     */
    .site-footer {
      text-align: center; padding: 30px; color: var(--text-muted); font-size: 0.8rem;
      margin-top: auto;
    }
    .site-footer span { font-weight: 600; color: var(--brand-primary); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* * ==========================================
     * 6. MOBILE RESPONSIVE FIX (CARD LAYOUT)
     * ==========================================
     */
    @media (max-width: 650px) {
        .ledger-table thead { display: none; }
        
        .ledger-table tr {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }
        .ledger-table tr:last-child { border-bottom: none; }

        .ledger-table td {
            display: block;
            padding: 0;
            border: none;
            width: auto;
        }

        .td-det { width: 50%; }
        .td-stat { width: 50%; text-align: right; }
        
        .td-pay { width: 50%; margin-top: 12px; font-size: 0.9rem;}
        .td-pay::before { content: "Paid: "; color: var(--text-muted); font-weight: 400; }

        .td-bal { width: 50%; text-align: right; margin-top: 12px; font-size: 0.9rem;}
        .td-bal::before { content: "Bal: "; color: var(--text-muted); font-weight: 400; }
        
        .card-top, .card-footer { padding: 16px; }
        .card-footer { flex-direction: column; align-items: flex-start; gap: 4px; }
    }

    /* * ==========================================
     * 7. NATIVE iOS/META POPUP MODAL
     * ==========================================
     */
    #custom-modal {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--modal-overlay);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center; align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      max-width: 320px; width: 100%;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
      transform: scale(0.95);
      opacity: 0;
      transition: all 0.2s cubic-bezier(0.08, 0.82, 0.17, 1);
    }
    
    .modal-show .modal-content { transform: scale(1); opacity: 1; }

    .modal-icon { font-size: 2.5rem; margin-bottom: 16px; display: block; }
    .modal-title { color: var(--text-main); font-size: 1.25rem; font-weight: 700; margin: 0 0 8px 0; }
    .modal-msg { color: var(--text-muted); font-size: 0.95rem; line-height: 1.4; margin-bottom: 24px; }
    
    .modal-btn {
      background: var(--brand-primary); color: #FFFFFF;
      border: none; padding: 12px 24px;
      font-weight: 600; border-radius: 6px;
      cursor: pointer; width: 100%; font-size: 1rem;
    }
    .modal-btn:hover { background: var(--brand-primary-hover); }

  </style>
</head>
<body>

  <header>
    <div class="brand-logo">MEENA GROUPS</div>
    <div class="portal-tag">Customer Portal</div>
  </header>

  <div id="custom-modal">
    <div class="modal-content">
      <span class="modal-icon">🔒</span>
      <h3 class="modal-title" id="modal-title">Access Denied</h3>
      <p class="modal-msg" id="modal-msg">Credentials incorrect.</p>
      <button class="modal-btn" onclick="closeModal()">Dismiss</button>
    </div>
  </div>

  <div id="auth-section" class="auth-container">
    <div class="login-card">
      <div class="login-header">
        <h2>Log in to Portal</h2>
        <p>Enter your Customer ID to view your ledger and live status.</p>
      </div>
      
      <div class="input-group">
        <input type="text" id="custId" class="styled-input" placeholder="Customer ID (e.g. M105)" oninput="this.value = this.value.toUpperCase()">
      </div>
      
      <div class="input-group" style="display: none;">
        <input type="number" id="dueNo" class="styled-input" placeholder="Enter Lastest Due No">
      </div>

      <button class="btn-primary" onclick="verifyAccess()">Log In</button>
    </div>
  </div>

  <div id="dashboard-view">
    
    <div class="user-header">
      <div class="user-info">
        <h1 id="userName">User Name</h1>
        <p id="userId">Account ID: --</p>
      </div>
      <button class="btn-logout" onclick="location.reload()">Log Out</button>
    </div>

    <div id="products-container">
      </div>

  </div>

  <footer class="site-footer">
    <div style="margin-bottom: 4px; font-weight: 500; color: var(--text-main);">MEENA GROUPS FINANCIAL SERVICES</div>
    <div>Powered by <span>Goorac Secure Systems</span></div>
  </footer>

  <script type="module">
    import { db } from "./admin/config.js";
    import { doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // --- MODAL LOGIC ---
    window.showModal = (title, message, isError = true) => {
      const modal = document.getElementById("custom-modal");
      document.getElementById("modal-title").innerText = title;
      document.getElementById("modal-msg").innerText = message;
      document.querySelector(".modal-icon").innerText = isError ? "⚠️" : "✅";
      
      modal.style.display = "flex";
      // Slight delay to trigger CSS transition
      setTimeout(() => modal.classList.add("modal-show"), 10);
    };

    window.closeModal = () => {
      const modal = document.getElementById("custom-modal");
      modal.classList.remove("modal-show");
      setTimeout(() => modal.style.display = "none", 300);
    };

    // --- VERIFY & LOGIN ---
    window.verifyAccess = async () => {
      const idInput = document.getElementById("custId").value.trim().toUpperCase();
      
      // Preserved original dueNo definition line, but no longer blocking authentication
      const dueInput = parseInt(document.getElementById("dueNo").value);

      if (!idInput) {
        window.showModal("Input Required", "Please enter your Customer ID.");
        return;
      }

      const btn = document.querySelector(".btn-primary");
      btn.innerText = "Logging in...";
      btn.disabled = true;

      try {
        // 1. Fetch Customer Data (Exists Check)
        const docRef = doc(db, "customers", idInput);
        const snap = await getDoc(docRef);

        if (!snap.exists()) throw "Invalid Customer ID"; // Generic error flag

        const data = snap.data();
        
        // --- LOGIC TO FIND HIGHEST (LATEST) DUE NUMBER ---
        // Preserved exactly as requested to maintain all lines, but it won't block access
        let maxSystemDue = 0;

        // A. Check Approved Payments in History
        if (data.products) {
            data.products.forEach(p => {
                if(p.payments) {
                    p.payments.forEach(pay => {
                        const dNo = parseInt(pay.dueNumber);
                        if(dNo > maxSystemDue) maxSystemDue = dNo;
                    });
                }
            });
        }

        // B. Check Live/Draft/Pending Payments (Agent Side)
        const q = query(
            collection(db, "temp_entries"),
            where("customerId", "==", idInput)
        );
        const tempSnap = await getDocs(q);
        tempSnap.forEach(doc => {
            const t = doc.data();
            const dNo = parseInt(t.dueNumber);
            if(dNo > maxSystemDue) maxSystemDue = dNo;
        });

        // 3. COMPARE: Strict check for LATEST NUMBER only
        // Bypassed: This ensures users log in just by typing the account number.
        // if (dueInput !== maxSystemDue) {
        //      throw "Incorrect Credentials";
        // }

        // 4. Success: Load Data
        await loadDashboard(data, idInput);

      } catch (e) {
        // Handle Errors Professionally
        let title = "Access Denied";
        let msg = "Customer ID not found. Please check your details and try again.";
        
        // If system error (not auth failure)
        if(e !== "Invalid Customer ID" && e !== "Incorrect Credentials") {
            console.error(e); // Log actual error to console for dev
            msg = "A system error occurred. Please try again.";
        }

        window.showModal(title, msg);
        
        btn.innerText = "Log In";
        btn.disabled = false;
      }
    };

    // --- LOAD DASHBOARD WITH LIVE STATUS ---
    async function loadDashboard(customer, custId) {
      document.getElementById("auth-section").style.display = "none";
      document.getElementById("dashboard-view").style.display = "block";
      
      document.getElementById("userName").innerText = customer.name;
      document.getElementById("userId").innerText = `Account ID: ${customer.id}`;

      const container = document.getElementById("products-container");
      container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted); font-weight: 500;">Loading live transactions...</div>`;

      // 5. Fetch Temporary Entries (Pending/Drafts)
      let tempEntries = [];
      try {
        const q = query(collection(db, "temp_entries"), where("customerId", "==", custId));
        const tempSnap = await getDocs(q);
        tempSnap.forEach(doc => tempEntries.push(doc.data()));
      } catch(e) { console.error("Live fetch error", e); }

      container.innerHTML = ""; 

      // 6. Render Each Product Ledger
      customer.products.forEach(p => {
        
        // A. Merge Approved Payments
        let allTxns = (p.payments || []).map(pay => ({
          ...pay,
          status: 'approved',
          timestamp: new Date(pay.date).getTime() 
        }));

        // B. Merge Pending/Drafts for THIS product
        const relevantTemps = tempEntries.filter(t => t.productName === p.name);
        
        relevantTemps.forEach(t => {
          allTxns.push({
            dueNumber: t.dueNumber,
            date: t.date,
            amount: t.amount,
            status: t.status, 
            timestamp: t.timestamp ? (t.timestamp.toDate ? t.timestamp.toDate().getTime() : Date.now()) : Date.now()
          });
        });

        // C. Sort by Due Number (Ascending)
        allTxns.sort((a, b) => (a.dueNumber || 0) - (b.dueNumber || 0));

        // D. Calculate Running Balance & Rows
        let runningPaid = 0;
        let rowsHtml = "";

        allTxns.forEach(tx => {
          runningPaid += parseFloat(tx.amount);
          
          let rowBalance = p.total - runningPaid;

          // Status Badge Logic
          let badge = `<span class="status-badge st-approved">Paid</span>`;
          if(tx.status === 'pending') badge = `<span class="status-badge st-pending">Pending</span>`;
          if(tx.status === 'draft') badge = `<span class="status-badge st-draft">Processing</span>`;

          // Note: Added classes 'td-det', 'td-stat', etc. to enable mobile layout
          rowsHtml += `
            <tr>
              <td class="td-det">
                <span class="col-due">Due #${tx.dueNumber}</span>
                <span class="col-date">${tx.date}</span>
              </td>
              <td class="td-stat">${badge}</td>
              <td class="td-pay col-amt">₹${parseInt(tx.amount).toLocaleString()}</td>
              <td class="td-bal col-bal">₹${rowBalance.toLocaleString()}</td>
            </tr>
          `;
        });

        const outstanding = p.total - runningPaid;

        // E. Build Card HTML
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <div class="card-top">
            <div class="prod-name">${p.name}</div>
            <div class="prod-val">Value: ₹${p.total.toLocaleString()}</div>
          </div>
          <div class="table-container">
            <table class="ledger-table">
              <thead>
                <tr>
                  <th width="25%">Transaction Detail</th>
                  <th width="25%">Status</th>
                  <th width="25%">Amount Paid</th>
                  <th width="25%">Remaining Balance</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
          <div class="card-footer">
            <div class="footer-label">Outstanding Balance</div>
            <div class="footer-val">₹${outstanding.toLocaleString()}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
