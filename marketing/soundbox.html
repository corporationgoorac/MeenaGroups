<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meena Marketing - Live Sound Box</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b111a;
            --surface-color: #131b26;
            --surface-hover: #1b2636;
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6; 
            --success-color: #10b981; 
            --warning-color: #f59e0b; 
            --meena-red: #ef4444;
            --input-border: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .soundbox-container {
            background: linear-gradient(145deg, var(--surface-color), #1e293b);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            margin-top: 20px;
        }

        /* --- Speaker Animation --- */
        .speaker-mesh {
            width: 100px;
            height: 100px;
            background: #090d16;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid var(--input-border);
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }
        .speaker-mesh .material-symbols-outlined { font-size: 40px; color: var(--text-secondary); transition: all 0.3s; }
        
        .speaker-mesh.active-sale { border-color: var(--success-color); box-shadow: 0 0 25px rgba(16, 185, 129, 0.5); }
        .speaker-mesh.active-sale .material-symbols-outlined { color: var(--success-color); transform: scale(1.1); }
        
        .speaker-mesh.active-alert { border-color: var(--meena-red); box-shadow: 0 0 25px rgba(239, 68, 68, 0.5); }
        .speaker-mesh.active-alert .material-symbols-outlined { color: var(--meena-red); transform: scale(1.1); }

        h1 { font-size: 22px; margin: 0 0 5px 0; font-weight: 700; }
        .sub-tag { color: var(--text-secondary); font-size: 13px; margin-bottom: 25px; display: block; }

        .engine-btn {
            background: linear-gradient(135deg, var(--accent-color), #2563eb);
            color: white; border: none; padding: 16px 24px; font-size: 16px; font-weight: 700;
            border-radius: 12px; cursor: pointer; width: 100%; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }
        .engine-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(59, 130, 246, 0.4); }
        .engine-btn:disabled { background: #334155; color: var(--text-secondary); cursor: not-allowed; transform: none; box-shadow: none; }

        .status-badge {
            margin-top: 20px; font-size: 13px; font-weight: 600; color: #ef4444;
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.02);
            padding: 8px 16px; border-radius: 20px; border: 1px solid var(--input-border);
        }
        .status-badge.online { color: var(--success-color); }

        /* --- Log & Card UI --- */
        .log-container { margin-top: 30px; text-align: left; width: 100%; max-width: 500px; }
        .log-title { font-size: 12px; text-transform: uppercase; color: var(--text-secondary); font-weight: 700; letter-spacing: 1px; margin-bottom: 15px; text-align: center; }
        
        #broadcastLog { display: flex; flex-direction: column; gap: 12px; max-height: 400px; overflow-y: auto; padding-right: 5px; }

        .log-card {
            background: var(--surface-color);
            border-radius: 12px; padding: 16px;
            border: 1px solid var(--input-border);
            display: flex; gap: 15px; align-items: flex-start;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; overflow: hidden;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }

        .card-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .card-content { flex-grow: 1; min-width: 0; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .card-title { font-weight: 700; font-size: 14px; }
        .card-time { font-size: 11px; color: var(--text-secondary); }
        .card-details { font-size: 13px; color: #e2e8f0; line-height: 1.5; }
        .card-highlight { font-weight: 700; font-size: 15px; margin-top: 6px; display: block; }

        /* Sales Specific Card */
        .log-card.sale { border-left: 4px solid var(--success-color); }
        .log-card.sale .card-icon { background: rgba(16, 185, 129, 0.15); color: var(--success-color); border: 1px solid rgba(16, 185, 129, 0.3); }
        .log-card.sale .card-highlight { color: var(--success-color); }

        /* Alert Specific Card */
        .log-card.alert { border-left: 4px solid var(--meena-red); }
        .log-card.alert .card-icon { background: rgba(239, 68, 68, 0.15); color: var(--meena-red); border: 1px solid rgba(239, 68, 68, 0.3); }
        .log-card.alert .card-highlight { color: var(--warning-color); }

    </style>
</head>
<body>

    <div class="soundbox-container">
        <div class="speaker-mesh" id="speakerMesh">
            <span class="material-symbols-outlined" id="speakerIcon">volume_off</span>
        </div>

        <h1>Live Alert Sound Box</h1>
        <span class="sub-tag">Meena Marketing Audio Output Panel</span>

        <button class="engine-btn" id="startBtn">
            <span class="material-symbols-outlined">power_settings_new</span>
            Power On Sound Box
        </button>

        <div>
            <div class="status-badge" id="statusBadge">
                <span class="material-symbols-outlined" style="font-size: 16px;">radio_button_checked</span>
                System Standby
            </div>
        </div>
    </div>

    <div class="log-container">
        <div class="log-title">Recent Announcements</div>
        <div id="broadcastLog">
            <div style="color: var(--text-secondary); font-size: 13px; text-align: center; padding: 20px; background: var(--surface-color); border-radius: 12px; border: 1px dashed var(--input-border);">
                System offline. Click 'Power On' to begin monitoring.
            </div>
        </div>
    </div>

    <script type="module">
        import { db, auth } from './config.js';
        import { collection, query, where, orderBy, limit, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

        // --- AUTHENTICATION CHECK ---
        if (auth) {
            onAuthStateChanged(auth, (user) => {
                if (!user) {
                    window.location.replace('login.html'); // Redirect to login if unauthenticated[span_3](start_span)[span_3](end_span)
                }
            });
        } else {
            window.location.replace('login.html');
        }

        // --- TAMIL DICTIONARIES ---
        const tamilNumbers = {
            1: 'ஒன்று', 2: 'இரண்டு', 3: 'மூன்று', 4: 'நான்கு', 5: 'ஐந்து',
            6: 'ஆறு', 7: 'ஏழு', 8: 'எட்டு', 9: 'ஒன்பது', 10: 'பத்து'
        };

        const reasonTranslations = {
            "Damaged Product": "பழுதான பொருள்",
            "Sent to Meena Agency": "மீனா ஏஜென்சிக்கு அனுப்பப்பட்டுள்ளது",
            "Product Missing": "பொருள் காணவில்லை",
            "Returned to Dealer": "டீலருக்கு திருப்பி அனுப்பப்பட்டுள்ளது",
            "Gift to Customer": "வாடிக்கையாளருக்கு பரிசு",
            "Counting Mistake": "எண்ணிக்கை தவறு",
            "Customer Return": "வாடிக்கையாளர் திருப்பிக் கொடுத்தது",
            "New Stock": "புதிய சரக்கு"
        };

        // --- DYNAMIC TAMIL TEMPLATES ---
        const salesTemplates = [
            "கடையில், [ITEMS], ரூ [AMOUNT]-க்கு விற்பனை ஆகி உள்ளது.",
            "நற்செய்தி! [ITEMS], மொத்தம் [AMOUNT] ரூபாய்க்கு விற்பனையாகியுள்ளது.",
            "ஒரு புதிய விற்பனை நடந்துள்ளது. [ITEMS], [AMOUNT] ரூபாய்க்கு விற்கப்பட்டுள்ளது.",
            "மீனா மார்க்கெட்டிங்கில் தற்போது, [ITEMS], [AMOUNT] ரூபாய்க்கு பில் செய்யப்பட்டுள்ளது.",
            "சிறப்பு! வாடிக்கையாளர் [ITEMS]-ஐ, [AMOUNT] ரூபாய்க்கு வாங்கியுள்ளார்.",
            "கவனத்திற்கு! [ITEMS], [AMOUNT] ரூபாய்க்கு வெற்றிகரமாக விற்பனை செய்யப்பட்டுள்ளது.",
            "[ITEMS], மொத்தம் [AMOUNT] ரூபாய் மதிப்பிற்கு விற்பனையாகி உள்ளது.",
            "மகிழ்ச்சியான செய்தி! கடையில் [ITEMS], [AMOUNT] ரூபாய்க்கு விற்பனை முடிந்துள்ளது.",
            "தற்போது [ITEMS], [AMOUNT] ரூபாய்க்கு விற்கப்பட்டுள்ளது.",
            "[ITEMS] வாங்கியதற்கான புதிய பில், [AMOUNT] ரூபாய்க்கு உருவாக்கப்பட்டுள்ளது.",
            "அருமை! [AMOUNT] ரூபாய் மதிப்பிலான [ITEMS] தற்போது விற்பனையாகியுள்ளது.",
            "மீனா மார்க்கெட்டிங்கின் புதிய விற்பனை! [AMOUNT] ரூபாய்க்கு [ITEMS] விற்கப்பட்டுள்ளது.",
            "கல்லாவில் புதிய வரவு! [ITEMS] விற்பனையாகி, [AMOUNT] ரூபாய் பெறப்பட்டுள்ளது.",
            "ஒரு வெற்றிகரமான விற்பனை! [ITEMS], [AMOUNT] ரூபாய்க்கு கொடுக்கப்பட்டுள்ளது.",
            "வாடிக்கையாளர் ஒருவர் [AMOUNT] ரூபாய்க்கு, [ITEMS]-ஐ வாங்கியுள்ளார்."
        ];

        const alertTemplates = [
            "கவனம்! [PRODUCT], [QTY] எண்ணிக்கை குறைக்கப்பட்டுள்ளது. காரணம்: [REASON].",
            "எச்சரிக்கை! [PRODUCT], [QTY] இருப்பு எடுக்கப்பட்டுள்ளது. இதற்கான காரணம், [REASON].",
            "நிர்வாகியின் கவனத்திற்கு! [REASON] காரணமாக, [PRODUCT] இருப்பில் [QTY] குறைந்துள்ளது.",
            "முக்கிய தகவல். [PRODUCT] இருப்பிலிருந்து [QTY] நீக்கப்பட்டுள்ளது. காரணம்: [REASON].",
            "ஸ்டாக் அப்டேட்! [PRODUCT], [QTY] எண்ணிக்கை குறைக்கப்பட்டுள்ளது. காரணம்: [REASON].",
            "[REASON] என்பதனால், [PRODUCT] [QTY] எண்ணிக்கை இருப்பிலிருந்து எடுக்கப்பட்டுள்ளது.",
            "கவனிக்கவும், [PRODUCT] இருப்பு [QTY] குறைக்கப்பட்டுள்ளது. காரணம்: [REASON].",
            "இருப்பு மாற்றம் செய்யப்பட்டுள்ளது! [PRODUCT], [QTY] எண்ணிக்கை குறைந்தது. காரணம்: [REASON].",
            "[PRODUCT]-ன் ஸ்டாக் [QTY] குறைக்கப்பட்டுள்ளது. அதற்கான காரணம்: [REASON].",
            "கவனத்திற்கு, [REASON] என்ற காரணத்தினால், [PRODUCT] [QTY] எடுக்கப்பட்டுள்ளது."
        ];

        function getRandomTemplate(templateArray) {
            const randomIndex = Math.floor(Math.random() * templateArray.length);
            return templateArray[randomIndex];
        }

        // --- SYSTEM VARIABLES ---
        let audioQueue = [];
        let isSpeaking = false;
        let systemActive = false;
        let sessionStartTime = new Date();

        const startBtn = document.getElementById('startBtn');
        const speakerMesh = document.getElementById('speakerMesh');
        const speakerIcon = document.getElementById('speakerIcon');
        const broadcastLog = document.getElementById('broadcastLog');

        startBtn.addEventListener('click', () => {
            if (systemActive) return;
            systemActive = true;
            sessionStartTime = new Date(); 
            
            startBtn.disabled = true;
            startBtn.innerHTML = `<span class="material-symbols-outlined">sensors</span> Listening Live...`;
            document.getElementById('statusBadge').classList.add('online');
            document.getElementById('statusBadge').innerHTML = `<span class="material-symbols-outlined" style="font-size:16px;">dynamic_feed</span> Online & Protected`;
            speakerIcon.innerText = 'volume_up';
            broadcastLog.innerHTML = ''; 

            initSalesListener();
            initReductionListener();
            
            speakText("மீனா மார்க்கெட்டிங் சவுண்ட் பாக்ஸ் தயார்.");
        });

        // 1. OPTIMIZED & RANDOMIZED SALES LISTENER
        function initSalesListener() {
            const salesQuery = query(
                collection(db, "sellings"),
                where("createdAt", ">=", sessionStartTime),
                orderBy("createdAt", "desc"),
                limit(1)
            );

            onSnapshot(salesQuery, (snapshot) => {
                if (snapshot.empty) return;

                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const data = change.doc.data();
                        
                        // Parse Tamil Phrase
                        let parsedItemText = '';
                        let itemNamesForUI = [];

                        if (data.items && Array.isArray(data.items) && data.items.length > 0) {
                            if (data.items.length === 1) {
                                const item = data.items[0];
                                const pName = item.name || 'பொருள்';
                                const pQty = parseInt(item.qty) || 1;
                                const qtyInTamil = tamilNumbers[pQty] || pQty.toString();
                                parsedItemText = `${pName} ${qtyInTamil}`;
                                itemNamesForUI.push(`${pName} (x${pQty})`);
                            } else {
                                let parts = [];
                                data.items.forEach((item) => {
                                    const pName = item.name || 'பொருள்';
                                    const pQty = parseInt(item.qty) || 1;
                                    const qtyInTamil = tamilNumbers[pQty] || pQty.toString();
                                    parts.push(`${pName} ${qtyInTamil}`);
                                    itemNamesForUI.push(`${pName} (x${pQty})`);
                                });
                                const lastPart = parts.pop();
                                parsedItemText = parts.join(', ') + ', மற்றும் ' + lastPart;
                            }
                        } else {
                            parsedItemText = 'பொருட்கள்';
                        }

                        const totalAmount = Math.round(data.totals?.grand || 0);
                        
                        let rawTemplate = getRandomTemplate(salesTemplates);
                        let ttsPhrase = rawTemplate
                            .replace('[ITEMS]', parsedItemText)
                            .replace('[AMOUNT]', totalAmount);

                        const uiData = {
                            title: `New Sale: ${data.invoiceNo || 'INV'}`,
                            details: itemNamesForUI.join('<br>'),
                            highlight: `₹${totalAmount.toLocaleString()}`
                        };

                        queueSpeech(ttsPhrase, "sale", uiData);
                    }
                });
            });
        }

        // 2. ZERO-WASTE & RANDOMIZED REDUCTION LISTENER
        function initReductionListener() {
            const reductionDocRef = doc(db, "alerts", "stock_reduction");

            onSnapshot(reductionDocRef, (docSnap) => {
                if (!docSnap.exists()) return;
                
                const data = docSnap.data();
                if (data.lastUpdated) {
                    const updateTime = new Date(data.lastUpdated);
                    if (updateTime < sessionStartTime) return; 
                }

                const prodName = data.name || "பொருள்";
                const oldQty = data.previousQty || 0;
                const newQty = data.qty || 0;
                const reducedQty = oldQty - newQty;
                
                if (reducedQty <= 0) return;

                const englishReason = data.lastEditReason || "Unknown";
                const tamilReason = reasonTranslations[englishReason] || englishReason; 
                
                const qtyInTamil = tamilNumbers[reducedQty] || reducedQty.toString();

                let rawTemplate = getRandomTemplate(alertTemplates);
                let ttsPhrase = rawTemplate
                    .replace('[PRODUCT]', prodName)
                    .replace('[QTY]', qtyInTamil)
                    .replace('[REASON]', tamilReason);

                const uiData = {
                    title: `Stock Reduced`,
                    details: `${prodName}<br>Reduced by: ${reducedQty} (Now: ${newQty})`,
                    highlight: englishReason
                };

                queueSpeech(ttsPhrase, "alert", uiData);
            });
        }

        // --- AUDIO ENGINE ---
        function queueSpeech(text, type, uiData) {
            audioQueue.push({ text, type, uiData });
            if (uiData) addCardToLog(type, uiData);
            if (!isSpeaking) processNextAudio();
        }

        function processNextAudio() {
            if (audioQueue.length === 0) {
                isSpeaking = false;
                speakerMesh.className = 'speaker-mesh'; 
                return;
            }

            isSpeaking = true;
            const currentItem = audioQueue.shift();
            
            if (currentItem.type) {
                speakerMesh.className = `speaker-mesh ${currentItem.type === 'sale' ? 'active-sale' : (currentItem.type === 'alert' ? 'active-alert' : '')}`;
            }
            
            speakText(currentItem.text);
        }

        function speakText(textToSpeak) {
            const baseApiUrl = "https://shiva757-tts.hf.space/api/speak";
            const fullRequestUrl = `${baseApiUrl}?text=${encodeURIComponent(textToSpeak)}`;
            const liveAudio = new Audio(fullRequestUrl);
            
            liveAudio.play()
                .then(() => {
                    liveAudio.onended = () => processNextAudio();
                })
                .catch((error) => {
                    console.error("Playback failed: ", error);
                    setTimeout(processNextAudio, 1000);
                });
        }

        // --- DYNAMIC CARD UI RENDERER ---
        function addCardToLog(type, uiData) {
            const time = new Date().toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit' });
            
            let iconStr = type === 'sale' ? 'shopping_cart_checkout' : 'trending_down';
            let cardClass = type === 'sale' ? 'sale' : 'alert';

            const cardHtml = `
                <div class="log-card ${cardClass}">
                    <div class="card-icon">
                        <span class="material-symbols-outlined">${iconStr}</span>
                    </div>
                    <div class="card-content">
                        <div class="card-header">
                            <span class="card-title">${uiData.title}</span>
                            <span class="card-time">${time}</span>
                        </div>
                        <div class="card-details">${uiData.details}</div>
                        <span class="card-highlight">${uiData.highlight}</span>
                    </div>
                </div>
            `;

            broadcastLog.insertAdjacentHTML('afterbegin', cardHtml);
            
            if (broadcastLog.children.length > 10) {
                broadcastLog.lastElementChild.remove();
            }
        }
    </script>
</body>
</html>
