<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Prefix Migration</title>
</head>
<body style="background:#121212; color:white; text-align:center; padding:50px; font-family:sans-serif;">
    <h2>Upgrade Database for Partial Search</h2>
    <button id="btnStart" style="padding:15px 30px; font-size:1.1em; cursor:pointer;">Start Prefix Upgrade</button>
    <div id="status" style="margin-top:20px;">Waiting...</div>

    <script type="module">
        import { db } from './config.js';
        import { collection, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        function generateKeywords(name, model) {
            const combinedText = `${name || ''} ${model || ''}`.toLowerCase();
            const wordsArray = combinedText.split(/[\s\-_]+/).filter(word => word.trim().length > 0);
            const prefixes = new Set();
            wordsArray.forEach(word => {
                let prefix = '';
                for (let i = 0; i < word.length; i++) {
                    prefix += word[i];
                    prefixes.add(prefix);
                }
            });
            return [...prefixes];
        }

        document.getElementById('btnStart').addEventListener('click', async () => {
            const btn = document.getElementById('btnStart');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.innerText = "Fetching 10,000 items... Please wait.";

            try {
                const snap = await getDocs(collection(db, "inventory"));
                const docs = snap.docs;
                let processed = 0;

                for (let i = 0; i < docs.length; i += 500) {
                    const chunk = docs.slice(i, i + 500);
                    const batch = writeBatch(db);
                    
                    chunk.forEach(d => {
                        const data = d.data();
                        batch.update(d.ref, { searchKeywords: generateKeywords(data.name, data.model) });
                    });
                    
                    await batch.commit();
                    processed += chunk.length;
                    status.innerText = `Upgraded ${processed} / ${docs.length} products...`;
                }
                
                status.innerText = "SUCCESS! You can now search by partial words.";
                alert("Done! You can delete this file now.");
            } catch (e) {
                status.innerText = "Error: " + e.message;
            }
        });
    </script>
</body>
</html>
