<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Migration - Goorac</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #212121;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #333;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 0; color: #ff3333; }
        p { color: #aaaaaa; line-height: 1.5; }
        button {
            background: #0056b3;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }
        button:hover { background: #007bff; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        #statusArea {
            margin-top: 25px;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #444;
            font-family: monospace;
            text-align: left;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-entry { margin-bottom: 5px; font-size: 0.9em; }
        .success { color: #00c853; font-weight: bold; }
        .error { color: #ff3333; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Database Migration Tool</h2>
        <p>This script will safely fetch all inventory records and generate searchable keyword arrays for each product. <strong>Do not close this tab once started.</strong></p>
        
        <button id="btnStart">Start Migration</button>
        
        <div id="statusArea">
            <div class="log-entry">Waiting to start...</div>
        </div>
    </div>

    <script type="module">
        // Import your existing config exactly as you do in the main app
        import { db } from './config.js';
        import { collection, getDocs, writeBatch, doc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        function log(message, type = "normal") {
            const statusArea = document.getElementById('statusArea');
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            div.innerText = `> ${message}`;
            statusArea.appendChild(div);
            statusArea.scrollTop = statusArea.scrollHeight;
        }

        // Helper to generate an array of searchable lowercase words
        function generateKeywords(name, model) {
            const combinedText = `${name || ''} ${model || ''}`.toLowerCase();
            // Split by spaces, hyphens, or underscores, and filter out empty strings
            const wordsArray = combinedText.split(/[\s\-_]+/).filter(word => word.trim().length > 0);
            
            // Return an array of unique words
            return [...new Set(wordsArray)];
        }

        document.getElementById('btnStart').addEventListener('click', async () => {
            const confirmation = confirm("WARNING: You are about to update all products in the database. Have you backed up your data, and are you ready to proceed?");
            if (!confirmation) return;

            const btn = document.getElementById('btnStart');
            btn.disabled = true;
            btn.innerText = "Migrating...";
            document.getElementById('statusArea').innerHTML = ""; // Clear logs

            try {
                log("Fetching all inventory documents... this may take a moment.");
                
                const querySnapshot = await getDocs(collection(db, "inventory"));
                const docs = querySnapshot.docs;
                const totalDocs = docs.length;
                
                log(`Successfully fetched ${totalDocs} documents.`, "success");

                if (totalDocs === 0) {
                    log("No documents found to migrate.");
                    btn.disabled = false;
                    btn.innerText = "Start Migration";
                    return;
                }

                const CHUNK_SIZE = 500; // Firestore limit per batch
                let processedCount = 0;

                for (let i = 0; i < totalDocs; i += CHUNK_SIZE) {
                    const chunk = docs.slice(i, i + CHUNK_SIZE);
                    const batch = writeBatch(db);
                    
                    chunk.forEach(docSnap => {
                        const data = docSnap.data();
                        const keywords = generateKeywords(data.name, data.model);
                        
                        // We ONLY update the searchKeywords field. 
                        // Existing fields (price, qty, etc.) are untouched.
                        batch.update(docSnap.ref, { searchKeywords: keywords });
                    });
                    
                    log(`Committing batch ${Math.floor(i / CHUNK_SIZE) + 1}...`);
                    await batch.commit();
                    
                    processedCount += chunk.length;
                    log(`Progress: ${processedCount} / ${totalDocs} updated.`);
                }
                
                log("MIGRATION COMPLETE! All items updated safely.", "success");
                btn.innerText = "Migration Finished";
                alert("Migration complete! You can now safely close and delete this file.");
                
            } catch (error) {
                console.error("Migration failed:", error);
                log(`ERROR: ${error.message}`, "error");
                btn.disabled = false;
                btn.innerText = "Retry Migration";
            }
        });
    </script>
</body>
</html>
