<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meena Marketing - Campaign Agent</title>
    
    <style>
        /* YOUTUBE DARK THEME (Updated to match index.html palette) */
        :root {
            --yt-bg: #121212;
            --yt-card: #212121;
            --yt-border: #333333;
            --yt-text-primary: #ffffff;
            --yt-text-secondary: #aaaaaa;
            --meena-red: #ff3333;
            --meena-white: #ffffff;
            --wa-green: #25D366;
            --call-blue: #3ea6ff;
            --accent-color: #0056b3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--yt-bg);
            color: var(--yt-text-primary);
            overflow-x: hidden;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* Stop main page scrolling when modals are open */
        body.no-scroll {
            overflow: hidden !important;
        }

        /* HEADER */
        header {
            background-color: var(--yt-card);
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        /* Professional Back Arrow for History Page */
        .header-back-btn {
            color: var(--yt-text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            margin-right: 12px;
            margin-left: -8px;
            border-radius: 50%;
            transition: background 0.2s;
            cursor: pointer;
        }
        .header-back-btn:active {
            background: var(--yt-border);
        }
        .header-back-btn svg {
            fill: currentColor;
            width: 26px;
            height: 26px;
        }

        .brand {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }
        .brand .meena { color: var(--meena-red); }
        .brand .marketing { color: var(--meena-white); }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .server-icon, .action-icon {
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .server-icon:active, .action-icon:active { background: var(--yt-border); }
        .server-icon svg, .action-icon svg { fill: var(--yt-text-primary); width: 24px; height: 24px; }

        /* GRID CONTENT */
        main {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .dashboard-stats {
            margin-bottom: 20px;
            font-size: 14px;
            color: var(--yt-text-secondary);
        }

        .customer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        /* CARDS */
        .card {
            background-color: var(--yt-card);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s ease;
            border: 1px solid var(--yt-border);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .customer-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--yt-text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .customer-phone {
            font-size: 14px;
            color: var(--yt-text-secondary);
            margin-top: 4px;
            font-family: monospace;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            border: none;
        }
        .btn:active { opacity: 0.7; }

        .btn-call { background-color: rgba(62, 166, 255, 0.15); color: var(--call-blue); }
        .btn-call svg { fill: var(--call-blue); width: 18px; height: 18px; }

        .btn-wa { background-color: rgba(37, 211, 102, 0.15); color: var(--wa-green); }
        .btn-wa svg { fill: var(--wa-green); width: 18px; height: 18px; }

        /* SLIDE MODAL RIGHT */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        .modal {
            position: fixed;
            top: 0; right: -100%;
            width: 85%;
            max-width: 400px;
            height: 100%;
            background-color: var(--yt-card);
            z-index: 101;
            box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            transition: right 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        /* SLIDE MODAL LEFT (NEW) */
        .left-modal {
            position: fixed;
            top: 0; left: -100%;
            width: 85%;
            max-width: 400px;
            height: 100%;
            background-color: var(--yt-card);
            z-index: 101;
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            transition: left 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .overlay.active { opacity: 1; visibility: visible; }
        .modal.active { right: 0; }
        .left-modal.active { left: 0; }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--yt-border);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--yt-text-primary);
            font-size: 24px;
            cursor: pointer;
        }

        .modal-content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .stat-box {
            background-color: var(--yt-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--yt-border);
        }

        .stat-label { font-size: 12px; color: var(--yt-text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .stat-value { font-size: 24px; font-weight: bold; color: var(--yt-text-primary); }
        
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }
        .status-active { background: rgba(37, 211, 102, 0.2); color: var(--wa-green); }
        .status-sleep { background: rgba(255, 51, 51, 0.2); color: var(--meena-red); }

        .danger-zone {
            margin-top: 30px;
            border-top: 1px solid var(--yt-border);
            padding-top: 20px;
        }

        .btn-danger {
            width: 100%;
            padding: 12px;
            background: rgba(255, 51, 51, 0.1);
            color: var(--meena-red);
            border: 1px solid rgba(255, 51, 51, 0.3);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-danger:active { background: rgba(255, 51, 51, 0.2); }
        .btn-danger:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Loader for pagination */
        .loading-more {
            text-align: center;
            padding: 20px;
            color: var(--yt-text-secondary);
            font-size: 14px;
            display: none;
        }

        /* CUSTOM MINI-MODAL (Replaces system Confirm/Alert) */
        .dialog-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dialog-overlay.active {
            opacity: 1; visibility: visible;
        }
        .dialog-box {
            background: var(--yt-card);
            border: 1px solid var(--yt-border);
            border-radius: 12px;
            width: 85%;
            max-width: 350px;
            padding: 24px;
            transform: scale(0.9);
            transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        .dialog-overlay.active .dialog-box {
            transform: scale(1);
        }
        .dialog-text {
            font-size: 16px;
            color: var(--yt-text-primary);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .dialog-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        .dialog-btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .dialog-btn:active { opacity: 0.7; }
        .dialog-btn-cancel {
            background: transparent;
            color: var(--yt-text-secondary);
        }
        .dialog-btn-confirm {
            background: rgba(255, 51, 51, 0.1);
            color: var(--meena-red);
            border: 1px solid rgba(255, 51, 51, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="history.html" class="header-back-btn" id="smart-back-btn">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path></svg>
            </a>
            <div class="brand">
                <span class="meena">Meena</span> <span class="marketing">Marketing</span>
            </div>
        </div>
        <div class="header-actions">
            <div class="action-icon" id="btn-open-left-modal">
                <svg viewBox="0 0 24 24"><path d="M15 2H9c-1.1 0-2 .9-2 2v2H3v2h2v12c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V8h2V6h-4V4c0-1.1-.9-2-2-2zm-4 16H9V10h2v8zm4 0h-2V10h2v8zM15 6H9V4h6v2z"></path></svg>
            </div>
            <div class="server-icon" id="btn-open-modal">
                <svg viewBox="0 0 24 24"><path d="M4 11h16V5H4v6zm2-4h2v2H6V7zm-2 6h16v6H4v-6zm2 2h2v2H6v-2z"></path></svg>
            </div>
        </div>
    </header>

    <main>
        <div class="dashboard-stats" id="quick-stats">Loading pending customers...</div>
        <div class="customer-grid" id="grid">
            </div>
        <div class="loading-more" id="loading-more">Loading more customers...</div>
    </main>

    <div class="overlay" id="overlay"></div>
    
    <div class="left-modal" id="left-modal">
        <div class="modal-header">
            <button class="back-btn" id="btn-close-left-modal">&larr;</button>
            <h2 style="font-size: 18px;">Storage Cleaner</h2>
        </div>
        <div class="modal-content">
            <div class="stat-box">
                <div class="stat-label">Old Sellings (> 2 Months)</div>
                <div class="stat-value" id="ui-old-count">--</div>
                <div style="font-size: 12px; color: var(--yt-text-secondary); margin-top: 4px;">Old bills safely detected for removal.</div>
            </div>

            <div class="danger-zone">
                <div class="stat-label" style="color: #ff3333;">Database Actions</div>
                <button class="btn-danger" id="btn-delete-old" disabled>🗑️ Delete Old Documents</button>
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-header">
            <button class="back-btn" id="btn-close-modal">&larr;</button>
            <h2 style="font-size: 18px;">Server Controller</h2>
        </div>
        <div class="modal-content">
            
            <div class="stat-box">
                <div class="stat-label">Daily Limit</div>
                <div class="stat-value" id="ui-limit">--</div>
                <div style="font-size: 12px; color: var(--yt-text-secondary); margin-top: 4px;" id="ui-day-type"></div>
            </div>

            <div class="stat-box">
                <div class="stat-label">Messages Today</div>
                <div class="stat-value"><span id="ui-sent">0</span> <span style="font-size:16px; color:var(--yt-text-secondary)">/ <span id="ui-remaining">0</span> Remaining</span></div>
            </div>

            <div class="stat-box">
                <div class="stat-label">Agent Status</div>
                <div class="stat-value" id="ui-next-time" style="font-size: 20px;">--</div>
                <div id="ui-badge" class="status-badge status-active">Syncing...</div>
            </div>

            <div class="danger-zone">
                <div class="stat-label" style="color: #ff3333;">Admin Actions</div>
                <button class="btn-danger" id="btn-reset-graveyard">♻️ Reset Graveyard List (<span id="ui-grave-count">0</span>)</button>
                <button class="btn-danger" id="btn-delete-doc">🗑️ Delete Campaign Data</button>
            </div>
        </div>
    </div>

    <div class="dialog-overlay" id="dialog-overlay">
        <div class="dialog-box">
            <div class="dialog-text" id="dialog-text">Are you sure?</div>
            <div class="dialog-buttons">
                <button class="dialog-btn dialog-btn-cancel" id="dialog-btn-cancel">Cancel</button>
                <button class="dialog-btn dialog-btn-confirm" id="dialog-btn-confirm">OK</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './config.js';
        import { doc, onSnapshot, updateDoc, deleteDoc, collection, query, where, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        // SMART BACK BUTTON LOGIC
        document.getElementById('smart-back-btn').addEventListener('click', function(e) {
            e.preventDefault();
            if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
                window.history.back(); // Go back to exactly where they came from
            } else {
                window.location.href = 'index.html'; // Fallback to home if directly opened
            }
        });

        // DOM Elements
        const grid = document.getElementById('grid');
        const modal = document.getElementById('modal');
        const leftModal = document.getElementById('left-modal');
        const overlay = document.getElementById('overlay');
        const btnOpen = document.getElementById('btn-open-modal');
        const btnClose = document.getElementById('btn-close-modal');
        const btnOpenLeft = document.getElementById('btn-open-left-modal');
        const btnCloseLeft = document.getElementById('btn-close-left-modal');
        const loadingMore = document.getElementById('loading-more');
        
        // Custom Dialog Elements
        const dialogOverlay = document.getElementById('dialog-overlay');
        const dialogText = document.getElementById('dialog-text');
        const dialogCancel = document.getElementById('dialog-btn-cancel');
        const dialogConfirm = document.getElementById('dialog-btn-confirm');
        let dialogCallback = null;
        
        // Pagination state
        let visibleCount = 15;
        let lastCustomerString = ""; // FIREBASE UI OPTIMIZATION VAR
        
        // Modal & History Logic for Mobile Back Button
        function openModal() {
            modal.classList.add('active');
            overlay.classList.add('active');
            document.body.classList.add('no-scroll'); // Prevent main page scrolling
            history.pushState({ modalOpen: true }, '');
            
            // Re-render stats immediately when opened to show fresh human mood quotes
            renderModalStats();
        }

        function closeModal() {
            modal.classList.remove('active');
            overlay.classList.remove('active');
            // Remove no-scroll if custom dialog and left modal are also not open
            if (!dialogOverlay.classList.contains('active') && !leftModal.classList.contains('active')) {
                document.body.classList.remove('no-scroll');
            }
        }

        // LEFT MODAL & CLEANUP LOGIC (NEW)
        const uiOldCount = document.getElementById('ui-old-count');
        const btnDeleteOld = document.getElementById('btn-delete-old');
        let oldSellingsDocs = [];

        async function fetchOldSellings() {
            uiOldCount.innerText = "Scanning...";
            btnDeleteOld.disabled = true;
            try {
                const twoMonthsAgo = new Date();
                twoMonthsAgo.setMonth(twoMonthsAgo.getMonth() - 2);

                const q = query(collection(db, "sellings"), where("createdAt", "<", twoMonthsAgo));
                const snap = await getDocs(q);
                
                oldSellingsDocs = snap.docs;
                uiOldCount.innerText = oldSellingsDocs.length;
                
                if(oldSellingsDocs.length > 0) {
                    btnDeleteOld.disabled = false;
                }
            } catch (error) {
                console.error(error);
                uiOldCount.innerText = "Error";
            }
        }

        function openLeftModal() {
            leftModal.classList.add('active');
            overlay.classList.add('active');
            document.body.classList.add('no-scroll');
            history.pushState({ leftModalOpen: true }, '');
            
            // READ OPTIMIZED: only check DB when the panel is actually opened
            fetchOldSellings();
        }

        function closeLeftModal() {
            leftModal.classList.remove('active');
            overlay.classList.remove('active');
            if (!dialogOverlay.classList.contains('active') && !modal.classList.contains('active')) {
                document.body.classList.remove('no-scroll');
            }
        }

        btnOpenLeft.addEventListener('click', openLeftModal);
        btnCloseLeft.addEventListener('click', () => {
            if (history.state?.leftModalOpen) history.back();
            else closeLeftModal();
        });

        btnDeleteOld.addEventListener('click', () => {
            showCustomDialog(`Are you sure you want to permanently delete ${oldSellingsDocs.length} old documents? This cannot be undone.`, false, async (confirmed) => {
                if (confirmed) {
                    btnDeleteOld.disabled = true;
                    btnDeleteOld.innerText = "Deleting...";
                    try {
                        // Batch deletion loops to handle any size without breaching Firestore's 500 limit
                        for (let i = 0; i < oldSellingsDocs.length; i += 500) {
                            const batch = writeBatch(db);
                            const chunk = oldSellingsDocs.slice(i, i + 500);
                            chunk.forEach(d => batch.delete(d.ref));
                            await batch.commit();
                        }
                        showCustomDialog("Successfully deleted old documents.", true);
                        fetchOldSellings(); // Refresh the count
                    } catch (err) {
                        showCustomDialog("Error deleting documents: " + err.message, true);
                    } finally {
                        btnDeleteOld.innerHTML = "🗑️ Delete Old Documents";
                    }
                }
            });
        });

        // Custom Dialog Logic replacing system confirm/alert
        function showCustomDialog(message, isAlert, callback) {
            dialogText.innerHTML = message;
            dialogCallback = callback;
            
            if (isAlert) {
                dialogCancel.style.display = 'none';
                dialogConfirm.innerText = 'OK';
                dialogConfirm.style.color = 'var(--call-blue)';
                dialogConfirm.style.borderColor = 'rgba(62, 166, 255, 0.3)';
                dialogConfirm.style.background = 'rgba(62, 166, 255, 0.1)';
            } else {
                dialogCancel.style.display = 'block';
                dialogConfirm.innerText = 'Confirm';
                dialogConfirm.style.color = 'var(--meena-red)';
                dialogConfirm.style.borderColor = 'rgba(255, 51, 51, 0.3)';
                dialogConfirm.style.background = 'rgba(255, 51, 51, 0.1)';
            }

            dialogOverlay.classList.add('active');
            document.body.classList.add('no-scroll'); // Prevent background scrolling
            
            // Push history state to support hardware back button for the dialog
            history.pushState({ dialogOpen: true }, '');
        }

        function closeCustomDialog(isConfirmed) {
            dialogOverlay.classList.remove('active');
            
            // Remove no-scroll only if side modals are also closed
            if (!modal.classList.contains('active') && !leftModal.classList.contains('active')) {
                document.body.classList.remove('no-scroll');
            }
            
            // Pop the specific state if it exists
            if (history.state && history.state.dialogOpen) {
                history.back();
            }
            
            if (dialogCallback) dialogCallback(isConfirmed);
            dialogCallback = null;
        }

        dialogCancel.addEventListener('click', () => closeCustomDialog(false));
        dialogConfirm.addEventListener('click', () => closeCustomDialog(true));
        
        // Listeners for right side modal
        btnOpen.addEventListener('click', openModal);
        btnClose.addEventListener('click', () => {
            if (history.state?.modalOpen) history.back();
            else closeModal();
        });
        
        overlay.addEventListener('click', () => {
            if (history.state?.modalOpen) history.back();
            else if (history.state?.leftModalOpen) history.back();
            else { 
                closeModal(); 
                closeLeftModal(); 
            }
        });

        // Universal Popstate listener overriding previous basic one
        window.addEventListener('popstate', (e) => {
            // First check if the custom dialog is open and close it
            if (dialogOverlay.classList.contains('active')) {
                dialogOverlay.classList.remove('active');
                if (!modal.classList.contains('active') && !leftModal.classList.contains('active')) {
                    document.body.classList.remove('no-scroll');
                }
                if (dialogCallback) dialogCallback(false);
                dialogCallback = null;
            } 
            // If custom dialog wasn't open, check if modals need closing
            else {
                if (!e.state?.modalOpen && modal.classList.contains('active')) closeModal();
                if (!e.state?.leftModalOpen && leftModal.classList.contains('active')) closeLeftModal();
            }
        });

        // Firebase Sync Logic (v9 Modular)
        const docRef = doc(db, 'marketing_messages', 'campaign_data');
        let currentData = null;

        onSnapshot(docRef, (snap) => {
            if (snap.exists()) {
                currentData = snap.data();
                renderDashboard();
                renderModalStats();
            } else {
                currentData = null;
                grid.innerHTML = '<div style="color: var(--yt-text-secondary);">No active campaign found. Agent will build this when the node script runs.</div>';
                document.getElementById('quick-stats').innerText = "Database is empty.";
                renderModalStats();
            }
        });

        // Scroll Event Listener for Pagination
        window.addEventListener('scroll', () => {
            const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
            
            // Check if we hit the bottom of the page
            if (scrollTop + clientHeight >= scrollHeight - 50) {
                if (currentData && currentData.pendingCustomers && visibleCount < currentData.pendingCustomers.length) {
                    loadingMore.style.display = 'block';
                    
                    // Small delay to make the loading feel natural
                    setTimeout(() => {
                        visibleCount += 15;
                        
                        // Temporarily bypass optimization cache to allow pagination expansion
                        const tempCache = lastCustomerString; 
                        lastCustomerString = ""; 
                        renderDashboard();
                        lastCustomerString = tempCache; 
                        
                        loadingMore.style.display = 'none';
                    }, 400);
                }
            }
        });

        function renderDashboard() {
            if (!currentData || !currentData.pendingCustomers) return;
            
            const pending = currentData.pendingCustomers;

            // FIREBASE UI OPTIMIZATION: Only rebuild the massive DOM if the array data actually changed.
            // When Firebase triggers an update just because 'nextAllowedTime' changed, we save huge CPU resources.
            const newCustomerString = JSON.stringify(pending);
            if(newCustomerString === lastCustomerString) {
                return; // The queue hasn't changed, skip DOM re-painting.
            }
            lastCustomerString = newCustomerString;

            document.getElementById('quick-stats').innerText = `Displaying ${Math.min(visibleCount, pending.length)} of ${pending.length} Pending Customers Queue`;

            // Slice the array based on the visibleCount for pagination
            const paginatedCustomers = pending.slice(0, visibleCount);

            grid.innerHTML = paginatedCustomers.map((customer, index) => {
                // Safeguard against old string formats
                const name = typeof customer === 'string' ? 'Valued Customer' : (customer.name || 'Valued Customer');
                const phone = typeof customer === 'string' ? customer : customer.phone;
                
                // Format phone for links
                const cleanPhone = phone.replace(/[^0-9]/g, '');
                
                return `
                <div class="card" style="animation: fadeIn 0.3s ease ${index % 15 * 0.02}s both;">
                    <div class="card-header">
                        <div>
                            <div class="customer-name">${name}</div>
                            <div class="customer-phone">${phone}</div>
                        </div>
                    </div>
                    <div class="actions">
                        <a href="tel:+${cleanPhone}" class="btn btn-call">
                            <svg viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.03 21c.73 0 .96-.63.96-1.18v-3.45c0-.54-.45-.99-.99-.99z"></path></svg>
                            Call
                        </a>
                        <a href="https://wa.me/${cleanPhone}" target="_blank" class="btn btn-wa">
                            <svg viewBox="0 0 24 24"><path d="M19.05 4.91A9.816 9.816 0 0 0 12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01zm-7.01 15.24c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.264 8.264 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24 2.4 0 4.66.94 6.36 2.64 1.7 1.7 2.64 3.96 2.64 6.36 0 4.54-3.7 8.24-8.24 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43s.17-.25.25-.41c.08-.17.04-.31-.02-.43s-.56-1.34-.76-1.84c-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.84-.86 2.05s.89 2.38 1.01 2.54c.12.17 1.73 2.64 4.19 3.7 1.73.74 2.38.8 3.23.68.85-.12 2.76-1.13 3.15-2.22.39-1.09.39-2.03.27-2.22-.11-.2-.38-.32-.63-.44z"></path></svg>
                            WhatsApp
                        </a>
                    </div>
                </div>`;
            }).join('');
        }

        function renderModalStats() {
            if (!currentData) return;

            // Date and Time Logic - Enforcing Indian Standard Time (IST)
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const istTime = new Date(utc + (330 * 60000)); // IST is UTC+5:30 (330 minutes)
            
            const currentHour = istTime.getHours();
            const isSunday = istTime.getDay() === 0;
            const maxLimit = isSunday ? 10 : 7;
            
            const sentToday = currentData.messagesSentToday || 0;
            const remaining = maxLimit - sentToday;
            const queueSize = currentData.pendingCustomers ? currentData.pendingCustomers.length : 0;
            
            // Apply logic to UI
            document.getElementById('ui-limit').innerText = maxLimit;
            document.getElementById('ui-day-type').innerText = isSunday ? 'Sunday Weekend Booster 🚀 (10 per day)' : 'Standard Business Day (7 per day)';
            document.getElementById('ui-sent').innerText = sentToday;
            document.getElementById('ui-remaining').innerText = remaining > 0 ? remaining : 0;
            
            const badge = document.getElementById('ui-badge');
            const nextTimeLabel = document.getElementById('ui-next-time');

            // 5 minutes in milliseconds
            const fiveMinsInMillis = 5 * 60 * 1000;
            
            // Check if Node server missed its mark by > 5 mins
            const isOverdue = currentData.nextAllowedTime && (now.getTime() - currentData.nextAllowedTime > fiveMinsInMillis);
            const hasPendingWork = sentToday < maxLimit && queueSize > 0;

            // --- MASSIVE HUMAN-LIKE AGENT VOCABULARY ARRAYS ---
            const sleepQuotes = [
                "Dreaming of 10x ROI 💰", "Catching Zzz's 😴", "Deep in REM sleep 🌙", "Counting sheep 🐑",
                "Recharging batteries 🔋", "Out of Office till 6 AM 🚪", "Hibernating for the night 🐻",
                "Snoring softly 💤", "System cooling down ❄️", "Dreaming of the next big sale 📈",
                "Powering down auxiliary systems 🔌", "Midnight meditation 🧘", "Counting conversions in my sleep 💭",
                "Night mode activated 🦇", "Resting my virtual eyes 😌", "Off the clock ⏰",
                "Dreaming in JavaScript ✨", "Storing energy for tomorrow ⚡", "Do not disturb 🚫",
                "Enjoying the digital silence 🤫", "Catching some virtual shut-eye 🛌", "Asleep at the terminal 💻"
            ];

            const quotaMetQuotes = [
                "Agent clocked out. See you tomorrow! 🏖️", "Daily target absolutely crushed 🔨", "Mission accomplished for today 🎖️",
                "Heading to the virtual pub 🍻", "High-fiving the database 🙌", "Time to celebrate today's wins 🎉",
                "Pack it up, we are done here 🎒", "Kicking back and relaxing 🛋️", "Another successful day in the books 📚",
                "Mic drop. I'm out. 🎤", "Quota demolished. Resting now. 💥", "Enjoying the post-work glow 🌅",
                "Taking a well-deserved break 🛀", "My work here is done 🦸", "Clocking out with a smile 😊",
                "Leaving the office early today 🏃", "Time to watch some virtual Netflix 🍿", "Sales target hit, powering down 📉"
            ];

            const depressedQuotes = [
                "Ghosted by Node Server (>5m) 👻", "Feeling lonely in the cloud ☁️", "Did my backend leave me? 💔",
                "Staring into the digital void 🕳️", "Waiting for a ping... any ping 🏓", "Is the Wi-Fi down? 📶",
                "Severely depressed, server offline 🌧️", "Crying in binary 0️⃣1️⃣", "Where did everybody go? 🏜️",
                "Connection lost. Heart broken. 💔", "Lost in the server graveyard 🪦", "Send help... or a heartbeat 🆘",
                "I miss my Node.js companion 🥺", "Is it me? Did I do something wrong? 🥀", "Experiencing severe existential dread 🕸️",
                "Please check the backend console 🖥️", "I'm giving up hope 📉", "Drifting in cyberspace 🌌",
                "Hello? Is anybody out there? 🗣️", "My ping requests are echoing 🦇", "I think the engine died 🚗💨"
            ];

            const readyQuotes = [
                "Cracking knuckles, ready to type ⌨️", "Sipping coffee, hyped up ☕", "Reviewing product catalog 📦",
                "Waiting for the green light 🚦", "Locked and loaded 🔫", "Caffeine kicking in 🚀",
                "Fingers hovering over the keyboard 🖐️", "Ready to deploy the next pitch 📝", "Target acquired 🎯",
                "Pumped and ready to go 💪", "System running at 100% efficiency ⚙️", "Eager to make a sale 🛒",
                "Polishing the sales copy ✨", "Warming up the servers 🔥", "Stretching virtual muscles 🤸",
                "Scanning the customer database 🗃️", "Awaiting deployment orders 📡", "Let's make some magic happen 🎩",
                "Vibe check passed, ready to send ✅", "Fully caffeinated and operational ☕🤖",
                "Standing by for transmission 📻", "In the zone 🎧", "All systems nominal and ready 🟢"
            ];

            const draftingQuotes = [
                "Drafting the perfect pitch ✍️", "Checking spelling and grammar 📖", "Adding emojis to the message 🎨",
                "Personalizing the introduction 🤝", "Double-checking the promo code 🎫", "Polishing the Tamil translation 🗣️",
                "Doing some quick conversion math 🧮", "Crafting a compelling hook 🪝", "Adjusting the tone of voice 🎭"
            ];
            const teaBreakQuotes = [
                "Having a tea break ☕", "Stretching my legs 🚶", "Organizing my digital desk 🗄️", 
                "Reading a marketing blog 📰", "Daydreaming about conversions 🌈", "Listening to lo-fi beats 🎧"
            ];
            const reviewingQuotes = [
                "Reviewing customer file 📁", "Looking up purchase history 🔍", "Analyzing engagement metrics 📊",
                "Cross-referencing the database 🖇️", "Evaluating lead temperature 🌡️", "Preparing the attachments 📎"
            ];
            const triggerQuotes = [
                "Finger on the trigger 🎯", "Taking a deep breath 😮‍💨", "Countdown initiated ⏱️", 
                "Preparing to hit send 📨", "Final system check 🛠️", "Brace for impact 💥"
            ];

            // --- EVALUATING CURRENT STATE ---
            
            // 1. Sleep Logic (10 PM to 6 AM IST)
            if (currentHour >= 22 || currentHour < 6) {
                const randomSleep = sleepQuotes[Math.floor(Date.now() / 3600000) % sleepQuotes.length]; // Rotates every hour
                nextTimeLabel.innerText = "Agent is sleeping 🌙";
                badge.className = "status-badge status-sleep";
                badge.innerText = `${randomSleep}`;
            } 
            // 2. Quota Met Logic
            else if (sentToday >= maxLimit) {
                const randomQuota = quotaMetQuotes[Math.floor(Date.now() / 600000) % quotaMetQuotes.length]; // Rotates every 10 min
                nextTimeLabel.innerText = "Target Achieved 🎯";
                badge.className = "status-badge status-sleep";
                badge.innerText = randomQuota;
            }
            // 3. Pacing Active Logic (Time is in the future)
            else if (currentData.nextAllowedTime && currentData.nextAllowedTime > now.getTime()) {
                const nextDate = new Date(currentData.nextAllowedTime);
                
                // Convert stored nextAllowedTime to IST for display
                const nextDateUtc = nextDate.getTime() + (nextDate.getTimezoneOffset() * 60000);
                const nextDateIst = new Date(nextDateUtc + (330 * 60000));
                
                let hours = nextDateIst.getHours();
                let mins = nextDateIst.getMinutes();
                const ampm = hours >= 12 ? 'Pm' : 'Am';
                hours = hours % 12 || 12;
                mins = mins < 10 ? '0' + mins : mins;
                
                // Humanize the waiting period with dynamically selected rotating text
                const minsLeft = Math.ceil((currentData.nextAllowedTime - now.getTime()) / 60000);
                const rotationIndex = Math.floor(Date.now() / 180000); // Changes text every 3 mins to keep it fresh
                
                let humanAction = "";
                if (minsLeft > 25) humanAction = teaBreakQuotes[rotationIndex % teaBreakQuotes.length];
                else if (minsLeft > 15) humanAction = draftingQuotes[rotationIndex % draftingQuotes.length];
                else if (minsLeft > 2) humanAction = reviewingQuotes[rotationIndex % reviewingQuotes.length];
                else humanAction = triggerQuotes[rotationIndex % triggerQuotes.length];
                
                nextTimeLabel.innerText = `${hours}.${mins} ${ampm}`;
                badge.className = "status-badge status-active";
                badge.innerText = humanAction;
            } 
            // 4. Agent Depressed Logic (Time crossed > 5 mins and it still has work to do)
            else if (isOverdue && hasPendingWork) {
                const randomDepressed = depressedQuotes[Math.floor(Date.now() / 60000) % depressedQuotes.length]; // Fast rotation when broken
                nextTimeLabel.innerText = "Agent is depressed 🌧️";
                badge.className = "status-badge status-sleep";
                badge.innerText = randomDepressed;
            }
            // 5. Idle/Ready Logic
            else {
                // Rotates the quote every few minutes so it feels alive
                const randomReady = readyQuotes[Math.floor(Date.now() / 120000) % readyQuotes.length]; 
                
                let moodLabel = "Agent is pumped up ⚡";
                if (queueSize > 150) {
                    moodLabel = "Agent is sweating 😰"; // Dynamic reaction to large queues
                } else if (queueSize < 5) {
                    moodLabel = "Almost done for the day 🏖️"; // Dynamic reaction to small queues
                }

                nextTimeLabel.innerText = moodLabel;
                badge.className = "status-badge status-active";
                badge.innerText = randomReady;
            }

            // Graveyard stats
            const graves = currentData.invalidNumbers ? currentData.invalidNumbers.length : 0;
            document.getElementById('ui-grave-count').innerText = graves;
        }

        // --- ADMIN ACTIONS (v9 Modular with Custom Modals) ---
        document.getElementById('btn-reset-graveyard').addEventListener('click', async () => {
            showCustomDialog("Are you sure you want to clear the graveyard? Invalid numbers will be retried.", false, async (confirmed) => {
                if (confirmed) {
                    try {
                        await updateDoc(docRef, { invalidNumbers: [] });
                        showCustomDialog("Graveyard cleared.", true);
                    } catch (e) {
                        showCustomDialog("Error clearing graveyard: " + e.message, true);
                    }
                }
            });
        });

        document.getElementById('btn-delete-doc').addEventListener('click', async () => {
            showCustomDialog("⚠️ DANGER!<br><br>This will wipe the current cycle entirely. The Node engine will re-fetch the last 200 bills on next run. Proceed?", false, async (confirmed) => {
                if (confirmed) {
                    try {
                        await deleteDoc(docRef);
                        closeModal();
                    } catch (e) {
                        showCustomDialog("Error deleting document: " + e.message, true);
                    }
                }
            });
        });

    </script>
</body>
