<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Meena Marketing</title>
    
    <meta name="theme-color" content="#121212">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
    
    <style>
        /* Meena Marketing Dark Theme Palette */
        :root {
            --bg-color: #121212;
            --surface-color: #212121;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --meena-red: #ff3333;
            --marketing-white: #ffffff;
            --button-hover: rgba(255, 51, 51, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Login Card Container */
        .auth-container {
            background-color: var(--surface-color);
            padding: 40px 30px;
            border-radius: 16px;
            border: 1px solid #333;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .brand-title { font-size: 1.6em; font-weight: bold; margin-bottom: 5px; }
        .meena { color: var(--meena-red); }
        .marketing { color: var(--marketing-white); }
        .subtitle { font-size: 0.9em; color: var(--text-secondary); margin-bottom: 30px; }

        /* Google Login Button */
        .google-btn {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid #555;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 1em;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .google-btn:hover {
            background-color: #2a2a2a;
            border-color: #777;
        }

        .google-btn:active { transform: scale(0.97); }

        .google-icon { width: 24px; height: 24px; }

        /* Setup Profile Section (Hidden by Default) */
        #setup-section {
            display: none;
            animation: fadeIn 0.4s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-dp {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--meena-red);
            margin: 0 auto 15px auto;
            object-fit: cover;
            display: block;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.2);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-bottom: 8px;
            margin-left: 5px;
        }

        .input-group input {
            width: 100%;
            box-sizing: border-box;
            background-color: #111;
            color: white;
            border: 1px solid #444;
            padding: 14px;
            border-radius: 12px;
            font-size: 1em;
            outline: none;
            transition: border 0.3s;
        }

        .input-group input:focus {
            border-color: var(--meena-red);
        }

        .submit-btn {
            background-color: var(--meena-red);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1em;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background-color: #e62e2e;
            box-shadow: 0 4px 15px rgba(255, 51, 51, 0.4);
        }
        
        .submit-btn:active { transform: scale(0.97); }

        /* Loader */
        #loader {
            display: none;
            margin: 20px auto;
            border: 3px solid #333;
            border-top: 3px solid var(--meena-red);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="auth-container">
        <div id="login-section">
            <img src="icon.png" alt="Meena Marketing" class="brand-logo" onerror="this.src='https://via.placeholder.com/70/212121/ff3333?text=MM'">
            <div class="brand-title"><span class="meena">Meena</span> <span class="marketing">Marketing</span></div>
            <div class="subtitle">Secure Partner Login</div>
            
            <button class="google-btn" id="google-login-btn">
                <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Sign in with Google
            </button>

            <div id="loader"></div>
        </div>

        <div id="setup-section">
            <div class="brand-title" style="font-size: 1.3em; margin-bottom: 20px;">Welcome to the Team!</div>
            
            <img id="user-dp" class="profile-dp" src="" alt="Profile Picture">
            
            <div class="input-group">
                <label for="user-name">Confirm your full name</label>
                <input type="text" id="user-name" placeholder="E.g. Meena Kumar">
            </div>

            <button class="submit-btn" id="complete-setup-btn">Complete Setup</button>
        </div>
    </div>

    <script type="module">
        // Make sure your config.js exports 'auth' and 'db'
        import { auth, db } from './config.js';
        import { GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
        import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        const loginSection = document.getElementById('login-section');
        const setupSection = document.getElementById('setup-section');
        const googleBtn = document.getElementById('google-login-btn');
        const loader = document.getElementById('loader');
        
        const userDp = document.getElementById('user-dp');
        const userNameInput = document.getElementById('user-name');
        const completeSetupBtn = document.getElementById('complete-setup-btn');

        let pendingUser = null; // Store user details temporarily if they are new

        // Handle Google Login Click
        googleBtn.addEventListener('click', async () => {
            if (navigator.vibrate) navigator.vibrate(40);
            
            googleBtn.style.display = 'none';
            loader.style.display = 'block';
            
            const provider = new GoogleAuthProvider();
            
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Check if user already exists in Firestore
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    // User exists, send to dashboard!
                    window.location.href = 'index.html';
                } else {
                    // User is NEW. Hide login, show setup UI.
                    pendingUser = user;
                    
                    loginSection.style.display = 'none';
                    setupSection.style.display = 'block';
                    
                    // Populate data from Google
                    userDp.src = user.photoURL || 'https://via.placeholder.com/90/333/fff?text=User';
                    userNameInput.value = user.displayName || '';
                }

            } catch (error) {
                console.error("Login Failed:", error);
                alert("Login failed. Please try again.");
                googleBtn.style.display = 'flex';
                loader.style.display = 'none';
            }
        });

        // Handle Complete Setup Click
        completeSetupBtn.addEventListener('click', async () => {
            if (navigator.vibrate) navigator.vibrate(40);
            
            const finalName = userNameInput.value.trim();
            if (!finalName) {
                alert("Please enter your name.");
                return;
            }

            const originalText = completeSetupBtn.innerText;
            completeSetupBtn.innerText = "Saving...";
            completeSetupBtn.disabled = true;

            try {
                // Create document in Firestore
                await setDoc(doc(db, "users", pendingUser.uid), {
                    uid: pendingUser.uid,
                    name: finalName,
                    email: pendingUser.email,
                    photoURL: pendingUser.photoURL,
                    role: "staff", // You can default roles here
                    createdAt: serverTimestamp()
                });

                // Redirect to dashboard
                window.location.href = 'index.html';
                
            } catch (error) {
                console.error("Error saving user data:", error);
                alert("Failed to save data. Please try again.");
                completeSetupBtn.innerText = originalText;
                completeSetupBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
