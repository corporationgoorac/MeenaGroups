<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meena LogBook</title>
  
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f">
  
  <link rel="manifest" href="manifest.json">

  <style>
    /* === PREMIUM AUTO DARK / LIGHT THEME === */
    :root {
      --bg-color: #ffffff;
      --text-main: #0f0f0f;
      --text-muted: #606060;
      --card-bg: #ffffff;
      --primary: #10b981;
      --primary-dark: #059669;
      --primary-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --cash-color: #008000;
      --online-color: #065fd4;
      --split-color: #f29900;
      --pending-color: #f59e0b;
      --danger-color: #ef4444;
      --border: #e5e5e5;
      --input-bg: #f2f2f2;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f0f0f;
        --text-main: #f1f1f1;
        --text-muted: #aaaaaa;
        --card-bg: #282828;
        --primary: #10b981;
        --border: #3f3f3f;
        --input-bg: #121212;
      }
    }

    *::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      margin: 0;
      padding-bottom: 90px;
      min-height: 100vh;
      -webkit-user-select: none; user-select: none;
    }
    
    input, select, textarea { -webkit-user-select: auto; user-select: auto; }

    header {
      background-color: var(--card-bg);
      padding: 16px 20px;
      font-size: 20px;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    
    .summary-card { background: var(--card-bg); border-radius: 12px; padding: 24px; display: flex; justify-content: space-between; box-shadow: var(--shadow-md); margin-bottom: 28px; border: 1px solid var(--border); }
    
    .history-card { background: var(--card-bg); border-radius: 12px; padding: 18px; margin-bottom: 14px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; position: relative; }
    .pending-card { border: 2px solid var(--pending-color); }

    .trash-btn { position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--danger-color); cursor: pointer; padding: 5px; }

    .fab { position: fixed; bottom: 28px; right: 28px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 36px; box-shadow: var(--shadow-lg); cursor: pointer; z-index: 20; }
    
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 40; opacity: 0; pointer-events: none; }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    
    .modal { position: fixed; top: 0; right: -100%; bottom: 0; width: 100%; max-width: 450px; background-color: var(--bg-color); z-index: 50; transition: right 0.35s ease; display: flex; flex-direction: column; }
    .modal.open { right: 0; }

    .btn-save { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    
    .install-pill { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); background: var(--text-main); color: var(--bg-color); padding: 10px 20px; border-radius: 24px; display: none; z-index: 30; }
  </style>
</head>
<body>

  <header>
    <div style="display:flex; align-items:center; gap:10px;">
      <img src="icon.png" style="width:24px;height:24px;border-radius:4px;"> Meena LogBook
    </div>
    <div style="position:relative;">
      <input type="date" id="dateFilter" style="position:absolute; opacity:0; z-index:2; width:100%; height:100%;">
      <div class="date-icon" onclick="document.getElementById('dateFilter').showPicker()">📅</div>
    </div>
  </header>

  <div class="install-pill" id="installPill">Install App</div>

  <div class="container">
    <div class="summary-card">
      <div class="summary-item"><div class="summary-label">Total Cash</div><div class="summary-value" id="totalCashView">₹0</div></div>
      <div class="summary-item"><div class="summary-label">Total Online</div><div class="summary-value" id="totalOnlineView">₹0</div></div>
    </div>
    <div id="historyList"></div>
  </div>

  <div class="fab" id="fabBtn">+</div>

  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal" id="entryModal">
    <div class="modal-header" style="display:flex; justify-content:space-between; padding:20px;">
      <span>New Entry</span>
      <button class="close-btn" id="closeModalBtn">&times;</button>
    </div>
    <div class="modal-body" style="padding:20px;">
      <form id="entryForm">
        <select id="invPrefix"><option value="INV-">INV-</option><option value="GST-">GST-</option></select>
        <input type="number" id="invNumber" placeholder="Number" required>
        <input type="text" id="customerName" placeholder="Name" required>
        <input type="text" id="reason" placeholder="Reason" required>
        <select id="payMode" onchange="toggleSplitFields()">
            <option value="Cash">Cash Only</option>
            <option value="Online">Online Only</option>
            <option value="Split">Split (Cash + Online)</option>
        </select>
        <input type="number" id="singleAmount" placeholder="Amount">
        <div id="splitAmountContainer" style="display:none;">
            <input type="number" id="splitCash" placeholder="Cash Amount">
            <input type="number" id="splitOnline" placeholder="Online Amount">
        </div>
        <div class="toggle-container"><span>Pending</span><label class="switch"><input type="checkbox" id="isPending"><span class="slider"></span></label></div>
        <button type="submit" class="btn-save">Save Entry</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="passOverlay"></div>
  <div class="modal" id="passModal">
    <div class="modal-body" style="padding:40px;">
      <h3>Enter Password</h3>
      <input type="password" id="passInput" placeholder="Password">
      <button class="btn-save" onclick="verifyDelete()">Confirm Delete</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, where, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    const db = getFirestore(initializeApp({
        apiKey: "AIzaSyAumKMYJnORESyGLoYttNSJi1HhOJU6rgM",
        projectId: "meena-logbook"
    }));

    let deleteId = null;
    const transactionsRef = collection(db, "daily_transactions");

    // UI Helpers
    const vibrate = () => navigator.vibrate && navigator.vibrate(50);
    const fabBtn = document.getElementById('fabBtn');
    
    // Core Logic
    window.deleteEntry = (id) => {
        vibrate();
        deleteId = id;
        document.getElementById('passOverlay').classList.add('open');
        document.getElementById('passModal').classList.add('open');
    };

    window.verifyDelete = async () => {
        if(document.getElementById('passInput').value === "2502") {
            await deleteDoc(doc(db, "daily_transactions", deleteId));
            document.getElementById('passOverlay').classList.remove('open');
            document.getElementById('passModal').classList.remove('open');
            document.getElementById('passInput').value = "";
        } else {
            alert("Wrong Password");
        }
    };

    // ... (All other logic: fetching, rendering, submitting, toggle remains as per your previous requirements)
    // IMPORTANT: Ensure you include all existing event listeners and fetchLogsForDate logic here to maintain the app.
  </script>
</body>
</html>
