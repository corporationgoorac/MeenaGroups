<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meena LogBook</title>
  
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a">
  
  <link rel="manifest" href="manifest.json">

  <style>
    /* === PREMIUM AUTO DARK / LIGHT THEME === */
    :root {
      --bg-color: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      --cash-color: #10b981;
      --online-color: #3b82f6;
      --split-color: #f59e0b;
      --border: #e2e8f0;
      --input-bg: #f1f5f9;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --card-radius: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --card-bg: #1e293b;
        --primary: #6366f1;
        --primary-gradient: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
        --cash-color: #34d399;
        --online-color: #60a5fa;
        --split-color: #fbbf24;
        --border: #334155;
        --input-bg: #0f172a;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      }
    }

    /* === BASE STYLES === */
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      padding-bottom: 90px;
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      background-color: var(--card-bg);
      padding: 20px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    header::before {
      content: '';
      display: block;
      width: 12px;
      height: 12px;
      background: var(--primary-gradient);
      border-radius: 50%;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    /* === SUMMARY CARD (Premium Look) === */
    .summary-card {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      padding: 24px;
      display: flex;
      justify-content: space-between;
      box-shadow: var(--shadow-md);
      margin-bottom: 28px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .summary-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 4px;
      background: var(--primary-gradient);
    }

    .summary-item {
      text-align: center;
      flex: 1;
    }

    .summary-item:first-child { 
      border-right: 1px solid var(--border); 
    }

    .summary-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .summary-value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
    }
    
    .text-cash { color: var(--cash-color); }
    .text-online { color: var(--online-color); }

    /* === HISTORY LIST === */
    .section-title {
      font-size: 18px;
      color: var(--text-main);
      margin-bottom: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .history-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.2s;
    }
    
    .history-card:active { transform: scale(0.98); }

    .hc-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .hc-middle {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hc-customer { font-weight: 700; font-size: 17px; color: var(--text-main); }
    .hc-amount { font-weight: 800; font-size: 18px; }
    
    .hc-bottom {
      display: flex;
      gap: 10px;
      font-size: 13px;
      align-items: center;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .bg-cash { background: rgba(16, 185, 129, 0.15); color: var(--cash-color); }
    .bg-online { background: rgba(59, 130, 246, 0.15); color: var(--online-color); }
    .bg-split { background: rgba(245, 158, 11, 0.15); color: var(--split-color); }

    /* === FLOATING ACTION BUTTON === */
    .fab {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 64px;
      height: 64px;
      background: var(--primary-gradient);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 300;
      box-shadow: var(--shadow-lg);
      cursor: pointer;
      z-index: 20;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .fab:active { 
      transform: scale(0.92); 
      box-shadow: var(--shadow-md);
    }

    /* === SLIDE-IN MODAL === */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(3px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      position: fixed;
      top: 0; right: -100%; bottom: 0;
      width: 100%;
      max-width: 450px;
      background-color: var(--bg-color);
      z-index: 50;
      transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -10px 0 25px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
    }
    .modal.open { right: 0; }

    .modal-header {
      padding: 20px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      font-weight: 800;
    }

    .close-btn {
      background: var(--input-bg);
      border: none;
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 1;
      transition: background 0.2s;
    }
    .close-btn:active { background: var(--border); }

    .modal-body {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
    }

    /* === FORM ELEMENTS === */
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--input-bg);
      color: var(--text-main);
      box-sizing: border-box;
      font-size: 16px;
      font-weight: 500;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: var(--text-muted); opacity: 0.6; }
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
      background: var(--card-bg);
    }

    .input-row { display: flex; gap: 12px; }

    .btn-save {
      width: 100%;
      padding: 18px;
      background: var(--primary-gradient);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: var(--shadow-md);
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn-save:active { 
      transform: scale(0.98); 
      opacity: 0.9; 
    }
    .btn-save:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <header>Meena LogBook</header>

  <div class="container">
    <div class="summary-card">
      <div class="summary-item">
        <div class="summary-label">Total Cash</div>
        <div class="summary-value text-cash" id="totalCashView">₹0</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">Total Online</div>
        <div class="summary-value text-online" id="totalOnlineView">₹0</div>
      </div>
    </div>

    <div class="section-title">
      Today's Entries
      <span id="dateView" style="font-size: 14px; color: var(--text-muted); font-weight: 500;"></span>
    </div>
    
    <div id="historyList">
      <p style="color: var(--text-muted); text-align: center; margin-top: 40px; font-weight: 500;">No entries yet today. Tap + to start.</p>
    </div>
  </div>

  <div class="fab" id="fabBtn">+</div>

  <div class="modal-overlay" id="modalOverlay"></div>

  <div class="modal" id="entryModal">
    <div class="modal-header">
      <span>New Entry</span>
      <button class="close-btn" id="closeModalBtn">&times;</button>
    </div>
    
    <div class="modal-body">
      <form id="entryForm">
        
        <div class="form-group">
          <label>Invoice Number</label>
          <div class="input-row">
            <select id="invPrefix" style="width: 35%;">
              <option value="GST-">GST-</option>
              <option value="INV-">INV-</option>
            </select>
            <input type="number" id="invNumber" style="width: 65%;" placeholder="e.g. 1767" required>
          </div>
        </div>

        <div class="form-group">
          <label>Customer Name</label>
          <input type="text" id="customerName" placeholder="Enter full name" required autocomplete="off">
        </div>

        <div class="form-group">
          <label>Reason / Items</label>
          <input type="text" id="reason" placeholder="e.g. 2x Shirts, Bill Payment" required autocomplete="off">
        </div>

        <div class="form-group">
          <label>Payment Mode</label>
          <select id="payMode" onchange="toggleSplitFields()">
            <option value="Cash">Cash Only</option>
            <option value="Online">Online Only</option>
            <option value="Split">Split (Cash + Online)</option>
          </select>
        </div>

        <div class="form-group" id="singleAmountContainer">
          <label>Total Amount (₹)</label>
          <input type="number" id="singleAmount" placeholder="0.00" step="any">
        </div>

        <div class="input-row" id="splitAmountContainer" style="display: none;">
          <div class="form-group" style="flex: 1;">
            <label>Cash (₹)</label>
            <input type="number" id="splitCash" placeholder="0.00" step="any">
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Online (₹)</label>
            <input type="number" id="splitOnline" placeholder="0.00" step="any">
          </div>
        </div>

        <button type="submit" class="btn-save" id="saveBtn">Save Entry</button>
      </form>
    </div>
  </div>

  <script type="module">
    // === FIREBASE SETUP ===
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAumKMYJnORESyGLoYttNSJi1HhOJU6rgM",
      authDomain: "meena-logbook.firebaseapp.com",
      projectId: "meena-logbook",
      storageBucket: "meena-logbook.firebasestorage.app",
      messagingSenderId: "466637891440",
      appId: "1:466637891440:web:0d74df16182c6c665491b5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // === UTILITY FUNCTIONS ===
    const formatCurrency = (amt) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 2 }).format(amt || 0);
    
    // Set UI Date Header
    document.getElementById('dateView').innerText = new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

    // FIXED: Get Today's Date String (YYYY-MM-DD) natively in IST timezone
    const getTodayString = () => {
      const date = new Date();
      // Ensure we get the local date string without timezone shifting issues
      const localDate = new Date(date.getTime() - (date.getTimezoneOffset() * 60000));
      // IMPORTANT FIX: Added [0] so it returns a String, not an Array!
      return localDate.toISOString().split('T')[0]; 
    };
    
    const todayDocId = getTodayString();
    const dayDocRef = doc(db, "daily_logs", todayDocId);

    // === UI ELEMENTS ===
    const fabBtn = document.getElementById('fabBtn');
    const entryModal = document.getElementById('entryModal');
    const modalOverlay = document.getElementById('modalOverlay');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const entryForm = document.getElementById('entryForm');
    const historyList = document.getElementById('historyList');

    // === MODAL LOGIC (With Mobile Back Button Support) ===
    function openModal() {
      entryModal.classList.add('open');
      modalOverlay.classList.add('open');
      history.pushState({ modalOpen: true }, '', '#new-entry');
      // Auto focus Invoice number field
      setTimeout(() => document.getElementById('invNumber').focus(), 350);
    }

    function closeModal() {
      entryModal.classList.remove('open');
      modalOverlay.classList.remove('open');
      entryForm.reset();
      toggleSplitFields(); // reset visibility
    }

    window.addEventListener('popstate', (e) => {
      if (entryModal.classList.contains('open')) {
        closeModal();
      }
    });

    fabBtn.addEventListener('click', openModal);
    closeModalBtn.addEventListener('click', () => history.back()); 
    modalOverlay.addEventListener('click', () => history.back());

    // === SPLIT AMOUNT LOGIC ===
    window.toggleSplitFields = function() {
      const mode = document.getElementById('payMode').value;
      const singleContainer = document.getElementById('singleAmountContainer');
      const splitContainer = document.getElementById('splitAmountContainer');
      const singleInput = document.getElementById('singleAmount');
      const splitCash = document.getElementById('splitCash');
      const splitOnline = document.getElementById('splitOnline');

      if (mode === 'Split') {
        singleContainer.style.display = 'none';
        splitContainer.style.display = 'flex';
        singleInput.removeAttribute('required');
        splitCash.setAttribute('required', 'true');
        splitOnline.setAttribute('required', 'true');
      } else {
        singleContainer.style.display = 'block';
        splitContainer.style.display = 'none';
        singleInput.setAttribute('required', 'true');
        splitCash.removeAttribute('required');
        splitOnline.removeAttribute('required');
      }
    }

    // === FETCH & RENDER DATA ===
    onSnapshot(dayDocRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        
        // Update Totals
        document.getElementById('totalCashView').innerText = formatCurrency(data.totalCash);
        document.getElementById('totalOnlineView').innerText = formatCurrency(data.totalOnline);

        // Update History (Reverse order)
        if (data.transactions && data.transactions.length > 0) {
          const sortedTx = [...data.transactions].reverse();
          historyList.innerHTML = sortedTx.map(tx => {
            const modeClass = tx.mode.toLowerCase() === 'split' ? 'split' : tx.mode.toLowerCase();
            return `
            <div class="history-card">
              <div class="hc-top">
                <span style="font-weight: 600; color: var(--text-main);">${tx.invoiceNo}</span>
                <span>${tx.time}</span>
              </div>
              <div class="hc-middle">
                <span class="hc-customer">${tx.customerName}</span>
                <span class="hc-amount text-${modeClass}">
                  ${formatCurrency(tx.totalAmount)}
                </span>
              </div>
              <div class="hc-bottom">
                <span class="badge bg-${modeClass}">${tx.mode}</span>
                <span style="color: var(--text-muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${tx.reason}</span>
              </div>
            </div>
          `}).join('');
        }
      } else {
        document.getElementById('totalCashView').innerText = formatCurrency(0);
        document.getElementById('totalOnlineView').innerText = formatCurrency(0);
        historyList.innerHTML = `<p style="color: var(--text-muted); text-align: center; margin-top: 40px; font-weight: 500;">No entries yet today. Tap + to start.</p>`;
      }
    }, (error) => {
      console.error("Firebase Read Error:", error);
      alert("Could not connect to database. Check internet or permissions.");
    });

    // === SAVE ENTRY ===
    entryForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.innerText = "Saving...";
      saveBtn.disabled = true;

      const prefix = document.getElementById('invPrefix').value;
      const invNum = document.getElementById('invNumber').value;
      const customer = document.getElementById('customerName').value;
      const reason = document.getElementById('reason').value;
      const mode = document.getElementById('payMode').value;
      
      let cashAmt = 0;
      let onlineAmt = 0;

      if (mode === 'Split') {
        cashAmt = Number(document.getElementById('splitCash').value) || 0;
        onlineAmt = Number(document.getElementById('splitOnline').value) || 0;
      } else if (mode === 'Cash') {
        cashAmt = Number(document.getElementById('singleAmount').value) || 0;
      } else if (mode === 'Online') {
        onlineAmt = Number(document.getElementById('singleAmount').value) || 0;
      }

      const totalAmt = cashAmt + onlineAmt;

      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });

      const newTx = {
        id: Date.now().toString(),
        invoiceNo: prefix + invNum,
        customerName: customer,
        reason: reason,
        mode: mode,
        cashAmount: cashAmt,
        onlineAmount: onlineAmt,
        totalAmount: totalAmt,
        time: timeStr
      };

      try {
        await setDoc(dayDocRef, {
          totalCash: increment(cashAmt),
          totalOnline: increment(onlineAmt),
          transactions: arrayUnion(newTx)
        }, { merge: true });

        history.back(); // Closes modal
      } catch (err) {
        console.error("Firebase Write Error:", err);
        alert("Error saving entry. Please check your Firestore Security Rules.");
      } finally {
        saveBtn.innerText = "Save Entry";
        saveBtn.disabled = false;
      }
    });

    // === PWA REGISTRATION ===
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker Registered!', reg))
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
