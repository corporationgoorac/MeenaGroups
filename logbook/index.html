<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meena LogBook</title>
  
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f">
  
  <link rel="manifest" href="manifest.json">

  <style>
    /* === PREMIUM AUTO DARK / LIGHT THEME (YOUTUBE VIBE) === */
    :root {
      --bg-color: #ffffff;
      --text-main: #0f0f0f;
      --text-muted: #606060;
      --card-bg: #ffffff;
      --primary: #ff0000;
      --primary-dark: #cc0000;
      --primary-gradient: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
      --cash-color: #008000;
      --online-color: #065fd4;
      --split-color: #f29900;
      --border: #e5e5e5;
      --input-bg: #f2f2f2;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --card-radius: 12px;
      --skeleton-base: #e5e5e5;
      --skeleton-highlight: #f2f2f2;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f0f0f;
        --text-main: #f1f1f1;
        --text-muted: #aaaaaa;
        --card-bg: #282828;
        --primary: #ff0000;
        --primary-dark: #cc0000;
        --primary-gradient: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
        --cash-color: #2ba640;
        --online-color: #3ea6ff;
        --split-color: #f29900;
        --border: #3f3f3f;
        --input-bg: #121212;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        --skeleton-base: #3f3f3f;
        --skeleton-highlight: #555555;
      }
    }

    /* === BASE STYLES === */
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      padding-bottom: 90px;
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh;
    }

    header {
      background-color: var(--card-bg);
      padding: 16px 20px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    /* === INSTALL PILL === */
    .install-pill {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--text-main);
      color: var(--bg-color);
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      display: none; /* Hidden by default */
      align-items: center;
      gap: 8px;
      z-index: 30;
      box-shadow: var(--shadow-lg);
      cursor: pointer;
      animation: dropDown 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes dropDown {
      0% { top: 20px; opacity: 0; }
      100% { top: 70px; opacity: 1; }
    }

    /* === SKELETON LOADING === */
    .skeleton {
      background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-highlight) 50%, var(--skeleton-base) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skeleton-text { height: 32px; width: 60%; margin: 0 auto; }
    .skeleton-card { height: 90px; width: 100%; border-radius: 12px; margin-bottom: 14px; }

    /* === SUMMARY CARD === */
    .summary-card {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      padding: 24px;
      display: flex;
      justify-content: space-between;
      box-shadow: var(--shadow-md);
      margin-bottom: 28px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .summary-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: var(--primary);
    }

    .summary-item {
      text-align: center;
      flex: 1;
    }

    .summary-item:first-child { 
      border-right: 1px solid var(--border); 
    }

    .summary-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .summary-value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    
    .text-cash { color: var(--cash-color); }
    .text-online { color: var(--online-color); }

    /* === HISTORY LIST === */
    .section-title {
      font-size: 18px;
      color: var(--text-main);
      margin-bottom: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .history-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.2s;
    }
    
    .history-card:active { transform: scale(0.98); }

    .hc-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .hc-middle {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hc-customer { font-weight: 600; font-size: 16px; color: var(--text-main); }
    .hc-amount { font-weight: 700; font-size: 18px; }
    
    .hc-bottom {
      display: flex;
      gap: 10px;
      font-size: 13px;
      align-items: center;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .bg-cash { background: rgba(0, 128, 0, 0.1); color: var(--cash-color); }
    .bg-online { background: rgba(6, 95, 212, 0.1); color: var(--online-color); }
    .bg-split { background: rgba(242, 153, 0, 0.1); color: var(--split-color); }

    /* === FLOATING ACTION BUTTON === */
    .fab {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 60px;
      height: 60px;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 300;
      box-shadow: var(--shadow-lg);
      cursor: pointer;
      z-index: 20;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .fab:active { 
      transform: scale(0.92); 
      box-shadow: var(--shadow-md);
    }

    /* === SLIDE-IN MODAL === */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(3px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      position: fixed;
      top: 0; right: -100%; bottom: 0;
      width: 100%;
      max-width: 450px;
      background-color: var(--bg-color);
      z-index: 50;
      transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -10px 0 25px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
    }
    .modal.open { right: 0; }

    .modal-header {
      padding: 16px 20px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      font-weight: 700;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 1;
      transition: background 0.2s;
    }
    .close-btn:active { background: var(--border); }

    .modal-body {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
    }

    /* === FORM ELEMENTS === */
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text-main);
      box-sizing: border-box;
      font-size: 16px;
      font-weight: 500;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: var(--text-muted); opacity: 0.8; }
    input:focus, select:focus {
      outline: none;
      border-color: var(--text-main);
      box-shadow: 0 0 0 1px var(--text-main);
      background: var(--card-bg);
    }

    .input-row { display: flex; gap: 12px; }

    .btn-save {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: var(--shadow-sm);
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn-save:active { 
      transform: scale(0.98); 
      background: var(--primary-dark);
    }
    .btn-save:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <header>
    <img src="icon.png" alt="Logo" style="width: 24px; height: 24px; border-radius: 4px;">
    Meena LogBook
  </header>

  <div class="install-pill" id="installPill">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    Install App
  </div>

  <div class="container">
    <div class="summary-card">
      <div class="summary-item">
        <div class="summary-label">Total Cash</div>
        <div class="summary-value text-cash" id="totalCashView">
          <div class="skeleton skeleton-text"></div>
        </div>
      </div>
      <div class="summary-item">
        <div class="summary-label">Total Online</div>
        <div class="summary-value text-online" id="totalOnlineView">
          <div class="skeleton skeleton-text"></div>
        </div>
      </div>
    </div>

    <div class="section-title">
      Today's Entries
      <span id="dateView" style="font-size: 14px; color: var(--text-muted); font-weight: 500;"></span>
    </div>
    
    <div id="historyList">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
  </div>

  <div class="fab" id="fabBtn">+</div>

  <div class="modal-overlay" id="modalOverlay"></div>

  <div class="modal" id="entryModal">
    <div class="modal-header">
      <span>New Entry</span>
      <button class="close-btn" id="closeModalBtn">&times;</button>
    </div>
    
    <div class="modal-body">
      <form id="entryForm">
        
        <div class="form-group">
          <label>Invoice Number</label>
          <div class="input-row">
            <select id="invPrefix" style="width: 35%;">
              <option value="GST-">GST-</option>
              <option value="INV-">INV-</option>
            </select>
            <input type="number" id="invNumber" style="width: 65%;" placeholder="e.g. 1767" required>
          </div>
        </div>

        <div class="form-group">
          <label>Customer Name</label>
          <input type="text" id="customerName" placeholder="Enter full name" required autocomplete="off">
        </div>

        <div class="form-group">
          <label>Reason / Items</label>
          <input type="text" id="reason" placeholder="e.g. 2x Shirts, Bill Payment" required autocomplete="off">
        </div>

        <div class="form-group">
          <label>Payment Mode</label>
          <select id="payMode" onchange="toggleSplitFields()">
            <option value="Cash">Cash Only</option>
            <option value="Online">Online Only</option>
            <option value="Split">Split (Cash + Online)</option>
          </select>
        </div>

        <div class="form-group" id="singleAmountContainer">
          <label>Total Amount (₹)</label>
          <input type="number" id="singleAmount" placeholder="0" step="any">
        </div>

        <div class="input-row" id="splitAmountContainer" style="display: none;">
          <div class="form-group" style="flex: 1;">
            <label>Cash (₹)</label>
            <input type="number" id="splitCash" placeholder="0" step="any">
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Online (₹)</label>
            <input type="number" id="splitOnline" placeholder="0" step="any">
          </div>
        </div>

        <button type="submit" class="btn-save" id="saveBtn">Save Entry</button>
      </form>
    </div>
  </div>

  <script type="module">
    // === FIREBASE SETUP ===
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAumKMYJnORESyGLoYttNSJi1HhOJU6rgM",
      authDomain: "meena-logbook.firebaseapp.com",
      projectId: "meena-logbook",
      storageBucket: "meena-logbook.firebasestorage.app",
      messagingSenderId: "466637891440",
      appId: "1:466637891440:web:0d74df16182c6c665491b5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // === UTILITY FUNCTIONS ===
    // Removed maximumFractionDigits and minimumFractionDigits so it shows no decimals
    const formatCurrency = (amt) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(amt || 0);
    
    // Set UI Date Header
    document.getElementById('dateView').innerText = new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

    // FIXED: Get Today's Date String (YYYY-MM-DD) natively in IST timezone
    const getTodayString = () => {
      const date = new Date();
      // Ensure we get the local date string without timezone shifting issues
      const localDate = new Date(date.getTime() - (date.getTimezoneOffset() * 60000));
      // IMPORTANT FIX: Added so it returns a String, not an Array!
      return localDate.toISOString().split('T'); 
    };
    
    const todayDocId = getTodayString();
    const dayDocRef = doc(db, "daily_logs", todayDocId);

    // === UI ELEMENTS ===
    const fabBtn = document.getElementById('fabBtn');
    const entryModal = document.getElementById('entryModal');
    const modalOverlay = document.getElementById('modalOverlay');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const entryForm = document.getElementById('entryForm');
    const historyList = document.getElementById('historyList');

    // === MODAL LOGIC (With Mobile Back Button Support) ===
    function openModal() {
      entryModal.classList.add('open');
      modalOverlay.classList.add('open');
      history.pushState({ modalOpen: true }, '', '#new-entry');
      // Auto focus Invoice number field
      setTimeout(() => document.getElementById('invNumber').focus(), 350);
    }

    function closeModal() {
      entryModal.classList.remove('open');
      modalOverlay.classList.remove('open');
      entryForm.reset();
      toggleSplitFields(); // reset visibility
    }

    window.addEventListener('popstate', (e) => {
      if (entryModal.classList.contains('open')) {
        closeModal();
      }
    });

    fabBtn.addEventListener('click', openModal);
    closeModalBtn.addEventListener('click', () => history.back()); 
    modalOverlay.addEventListener('click', () => history.back());

    // === SPLIT AMOUNT LOGIC ===
    window.toggleSplitFields = function() {
      const mode = document.getElementById('payMode').value;
      const singleContainer = document.getElementById('singleAmountContainer');
      const splitContainer = document.getElementById('splitAmountContainer');
      const singleInput = document.getElementById('singleAmount');
      const splitCash = document.getElementById('splitCash');
      const splitOnline = document.getElementById('splitOnline');

      if (mode === 'Split') {
        singleContainer.style.display = 'none';
        splitContainer.style.display = 'flex';
        singleInput.removeAttribute('required');
        splitCash.setAttribute('required', 'true');
        splitOnline.setAttribute('required', 'true');
      } else {
        singleContainer.style.display = 'block';
        splitContainer.style.display = 'none';
        singleInput.setAttribute('required', 'true');
        splitCash.removeAttribute('required');
        splitOnline.removeAttribute('required');
      }
    }

    // === FETCH & RENDER DATA ===
    onSnapshot(dayDocRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        
        // Update Totals (replaces skeleton)
        document.getElementById('totalCashView').innerText = formatCurrency(data.totalCash);
        document.getElementById('totalOnlineView').innerText = formatCurrency(data.totalOnline);

        // Update History (Reverse order)
        if (data.transactions && data.transactions.length > 0) {
          const sortedTx = [...data.transactions].reverse();
          historyList.innerHTML = sortedTx.map(tx => {
            const modeClass = tx.mode.toLowerCase() === 'split' ? 'split' : tx.mode.toLowerCase();
            return `
            <div class="history-card">
              <div class="hc-top">
                <span style="font-weight: 600; color: var(--text-main);">${tx.invoiceNo}</span>
                <span>${tx.time}</span>
              </div>
              <div class="hc-middle">
                <span class="hc-customer">${tx.customerName}</span>
                <span class="hc-amount text-${modeClass}">
                  ${formatCurrency(tx.totalAmount)}
                </span>
              </div>
              <div class="hc-bottom">
                <span class="badge bg-${modeClass}">${tx.mode}</span>
                <span style="color: var(--text-muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${tx.reason}</span>
              </div>
            </div>
          `}).join('');
        } else {
          historyList.innerHTML = `<p style="color: var(--text-muted); text-align: center; margin-top: 40px; font-weight: 500;">No entries yet today. Tap + to start.</p>`;
        }
      } else {
        // Document doesn't exist yet, clear skeletons
        document.getElementById('totalCashView').innerText = formatCurrency(0);
        document.getElementById('totalOnlineView').innerText = formatCurrency(0);
        historyList.innerHTML = `<p style="color: var(--text-muted); text-align: center; margin-top: 40px; font-weight: 500;">No entries yet today. Tap + to start.</p>`;
      }
    }, (error) => {
      console.error("Firebase Read Error:", error);
      alert("Could not connect to database. Check internet or permissions.");
    });

    // === SAVE ENTRY ===
    entryForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.innerText = "Saving...";
      saveBtn.disabled = true;

      const prefix = document.getElementById('invPrefix').value;
      const invNum = document.getElementById('invNumber').value;
      const customer = document.getElementById('customerName').value;
      const reason = document.getElementById('reason').value;
      const mode = document.getElementById('payMode').value;
      
      let cashAmt = 0;
      let onlineAmt = 0;

      if (mode === 'Split') {
        cashAmt = Number(document.getElementById('splitCash').value) || 0;
        onlineAmt = Number(document.getElementById('splitOnline').value) || 0;
      } else if (mode === 'Cash') {
        cashAmt = Number(document.getElementById('singleAmount').value) || 0;
      } else if (mode === 'Online') {
        onlineAmt = Number(document.getElementById('singleAmount').value) || 0;
      }

      const totalAmt = cashAmt + onlineAmt;

      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });

      const newTx = {
        id: Date.now().toString(),
        invoiceNo: prefix + invNum,
        customerName: customer,
        reason: reason,
        mode: mode,
        cashAmount: cashAmt,
        onlineAmount: onlineAmt,
        totalAmount: totalAmt,
        time: timeStr
      };

      try {
        await setDoc(dayDocRef, {
          totalCash: increment(cashAmt),
          totalOnline: increment(onlineAmt),
          transactions: arrayUnion(newTx)
        }, { merge: true });

        history.back(); // Closes modal
      } catch (err) {
        console.error("Firebase Write Error:", err);
        alert("Error saving entry. Please check your Firestore Security Rules.");
      } finally {
        saveBtn.innerText = "Save Entry";
        saveBtn.disabled = false;
      }
    });

    // === PWA REGISTRATION & INSTALL PILL LOGIC ===
    let deferredPrompt;
    const installPill = document.getElementById('installPill');

    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent the mini-infobar from appearing on mobile
      e.preventDefault();
      // Stash the event so it can be triggered later.
      deferredPrompt = e;
      // Update UI to notify the user they can install the PWA
      installPill.style.display = 'flex';
    });

    installPill.addEventListener('click', async () => {
      if (deferredPrompt) {
        // Show the install prompt
        deferredPrompt.prompt();
        // Wait for the user to respond to the prompt
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installPill.style.display = 'none';
        }
        // We've used the prompt, and can't use it again, throw it away
        deferredPrompt = null;
      }
    });

    window.addEventListener('appinstalled', () => {
      // Hide the app-provided install promotion
      installPill.style.display = 'none';
      deferredPrompt = null;
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker Registered!', reg))
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
