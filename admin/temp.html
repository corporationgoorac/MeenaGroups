<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Goorac - Mobile DB Importer</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: white; margin: 0; padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #1a1a1a; padding: 30px 25px; border-radius: 12px; max-width: 500px; width: 100%; box-shadow: 0 8px 25px rgba(0,0,0,0.8); border: 1px solid #333; }
    h2 { margin-top: 0; font-size: 24px; color: #2979ff; }
    p { font-size: 14px; color: #bbb; margin-bottom: 25px; line-height: 1.5; }
    
    button.import { 
      background: #2979ff; color: white; padding: 16px 20px; border: none; border-radius: 8px; 
      font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; transition: all 0.2s;
    }
    button.import:active { opacity: 0.8; }
    button.import:disabled { background: #333; color: #777; cursor: not-allowed; }
    
    input[type="file"] { 
      margin: 0 0 20px 0; color: #fff; width: 100%; padding: 12px; background: #0a0a0a; border-radius: 8px; border: 1px dashed #555; box-sizing: border-box;
    }
    
    #statusBox { margin-top: 20px; padding: 15px; background: #111; border-radius: 8px; border: 1px solid #222; }
    #status { font-weight: bold; font-size: 15px; word-wrap: break-word; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Step 2: Import to India DB</h2>
    <p>Select your downloaded <b>.json</b> backup file.</p>
    
    <input type="file" id="fileInput" accept=".json" />
    <button id="btnImport" class="import">⬆ Upload & Import Data</button>
    
    <div id="statusBox">
      <div id="status" style="color: #ff9100;">Ready.</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { getFirestore, writeBatch, doc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // ⚠️ CONFIG: Your Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD4swxPXGkuK4VaVvJKOBRkjAUIGfovZN8",
      authDomain: "meenagroupsgoorac.firebaseapp.com",
      projectId: "meenagroupsgoorac",
      storageBucket: "meenagroupsgoorac.firebasestorage.app",
      messagingSenderId: "589926126547",
      appId: "1:589926126547:web:ffa93c5877b3ce6d40d526"
    };

    const app = initializeApp(firebaseConfig);
    
    // Connect to the new database instance
    const db = getFirestore(app, "india-db");

    const statusEl = document.getElementById("status");
    const btnImport = document.getElementById("btnImport");
    const fileInput = document.getElementById("fileInput");

    btnImport.addEventListener("click", async () => {
      // ✅ FIXED: Added here so it properly selects the single file
      const file = fileInput.files;
      
      if (!file) {
        statusEl.innerText = "⚠️ Please select the JSON file first.";
        statusEl.style.color = "#ff1744";
        return;
      }

      // Lock UI
      btnImport.disabled = true;
      fileInput.disabled = true;
      statusEl.innerText = "Reading file (Optimized for Mobile)...";
      statusEl.style.color = "#2979ff";

      try {
        // Read file contents
        const textData = await file.text();
        
        statusEl.innerText = "Parsing database structure...";
        
        // Yield to let the phone screen update before the heavy lifting
        await new Promise(resolve => setTimeout(resolve, 100)); 
        
        const jsonData = JSON.parse(textData);
        await processImport(jsonData);

      } catch (error) {
        console.error(error);
        statusEl.innerText = "❌ Error reading file: " + error.message;
        statusEl.style.color = "#ff1744";
        btnImport.disabled = false;
        fileInput.disabled = false;
      }
    });

    async function processImport(jsonData) {
      statusEl.innerText = "Preparing to upload...";
      statusEl.style.color = "#ff9100";

      let batch = writeBatch(db);
      let currentBatchCount = 0;
      let totalCommitted = 0;

      try {
        for (const collectionName in jsonData) {
          const documents = jsonData[collectionName];

          for (const docId in documents) {
            const docData = documents[docId];
            const docRef = doc(db, collectionName, docId);
            
            batch.set(docRef, docData);
            currentBatchCount++;

            // Every 50 docs, let the phone breathe
            if (currentBatchCount % 50 === 0) {
              await new Promise(r => setTimeout(r, 0));
            }

            // Chunk at 490
            if (currentBatchCount >= 490) {
              statusEl.innerText = `Uploading... (${totalCommitted + currentBatchCount} documents done)`;
              await batch.commit();
              totalCommitted += currentBatchCount;
              
              batch = writeBatch(db); 
              currentBatchCount = 0; 
            }
          }
        }

        // Commit leftovers
        if (currentBatchCount > 0) {
          statusEl.innerText = `Finishing final batch...`;
          await batch.commit();
          totalCommitted += currentBatchCount;
        }

        statusEl.innerText = `✅ Success! Migrated ${totalCommitted} documents to India safely.`;
        statusEl.style.color = "#00e676";

      } catch (error) {
        console.error(error);
        statusEl.innerText = "❌ Firebase Upload Error: " + error.message;
        statusEl.style.color = "#ff1744";
        btnImport.disabled = false;
        fileInput.disabled = false;
      }
    }
  </script>
</body>
</html>
