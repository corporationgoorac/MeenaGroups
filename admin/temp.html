<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Goorac - Advanced DB Importer</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: white; margin: 0; padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #1a1a1a; padding: 30px 25px; border-radius: 12px; max-width: 500px; width: 100%; box-shadow: 0 8px 25px rgba(0,0,0,0.8); border: 1px solid #333; }
    h2 { margin-top: 0; font-size: 24px; color: #2979ff; }
    p { font-size: 14px; color: #bbb; margin-bottom: 25px; line-height: 1.5; }
    
    button.import { 
      background: #2979ff; color: white; padding: 16px 20px; border: none; border-radius: 8px; 
      font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; transition: all 0.2s;
    }
    button.import:active { transform: scale(0.98); opacity: 0.8; }
    button.import:disabled { background: #333; color: #777; cursor: not-allowed; transform: none; }
    
    input[type="file"] { 
      margin: 0 0 20px 0; color: #fff; width: 100%; padding: 12px; background: #0a0a0a; border-radius: 8px; border: 1px dashed #555; box-sizing: border-box;
    }
    
    #statusBox { margin-top: 20px; padding: 15px; background: #111; border-radius: 8px; border: 1px solid #222; display: none; }
    #status { font-weight: bold; font-size: 15px; word-wrap: break-word; margin-bottom: 5px; }
    #progressBar { height: 6px; background: #222; border-radius: 3px; overflow: hidden; margin-top: 10px; display: none; }
    #progressFill { height: 100%; background: #00e676; width: 0%; transition: width 0.3s ease; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Step 2: Import to India DB</h2>
    <p>Select your downloaded <b>.json</b> backup file. The script will automatically chunk and push your data to the new server.</p>
    
    <input type="file" id="fileInput" accept=".json" />
    <button id="btnImport" class="import">⬆ Upload & Import Data</button>
    
    <div id="statusBox">
      <div id="status" style="color: #ff9100;">Ready.</div>
      <div id="progressBar"><div id="progressFill"></div></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { getFirestore, writeBatch, doc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // ⚠️ CONFIG: Your Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD4swxPXGkuK4VaVvJKOBRkjAUIGfovZN8",
      authDomain: "meenagroupsgoorac.firebaseapp.com",
      projectId: "meenagroupsgoorac",
      storageBucket: "meenagroupsgoorac.firebasestorage.app",
      messagingSenderId: "589926126547",
      appId: "1:589926126547:web:ffa93c5877b3ce6d40d526"
    };

    const app = initializeApp(firebaseConfig);
    
    // ⚠️ CRITICAL: If you named your new India database "india-db", leave the next line as is.
    // If you did NOT give it a name and it is just the default database, change it to: getFirestore(app);
    const db = getFirestore(app, "india-db");

    const statusEl = document.getElementById("status");
    const statusBox = document.getElementById("statusBox");
    const progressFill = document.getElementById("progressFill");
    const progressBar = document.getElementById("progressBar");
    const btnImport = document.getElementById("btnImport");

    let isWorking = false;
    window.onbeforeunload = function() {
      if (isWorking) return "Data migration in progress! Are you sure you want to leave?";
    };

    function updateUI(disabled, msg, color, progressPercent = null) {
      isWorking = disabled;
      btnImport.disabled = disabled;
      document.getElementById("fileInput").disabled = disabled;
      
      statusBox.style.display = "block";
      statusEl.innerText = msg;
      statusEl.style.color = color || "#ff9100";

      if (progressPercent !== null) {
        progressBar.style.display = "block";
        progressFill.style.width = `${progressPercent}%`;
      }
    }

    btnImport.addEventListener("click", () => {
      // ✅ FIXED: Added to correctly select the file object from the array
      const file = document.getElementById("fileInput").files;
      
      if (!file) {
        updateUI(false, "⚠️ Please select the JSON file first.", "#ff1744");
        return;
      }

      updateUI(true, "Reading local file into memory...", "#2979ff", 5);

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          updateUI(true, "Parsing JSON data...", "#2979ff", 10);
          await new Promise(r => setTimeout(r, 50)); // Yield to allow UI update
          
          const jsonData = JSON.parse(e.target.result);
          await processImport(jsonData);
        } catch (err) {
          console.error(err);
          updateUI(false, "❌ Invalid JSON File or Memory Error!", "#ff1744", 0);
        }
      };
      reader.readAsText(file);
    });

    async function processImport(jsonData) {
      updateUI(true, "Calculating total documents...", "#ff9100", 15);
      
      // 1. ADVANCED: Pre-calculate total documents for accurate progress
      let totalDocsToImport = 0;
      for (const collectionName in jsonData) {
        totalDocsToImport += Object.keys(jsonData[collectionName]).length;
      }

      if (totalDocsToImport === 0) {
        updateUI(false, "⚠️ No documents found in JSON file.", "#ff1744", 0);
        return;
      }

      let batch = writeBatch(db);
      let currentBatchCount = 0;
      let totalCommitted = 0;

      try {
        for (const collectionName in jsonData) {
          const documents = jsonData[collectionName];

          for (const docId in documents) {
            const docData = documents[docId];
            const docRef = doc(db, collectionName, docId);
            
            batch.set(docRef, docData);
            currentBatchCount++;

            // Every 50 documents, yield processor to prevent mobile freezing
            if (currentBatchCount % 50 === 0) {
              await new Promise(r => setTimeout(r, 0));
            }

            // CHUNK AT 490: Commit to Firebase
            if (currentBatchCount >= 490) {
              await batch.commit();
              totalCommitted += currentBatchCount;
              
              const percent = Math.floor((totalCommitted / totalDocsToImport) * 100);
              updateUI(true, `Importing... (${totalCommitted} of ${totalDocsToImport})`, "#ff9100", percent);
              
              batch = writeBatch(db); // Reset Batch
              currentBatchCount = 0; 
            }
          }
        }

        // Commit any remaining documents in the final batch
        if (currentBatchCount > 0) {
          updateUI(true, `Committing final batch...`, "#ff9100", 95);
          await batch.commit();
          totalCommitted += currentBatchCount;
        }

        updateUI(false, `✅ Success! Migrated ${totalCommitted} documents.`, "#00e676", 100);

      } catch (error) {
        console.error(error);
        updateUI(false, "❌ Import Error: " + error.message, "#ff1744", 0);
      }
    }
  </script>
</body>
</html>
