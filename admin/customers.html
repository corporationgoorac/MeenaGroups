<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customers - MeenaGroups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex, nofollow">
  
  <style>
    * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }
    
    /* --- 1. HIGH CONTRAST / PROFESSIONAL THEME --- */
    :root { 
      --bg: #000000; 
      --surface: #0a0a0a;
      --card: #141414; 
      --input-bg: #1a1a1a;
      --primary: #00e676; /* Neon Green */
      --secondary: #2979ff; /* Bright Blue */
      --danger: #ff1744; 
      --text: #ffffff; 
      --text-muted: #888888;
      --border: #333333; 
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
      margin: 0; padding: 0; 
      height: 100vh; 
      overflow: hidden; 
      display: flex; flex-direction: column;
    }

    /* --- 2. HEADER --- */
    header {
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 15px 20px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 50; height: 60px; flex-shrink: 0;
    }
    header h1 { margin: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.5px; }
    
    .nav-btn { background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; padding: 5px; }

    /* --- 3. MAIN LIST VIEW --- */
    #main-view {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      position: relative;
    }

    /* Search Bar (Redesigned) */
    .search-wrapper { 
      position: sticky; top: 0; z-index: 10; 
      background: var(--bg); padding-bottom: 15px; margin-bottom: 10px;
    }
    .search-input {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      color: white; padding: 14px 45px 14px 15px; border-radius: 12px;
      font-size: 1rem; transition: 0.3s;
    }
    .search-input:focus { border-color: var(--secondary); box-shadow: 0 0 10px rgba(41, 121, 255, 0.2); }
    .search-icon { position: absolute; right: 15px; top: 14px; color: var(--text-muted); pointer-events: none; }

    /* Action Buttons (Top) */
    .action-bar {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      margin-bottom: 20px;
    }
    
    .btn-action {
      background: var(--card); border: 1px solid var(--border); 
      color: var(--primary); padding: 15px; border-radius: 12px;
      font-weight: 600; font-size: 0.9rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: 0.2s;
    }
    .btn-action:active { background: #222; transform: scale(0.98); }
    .btn-action.secondary { color: var(--secondary); }

    /* Customer Cards (Redesigned) */
    .customer-list { display: flex; flex-direction: column; gap: 15px; padding-bottom: 80px; }
    
    .cust-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden; position: relative;
      animation: fadeIn 0.3s ease-out;
      display: flex; flex-direction: column;
    }
    /* Status Stripe */
    .cust-card::before { content:''; position: absolute; top:0; left:0; bottom:0; width:4px; background: var(--border); transition: 0.3s; }
    .cust-card.status-ok::before { background: var(--primary); box-shadow: 0 0 10px var(--primary); }
    .cust-card.status-due::before { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

    .cust-header {
      padding: 15px; background: linear-gradient(to right, #111, #0a0a0a); 
      border-bottom: 1px solid #222;
      display: flex; justify-content: space-between; align-items: flex-start;
      padding-left: 20px; /* Space for stripe */
    }
    .cust-info h3 { margin: 0; font-size: 1.1rem; color: #fff; font-weight: 700; }
    .cust-info small { color: var(--secondary); font-family: monospace; font-size: 0.85rem; display: block; margin-top: 4px; }
    
    .cust-meta { text-align: right; font-size: 0.8rem; color: var(--text-muted); }

    .cust-body { padding: 15px; padding-left: 20px; }
    
    .prod-chip {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.03); border-radius: 8px;
      padding: 10px; margin-bottom: 8px; border: 1px solid #222;
    }
    .prod-name { font-size: 0.9rem; font-weight: 600; color: #ddd; }
    .prod-status { font-size: 0.8rem; font-weight: 700; }
    .bal-text { color: var(--danger); }
    .paid-text { color: var(--primary); }

    .card-actions {
      display: flex; border-top: 1px solid #222;
    }
    .card-btn {
      flex: 1; background: transparent; border: none; border-right: 1px solid #222;
      color: var(--text-muted); padding: 14px; font-size: 0.85rem; font-weight: 600; 
      cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
      transition: 0.2s;
    }
    .card-btn:last-child { border-right: none; }
    .card-btn:active { background: #222; color: white; }
    .btn-edit:hover { color: var(--secondary); background: rgba(41,121,255,0.05); }
    .btn-del:hover { color: var(--danger); background: rgba(255,23,68,0.05); }

    /* Loading Sentinel */
    #sentinel { height: 20px; margin-top: 20px; }

    /* --- 4. MODALS (Slide Up on Mobile / Right on Desktop) --- */
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); z-index: 200;
      display: flex; flex-direction: column;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal.active { opacity: 1; pointer-events: auto; }
    
    /* Content Slide Animation */
    .modal-content-wrapper {
      flex: 1; background: var(--bg); display: flex; flex-direction: column;
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .modal.active .modal-content-wrapper { transform: translateY(0); }

    @media (min-width: 768px) {
      .modal-content-wrapper { transform: translateX(100%); max-width: 500px; margin-left: auto; border-left: 1px solid var(--border); }
      .modal.active .modal-content-wrapper { transform: translateX(0); }
    }

    .modal-header {
      padding: 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 15px; background: var(--surface);
    }
    .btn-back { background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; }
    .modal-title { font-size: 1.2rem; font-weight: 700; margin: 0; }

    .modal-body { flex: 1; overflow-y: auto; padding: 25px; }

    /* Forms */
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; color: var(--text-muted); margin-bottom: 8px; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
    
    input {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      color: white; padding: 16px; border-radius: 12px; font-size: 1rem;
      transition: 0.2s;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0,230,118,0.1); }
    input[readonly] { opacity: 0.6; cursor: not-allowed; background: #111; }
    input:disabled { opacity: 0.6; cursor: not-allowed; background: #111; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    .btn-submit {
      width: 100%; padding: 18px; background: var(--primary); color: #000;
      font-weight: 800; border: none; border-radius: 12px; font-size: 1rem;
      margin-top: 15px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 0 15px rgba(0,230,118,0.3);
      transition: 0.2s;
    }
    .btn-submit:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }
    .btn-submit.blue { background: var(--secondary); color: white; box-shadow: 0 0 15px rgba(41,121,255,0.3); }

    /* Toast Notification */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: #222; color: white; padding: 14px 28px; border-radius: 50px;
      font-weight: 600; transition: transform 0.3s; z-index: 300;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid #333;
      display: flex; align-items: center; gap: 10px;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div id="toast" class="toast">Action Successful</div>

  <header>
    <h1>Customers</h1>
    <a href="index.html" style="text-decoration:none;"><button class="nav-btn">🏠</button></a>
  </header>

  <div id="main-view">
    <div class="search-wrapper">
      <input type="text" id="searchBox" class="search-input" placeholder="Search by ID or Name...">
      <span class="search-icon">🔍</span>
    </div>

    <div class="action-bar">
      <div class="btn-action" onclick="openModal('modal-add-customer')">
        <span>👤</span> Add Customer
      </div>
      <div class="btn-action secondary" onclick="openModal('modal-add-product')">
        <span>📦</span> Add Product
      </div>
    </div>

    <div id="customerList" class="customer-list">
      </div>
    <div id="sentinel"></div>
  </div>


  <div id="modal-add-customer" class="modal">
    <div class="modal-content-wrapper">
      <div class="modal-header">
        <button class="btn-back" onclick="closeModal()">✕</button>
        <h2 class="modal-title">New Customer</h2>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Customer ID</label>
          <input id="newId" placeholder="e.g. A20" oninput="this.value = this.value.toUpperCase()">
          <div id="newIdStatus" style="font-size: 0.85rem; margin-top: 8px; font-weight: bold;"></div>
        </div>
        <div class="form-group grid-2">
          <div>
            <label>Name</label>
            <input id="newName" placeholder="Full Name">
          </div>
          <div>
            <label>Phone</label>
            <input id="newPhone" type="tel" placeholder="Mobile">
          </div>
        </div>
        <div class="form-group">
          <label>Location</label>
          <input id="newPlace" placeholder="City / Area">
        </div>
        
        <div style="border-top: 1px dashed #333; margin: 30px 0; padding-top: 20px; color: #666; font-size: 0.8rem; font-weight: bold; text-transform: uppercase;">Initial Product</div>
        
        <div class="form-group">
          <label>Product Name</label>
          <input id="newProduct" placeholder="Item Name">
        </div>
        <div class="form-group grid-3">
          <div>
            <label>Total ₹</label>
            <input id="newTotal" type="number" placeholder="0">
          </div>
          <div>
            <label>Paid ₹</label>
            <input id="newPaid" type="number" placeholder="0">
          </div>
          <div>
            <label>Due #</label>
            <input id="newDueNum" type="number" placeholder="0">
          </div>
        </div>
        
        <button id="btnSaveCustomer" class="btn-submit">Create Profile</button>
      </div>
    </div>
  </div>


  <div id="modal-add-product" class="modal">
    <div class="modal-content-wrapper">
      <div class="modal-header">
        <button class="btn-back" onclick="closeModal()">✕</button>
        <h2 class="modal-title">Add Product</h2>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Customer ID</label>
          <input id="existId" placeholder="Enter existing ID" oninput="this.value = this.value.toUpperCase()">
        </div>
        <div class="form-group">
          <label>Product Name</label>
          <input id="addProduct" placeholder="Item Name">
        </div>
        <div class="form-group grid-3">
          <div>
            <label>Total ₹</label>
            <input id="addTotal" type="number" placeholder="0">
          </div>
          <div>
            <label>Paid ₹</label>
            <input id="addPaid" type="number" placeholder="0">
          </div>
          <div>
            <label>Due #</label>
            <input id="addDueNum" type="number" placeholder="0">
          </div>
        </div>
        <button id="btnSaveProduct" class="btn-submit blue">Add to Profile</button>
      </div>
    </div>
  </div>


  <div id="modal-edit-customer" class="modal">
    <div class="modal-content-wrapper">
      <div class="modal-header">
        <button class="btn-back" onclick="closeModal()">✕</button>
        <h2 class="modal-title">Edit Profile</h2>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Customer ID</label>
          <input type="hidden" id="originalEditId">
          <input id="editId" oninput="this.value = this.value.toUpperCase()">
          <div id="editIdStatus" style="font-size: 0.85rem; margin-top: 8px; font-weight: bold;"></div>
        </div>
        <div class="form-group">
          <label>Full Name</label>
          <input id="editName">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input id="editPhone">
        </div>
        <div class="form-group">
          <label>Location</label>
          <input id="editPlace">
        </div>
        <button id="btnUpdateCustomer" class="btn-submit" style="background:#333; color:#fff; border:1px solid #555;">Save Changes</button>
      </div>
    </div>
  </div>


  <script type="module">
    import { db } from "./config.js";
    import { 
      doc, getDoc, updateDoc, deleteDoc, 
      collection, query, where, limit, getDocs, orderBy, startAfter,
      runTransaction, increment 
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // --- GLOBAL VARIABLES ---
    let lastVisibleDoc = null;
    let isFetching = false;
    let noMoreData = false;
    let searchTimeout = null;

    // --- 1. UI: MODAL & NAVIGATION LOGIC ---
    window.openModal = (modalId) => {
      window.history.pushState({modal: modalId}, '', `#${modalId}`);
      document.getElementById(modalId).classList.add('active');
    };

    window.closeModal = () => {
      document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
      if(window.location.hash) window.history.back(); 
    };

    window.addEventListener('popstate', (event) => {
      document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
    });

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.innerHTML = `<span>✅</span> ${msg}`;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 3000);
    }

    // --- 2. FIREBASE: LOAD & INFINITE SCROLL ---
    async function loadCustomers(reset = false) {
      if (isFetching || (noMoreData && !reset)) return;
      isFetching = true;

      const container = document.getElementById("customerList");
      if (reset) {
        container.innerHTML = "";
        lastVisibleDoc = null;
        noMoreData = false;
      }

      try {
        let q;
        const colRef = collection(db, "customers");
        
        if (reset) {
          q = query(colRef, orderBy("createdAt", "desc"), limit(10));
        } else {
          q = query(colRef, orderBy("createdAt", "desc"), startAfter(lastVisibleDoc), limit(10));
        }

        const snapshot = await getDocs(q);
        
        if (snapshot.empty) {
          noMoreData = true;
          if(reset) container.innerHTML = "<div style='text-align:center; padding:40px; color:#555;'>No customers found.</div>";
        } else {
          lastVisibleDoc = snapshot.docs[snapshot.docs.length - 1];
          renderList(snapshot, container);
        }
      } catch (e) {
        console.error(e);
      } finally {
        isFetching = false;
      }
    }

    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !isFetching) {
        loadCustomers(false);
      }
    }, { threshold: 0.5 });
    observer.observe(document.getElementById("sentinel"));

    // --- 3. RENDER LIST (REDESIGNED CARD) ---
    function renderList(snapshot, container) {
      snapshot.forEach(docSnap => {
        const c = docSnap.data();
        let totalDue = 0;
        
        // Product HTML
        let prodHTML = "";
        if(c.products) {
            c.products.forEach(p => {
              const bal = (p.total || 0) - (p.paid || 0);
              totalDue += bal;
              const statusClass = bal > 0 ? "bal-text" : "paid-text";
              const statusText = bal > 0 ? `₹${bal}` : "PAID";
              
              prodHTML += `
                <div class="prod-chip">
                  <span class="prod-name">${p.name}</span>
                  <span class="prod-status ${statusClass}">${statusText}</span>
                </div>`;
            });
        }

        const cardStatus = totalDue > 0 ? "status-due" : "status-ok";

        const div = document.createElement("div");
        div.className = `cust-card ${cardStatus}`;
        div.innerHTML = `
          <div class="cust-header">
            <div class="cust-info">
              <h3>${c.name}</h3>
              <small>${c.id}</small>
            </div>
            <div class="cust-meta">
              ${c.place || ''}<br>
              ${c.phone || ''}
            </div>
          </div>
          <div class="cust-body">
            ${prodHTML || '<small style="color:#666">No Products</small>'}
          </div>
          <div class="card-actions">
            <button class="card-btn btn-edit" onclick="editCustomer('${c.id}')">EDIT</button>
            <button class="card-btn btn-del" onclick="deleteCustomer('${c.id}')">DELETE</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // --- 4. SEARCH FUNCTIONALITY (FIXED: ID + NAME) ---
    document.getElementById("searchBox").addEventListener("input", (e) => {
      const term = e.target.value.trim();
      clearTimeout(searchTimeout);
      
      searchTimeout = setTimeout(async () => {
        const container = document.getElementById("customerList");
        container.innerHTML = "";
        noMoreData = true; // Disable scroll loading

        if (!term) {
          loadCustomers(true); 
          return;
        }

        try {
          const colRef = collection(db, "customers");
          
          // Parallel Queries: 1. ID Match  2. Name Match
          const idTerm = term.toUpperCase();
          const nameTerm = term; // Firestore is case-sensitive, assumes standard casing

          const [idSnap, nameSnap] = await Promise.all([
             getDocs(query(colRef, where("id", ">=", idTerm), where("id", "<=", idTerm + '\uf8ff'), limit(5))),
             getDocs(query(colRef, where("name", ">=", nameTerm), where("name", "<=", nameTerm + '\uf8ff'), limit(5)))
          ]);

          // Merge Results (Unique IDs)
          const results = new Map();
          idSnap.forEach(doc => results.set(doc.id, doc));
          nameSnap.forEach(doc => results.set(doc.id, doc));

          if(results.size === 0) {
             container.innerHTML = "<div style='text-align:center; padding:40px; color:#555;'>No matches found.</div>";
          } else {
             renderList(results, container);
          }
        } catch(e) { console.error(e); }
      }, 600);
    });

    // --- 5. ADD CUSTOMER LOGIC WITH REALTIME ID CHECK ---
    let newIdCheckTimeout = null;
    document.getElementById("newId").addEventListener("input", (e) => {
      const newId = e.target.value.trim().toUpperCase();
      const statusDiv = document.getElementById("newIdStatus");
      const saveBtn = document.getElementById("btnSaveCustomer");
      
      if(newId === "") {
         statusDiv.innerHTML = "❌ ID cannot be empty";
         statusDiv.style.color = "var(--danger)";
         saveBtn.disabled = true;
         return;
      }
      
      statusDiv.innerHTML = "Checking availability...";
      statusDiv.style.color = "var(--text-muted)";
      saveBtn.disabled = true;
      
      clearTimeout(newIdCheckTimeout);
      newIdCheckTimeout = setTimeout(async () => {
         try {
            const snap = await getDoc(doc(db, "customers", newId));
            if(snap.exists()) {
               statusDiv.innerHTML = "❌ Not available";
               statusDiv.style.color = "var(--danger)";
               saveBtn.disabled = true;
            } else {
               statusDiv.innerHTML = "✅ Available";
               statusDiv.style.color = "var(--primary)";
               saveBtn.disabled = false;
            }
         } catch(err) {
            console.error(err);
         }
      }, 500);
    });

    document.getElementById("btnSaveCustomer").addEventListener("click", async () => {
      const idInput = document.getElementById("newId");
      const id = idInput.value.trim().toUpperCase(); 
      const name = document.getElementById("newName").value.trim();
      const product = document.getElementById("newProduct").value.trim();
      const total = parseFloat(document.getElementById("newTotal").value);
      const paid = parseFloat(document.getElementById("newPaid").value);
      const dueNum = parseInt(document.getElementById("newDueNum").value) || 0;

      if (!id || !name || !product || isNaN(total) || isNaN(paid)) return alert("Fill all fields");

      const btn = document.getElementById("btnSaveCustomer");
      btn.innerText = "Saving...";
      btn.disabled = true;

      try {
        await runTransaction(db, async (transaction) => {
          const custRef = doc(db, "customers", id);
          
          const check = await transaction.get(custRef);
          if (check.exists()) throw "Customer ID already exists!";

          transaction.set(custRef, {
            id, name, 
            phone: document.getElementById("newPhone").value.trim(),
            place: document.getElementById("newPlace").value.trim(),
            createdAt: new Date().toISOString(),
            products: [{
              name: product, total, paid,
              payments: [{ date: new Date().toISOString().split("T")[0], amount: paid, dueNumber: dueNum, type: "Downpayment" }]
            }]
          });
        });

        showToast("Customer Created!");
        ["newId", "newName", "newPhone", "newPlace", "newProduct", "newTotal", "newPaid", "newDueNum"].forEach(i => document.getElementById(i).value = "");
        document.getElementById("newIdStatus").innerHTML = ""; // Clear status text on success
        closeModal(); 
        loadCustomers(true); 

      } catch (e) { alert(e); } 
      finally { btn.innerText = "Create Profile"; btn.disabled = false; }
    });

    // --- 6. ADD PRODUCT LOGIC ---
    document.getElementById("btnSaveProduct").addEventListener("click", async () => {
      const id = document.getElementById("existId").value.trim().toUpperCase();
      const name = document.getElementById("addProduct").value.trim();
      const total = parseFloat(document.getElementById("addTotal").value);
      const paid = parseFloat(document.getElementById("addPaid").value);
      const dueNum = parseInt(document.getElementById("addDueNum").value) || 0;

      if (!id || !name || isNaN(total)) return alert("Check inputs");

      const btn = document.getElementById("btnSaveProduct");
      btn.innerText = "Processing...";
      btn.disabled = true;

      try {
        await runTransaction(db, async (transaction) => {
          const custRef = doc(db, "customers", id);
          const snap = await transaction.get(custRef);
          if (!snap.exists()) throw "ID not found!";

          const data = snap.data();
          if(!data.products) data.products = [];
          
          data.products.push({
            name, total, paid,
            payments: [{ date: new Date().toISOString().split("T")[0], amount: paid, dueNumber: dueNum, type: "Downpayment" }]
          });

          transaction.update(custRef, { products: data.products });
        });

        showToast("Product Added!");
        ["existId", "addProduct", "addTotal", "addPaid", "addDueNum"].forEach(i => document.getElementById(i).value = "");
        closeModal();
        loadCustomers(true);
      } catch (e) { alert(e); }
      finally { btn.innerText = "Add to Profile"; btn.disabled = false; }
    });

    // --- 7. EDIT LOGIC WITH REALTIME ID CHECK ---
    window.editCustomer = async (id) => {
      try {
        const snap = await getDoc(doc(db, "customers", id));
        if(!snap.exists()) return;
        const d = snap.data();
        
        document.getElementById("originalEditId").value = d.id;
        document.getElementById("editId").value = d.id;
        document.getElementById("editName").value = d.name;
        document.getElementById("editPhone").value = d.phone || "";
        document.getElementById("editPlace").value = d.place || "";

        // Reset status texts and buttons on load
        document.getElementById("editIdStatus").innerHTML = "";
        document.getElementById("btnUpdateCustomer").disabled = false;
        
        openModal('modal-edit-customer');
      } catch(e) { console.error(e); }
    };

    let editIdCheckTimeout = null;
    document.getElementById("editId").addEventListener("input", (e) => {
      const newId = e.target.value.trim().toUpperCase();
      const originalId = document.getElementById("originalEditId").value;
      const statusDiv = document.getElementById("editIdStatus");
      const saveBtn = document.getElementById("btnUpdateCustomer");
      
      if(newId === "") {
         statusDiv.innerHTML = "❌ ID cannot be empty";
         statusDiv.style.color = "var(--danger)";
         saveBtn.disabled = true;
         return;
      }
      if(newId === originalId) {
         statusDiv.innerHTML = "✅ Original ID";
         statusDiv.style.color = "var(--primary)";
         saveBtn.disabled = false;
         return;
      }
      
      statusDiv.innerHTML = "Checking availability...";
      statusDiv.style.color = "var(--text-muted)";
      saveBtn.disabled = true;
      
      clearTimeout(editIdCheckTimeout);
      editIdCheckTimeout = setTimeout(async () => {
         try {
            const snap = await getDoc(doc(db, "customers", newId));
            if(snap.exists()) {
               statusDiv.innerHTML = "❌ Not available";
               statusDiv.style.color = "var(--danger)";
               saveBtn.disabled = true;
            } else {
               statusDiv.innerHTML = "✅ Available";
               statusDiv.style.color = "var(--primary)";
               saveBtn.disabled = false;
            }
         } catch(err) {
            console.error(err);
         }
      }, 500);
    });

    document.getElementById("btnUpdateCustomer").addEventListener("click", async () => {
      const oldId = document.getElementById("originalEditId").value;
      const newId = document.getElementById("editId").value.trim().toUpperCase();
      const newName = document.getElementById("editName").value.trim();
      const newPhone = document.getElementById("editPhone").value.trim();
      const newPlace = document.getElementById("editPlace").value.trim();
      
      if(!newId || !newName) return alert("ID and Name are required");

      const btn = document.getElementById("btnUpdateCustomer");
      btn.innerText = "Saving...";
      btn.disabled = true;

      try {
        if (oldId === newId) {
          // Normal update if ID hasn't changed
          await updateDoc(doc(db, "customers", oldId), {
            name: newName,
            phone: newPhone,
            place: newPlace
          });
        } else {
          // If ID changes, we must safely duplicate the old data into a new document and delete the old one.
          await runTransaction(db, async (transaction) => {
            const oldDocRef = doc(db, "customers", oldId);
            const newDocRef = doc(db, "customers", newId);
            
            const newCheck = await transaction.get(newDocRef);
            if (newCheck.exists()) throw "New ID is already taken!";
            
            const oldSnap = await transaction.get(oldDocRef);
            if (!oldSnap.exists()) throw "Original record missing!";
            
            const data = oldSnap.data();
            data.id = newId; // Update inside document 
            data.name = newName;
            data.phone = newPhone;
            data.place = newPlace;
            
            transaction.set(newDocRef, data);
            transaction.delete(oldDocRef);
          });
        }

        showToast("Profile Updated");
        closeModal();
        loadCustomers(true);
      } catch(e) { 
        alert(e); 
      } finally {
        btn.innerText = "Save Changes";
        btn.disabled = false;
      }
    });

    // --- 8. DELETE LOGIC ---
    window.deleteCustomer = async (id) => {
      if(!confirm(`Delete customer ${id}?\nIrreversible action.`)) return;
      try {
        await deleteDoc(doc(db, "customers", id));
        showToast("Deleted");
        loadCustomers(true);
      } catch(e) { alert(e); }
    };

    // Init
    loadCustomers(true);
    
    // Attach globals for HTML inline calls
    window.editCustomer = editCustomer;
    window.deleteCustomer = deleteCustomer;
    window.openModal = openModal;
    window.closeModal = closeModal;

  </script>
</body>
</html>
