<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - MeenaGroups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  
  <link rel="manifest" href="manifest.json">

  <style>
    /* --- 1. PROFESSIONAL HIGH CONTRAST THEME --- */
    :root { 
      --bg: #000000; 
      --surface: #0a0a0a;
      --card: #141414; 
      --primary: #00e676; /* Neon Green */
      --primary-dim: rgba(0, 230, 118, 0.1);
      --secondary: #2979ff; /* Blue */
      --text: #ffffff; 
      --text-muted: #888888;
      --border: #222222; 
      --nav-bg: #0f0f0f;
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      margin: 0; 
      padding: 0; 
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* Prevent body scroll, handle inside container */
    }

    /* --- 2. HEADER / BRANDING (Shared Desktop & Mobile) --- */
    .app-header {
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border);
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
    }

    .brand-container {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .brand-main {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text);
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 1px;
      margin-top: 2px;
    }
    
    .brand-sub span { color: var(--primary); font-weight: 600; }

    /* --- 3. DESKTOP NAVIGATION (Right side of header) --- */
    .desktop-nav-links { display: flex; gap: 5px; }
    
    .desktop-link { 
      color: var(--text-muted); 
      text-decoration: none; 
      padding: 10px 18px; 
      border-radius: 8px; 
      font-size: 0.9rem; 
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .desktop-link:hover { color: white; background: #222; }
    .desktop-link.active { color: var(--primary); background: var(--primary-dim); border: 1px solid rgba(0,230,118,0.2); }

    /* --- 4. MAIN CONTAINER --- */
    .main-content { 
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      position: relative;
      /* Background Mesh Gradient Effect */
      background: radial-gradient(circle at 50% 10%, #111 0%, #000 70%);
    }

    .greeting-card {
      padding: 40px;
      max-width: 600px;
      width: 100%;
      animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .greeting-badge { 
      display: inline-block;
      font-size: 0.8rem; 
      color: var(--primary); 
      background: var(--primary-dim);
      border: 1px solid rgba(0,230,118,0.3);
      padding: 6px 14px;
      border-radius: 20px;
      text-transform: uppercase; 
      letter-spacing: 1px; 
      font-weight: 700; 
      margin-bottom: 20px;
    }

    .greeting-title { 
      font-size: 3.5rem; 
      margin: 0; 
      font-weight: 700; 
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 30%, #777777 100%); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent;
    }
    
    .greeting-sub { 
      color: var(--text-muted); 
      margin-top: 15px; 
      font-size: 1.1rem; 
      font-weight: 300;
    }
    
    .live-clock {
      margin-top: 40px;
      font-size: 5rem;
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      text-shadow: 0 0 30px rgba(255,255,255,0.05);
      line-height: 1;
    }

    .live-date {
      font-size: 1.1rem;
      color: var(--secondary);
      margin-top: 10px;
      font-weight: 500;
      opacity: 0.9;
    }

    /* --- 5. MOBILE BOTTOM NAVIGATION --- */
    .mobile-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(15, 15, 15, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: none;
      justify-content: space-around;
      padding: 10px 0 25px 0; /* Extra padding for iOS home indicator */
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #666;
      font-size: 0.7rem;
      padding: 8px;
      width: 20%; /* Equal spacing */
      transition: 0.2s;
    }
    
    .nav-item svg { width: 24px; height: 24px; margin-bottom: 5px; fill: currentColor; }
    .nav-item.active { color: var(--primary); }
    .nav-item.active svg { filter: drop-shadow(0 0 8px rgba(0,230,118,0.4)); }

    /* --- 6. INSTALL PROMPT --- */
    #adminInstallPrompt {
      position: fixed; top: 80px; right: 20px;
      width: auto;
      background: var(--surface); 
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px; border-radius: 50px; display: none;
      align-items: center; gap: 15px;
      z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      animation: slideInRight 0.5s ease-out;
    }
    #adminInstallPrompt span { font-weight: 600; font-size: 0.85rem; }
    #adminInstallPrompt button {
      background: var(--primary); color: #000; border: none;
      padding: 6px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.8rem;
    }

    /* --- RESPONSIVENESS --- */
    @media (max-width: 768px) {
      .desktop-nav-links { display: none; } /* Hide Desktop Links */
      .mobile-nav { display: flex; } /* Show Bottom Bar */
      
      .greeting-title { font-size: 2.5rem; }
      .live-clock { font-size: 4rem; }
      .greeting-card { padding: 20px; }
      .main-content { padding-bottom: 90px; } /* Space for bottom nav */
      
      /* Mobile Header Adjustments */
      .app-header { padding: 12px 20px; background: var(--surface); }
      #adminInstallPrompt { top: auto; bottom: 100px; right: 50%; transform: translateX(50%); width: 90%; max-width: 300px; justify-content: space-between; }
    }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideInRight { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  </style>
</head>
<body>

  <header class="app-header">
    <div class="brand-container">
      <div class="brand-main">MeenaGroups</div>
      <div class="brand-sub">powered by <span>Goorac</span></div>
    </div>

    <nav class="desktop-nav-links">
      <a href="index.html" class="desktop-link active">Dashboard</a>
      <a href="customers.html" class="desktop-link">Customers</a>
      <a href="entries.html" class="desktop-link">Entries</a>
      <a href="review.html" class="desktop-link">Agent Sync</a>
      <a href="report.html" class="desktop-link">Reports</a>
    </nav>
  </header>

  <div id="adminInstallPrompt">
    <span>📲 Install App</span>
    <button id="btnAdminInstall">Install</button>
  </div>

  <div class="main-content">
    <div class="greeting-card">
      <div class="greeting-badge" id="greetingMessage">Hello</div>
      <h1 class="greeting-title">Admin Console</h1>
      <p class="greeting-sub">Secure access to EMI management system.</p>
      
      <div class="live-clock" id="liveClock">00:00</div>
      <div class="live-date" id="liveDate">Loading...</div>
    </div>
  </div>

  <nav class="mobile-nav">
    <a href="index.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </a>
    <a href="customers.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Users</span>
    </a>
    <a href="entries.html" class="nav-item">
       <svg viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
      <span>Pay</span>
    </a>
    <a href="review.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
      <span>Sync</span>
    </a>
    <a href="report.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
      <span>Report</span>
    </a>
  </nav>

  <script type="module">
    import { db } from "./config.js";

    // --- 1. CLOCK & GREETING LOGIC ---
    function updateClock() {
      const now = new Date();
      
      // Time Logic
      let hours = now.getHours();
      let minutes = now.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      
      hours = hours % 12;
      hours = hours ? hours : 12; 
      
      const strTime = `${pad(hours)}:${pad(minutes)} <span style="font-size:0.4em; font-weight:700; color:var(--primary); vertical-align:top; margin-left:5px;">${ampm}</span>`;
      document.getElementById('liveClock').innerHTML = strTime;

      // Date Logic
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('liveDate').innerText = now.toLocaleDateString('en-US', options);

      // Greeting Logic
      const rawHours = now.getHours();
      let greeting = "Welcome";
      if (rawHours >= 5 && rawHours < 12) greeting = "Good Morning";
      else if (rawHours >= 12 && rawHours < 17) greeting = "Good Afternoon";
      else if (rawHours >= 17 && rawHours < 22) greeting = "Good Evening";
      else greeting = "Good Night";
      
      document.getElementById('greetingMessage').innerText = greeting;
    }

    function pad(num) {
      return num < 10 ? '0' + num : num;
    }

    setInterval(updateClock, 1000);
    updateClock(); 

    // --- 2. PWA INSTALL LOGIC ---
    let deferredPrompt;
    const installBtn = document.getElementById('btnAdminInstall');
    const installBanner = document.getElementById('adminInstallPrompt');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') installBanner.style.display = 'none';
        deferredPrompt = null;
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('SW Registered'));
      });
    }
  </script>
</body>
</html>
