<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - EMI Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <link rel="manifest" href="manifest.json">

  <style>
    /* --- 1. HIGH CONTRAST THEME --- */
    :root { 
      --bg: #000000; 
      --card: #121212; 
      --primary: #00e676; /* High Contrast Neon Green */
      --secondary: #2979ff; /* High Contrast Blue */
      --text: #ffffff; 
      --text-muted: #b0b0b0;
      --border: #333333; 
      --nav-bg: #1a1a1a;
    }
    
    * { box-sizing: border-box; }
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
      margin: 0; 
      padding: 0; 
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- 2. DESKTOP NAVIGATION (Top) --- */
    .desktop-nav { 
      background: var(--nav-bg); 
      padding: 15px 40px; 
      border-bottom: 1px solid var(--border); 
      display: flex; 
      justify-content: space-between;
      align-items: center;
    }
    
    .logo { font-weight: 800; font-size: 1.2rem; letter-spacing: 1px; color: var(--primary); }

    .nav-links { display: flex; gap: 20px; }
    .nav-links a { 
      color: var(--text-muted); 
      text-decoration: none; 
      padding: 8px 16px; 
      border-radius: 6px; 
      font-size: 0.9rem; 
      transition: 0.3s;
    }
    .nav-links a:hover { color: white; background: #333; }
    .nav-links a.active { color: var(--bg); background: var(--primary); font-weight: 700; }

    /* --- 3. MOBILE NAVIGATION (Bottom) --- */
    .mobile-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--nav-bg);
      border-top: 1px solid var(--border);
      display: none; /* Hidden by default on desktop */
      justify-content: space-around;
      padding: 12px 0;
      z-index: 100;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      transition: 0.2s;
    }
    
    .nav-item svg { width: 24px; height: 24px; margin-bottom: 4px; fill: currentColor; }
    .nav-item.active { color: var(--primary); }
    
    /* --- 4. MAIN WELCOME CONTENT --- */
    .container { 
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      margin-bottom: 60px; /* Space for mobile nav */
    }

    .greeting-box {
      background: var(--card);
      padding: 40px;
      border-radius: 20px;
      border: 1px solid var(--border);
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,230,118, 0.05);
      animation: fadeIn 1s ease-out;
    }

    .greeting-time { font-size: 1.2rem; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; margin-bottom: 10px;}
    .greeting-title { font-size: 3rem; margin: 0; font-weight: 700; background: linear-gradient(to right, #fff, #b0b0b0); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}
    .greeting-sub { color: var(--text-muted); margin-top: 15px; font-size: 1.1rem; }
    
    .clock-display {
      margin-top: 30px;
      font-size: 4rem;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .date-display {
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: -5px;
    }

    /* --- 5. PWA INSTALL POPUP --- */
    #adminInstallPrompt {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 400px;
      background: var(--primary); color: #000;
      padding: 12px 20px; border-radius: 50px; display: none;
      align-items: center; justify-content: space-between;
      z-index: 9999; box-shadow: 0 0 20px rgba(0,230,118, 0.4);
      animation: slideDown 0.5s ease-out;
    }
    #adminInstallPrompt span { font-weight: 700; font-size: 0.9rem; }
    #adminInstallPrompt button {
      background: #000; color: #fff; border: none;
      padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer;
    }

    /* --- RESPONSIVENESS LOGIC --- */
    @media (max-width: 768px) {
      .desktop-nav { display: none; } /* Hide Top Bar */
      .mobile-nav { display: flex; } /* Show Bottom Bar */
      
      .greeting-title { font-size: 2.2rem; }
      .clock-display { font-size: 3.5rem; }
      .greeting-box { padding: 30px 20px; border: none; background: transparent; box-shadow: none; }
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideDown { from { transform: translate(-50%, -100px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

  </style>
</head>
<body>

  <nav class="desktop-nav">
    <div class="logo">EMI ADMIN</div>
    <div class="nav-links">
      <a href="index.html" class="active">Dashboard</a>
      <a href="customers.html">Customers</a>
      <a href="entries.html">Entries</a>
      <a href="review.html">Agent Sync</a>
      <a href="report.html">Reports</a>
    </div>
  </nav>

  <div id="adminInstallPrompt">
    <span>📲 Install App</span>
    <button id="btnAdminInstall">Get</button>
  </div>

  <div class="container">
    <div class="greeting-box">
      <div class="greeting-time" id="greetingMessage">Welcome</div>
      <h1 class="greeting-title">Admin Console</h1>
      <p class="greeting-sub">Manage your EMI business efficiently.</p>
      
      <div class="clock-display" id="liveClock">00:00:00</div>
      <div class="date-display" id="liveDate">Loading date...</div>
    </div>
  </div>

  <nav class="mobile-nav">
    <a href="index.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      <span>Home</span>
    </a>
    <a href="customers.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Users</span>
    </a>
    <a href="entries.html" class="nav-item">
       <svg viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
      <span>Pay</span>
    </a>
    <a href="review.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
      <span>Sync</span>
    </a>
    <a href="report.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
      <span>Report</span>
    </a>
  </nav>

  <script type="module">
    // Keeping your original imports as requested to ensure no breaks
    import { db } from "./config.js"; 
    // Note: specific stat fetching logic is removed to clear the display, 
    // but the db import is kept for future use.

    // --- 1. CLOCK & GREETING LOGIC ---
    function updateClock() {
      const now = new Date();
      
      // Time
      let hours = now.getHours();
      let minutes = now.getMinutes();
      let seconds = now.getSeconds();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      
      // 12 Hour Format
      hours = hours % 12;
      hours = hours ? hours : 12; 
      
      const strTime = `${pad(hours)}:${pad(minutes)} <span style="font-size:0.5em; vertical-align:top;">${ampm}</span>`;
      document.getElementById('liveClock').innerHTML = strTime;

      // Date
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('liveDate').innerText = now.toLocaleDateString('en-US', options);

      // Greeting
      const rawHours = now.getHours();
      let greeting = "Good Morning";
      if (rawHours >= 12 && rawHours < 17) greeting = "Good Afternoon";
      else if (rawHours >= 17) greeting = "Good Evening";
      
      document.getElementById('greetingMessage').innerText = greeting;
    }

    function pad(num) {
      return num < 10 ? '0' + num : num;
    }

    setInterval(updateClock, 1000);
    updateClock(); // Run immediately

    // --- 2. PWA INSTALL LOGIC (KEPT INTACT) ---
    let deferredPrompt;
    const installBtn = document.getElementById('btnAdminInstall');
    const installBanner = document.getElementById('adminInstallPrompt');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') installBanner.style.display = 'none';
        deferredPrompt = null;
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Admin SW Registered'));
      });
    }
  </script>
</body>
</html>
