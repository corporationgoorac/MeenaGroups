<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export Data - Old App</title>
  <style>
    body { background-color: #000000; color: #ffffff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .container { background: #141414; padding: 40px; border-radius: 16px; border: 1px solid #333; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    h2 { margin-top: 0; color: #00e676; }
    p { color: #888; line-height: 1.5; margin-bottom: 25px; }
    button { background: #2979ff; color: white; border: none; padding: 16px 24px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; box-shadow: 0 4px 15px rgba(41, 121, 255, 0.3); }
    button:hover { background: #1565c0; transform: translateY(-2px); }
    button:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; box-shadow: none; }
    #status { margin-top: 20px; font-weight: bold; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Data Exporter</h2>
    <p>Click below to safely download all customer records from your old database into a JSON backup file.</p>
    <button id="btnExport">Export Customers</button>
    <div id="status"></div>
  </div>

  <script type="module">
    import { db } from "./config.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    document.getElementById('btnExport').addEventListener('click', async () => {
      const btn = document.getElementById('btnExport');
      const status = document.getElementById('status');
      
      btn.disabled = true;
      btn.innerText = "Exporting...";
      status.innerText = "Fetching records from database...";
      status.style.color = "#888";

      try {
        const snap = await getDocs(collection(db, "customers"));
        let data = [];
        snap.forEach(d => data.push(d.data()));
        
        if(data.length === 0) {
            status.innerText = "No customers found in database.";
            status.style.color = "#ff1744";
            btn.disabled = false;
            btn.innerText = "Export Customers";
            return;
        }

        const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; 
        a.download = 'old_customers_backup.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        status.innerText = `✅ Successfully exported ${data.length} customers!`;
        status.style.color = "#00e676";
      } catch(e) {
        status.innerText = "❌ Error: " + e.message;
        status.style.color = "#ff1744";
      } finally {
        btn.disabled = false;
        btn.innerText = "Export Customers";
      }
    });
  </script>
</body>
</html>
