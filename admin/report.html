<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MeenaGroups | Quantum Analytics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    /* * ==========================================
     * 1. CORE THEME & VARIABLES
     * ==========================================
     */
    :root {
      --bg-root: #000000;
      --bg-surface: #0f0f0f;
      --bg-card: #141414;
      --bg-input: #1f1f1f;
      
      --primary: #2979ff;       /* Electric Blue */
      --success: #00e676;       /* Neon Green */
      --danger: #ff1744;        /* Bright Red */
      --warning: #ffb74d;       /* Orange */
      
      --text-main: #ffffff;
      --text-sub: #a0a0a0;
      --border: #262626;
      
      --glass: rgba(20, 20, 20, 0.85);
      --blur: 12px;
      
      --ease: cubic-bezier(0.23, 1, 0.32, 1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body {
      background: var(--bg-root);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0; padding: 0;
      height: 100vh;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* Scrollbar Polish */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    /* * ==========================================
     * 2. HEADER & NAVIGATION
     * ==========================================
     */
    header {
      background: var(--glass);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      border-bottom: 1px solid var(--border);
      padding: 15px 20px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 50; flex-shrink: 0;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }

    .brand { display: flex; flex-direction: column; gap: 2px; }
    .brand h1 { 
      margin: 0; font-size: 1.1rem; font-weight: 800; 
      letter-spacing: 0.5px; background: linear-gradient(to right, #fff, #aaa); 
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand span { font-size: 0.65rem; color: var(--primary); letter-spacing: 2px; font-weight: 700; text-transform: uppercase; }

    .nav-actions { display: flex; gap: 15px; }
    .icon-btn {
      background: rgba(255,255,255,0.05); border: 1px solid transparent; 
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-main); cursor: pointer; transition: 0.3s var(--ease);
    }
    .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .icon-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); border-color: #333; }
    .icon-btn:active { transform: scale(0.95); }

    /* * ==========================================
     * 3. SEARCH & CONTROLS
     * ==========================================
     */
    .controls-bar {
      padding: 15px 20px;
      background: var(--bg-root);
      display: flex; flex-direction: column; gap: 15px;
      border-bottom: 1px solid var(--border);
    }

    /* Input Field */
    .search-wrap { position: relative; width: 100%; }
    .search-wrap svg {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      width: 20px; fill: var(--text-sub); pointer-events: none;
    }
    .search-wrap input {
      width: 100%; background: var(--bg-input); border: 1px solid var(--border);
      color: white; padding: 14px 15px 14px 48px; border-radius: 14px;
      font-size: 1rem; transition: 0.3s;
    }
    .search-wrap input:focus { 
      border-color: var(--primary); 
      box-shadow: 0 0 0 4px rgba(41, 121, 255, 0.15); 
      background: #252525;
    }

    /* Filter Chips */
    .filter-row { 
      display: flex; gap: 10px; overflow-x: auto; 
      padding-bottom: 5px; -webkit-overflow-scrolling: touch;
    }
    .chip {
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-sub); padding: 8px 16px; border-radius: 50px;
      font-size: 0.85rem; font-weight: 600; white-space: nowrap;
      cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .chip svg { width: 16px; height: 16px; fill: currentColor; }
    .chip:active { transform: scale(0.95); background: #222; }
    
    .chip.primary { color: var(--primary); border-color: rgba(41,121,255,0.3); background: rgba(41,121,255,0.05); }
    .chip.success { color: var(--success); border-color: rgba(0,230,118,0.3); background: rgba(0,230,118,0.05); }
    .chip.danger { color: var(--danger); border-color: rgba(255,23,68,0.3); background: rgba(255,23,68,0.05); }

    /* * ==========================================
     * 4. MAIN LIST (CARDS)
     * ==========================================
     */
    .content-area {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 12px;
      background: radial-gradient(circle at 50% 10%, #111 0%, #000 70%);
    }

    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; padding: 18px;
      display: grid; grid-template-columns: 1fr auto; gap: 10px;
      position: relative; transition: all 0.2s var(--ease);
      cursor: pointer; overflow: hidden;
    }
    .card:active { transform: scale(0.98); background: #1c1c1c; }
    
    /* Status Indicator Bar */
    .card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    }
    .card.paid::before { background: var(--success); box-shadow: 2px 0 10px rgba(0,230,118,0.3); }
    .card.due::before { background: var(--danger); box-shadow: 2px 0 10px rgba(255,23,68,0.3); }

    .c-details h3 { margin: 0; font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .c-details p { margin: 0; font-size: 0.8rem; color: var(--text-sub); display: flex; align-items: center; gap: 6px; }
    .c-details .cid { font-family: monospace; background: #222; padding: 2px 6px; border-radius: 4px; }

    .c-meta { text-align: right; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; }
    .badge {
      padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.5px;
    }
    .badge.due { background: rgba(255, 23, 68, 0.1); color: var(--danger); }
    .badge.paid { background: rgba(0, 230, 118, 0.1); color: var(--success); }
    .c-date { font-size: 0.7rem; color: #666; margin-top: 6px; }

    /* Empty State */
    .empty-state {
      text-align: center; color: var(--text-sub); margin-top: 60px;
      display: flex; flex-direction: column; align-items: center; gap: 15px;
    }
    .empty-icon { width: 64px; height: 64px; fill: #222; margin-bottom: 10px; }

    /* * ==========================================
     * 5. DRAWER (DETAILS)
     * ==========================================
     */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px); opacity: 0; pointer-events: none;
      transition: opacity 0.3s; z-index: 99;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }

    .drawer {
      position: fixed; inset: 0; left: auto; width: 100%; max-width: 500px;
      background: #000; border-left: 1px solid var(--border);
      transform: translateX(100%); transition: transform 0.4s var(--ease);
      display: flex; flex-direction: column; z-index: 100;
      box-shadow: -10px 0 40px rgba(0,0,0,0.8);
    }
    .drawer.active { transform: translateX(0); }

    /* Drawer Header */
    .d-head { 
      padding: 20px 25px; background: #0a0a0a; border-bottom: 1px solid var(--border);
    }
    .dh-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .dh-title h2 { margin: 0; font-size: 1.8rem; font-weight: 800; background: linear-gradient(to bottom right, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}
    .dh-title span { color: var(--primary); font-family: monospace; font-size: 0.9rem; }
    
    .btn-close { 
      background: #222; border: none; width: 32px; height: 32px; border-radius: 50%; 
      color: #fff; cursor: pointer; display: grid; place-items: center; font-size: 1.2rem;
    }

    /* Info Grid */
    .d-grid { 
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;
    }
    .info-box { background: #111; padding: 12px; border-radius: 10px; border: 1px solid #222; }
    .info-box label { display: block; font-size: 0.65rem; text-transform: uppercase; color: #666; margin-bottom: 4px; }
    .info-box div { font-size: 0.9rem; font-weight: 600; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Action Buttons */
    .d-actions { display: flex; gap: 10px; }
    .act-btn {
      flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      background: #151515; color: white; text-decoration: none; font-size: 0.9rem; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s;
    }
    .act-btn:active { transform: scale(0.97); }
    .act-btn.call { border-color: rgba(0,230,118,0.3); color: var(--success); }
    .act-btn.map { border-color: rgba(41,121,255,0.3); color: var(--primary); }

    /* Drawer Body */
    .d-body { flex: 1; overflow-y: auto; padding: 20px; background: #050505; }
    
    .prod-item { 
      background: #121212; border: 1px solid #222; border-radius: 12px; 
      margin-bottom: 12px; overflow: hidden;
    }
    .pi-header { 
      padding: 15px; display: flex; align-items: center; gap: 12px; 
      cursor: pointer; background: rgba(255,255,255,0.02);
    }
    .pi-header:active { background: #222; }
    
    /* Custom Checkbox */
    .chk-wrap { position: relative; width: 24px; height: 24px; }
    .custom-chk { 
      width: 100%; height: 100%; appearance: none; border: 2px solid #444; 
      border-radius: 6px; background: transparent; transition: 0.2s; cursor: pointer;
    }
    .custom-chk:checked { background: var(--primary); border-color: var(--primary); }
    .custom-chk:checked::after {
      content: '✓'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: #000; font-size: 16px; font-weight: bold; pointer-events: none;
    }

    .pi-info { flex: 1; }
    .pi-title { font-weight: 700; font-size: 0.95rem; }
    .pi-sub { font-size: 0.75rem; color: #888; font-family: monospace; margin-top: 2px; }
    
    .pi-stat { 
      font-size: 0.75rem; font-weight: 800; padding: 4px 8px; border-radius: 6px; 
      background: #000; border: 1px solid #333; 
    }
    .pi-stat.red { color: var(--danger); border-color: var(--danger); }
    .pi-stat.green { color: var(--success); border-color: var(--success); }

    /* Ledger Expansion */
    .pi-ledger { 
      max-height: 0; overflow: hidden; transition: max-height 0.3s ease; 
      background: #000; border-top: 1px solid #222; 
    }
    .pi-ledger.open { max-height: 500px; overflow-y: auto; }
    
    .led-row { 
      display: grid; grid-template-columns: 0.5fr 1.5fr 1fr 1fr; padding: 10px 15px;
      font-size: 0.8rem; border-bottom: 1px solid #1a1a1a; color: #ccc;
    }
    .led-head { color: #666; font-size: 0.7rem; font-weight: 700; background: #080808; text-transform: uppercase; letter-spacing: 0.5px;}

    /* Footer Buttons */
    .d-foot { 
      padding: 15px 20px; background: #0a0a0a; border-top: 1px solid var(--border);
      display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px;
      padding-bottom: max(15px, env(safe-area-inset-bottom));
    }
    .btn-main {
      border: none; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 0.9rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-main.primary { background: var(--primary); color: #000; box-shadow: 0 4px 15px rgba(41,121,255,0.25); }
    .btn-main.secondary { background: transparent; border: 1px solid #444; color: #aaa; }
    .btn-main.secondary:hover { color: #fff; border-color: #fff; }

    /* * ==========================================
     * 6. ANALYTICS POPUP
     * ==========================================
     */
    .modal {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
      width: 90%; max-width: 600px; background: #111; border: 1px solid var(--border);
      border-radius: 20px; opacity: 0; pointer-events: none; transition: 0.3s var(--ease);
      z-index: 200; box-shadow: 0 20px 60px rgba(0,0,0,0.9); overflow: hidden;
    }
    .modal.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    
    .m-head { padding: 15px 20px; background: #161616; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center;}
    .m-head h3 { margin: 0; font-size: 1rem; color: #fff; letter-spacing: 1px; }
    
    .m-body { padding: 25px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .stat-card { background: #1a1a1a; padding: 20px; border-radius: 14px; text-align: center; border: 1px solid #333; }
    .stat-card h4 { margin: 0; font-size: 0.7rem; text-transform: uppercase; color: #888; letter-spacing: 1px; }
    .stat-card .val { font-size: 1.6rem; font-weight: 800; color: #fff; margin-top: 5px; font-family: monospace; }
    
    .chart-box { height: 250px; background: #080808; border-radius: 14px; padding: 15px; border: 1px solid #222; }

    /* Responsive */
    @media (max-width: 768px) {
      .d-foot { grid-template-columns: 1fr; }
      .stat-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Reports & Analytics</h1>
      <span>MEENA GROUPS</span>
    </div>
    <div class="nav-actions">
      <div class="icon-btn" onclick="openAnalytics()" title="Analytics">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
      </div>
      <a href="index.html" class="icon-btn" title="Home">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </a>
    </div>
  </header>

  <div class="controls-bar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="searchInput" type="text" placeholder="Search Name, ID, or Phone..." onkeyup="filterLocalData()">
    </div>
    
    <div class="filter-row">
      <button class="chip primary" onclick="searchCloud()">
        <svg viewBox="0 0 24 24"><path d="M19.36 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.64-4.96z"/></svg>
        Find in Cloud
      </button>
      <button class="chip success" onclick="loadRecent(15)">
        <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
        Load Recent
      </button>
      <button class="chip danger" onclick="loadAll()">
        <svg viewBox="0 0 24 24"><path d="M4 6h18V4H4c-1.1 0-2 .9-2 2v11H0v3h14v-3H4V6zm19 2h-6c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h6c.55 0 1-.45 1-1V9c0-.55-.45-1-1-1zm-1 9h-4v-7h4v7z"/></svg>
        Load All DB
      </button>
    </div>
  </div>

  <div id="resultContainer" class="content-area">
    <div class="empty-state">
      <svg class="empty-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
      <p>System Ready.<br>Search or Load Data to begin.</p>
    </div>
  </div>

  <div class="overlay" id="overlay" onclick="closeAll()"></div>

  <div class="drawer" id="customerDrawer">
    <div class="d-head">
      <div class="dh-top">
        <div class="dh-title">
          <h2 id="drawName">Customer Name</h2>
          <span id="drawId">ID: #000000</span>
        </div>
        <button class="btn-close" onclick="closeAll()">×</button>
      </div>

      <div class="d-grid">
        <div class="info-box">
          <label>Mobile</label>
          <div id="drawPhone">--</div>
        </div>
        <div class="info-box">
          <label>Location</label>
          <div id="drawPlace">--</div>
        </div>
        <div class="info-box">
          <label>Since</label>
          <div id="drawJoin">--</div>
        </div>
        <div class="info-box">
          <label>Orders</label>
          <div id="drawCount">0</div>
        </div>
      </div>

      <div class="d-actions">
        <a id="btnCall" href="#" class="act-btn call">
          <svg style="width:16px;height:16px;fill:currentColor" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 1.25 0 2.45.2 3.57.57.35.13.46.52.24 1.02l-2.2 2.2z"/></svg>
          CALL
        </a>
        <a id="btnMap" href="#" target="_blank" class="act-btn map">
          <svg style="width:16px;height:16px;fill:currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          MAP
        </a>
      </div>
    </div>

    <div class="d-body" id="productContainer">
      </div>

    <div class="d-foot">
      <button class="btn-main primary" onclick="downloadSelected()">
        <svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        Download Selected
      </button>
      <button class="btn-main secondary" onclick="downloadAllPDF()">
        Download All
      </button>
    </div>
  </div>

  <div class="modal" id="analyticsPopup">
    <div class="m-head">
      <h3>BUSINESS PULSE</h3>
      <button class="btn-close" onclick="closeAll()" style="width:24px;height:24px;font-size:1rem;">×</button>
    </div>
    <div class="m-body">
      <div class="stat-grid">
        <div class="stat-card" style="border-color: rgba(0,230,118,0.3)">
          <h4 style="color: var(--success)">Collected</h4>
          <div class="val" id="anaPaid">₹0</div>
        </div>
        <div class="stat-card" style="border-color: rgba(255,23,68,0.3)">
          <h4 style="color: var(--danger)">Outstanding</h4>
          <div class="val" id="anaDue">₹0</div>
        </div>
      </div>
      <div class="chart-box">
        <canvas id="financeChart"></canvas>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "./config.js";
    import { collection, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    let loadedData = [];
    let currentCustomer = null;
    let chartInstance = null;

    // ------------------------------------------
    // 1. DATA FETCHING (ENHANCED SEARCH)
    // ------------------------------------------

    window.loadRecent = async (n) => {
      uiLoading();
      try {
        const q = query(collection(db, "customers"), orderBy("createdAt", "desc"), limit(n));
        const snap = await getDocs(q);
        processData(snap);
      } catch (e) { alert("Error loading: " + e.message); }
    };

    window.loadAll = async () => {
      if(!confirm("⚠️ Load ALL records? This may take data.")) return;
      uiLoading();
      try {
        const snap = await getDocs(collection(db, "customers"));
        processData(snap);
      } catch (e) { alert(e.message); }
    };

    // FIXED: Search now looks for Name, ID, or Phone matches
    window.searchCloud = async () => {
      const v = document.getElementById("searchInput").value.trim();
      if(!v) return alert("Please enter Name, ID, or Phone");
      
      uiLoading();
      const colRef = collection(db, "customers");
      
      try {
        // Parallel Queries for better coverage
        const promises = [
          // 1. ID Match (Prefix)
          getDocs(query(colRef, where("id", ">=", v), where("id", "<=", v + '\uf8ff'), limit(5))),
          // 2. Name Match (Simple Case Sensitive Prefix)
          getDocs(query(colRef, where("name", ">=", v), where("name", "<=", v + '\uf8ff'), limit(5))),
          // 3. Phone Match (Exact)
          getDocs(query(colRef, where("phone", "==", v)))
        ];

        const snapshots = await Promise.all(promises);
        
        // Merge results using Map to prevent duplicates
        const resultMap = new Map();
        snapshots.forEach(snap => {
          snap.forEach(doc => resultMap.set(doc.id, doc.data()));
        });
        
        const results = Array.from(resultMap.values());
        
        if (results.length === 0) {
          document.getElementById("resultContainer").innerHTML = `
            <div class="empty-state">
              <p>No matches found for "${v}" in Cloud.</p>
              <button class="chip primary" onclick="loadAll()">Try Load All</button>
            </div>`;
        } else {
          loadedData = results; // Store globally
          renderList(loadedData);
          calcStats();
        }
      } catch (e) { alert(e.message); }
    };

    // NEW: Local Filter (Instant Search)
    window.filterLocalData = () => {
      const term = document.getElementById("searchInput").value.toLowerCase();
      if(loadedData.length === 0) return;
      
      const filtered = loadedData.filter(c => {
        return (c.name && c.name.toLowerCase().includes(term)) ||
               (c.id && c.id.toLowerCase().includes(term)) ||
               (c.phone && c.phone.includes(term)) ||
               (c.place && c.place.toLowerCase().includes(term));
      });
      
      renderList(filtered);
    };

    function uiLoading() {
      document.getElementById("resultContainer").innerHTML = `<div style="text-align:center;padding:50px;color:#666;">Syncing...</div>`;
    }

    // Handles both Snapshot or Array
    function processData(snap) {
      loadedData = [];
      snap.forEach(d => loadedData.push(d.data()));
      
      if(loadedData.length === 0) {
        document.getElementById("resultContainer").innerHTML = `<div class="empty-state"><p>No Records Found.</p></div>`;
      } else {
        renderList(loadedData);
      }
      calcStats();
    }

    // ------------------------------------------
    // 2. RENDERING
    // ------------------------------------------

    function renderList(data) {
      const div = document.getElementById("resultContainer");
      div.innerHTML = "";

      if(data.length === 0) {
        div.innerHTML = `<div style="text-align:center;padding:20px;color:#555;">No matching results.</div>`;
        return;
      }

      data.forEach(c => {
        let totalVal = 0, totalPaid = 0;
        if(c.products) c.products.forEach(p => { totalVal += (p.total||0); totalPaid += (p.paid||0); });
        
        const bal = totalVal - totalPaid;
        const status = bal > 1 ? 'due' : 'paid';

        const card = document.createElement("div");
        card.className = `card ${status}`;
        card.onclick = () => openDrawer(c);
        
        // Highlight search term logic could go here
        
        card.innerHTML = `
          <div class="c-details">
            <h3>${c.name}</h3>
            <p>
              <span class="cid">${c.id}</span>
              <span>${c.place || ''}</span>
            </p>
            <div class="c-date">Joined: ${c.createdAt ? new Date(c.createdAt).toLocaleDateString() : '-'}</div>
          </div>
          <div class="c-meta">
            <span class="badge ${bal > 1 ? 'due' : 'paid'}">
              ${bal > 1 ? '₹' + bal.toLocaleString() : 'CLEARED'}
            </span>
          </div>
        `;
        div.appendChild(card);
      });
    }

    // ------------------------------------------
    // 3. DRAWER & INTERACTIONS
    // ------------------------------------------

    window.openDrawer = (c) => {
      currentCustomer = c;
      window.history.pushState({ drawer: true }, "");

      // Populate Header
      document.getElementById("drawName").innerText = c.name;
      document.getElementById("drawId").innerText = "ID: " + c.id;
      document.getElementById("drawPhone").innerText = c.phone || '-';
      document.getElementById("drawPlace").innerText = c.place || '-';
      document.getElementById("drawJoin").innerText = c.createdAt ? new Date(c.createdAt).toLocaleDateString() : '-';
      document.getElementById("drawCount").innerText = (c.products || []).length;
      
      document.getElementById("btnCall").href = c.phone ? `tel:${c.phone}` : '#';
      document.getElementById("btnMap").href = c.place ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.place)}` : '#';

      // Populate Products
      const container = document.getElementById("productContainer");
      container.innerHTML = "";
      
      if(!c.products || c.products.length === 0) {
        container.innerHTML = "<div style='text-align:center;color:#666;padding:20px;'>No Products</div>";
        return;
      }

      c.products.forEach((p, idx) => {
        const bal = (p.total||0) - (p.paid||0);
        
        // Ledger Logic
        const sorted = (p.payments || []).sort((a,b) => (a.dueNumber||0)-(b.dueNumber||0));
        let running = 0;
        let rows = "";
        
        sorted.forEach(pay => {
          running += parseFloat(pay.amount);
          const curBal = p.total - running;
          rows += `
            <div class="led-row">
              <span style="color:#666">#${pay.dueNumber||'-'}</span>
              <span>${pay.date}</span>
              <span style="color:var(--success)">₹${pay.amount}</span>
              <span style="text-align:right">₹${curBal}</span>
            </div>`;
        });

        if(!rows) rows = `<div style="padding:15px;color:#555;text-align:center;font-size:0.8rem">No payments yet.</div>`;

        const item = document.createElement("div");
        item.className = "prod-item";
        item.innerHTML = `
          <div class="pi-header" onclick="toggleLedger(this)">
            <div class="chk-wrap" onclick="event.stopPropagation()">
              <input type="checkbox" class="custom-chk product-checkbox" data-idx="${idx}">
            </div>
            <div class="pi-info">
              <div class="pi-title">${p.name}</div>
              <div class="pi-sub">Val: ₹${(p.total||0).toLocaleString()}</div>
            </div>
            <div class="pi-stat ${bal > 1 ? 'red' : 'green'}">
              ${bal > 1 ? '₹'+bal : 'PAID'}
            </div>
          </div>
          <div class="pi-ledger">
             <div class="led-row led-head">
               <span>#</span><span>Date</span><span>Amt</span><span style="text-align:right">Bal</span>
             </div>
             ${rows}
          </div>
        `;
        container.appendChild(item);
      });

      document.getElementById("overlay").classList.add("active");
      document.getElementById("customerDrawer").classList.add("active");
    };

    window.toggleLedger = (el) => {
      const ledger = el.nextElementSibling;
      ledger.classList.toggle("open");
    };

    window.closeAll = () => {
      document.getElementById("overlay").classList.remove("active");
      document.getElementById("customerDrawer").classList.remove("active");
      document.getElementById("analyticsPopup").classList.remove("active");
      if(history.state) history.back();
    };

    window.onpopstate = () => {
      document.getElementById("overlay").classList.remove("active");
      document.getElementById("customerDrawer").classList.remove("active");
      document.getElementById("analyticsPopup").classList.remove("active");
    };

    // ------------------------------------------
    // 4. PDF GENERATION
    // ------------------------------------------

    window.downloadAllPDF = () => {
      if(!currentCustomer) return;
      generatePDF(currentCustomer, currentCustomer.products);
    };

    window.downloadSelected = () => {
      if(!currentCustomer) return;
      const checkboxes = document.querySelectorAll('.product-checkbox:checked');
      if(checkboxes.length === 0) return alert("Select at least one product.");
      
      const selectedIndices = Array.from(checkboxes).map(cb => parseInt(cb.dataset.idx));
      const selectedProducts = currentCustomer.products.filter((_, i) => selectedIndices.includes(i));
      generatePDF(currentCustomer, selectedProducts);
    };

    window.generatePDF = (c, products) => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      // Modern Header
      doc.setFillColor(15, 15, 15);
      doc.rect(0, 0, 210, 40, 'F');
      
      doc.setTextColor(41, 121, 255); // Brand Blue
      doc.setFontSize(24);
      doc.setFont("helvetica", "bold");
      doc.text("MeenaGroups", 14, 22);
      
      doc.setTextColor(200, 200, 200);
      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.text("ACCOUNT STATEMENT", 14, 30);
      doc.text(`Generated: ${new Date().toLocaleDateString()}`, 150, 30);

      // Customer Info
      doc.setTextColor(0, 0, 0);
      doc.setFontSize(14);
      doc.setFont("helvetica", "bold");
      doc.text(c.name.toUpperCase(), 14, 55);
      
      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.setTextColor(80, 80, 80);
      doc.text(`ID: ${c.id}`, 14, 62);
      doc.text(`Mobile: ${c.phone || '-'}`, 60, 62);
      doc.text(`City: ${c.place || '-'}`, 120, 62);

      let yPos = 75;

      products.forEach(p => {
        // Product Title Bar
        doc.setFillColor(240, 240, 240);
        doc.rect(14, yPos, 182, 10, 'F');
        
        doc.setTextColor(0,0,0);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(10);
        doc.text(p.name, 16, yPos + 7);
        doc.text(`Value: Rs.${p.total}`, 160, yPos + 7);
        
        yPos += 12;

        // Table Data
        const rows = [];
        let running = 0;
        const payments = (p.payments || []).sort((a,b) => (a.dueNumber||0)-(b.dueNumber||0));

        if(payments.length === 0) {
           rows.push(['-', '-', 'No Records', '-', `Rs.${p.total}`]);
        } else {
           payments.forEach(pay => {
             running += parseFloat(pay.amount);
             rows.push([ 
               `#${pay.dueNumber||'-'}`, 
               pay.date, 
               pay.type||'Cash', 
               `Rs.${pay.amount}`, 
               `Rs.${p.total - running}` 
             ]);
           });
        }

        doc.autoTable({
          startY: yPos,
          head: [['Due', 'Date', 'Mode', 'Paid', 'Balance']],
          body: rows,
          theme: 'grid',
          headStyles: { fillColor: [40, 40, 40], textColor: 255 },
          styles: { fontSize: 9, cellPadding: 3 },
          columnStyles: { 
            3: { fontStyle: 'bold', textColor: [0, 150, 0] },
            4: { fontStyle: 'bold' }
          },
          margin: { left: 14, right: 14 }
        });

        yPos = doc.lastAutoTable.finalY + 15;
      });

      // Footer
      const h = doc.internal.pageSize.height;
      doc.setDrawColor(200);
      doc.line(14, h - 20, 196, h - 20);
      doc.setFontSize(8);
      doc.setTextColor(100);
      doc.text("Thank you for your business.", 14, h - 12);
      doc.textWithLink("meena.goorac.biz", 170, h - 12, { url: "http://meena.goorac.biz" });

      doc.save(`Statement_${c.id}.pdf`);
    };

    // ------------------------------------------
    // 5. ANALYTICS
    // ------------------------------------------

    window.openAnalytics = () => {
      window.history.pushState({ modal: true }, "");
      calcStats();
      document.getElementById("overlay").classList.add("active");
      document.getElementById("analyticsPopup").classList.add("active");
    };

    function calcStats() {
      let paid = 0, total = 0;
      loadedData.forEach(c => {
        if(c.products) c.products.forEach(p => { paid += (p.paid||0); total += (p.total||0); });
      });
      const due = total - paid;
      
      document.getElementById("anaPaid").innerText = "₹" + paid.toLocaleString();
      document.getElementById("anaDue").innerText = "₹" + due.toLocaleString();

      const ctx = document.getElementById("financeChart").getContext("2d");
      if(chartInstance) chartInstance.destroy();
      
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Collected', 'Pending'],
          datasets: [{ 
            data: [paid, due], 
            backgroundColor: ['#00e676', '#ff1744'],
            borderWidth: 0,
            hoverOffset: 4
          }]
        },
        options: { 
          responsive: true, 
          maintainAspectRatio: false,
          plugins: { 
            legend: { position: 'bottom', labels: { color: '#fff', font: {size: 10} } } 
          }
        }
      });
    }

    // Init
    loadRecent(15);
  </script>
</body>
</html>
