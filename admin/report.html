<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reports - MeenaGroups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    /* --- 1. HIGH CONTRAST THEME --- */
    :root { 
      --bg: #000000; 
      --surface: #0a0a0a;
      --card: #141414; 
      --input-bg: #1a1a1a;
      --primary: #00e676; /* Neon Green */
      --secondary: #2979ff; /* Bright Blue */
      --danger: #ff1744; 
      --warning: #ffab00;
      --text: #ffffff; 
      --text-muted: #888888;
      --border: #333333; 
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
      margin: 0; padding: 0; 
      height: 100vh; 
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* --- 2. HEADER --- */
    header {
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 15px 20px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 50; flex-shrink: 0;
    }
    header h1 { margin: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.5px; }
    .nav-btn { background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; text-decoration: none; }

    /* --- 3. ANALYTICS DASHBOARD --- */
    .dashboard-panel {
      padding: 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: grid; grid-template-columns: 1fr 120px; gap: 20px;
      align-items: center;
    }
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .stat-card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-val { font-size: 1.4rem; font-weight: 700; margin-top: 5px; color: #fff; }
    
    .chart-box { height: 100px; width: 100px; position: relative; }

    /* --- 4. CONTROLS & LIST --- */
    .controls-bar {
      padding: 15px 20px;
      display: flex; gap: 10px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      overflow-x: auto; white-space: nowrap;
    }
    
    .search-input {
      background: var(--input-bg); border: 1px solid var(--border); color: white;
      padding: 10px 15px; border-radius: 8px; width: 200px;
    }

    .btn-ctrl {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 6px; font-size: 0.85rem;
    }
    .btn-ctrl:active { background: #222; }
    .btn-ctrl.primary { background: var(--secondary); border-color: var(--secondary); color: white; }
    .btn-ctrl.danger { border-color: var(--danger); color: var(--danger); }

    .list-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }

    /* Customer Row Card */
    .report-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 15px; display: flex; justify-content: space-between; align-items: center;
      transition: 0.2s; cursor: pointer;
    }
    .report-card:hover { border-color: var(--primary); background: #1a1a1a; }
    
    .rc-left h3 { margin: 0; font-size: 1rem; color: white; }
    .rc-left span { font-size: 0.8rem; color: var(--secondary); font-family: monospace; }
    
    .rc-right { text-align: right; }
    .status-pill { 
      font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; 
      background: #222; border: 1px solid #333; color: #aaa; 
    }
    .status-pill.active { color: var(--primary); border-color: var(--primary); background: rgba(0, 230, 118, 0.1); }

    /* --- 5. SLIDE-IN MODAL (DETAILED VIEW) --- */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
      z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .slide-panel {
      position: fixed; top: 0; right: 0; width: 100%; max-width: 500px; height: 100%;
      background: var(--bg); border-left: 1px solid var(--border);
      transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex; flex-direction: column; z-index: 101;
    }
    .slide-panel.active { transform: translateX(0); }

    .panel-header {
      padding: 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; background: var(--surface);
    }
    .panel-title h2 { margin: 0; font-size: 1.4rem; }
    .panel-title p { margin: 5px 0 0; color: var(--text-muted); font-size: 0.9rem; }
    .btn-close { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }

    .panel-body { flex: 1; overflow-y: auto; padding: 20px; }

    /* Product Section in Modal */
    .prod-detail-box { 
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; 
      padding: 20px; margin-bottom: 20px; 
    }
    .prod-head { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; }
    .prod-name { font-weight: 700; color: var(--secondary); font-size: 1.1rem; }
    
    .ledger-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 10px; }
    .ledger-table th { text-align: left; color: #666; padding: 8px; border-bottom: 1px solid #333; }
    .ledger-table td { padding: 8px; border-bottom: 1px solid #222; color: #ddd; }
    .ledger-table tr:last-child td { border-bottom: none; }

    .panel-footer { padding: 20px; border-top: 1px solid var(--border); background: var(--surface); }
    .btn-pdf { 
      width: 100%; padding: 15px; background: var(--primary); color: #000; 
      font-weight: 800; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; 
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .dashboard-panel { grid-template-columns: 1fr; }
      .chart-box { display: none; } /* Hide chart on small screens to save space */
      .controls-bar { flex-wrap: wrap; }
      .search-input { width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Analytics & Reports</h1>
    <a href="index.html" class="nav-btn">🏠</a>
  </header>

  <div class="dashboard-panel">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Collected</div>
        <div class="stat-val" style="color:var(--primary)" id="dispPaid">₹0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Outstanding</div>
        <div class="stat-val" style="color:var(--danger)" id="dispDue">₹0</div>
      </div>
    </div>
    <div class="chart-box">
      <canvas id="miniChart"></canvas>
    </div>
  </div>

  <div class="controls-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="Search ID or Name...">
    <button class="btn-ctrl primary" onclick="searchCloud()">🔍 Cloud Search</button>
    <button class="btn-ctrl" onclick="loadRecent(20)">🔄 Recent</button>
    <button class="btn-ctrl danger" onclick="loadAll()">⚠️ Load All</button>
  </div>

  <div id="reportList" class="list-container">
    <div style="text-align:center; padding: 50px; color:#444;">
      <p>Load data to view reports.</p>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
  <div class="slide-panel" id="detailPanel">
    <div class="panel-header">
      <div class="panel-title">
        <h2 id="modalName">Customer Name</h2>
        <p id="modalId">ID: --</p>
      </div>
      <button class="btn-close" onclick="closeModal()">×</button>
    </div>
    
    <div class="panel-body" id="modalBody">
      </div>

    <div class="panel-footer">
      <button class="btn-pdf" id="btnDownloadPdf">
        📄 DOWNLOAD STATEMENT PDF
      </button>
    </div>
  </div>

  <script type="module">
    import { db } from "./config.js";
    import { collection, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    let chartInstance = null;
    let currentCustomer = null; // Stores data for PDF

    // --- 1. DATA LOADING ---
    window.loadRecent = async (count) => {
      renderLoading();
      try {
        const q = query(collection(db, "customers"), orderBy("createdAt", "desc"), limit(count));
        const snap = await getDocs(q);
        const data = [];
        snap.forEach(d => data.push(d.data()));
        renderList(data);
      } catch (e) {
        console.error(e);
        alert("Error loading recent: " + e.message);
      }
    };

    window.searchCloud = async () => {
      const term = document.getElementById("searchInput").value.trim().toUpperCase();
      if(!term) return alert("Enter ID to search");
      
      renderLoading();
      try {
        const q = query(collection(db, "customers"), where("id", ">=", term), where("id", "<=", term + '\uf8ff'), limit(5));
        const snap = await getDocs(q);
        const data = [];
        snap.forEach(d => data.push(d.data()));
        
        if(data.length === 0) alert("No results found.");
        renderList(data);
      } catch(e) { alert(e.message); }
    };

    window.loadAll = async () => {
      if(!confirm("⚠️ Load ALL customers? This consumes high data usage.")) return;
      renderLoading();
      try {
        const snap = await getDocs(collection(db, "customers"));
        const data = [];
        snap.forEach(d => data.push(d.data()));
        renderList(data);
      } catch(e) { alert(e.message); }
    };

    function renderLoading() {
      document.getElementById("reportList").innerHTML = `<p style="text-align:center; color:#666;">Fetching data...</p>`;
    }

    // --- 2. RENDER LIST & STATS ---
    function renderList(customers) {
      const listDiv = document.getElementById("reportList");
      listDiv.innerHTML = "";
      
      let totalPaid = 0;
      let totalDue = 0;

      customers.forEach(c => {
        // Calculate Totals per customer
        let cPaid = 0, cTotal = 0;
        c.products.forEach(p => { cPaid += p.paid; cTotal += p.total; });
        
        const cDue = cTotal - cPaid;
        totalPaid += cPaid;
        totalDue += cDue;

        // Create Card
        const div = document.createElement("div");
        div.className = "report-card";
        div.onclick = () => openModal(c);
        div.innerHTML = `
          <div class="rc-left">
            <h3>${c.name}</h3>
            <span>${c.id}</span>
          </div>
          <div class="rc-right">
            <span class="status-pill ${cDue > 0 ? '' : 'active'}">
              ${cDue > 0 ? 'Due: ₹'+cDue.toLocaleString() : 'PAID'}
            </span>
          </div>
        `;
        listDiv.appendChild(div);
      });

      // Update Dashboard
      document.getElementById("dispPaid").innerText = "₹" + totalPaid.toLocaleString();
      document.getElementById("dispDue").innerText = "₹" + totalDue.toLocaleString();
      updateChart(totalPaid, totalDue);
    }

    function updateChart(paid, due) {
      const ctx = document.getElementById("miniChart").getContext("2d");
      if(chartInstance) chartInstance.destroy();
      
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ["Paid", "Due"],
          datasets: [{ data: [paid, due], backgroundColor: ["#00e676", "#ff1744"], borderWidth:0 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });
    }

    // --- 3. MODAL LOGIC ---
    window.openModal = (c) => {
      currentCustomer = c;
      document.getElementById("modalName").innerText = c.name;
      document.getElementById("modalId").innerText = `ID: ${c.id} | ${c.phone || ''}`;
      
      const body = document.getElementById("modalBody");
      body.innerHTML = "";

      c.products.forEach(p => {
        const bal = p.total - p.paid;
        
        // Ledger Rows
        const sortedPay = (p.payments || []).sort((a,b) => (a.dueNumber||0)-(b.dueNumber||0));
        let rows = "";
        let runningPaid = 0;

        if(sortedPay.length === 0) rows = `<tr><td colspan="4" style="text-align:center; color:#555;">No history</td></tr>`;
        
        sortedPay.forEach(pay => {
          runningPaid += parseFloat(pay.amount);
          const currentBal = p.total - runningPaid;
          rows += `
            <tr>
              <td>#${pay.dueNumber||'-'}</td>
              <td>${pay.date}</td>
              <td style="color:var(--primary)">₹${pay.amount}</td>
              <td>₹${currentBal}</td>
            </tr>
          `;
        });

        const box = document.createElement("div");
        box.className = "prod-detail-box";
        box.innerHTML = `
          <div class="prod-head">
            <span class="prod-name">${p.name}</span>
            <span style="color:${bal>0 ? 'var(--danger)':'var(--primary)'}">
              ${bal>0 ? 'Bal: ₹'+bal : 'CLEARED'}
            </span>
          </div>
          <div style="font-size:0.8rem; color:#888; margin-bottom:10px;">
            Total Value: ₹${p.total} | Paid: ₹${p.paid}
          </div>
          <table class="ledger-table">
            <thead><tr><th>Due</th><th>Date</th><th>Paid</th><th>Bal</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        `;
        body.appendChild(box);
      });

      // Show Modal
      document.getElementById("modalOverlay").classList.add("active");
      document.getElementById("detailPanel").classList.add("active");
      
      // Update PDF Button Listener
      document.getElementById("btnDownloadPdf").onclick = () => generatePDF(c);
    };

    window.closeModal = () => {
      document.getElementById("modalOverlay").classList.remove("active");
      document.getElementById("detailPanel").classList.remove("active");
    };

    // --- 4. PROFESSIONAL PDF GENERATION ---
    window.generatePDF = (c) => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      // Brand Header
      doc.setFillColor(0, 0, 0); // Black Header
      doc.rect(0, 0, 210, 35, 'F');
      
      doc.setTextColor(0, 230, 118); // Neon Green
      doc.setFontSize(20);
      doc.setFont("helvetica", "bold");
      doc.text("MeenaGroups", 14, 18);
      
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.text("EMI STATEMENT REPORT", 14, 26);
      doc.text(`Date: ${new Date().toLocaleDateString()}`, 160, 26);

      // Customer Details
      doc.setTextColor(0, 0, 0);
      doc.setFontSize(12);
      doc.text(`Customer: ${c.name.toUpperCase()}`, 14, 45);
      doc.text(`ID: ${c.id}`, 14, 52);
      doc.text(`Phone: ${c.phone || 'N/A'}`, 100, 45);
      doc.text(`Place: ${c.place || 'N/A'}`, 100, 52);

      let finalY = 60;

      // Loop Products
      c.products.forEach(p => {
        // Product Header
        doc.setFillColor(240, 240, 240);
        doc.rect(14, finalY, 182, 10, 'F');
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(11);
        doc.setFont("helvetica", "bold");
        doc.text(`${p.name} (Value: Rs.${p.total})`, 16, finalY + 7);
        
        finalY += 15;

        // Ledger Data
        const bodyData = [];
        let running = 0;
        const payments = (p.payments || []).sort((a,b) => (a.dueNumber||0)-(b.dueNumber||0));

        if(payments.length === 0) {
           bodyData.push(['-', '-', 'No Payments Recorded', '-', `Rs.${p.total}`]);
        } else {
           payments.forEach(pay => {
             running += parseFloat(pay.amount);
             const bal = p.total - running;
             bodyData.push([
               `#${pay.dueNumber||'-'}`,
               pay.date,
               pay.type || 'Manual',
               `Rs.${pay.amount}`,
               `Rs.${bal}`
             ]);
           });
        }

        // Table
        doc.autoTable({
          startY: finalY,
          head: [['Due', 'Date', 'Type', 'Paid', 'Balance']],
          body: bodyData,
          theme: 'grid',
          headStyles: { fillColor: [0, 0, 0], textColor: [255, 255, 255] },
          styles: { fontSize: 9 },
          margin: { left: 14, right: 14 }
        });

        finalY = doc.lastAutoTable.finalY + 15;
      });

      // Footer
      doc.setFontSize(8);
      doc.setTextColor(150);
      doc.text("System Generated Report - MeenaGroups", 14, 285);

      doc.save(`Statement_${c.id}.pdf`);
    };

    // Init
    loadRecent(20);

  </script>
</body>
</html>
