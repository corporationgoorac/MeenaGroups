<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Analytics - MeenaGroups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    /* --- 1. ULTRA-MODERN NEON THEME --- */
    :root { 
      --bg: #000000; 
      --surface: #0a0a0a;
      --card: #121212; 
      --input-bg: #181818;
      
      /* BRAND COLORS */
      --brand: #00e676;       /* Main Action */
      --accent: #2979ff;      /* Info / Links */
      --danger: #ff1744;      /* High Alert */
      --warning: #ffea00;     /* Attention */
      --text: #ffffff; 
      --text-muted: #888888;
      --border: #2a2a2a; 
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
      margin: 0; padding: 0; 
      height: 100vh; 
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* --- 2. HEADER --- */
    header {
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 15px 20px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 50; flex-shrink: 0;
    }
    
    .brand-group h1 { margin: 0; font-size: 1.1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .brand-group span { font-size: 0.65rem; color: var(--accent); letter-spacing: 2px; font-weight: 600; display: block; margin-top: 2px; }

    .header-icons { display: flex; gap: 20px; }
    .icon-btn { 
      background: none; border: none; color: var(--text); cursor: pointer; 
      transition: 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .icon-btn:hover { color: var(--brand); transform: scale(1.1); }

    /* --- 3. SMART SEARCH BAR --- */
    .controls-wrapper {
      padding: 15px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex; gap: 10px;
      overflow-x: auto;
    }
    
    .search-box { 
      flex: 1; position: relative; min-width: 220px; 
    }
    .search-box input {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      color: white; padding: 12px 15px 12px 42px; border-radius: 50px; font-size: 0.9rem;
      transition: 0.3s;
    }
    .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(41, 121, 255, 0.15); }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 16px; fill: var(--text-muted); }

    .chip-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 0 18px; border-radius: 50px; font-weight: 600; font-size: 0.8rem;
      white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 6px;
      transition: 0.2s;
    }
    .chip-btn:active { transform: scale(0.95); background: #222; }
    .chip-btn.blue { border-color: var(--accent); color: var(--accent); background: rgba(41, 121, 255, 0.05); }
    .chip-btn.red { border-color: var(--danger); color: var(--danger); background: rgba(255, 23, 68, 0.05); }

    /* --- 4. CUSTOMER LIST --- */
    .content-area { 
      flex: 1; overflow-y: auto; padding: 20px; 
      display: flex; flex-direction: column; gap: 15px; 
    }

    .user-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 20px; display: flex; justify-content: space-between; align-items: center;
      position: relative; overflow: hidden; transition: transform 0.2s;
      cursor: pointer;
    }
    .user-card:active { transform: scale(0.98); background: #1a1a1a; }
    
    /* Status Indicator Bar */
    .user-card::before { content:''; position: absolute; left:0; top:0; bottom:0; width:4px; }
    .user-card.status-ok::before { background: var(--brand); box-shadow: 2px 0 10px rgba(0,230,118,0.2); }
    .user-card.status-due::before { background: var(--danger); box-shadow: 2px 0 10px rgba(255,23,68,0.2); }

    .uc-info h3 { margin: 0; font-size: 1.1rem; color: #fff; font-weight: 700; }
    .uc-info p { margin: 4px 0 0; font-size: 0.85rem; color: var(--text-muted); font-family: monospace; }
    
    .uc-meta { text-align: right; }
    .badge { 
      display: inline-block; padding: 6px 12px; border-radius: 8px; 
      font-size: 0.75rem; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; 
    }
    .badge.due { background: rgba(255, 23, 68, 0.1); color: var(--danger); border: 1px solid rgba(255, 23, 68, 0.3); }
    .badge.paid { background: rgba(0, 230, 118, 0.1); color: var(--brand); border: 1px solid rgba(0, 230, 118, 0.3); }

    /* --- 5. FULL SCREEN CUSTOMER MODAL --- */
    .modal-layer {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
      z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-layer.open { opacity: 1; pointer-events: auto; }

    .drawer {
      position: fixed; top: 0; right: 0; width: 100%; max-width: 450px; height: 100%;
      background: #000; border-left: 1px solid var(--border);
      transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex; flex-direction: column; z-index: 101;
      box-shadow: -10px 0 50px rgba(0,0,0,0.8);
    }
    .drawer.open { transform: translateX(0); }

    /* Customer Header Profile */
    .profile-header {
      padding: 25px; background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .ph-nav { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .ph-name h2 { margin: 0; font-size: 1.8rem; font-weight: 800; color: #fff; }
    .ph-name span { color: var(--accent); font-family: monospace; font-size: 1rem; }
    
    .close-btn { 
      background: rgba(255,255,255,0.1); border: none; width: 40px; height: 40px; 
      border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    /* Quick Actions Grid */
    .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .q-btn { 
      padding: 12px; background: #111; border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 0.85rem; font-weight: 600; transition: 0.2s;
    }
    .q-btn.call { color: var(--brand); border-color: rgba(0,230,118,0.3); }
    .q-btn.loc { color: var(--accent); border-color: rgba(41,121,255,0.3); }
    .q-btn:active { transform: scale(0.96); background: #222; }

    /* Info Strip */
    .info-strip { 
      display: flex; gap: 15px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #222; 
      font-size: 0.8rem; color: var(--text-muted);
    }
    .is-item { display: flex; flex-direction: column; }
    .is-item strong { color: #fff; font-size: 0.95rem; margin-top: 2px; }

    /* Product Accordion List */
    .drawer-content { flex: 1; overflow-y: auto; padding: 20px; }
    
    .section-title { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 10px; }

    .product-box { 
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; 
      margin-bottom: 15px; overflow: hidden; transition: 0.3s;
    }
    
    .pb-head { 
      padding: 15px; display: flex; justify-content: space-between; align-items: center; 
      background: rgba(255,255,255,0.02); cursor: pointer;
    }
    .pb-title { font-weight: 700; font-size: 1rem; color: #fff; }
    .pb-bal { font-size: 0.9rem; font-weight: 800; }
    .pb-bal.red { color: var(--danger); }
    .pb-bal.green { color: var(--brand); }

    /* Expandable Ledger */
    .pb-body { 
      max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: #000;
    }
    .pb-body.expanded { max-height: 500px; overflow-y: auto; border-top: 1px solid var(--border); }

    .ledger-row { 
      display: grid; grid-template-columns: 0.5fr 1.5fr 1fr 1fr; padding: 12px 15px; 
      border-bottom: 1px solid #1a1a1a; font-size: 0.85rem; color: #ccc;
    }
    .ledger-row:last-child { border-bottom: none; }
    .amt-col { text-align: right; color: var(--brand); font-weight: 600; font-family: monospace; }
    .bal-col { text-align: right; color: #fff; font-family: monospace; }

    /* Footer Actions */
    .drawer-footer { padding: 20px; background: var(--surface); border-top: 1px solid var(--border); }
    .btn-pdf { 
      width: 100%; padding: 16px; background: var(--accent); color: #000; font-weight: 800; border: none; 
      border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;
      box-shadow: 0 5px 20px rgba(41, 121, 255, 0.3); transition: 0.2s;
    }
    .btn-pdf:active { transform: scale(0.98); }

    /* --- 6. ANALYTICS MODAL --- */
    .analytics-popup {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
      width: 90%; max-width: 600px; background: #111; border: 1px solid var(--border);
      border-radius: 20px; z-index: 200; opacity: 0; pointer-events: none; transition: 0.3s;
      box-shadow: 0 25px 80px rgba(0,0,0,1); display: flex; flex-direction: column;
    }
    .analytics-popup.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    
    .ap-head { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .ap-body { padding: 20px; }

    .metric-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .metric-card { background: #000; border: 1px solid var(--border); padding: 15px; border-radius: 12px; text-align: center; }
    .mc-val { font-size: 1.5rem; font-weight: 800; color: #fff; margin-top: 5px; }
    
    .warning-alert { 
      background: rgba(255, 234, 0, 0.05); border: 1px solid rgba(255, 234, 0, 0.2); 
      color: var(--warning); padding: 12px; border-radius: 8px; font-size: 0.8rem; margin-top: 15px;
      display: flex; gap: 10px; align-items: center;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .drawer { width: 100%; max-width: 100%; }
      .metric-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-group">
      <h1>Reports</h1>
      <span>MEENA GROUPS</span>
    </div>
    <div class="header-icons">
      <button class="icon-btn" onclick="openAnalytics()">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
      </button>
      <a href="index.html" class="icon-btn">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </a>
    </div>
  </header>

  <div class="controls-wrapper">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="searchInput" placeholder="Search ID, Name..." type="text">
    </div>
    <button class="chip-btn blue" onclick="searchCloud()">
      <svg style="width:16px;height:16px;fill:currentColor" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      Find
    </button>
    <button class="chip-btn" onclick="loadRecent(10)">
      <svg style="width:16px;height:16px;fill:currentColor" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      Recent
    </button>
    <button class="chip-btn red" onclick="loadAll()">
      Load All
    </button>
  </div>

  <div id="resultContainer" class="content-area">
    <div style="text-align:center; padding: 60px; color:#444;">
      <svg style="width:60px;height:60px;fill:#333;margin-bottom:15px" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      <p>Showing 10 recent records</p>
    </div>
  </div>

  <div class="modal-layer" id="overlay" onclick="closeAll()"></div>
  
  <div class="drawer" id="customerDrawer">
    <div class="profile-header">
      <div class="ph-nav">
        <div class="ph-name">
          <h2 id="drawName">Customer Name</h2>
          <span id="drawId">ID: --</span>
        </div>
        <button class="close-btn" onclick="closeAll()">
          <svg style="width:24px;height:24px;fill:currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>

      <div class="quick-grid">
        <a id="btnCall" href="#" class="q-btn call">
          <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 1.25 0 2.45.2 3.57.57.35.13.46.52.24 1.02l-2.2 2.2z"/></svg>
          CALL NOW
        </a>
        <a id="btnMap" href="#" target="_blank" class="q-btn loc">
          <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          LOCATE
        </a>
      </div>

      <div class="info-strip">
        <div class="is-item">
          <span>Phone</span>
          <strong id="drawPhone">--</strong>
        </div>
        <div class="is-item">
          <span>Location</span>
          <strong id="drawPlace">--</strong>
        </div>
        <div class="is-item">
          <span>Joined</span>
          <strong id="drawJoin">--</strong>
        </div>
      </div>
    </div>

    <div class="drawer-content" id="productContainer">
      </div>

    <div class="drawer-footer">
      <button class="btn-pdf" id="btnPdf">
        <svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v2.5zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5z"/></svg>
        DOWNLOAD STATEMENT
      </button>
    </div>
  </div>

  <div class="analytics-popup" id="analyticsPopup">
    <div class="ap-head">
      <h3 style="margin:0; text-transform:uppercase; letter-spacing:1px;">Business Pulse</h3>
      <button class="close-btn" onclick="closeAll()">×</button>
    </div>
    <div class="ap-body">
      <div class="metric-row">
        <div class="metric-card">
          <div style="font-size:0.8rem; color:#888;">Total Collected</div>
          <div class="mc-val" style="color:var(--brand)" id="anaPaid">₹0</div>
        </div>
        <div class="metric-card">
          <div style="font-size:0.8rem; color:#888;">Outstanding</div>
          <div class="mc-val" style="color:var(--danger)" id="anaDue">₹0</div>
        </div>
      </div>
      
      <div style="height:250px; background:#050505; border-radius:12px; padding:10px; border:1px solid #222;">
        <canvas id="financeChart"></canvas>
      </div>

      <div class="warning-alert">
        <span>⚠️</span>
        Note: Stats are based on loaded data. Use "Load All" for full business audit.
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "./config.js";
    import { collection, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    let loadedData = [];
    let chartInstance = null;

    // --- 1. DATA LOGIC ---
    window.loadRecent = async (n) => {
      uiLoading();
      try {
        const q = query(collection(db, "customers"), orderBy("createdAt", "desc"), limit(n));
        const snap = await getDocs(q);
        processData(snap);
      } catch (e) { alert("Error: " + e.message); }
    };

    window.searchCloud = async () => {
      const v = document.getElementById("searchInput").value.trim().toUpperCase();
      if(!v) return alert("Enter Customer ID");
      uiLoading();
      try {
        const q = query(collection(db, "customers"), where("id", ">=", v), where("id", "<=", v + '\uf8ff'), limit(10));
        const snap = await getDocs(q);
        if(snap.empty) alert("No match found.");
        processData(snap);
      } catch (e) { alert("Error: " + e.message); }
    };

    window.loadAll = async () => {
      if(!confirm("Load ALL records? Heavy data usage.")) return;
      uiLoading();
      try {
        const snap = await getDocs(collection(db, "customers"));
        processData(snap);
      } catch (e) { alert("Error: " + e.message); }
    };

    function uiLoading() {
      document.getElementById("resultContainer").innerHTML = `<p style="text-align:center; padding:50px; color:#666;">Syncing Database...</p>`;
    }

    function processData(snap) {
      loadedData = [];
      snap.forEach(d => loadedData.push(d.data()));
      renderList(loadedData);
      calcStats();
    }

    // --- 2. RENDER LIST ---
    function renderList(data) {
      const div = document.getElementById("resultContainer");
      div.innerHTML = "";
      
      if(data.length === 0) {
        div.innerHTML = `<p style="text-align:center; padding:50px;">No Data.</p>`;
        return;
      }

      data.forEach(c => {
        let totalVal = 0, totalPaid = 0;
        c.products.forEach(p => { totalVal += p.total; totalPaid += p.paid; });
        const bal = totalVal - totalPaid;
        const status = bal > 0 ? 'due' : 'ok';

        const card = document.createElement("div");
        card.className = `user-card status-${status}`;
        card.onclick = () => openDrawer(c);
        
        card.innerHTML = `
          <div class="uc-info">
            <h3>${c.name}</h3>
            <p>ID: ${c.id}</p>
          </div>
          <div class="uc-meta">
            <span class="badge ${bal > 0 ? 'due' : 'paid'}">
              ${bal > 0 ? '₹' + bal.toLocaleString() : 'CLEARED'}
            </span>
          </div>
        `;
        div.appendChild(card);
      });
    }

    // --- 3. CUSTOMER DRAWER ---
    window.openDrawer = (c) => {
      // Push history state to enable back button closing
      window.history.pushState({ drawer: true }, "");

      // Populate Header
      document.getElementById("drawName").innerText = c.name;
      document.getElementById("drawId").innerText = `ID: ${c.id}`;
      document.getElementById("drawPhone").innerText = c.phone || 'N/A';
      document.getElementById("drawPlace").innerText = c.place || 'N/A';
      document.getElementById("drawJoin").innerText = c.createdAt ? new Date(c.createdAt).toLocaleDateString() : '-';
      
      document.getElementById("btnCall").href = c.phone ? `tel:${c.phone}` : '#';
      document.getElementById("btnMap").href = c.place ? `https://maps.google.com/?q=${c.place}` : '#';

      // Populate Products (Accordion Style)
      const container = document.getElementById("productContainer");
      container.innerHTML = `<div class="section-title">Active Plans (${c.products.length})</div>`;

      c.products.forEach((p, idx) => {
        const bal = p.total - p.paid;
        
        // Prepare Ledger
        const sorted = (p.payments || []).sort((a,b) => (a.dueNumber||0)-(b.dueNumber||0));
        let running = 0;
        let rows = "";
        
        if(sorted.length === 0) rows = `<div style="padding:15px; color:#666; text-align:center;">No history found</div>`;
        else {
          sorted.forEach(pay => {
            running += parseFloat(pay.amount);
            const curBal = p.total - running;
            rows += `
              <div class="ledger-row">
                <span style="color:#666">#${pay.dueNumber||'-'}</span>
                <span>${pay.date}</span>
                <span class="amt-col">₹${pay.amount}</span>
                <span class="bal-col">₹${curBal}</span>
              </div>
            `;
          });
        }

        const box = document.createElement("div");
        box.className = "product-box";
        box.innerHTML = `
          <div class="pb-head" onclick="toggleAccordion(this)">
            <div class="pb-title">📦 ${p.name}</div>
            <div class="pb-bal ${bal>0?'red':'green'}">
              ${bal>0 ? 'BAL: ₹'+bal : 'PAID'}
            </div>
          </div>
          <div class="pb-body">
            ${rows}
          </div>
        `;
        container.appendChild(box);
      });

      document.getElementById("overlay").classList.add("open");
      document.getElementById("customerDrawer").classList.add("open");
      
      document.getElementById("btnPdf").onclick = () => generatePDF(c);
    };

    window.toggleAccordion = (header) => {
      const body = header.nextElementSibling;
      body.classList.toggle("expanded");
    };

    // --- 4. ANALYTICS ---
    window.openAnalytics = () => {
      window.history.pushState({ modal: true }, "");
      calcStats();
      document.getElementById("overlay").classList.add("open");
      document.getElementById("analyticsPopup").classList.add("open");
    };

    function calcStats() {
      let paid = 0, total = 0;
      loadedData.forEach(c => c.products.forEach(p => { paid += p.paid; total += p.total; }));
      
      const due = total - paid;
      document.getElementById("anaPaid").innerText = "₹" + paid.toLocaleString();
      document.getElementById("anaDue").innerText = "₹" + due.toLocaleString();

      const ctx = document.getElementById("financeChart").getContext("2d");
      if(chartInstance) chartInstance.destroy();
      
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Collected', 'Pending'],
          datasets: [{
            label: 'Financials',
            data: [paid, due],
            backgroundColor: ['#00e676', '#ff1744'],
            barThickness: 40
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { color:'#222' }, ticks: { color:'#666' } },
            x: { grid: { display:false }, ticks: { color:'#fff' } }
          }
        }
      });
    }

    // --- 5. GLOBAL CLOSING LOGIC ---
    window.closeAll = () => {
      document.getElementById("overlay").classList.remove("open");
      document.getElementById("customerDrawer").classList.remove("open");
      document.getElementById("analyticsPopup").classList.remove("open");
      
      // Clean history if we closed manually
      if(history.state) history.back();
    };

    // Handle Hardware Back Button
    window.onpopstate = () => {
      document.getElementById("overlay").classList.remove("open");
      document.getElementById("customerDrawer").classList.remove("open");
      document.getElementById("analyticsPopup").classList.remove("open");
    };

    // --- 6. PDF GENERATOR ---
    window.generatePDF = (c) => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      // Brand Header
      doc.setFillColor(0, 0, 0); 
      doc.rect(0, 0, 210, 40, 'F');
      doc.setTextColor(0, 230, 118); doc.setFontSize(22); doc.setFont("helvetica", "bold");
      doc.text("MeenaGroups", 14, 20);
      
      doc.setTextColor(255, 255, 255); doc.setFontSize(10); doc.setFont("helvetica", "normal");
      doc.text("EMI STATEMENT", 14, 28);
      doc.text(`Generated: ${new Date().toLocaleDateString()}`, 150, 28);

      // Customer
      doc.setTextColor(0, 0, 0); doc.setFontSize(12); doc.setFont("helvetica", "bold");
      doc.text(`CUSTOMER: ${c.name.toUpperCase()}`, 14, 55);
      doc.setFontSize(10);
      doc.text(`ID: ${c.id}`, 14, 62);
      doc.text(`Phone: ${c.phone || '-'}`, 80, 62);
      doc.text(`City: ${c.place || '-'}`, 140, 62);

      let finalY = 75;

      c.products.forEach(p => {
        doc.setFillColor(245, 245, 245); doc.rect(14, finalY, 182, 10, 'F');
        doc.setTextColor(0, 0, 0); doc.setFontSize(11); doc.setFont("helvetica", "bold");
        doc.text(p.name, 16, finalY + 7);
        finalY += 12;

        const rows = [];
        let running = 0;
        const payments = (p.payments || []).sort((a,b) => (a.dueNumber||0)-(b.dueNumber||0));

        if(payments.length === 0) rows.push(['-', '-', 'No Data', '-', `Rs.${p.total}`]);
        else {
          payments.forEach(pay => {
            running += parseFloat(pay.amount);
            const bal = p.total - running;
            rows.push([ `#${pay.dueNumber||'-'}`, pay.date, pay.type||'Manual', `Rs.${pay.amount}`, `Rs.${bal}` ]);
          });
        }

        doc.autoTable({
          startY: finalY,
          head: [['Due', 'Date', 'Type', 'Paid', 'Bal']],
          body: rows,
          theme: 'striped',
          headStyles: { fillColor: [20, 20, 20] },
          margin: { left: 14, right: 14 }
        });
        finalY = doc.lastAutoTable.finalY + 15;
      });

      // Footer with Link
      const pageHeight = doc.internal.pageSize.height;
      doc.setFontSize(9);
      doc.setTextColor(100);
      doc.text("Track live status at:", 14, pageHeight - 15);
      doc.setTextColor(0, 150, 255);
      doc.textWithLink("meena.goorac.biz", 45, pageHeight - 15, { url: "http://meena.goorac.biz" });
      
      doc.setTextColor(150);
      doc.text("System Generated Report", 150, pageHeight - 15);

      doc.save(`Statement_${c.id}.pdf`);
    };

    // Init
    loadRecent(10);
  </script>
</body>
</html>
