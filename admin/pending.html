<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pending Collections | MeenaGroups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090b">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    /* MATCHING YOUR EXACT THEME */
    :root {
      --bg-root: #09090b;       --bg-surface: #18181b;
      --bg-card: #27272a;       --bg-input: #1f1f22;
      --primary: #3b82f6;       --primary-hover: #2563eb;
      --success: #10b981;       --danger: #ef4444;
      --warning: #f59e0b;       --text-main: #f4f4f5;
      --text-sub: #a1a1aa;      --border: #3f3f46;
      --glass: rgba(24, 24, 27, 0.7); --blur: 16px;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: var(--bg-root); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* HEADER */
    header {
      background: var(--glass); backdrop-filter: blur(var(--blur));
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding: 16px 20px; display: flex; align-items: center; gap: 16px; z-index: 50;
    }

    .back-btn {
      background: var(--bg-surface); border: 1px solid var(--border);
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-main); text-decoration: none; cursor: pointer;
    }

    .brand h1 { margin: 0; font-size: 1.1rem; font-weight: 700; letter-spacing: -0.025em; }
    .brand span { font-size: 0.65rem; color: var(--danger); font-weight: 600; text-transform: uppercase; }

    /* CONTENT AREA */
    .content-area {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 16px;
      scroll-behavior: smooth;
    }

    /* CARD STYLE (MATCHING REPORT PAGE) */
    .card {
      background: var(--bg-surface); border: 1px solid rgba(255,255,255,0.05);
      border-radius: 20px; padding: 24px; position: relative;
      transition: all 0.2s var(--ease); cursor: pointer;
    }
    .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--danger); border-radius: 20px 0 0 20px;}
    
    .c-details h3 { margin: 0; font-size: 1.4rem; font-weight: 700; }
    .c-details p { margin: 8px 0 0; font-size: 0.95rem; color: var(--text-sub); display: flex; align-items: center; gap: 10px; }
    .cid { font-family: monospace; background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 6px; }

    .c-meta { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.08); margin-top: 16px; padding-top: 16px; }
    .overdue-tag { color: var(--danger); font-size: 0.85rem; font-weight: 600; }
    .badge-due { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.2); padding: 8px 14px; border-radius: 10px; font-weight: 700; }

    /* DRAWER (MATCHING REPORT PAGE) */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 99; }
    .overlay.active { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; inset: 0; left: auto; width: 100%; max-width: 500px; background: var(--bg-surface); transform: translateX(100%); transition: transform 0.4s var(--ease); display: flex; flex-direction: column; z-index: 100; }
    .drawer.active { transform: translateX(0); }
    .d-head { padding: 24px; background: var(--bg-root); border-bottom: 1px solid rgba(255,255,255,0.05); }
    .d-body { flex: 1; overflow-y: auto; padding: 20px; background: var(--bg-root); }

    /* INDEX ERROR MODAL */
    #indexPrompt {
        display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: #f59e0b; color: #000; padding: 12px 20px; border-radius: 12px;
        font-weight: 700; z-index: 1000; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* LOADING SPINNER */
    .loader { text-align: center; padding: 20px; color: var(--text-sub); }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>
    <div class="brand">
      <h1>Pending Collection</h1>
      <span>Overdue > 30 Days</span>
    </div>
  </header>

  <div id="pendingContainer" class="content-area">
    </div>

  <div id="loadingTrigger" class="loader">Checking for more records...</div>

  <a id="indexPrompt" href="#" target="_blank">⚠️ FIREBASE INDEX REQUIRED - CLICK TO FIX</a>

  <div class="overlay" id="overlay" onclick="closeDrawer()"></div>
  <div class="drawer" id="customerDrawer">
    <div class="d-head">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
                <h2 id="drawName" style="margin:0; font-size:1.5rem;">Customer Name</h2>
                <span id="drawId" style="color:var(--primary); font-family:monospace;">ID: #0000</span>
            </div>
            <button onclick="closeDrawer()" style="background:none; border:none; color:white; font-size:2rem; cursor:pointer;">&times;</button>
        </div>
    </div>
    <div class="d-body" id="drawerContent"></div>
  </div>

  <script type="module">
    import { db } from "./config.js";
    import { collection, query, orderBy, limit, startAfter, getDocs } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    let lastDoc = null;
    let isLoading = false;
    let allLoaded = false;
    const BATCH_SIZE = 10;

    // ------------------------------------------
    // 1. DATA FETCHING WITH INFINITE SCROLL
    // ------------------------------------------
    async function fetchPending(isNext = false) {
      if (isLoading || allLoaded) return;
      isLoading = true;

      try {
        let q = query(
          collection(db, "customers"),
          orderBy("createdAt", "desc"), 
          limit(BATCH_SIZE)
        );

        if (isNext && lastDoc) {
          q = query(q, startAfter(lastDoc));
        }

        const snap = await getDocs(q);
        
        if (snap.empty) {
          allLoaded = true;
          document.getElementById("loadingTrigger").innerText = "End of Records.";
          return;
        }

        lastDoc = snap.docs[snap.docs.length - 1];
        processAndRender(snap);

      } catch (e) {
        console.error(e);
        if (e.message.includes("index")) {
            const link = e.message.split("can be created here: ")[1];
            const prompt = document.getElementById("indexPrompt");
            prompt.href = link;
            prompt.style.display = "block";
        }
      } finally {
        isLoading = false;
      }
    }

    // ------------------------------------------
    // 2. OVERDUE LOGIC (> 1 MONTH)
    // ------------------------------------------
    function processAndRender(snap) {
      const container = document.getElementById("pendingContainer");
      const oneMonthAgo = new Date();
      oneMonthAgo.setMonth(oneMonthAgo.getMonth() - 1);

      snap.forEach(doc => {
        const c = doc.data();
        let totalVal = 0, totalPaid = 0, lastPayDate = null;

        if (c.products) {
          c.products.forEach(p => {
            totalVal += (p.total || 0);
            totalPaid += (p.paid || 0);
            
            // Find most recent payment date across all products
            if (p.payments && p.payments.length > 0) {
              p.payments.forEach(pay => {
                const d = new Date(pay.date);
                if (!lastPayDate || d > lastPayDate) lastPayDate = d;
              });
            }
          });
        }

        const balance = totalVal - totalPaid;
        // Logic: Has balance AND (No payment ever OR last payment > 30 days ago)
        const isOverdue = balance > 1 && (!lastPayDate || lastPayDate < oneMonthAgo);

        if (isOverdue) {
          const card = document.createElement("div");
          card.className = "card";
          card.onclick = () => openDrawer(c);
          
          const daysSince = lastPayDate 
            ? Math.floor((new Date() - lastPayDate) / (1000 * 60 * 60 * 24)) 
            : "No Payment Recieved";

          card.innerHTML = `
            <div class="c-details">
              <h3>${c.name}</h3>
              <p><span class="cid">${c.id}</span> | ${c.phone || 'No Phone'}</p>
              <p style="font-size:0.8rem; color:var(--warning)">Last Payment: ${lastPayDate ? lastPayDate.toLocaleDateString() : 'Never'}</p>
            </div>
            <div class="c-meta">
              <span class="overdue-tag">${daysSince} Days Late</span>
              <span class="badge-due">₹${balance.toLocaleString()}</span>
            </div>
          `;
          container.appendChild(card);
        }
      });
    }

    // ------------------------------------------
    // 3. DRAWER & MODAL LOGIC (EXACT MATCH)
    // ------------------------------------------
    window.openDrawer = (c) => {
      document.getElementById("drawName").innerText = c.name;
      document.getElementById("drawId").innerText = "ID: #" + c.id;
      
      const content = document.getElementById("drawerContent");
      content.innerHTML = "";

      c.products.forEach(p => {
        const pDiv = document.createElement("div");
        pDiv.style.cssText = "background:var(--bg-surface); padding:16px; border-radius:12px; margin-bottom:12px; border:1px solid var(--border);";
        pDiv.innerHTML = `
            <div style="display:flex; justify-content:space-between;">
                <strong>${p.name}</strong>
                <span style="color:var(--danger)">₹${p.total - p.paid} Due</span>
            </div>
            <div style="font-size:0.8rem; color:var(--text-sub); margin-top:4px;">Total Value: ₹${p.total}</div>
        `;
        content.appendChild(pDiv);
      });

      document.getElementById("overlay").classList.add("active");
      document.getElementById("customerDrawer").classList.add("active");
      window.history.pushState({ drawer: true }, "");
    };

    window.closeDrawer = () => {
      document.getElementById("overlay").classList.remove("active");
      document.getElementById("customerDrawer").classList.remove("active");
      if(history.state) history.back();
    };

    window.onpopstate = () => {
        document.getElementById("overlay").classList.remove("active");
        document.getElementById("customerDrawer").classList.remove("active");
    };

    // ------------------------------------------
    // 4. INFINITE SCROLL OBSERVER
    // ------------------------------------------
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) fetchPending(true);
    }, { threshold: 0.1 });

    observer.observe(document.getElementById("loadingTrigger"));

    // Initial Load
    fetchPending();

  </script>
</body>
</html>
