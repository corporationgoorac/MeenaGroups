<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent Directory - Meena Groups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#020617">
  <meta name="robots" content="noindex, nofollow">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

    /* --- PREMIUM DARK AGENT THEME --- */
    :root { 
      --bg: #020617; 
      --surface: #0f172a;
      --card: #1e293b; 
      --primary: #10b981; 
      --primary-muted: rgba(16, 185, 129, 0.15);
      --secondary: #38bdf8; 
      --danger: #ef4444; 
      --warning: #f59e0b;
      --text: #f8fafc; 
      --text-muted: #94a3b8;
      --border: #334155; 
      --input-bg: #020617;
      --header-bg: rgba(15, 23, 42, 0.85);
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 0; 
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 40px;
    }

    /* --- TOP NAVIGATION BAR --- */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 15px 0;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 15px var(--primary);
    }

    .brand h2 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    /* SEARCH BAR */
    .search-wrapper {
      flex: 1;
      min-width: 280px;
      max-width: 500px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 45px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: white;
      border-radius: 14px;
      font-size: 0.95rem;
      transition: 0.3s;
      font-family: inherit;
    }
    .search-input:focus { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
    
    .search-icon {
      position: absolute;
      left: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }

    /* --- AGENT CARDS GRID --- */
    .header-text { margin-bottom: 25px; }
    .header-text h1 { margin: 0; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.03em; color: #fff; }
    .header-text p { margin: 5px 0 0 0; color: var(--text-muted); font-size: 0.95rem; }

    .agent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .agent-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    
    .agent-card:hover {
      border-color: var(--secondary);
      background: var(--card);
      transform: translateY(-4px);
      box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.4);
    }
    
    .agent-card::before { content:''; position: absolute; left:0; top:0; bottom:0; width:4px; background: var(--secondary); opacity: 0.5; transition: 0.3s; }
    .agent-card:hover::before { opacity: 1; }

    .agent-avatar {
      width: 54px; height: 54px;
      border-radius: 16px;
      display: flex; justify-content: center; align-items: center;
      font-size: 1.5rem; font-weight: 800; color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    .agent-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .agent-name { margin: 0; font-size: 1.1rem; font-weight: 800; color: #fff; }
    .agent-meta { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .draft-badge { background: rgba(245, 158, 11, 0.15); color: var(--warning); padding: 2px 8px; border-radius: 6px; font-size: 0.7rem; border: 1px solid rgba(245, 158, 11, 0.3); }

    .agent-amount {
      text-align: right;
      display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
    }
    .amount-val { font-size: 1.3rem; font-weight: 800; color: var(--primary); letter-spacing: -0.02em; }
    .amount-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }

    /* Scroll Observer Marker */
    #scrollObserver { height: 20px; width: 100%; margin-top: 20px; }

    /* Loading Spinner */
    .loading-spinner {
      width: 40px; height: 40px; border: 3px solid rgba(56, 189, 248, 0.1); border-top-color: var(--secondary);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- BOTTOM SHEET MODAL (AGENT ACTION) --- */
    .bottom-sheet-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(5px);
      display: none; align-items: flex-end; justify-content: center; z-index: 2000;
      opacity: 0; transition: opacity 0.3s;
    }
    .bottom-sheet-overlay.open { opacity: 1; }
    
    .bottom-sheet {
      background: var(--surface); width: 100%; max-width: 600px;
      border-radius: 24px 24px 0 0; padding: 30px 24px; border: 1px solid var(--border);
      border-bottom: none; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
    }
    .bottom-sheet-overlay.open .bottom-sheet { transform: translateY(0); }
    
    .sheet-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; }
    .sheet-title { margin: 0; font-size: 1.5rem; font-weight: 800; color: #fff; }
    .sheet-subtitle { margin: 5px 0 0 0; color: var(--secondary); font-size: 0.9rem; font-weight: 600; }
    .btn-close { background: transparent; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; padding: 0; transition: 0.2s; }
    .btn-close:hover { color: #fff; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; color: var(--text-muted); font-size: 0.8rem; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .form-group input { 
      width: 100%; padding: 14px 18px; background: var(--input-bg); border: 1px solid var(--border); 
      color: white; border-radius: 12px; font-size: 1rem; font-family: inherit; transition: 0.2s;
    }
    .form-group input:focus { border-color: var(--secondary); box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15); }
    
    .action-row { display: flex; gap: 12px; margin-top: 30px; }
    .btn-action { 
      flex: 1; padding: 16px; border-radius: 14px; border: none; font-weight: 800; cursor: pointer; 
      transition: 0.2s; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    
    .btn-save-name { background: var(--card); color: #fff; border: 1px solid var(--border); }
    .btn-save-name:hover { background: #334155; }
    
    .btn-force-submit { 
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); 
      color: #fff; 
      box-shadow: 0 8px 20px -6px rgba(56, 189, 248, 0.6); 
    }
    .btn-force-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 25px -6px rgba(56, 189, 248, 0.7); }
    .btn-force-submit:active { transform: translateY(0); }

    /* --- CUSTOM DIALOG --- */
    .dialog-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 3000;
      opacity: 0; transition: 0.3s;
    }
    .dialog-overlay.open { opacity: 1; }
    .dialog-box {
      background: var(--surface); padding: 28px; border-radius: 24px; width: 90%; max-width: 360px;
      border: 1px solid var(--border); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
      text-align: center; transform: translateY(20px) scale(0.95); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .dialog-overlay.open .dialog-box { transform: translateY(0) scale(1); }
    .dialog-box h3 { margin: 0 0 12px 0; color: #fff; font-size: 1.4rem; font-weight: 800; }
    .dialog-box p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 28px; line-height: 1.5; }
    .dialog-actions { display: flex; gap: 12px; }
    .btn-dlg { flex: 1; padding: 14px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
    .btn-dlg-cancel { background: #334155; color: white; }
    .btn-dlg-confirm { background: var(--primary); color: #000; }

    @media (max-width: 600px) {
      .nav-container { flex-direction: column; align-items: flex-start; }
      .search-wrapper { width: 100%; max-width: 100%; }
      .agent-grid { grid-template-columns: 1fr; }
      .action-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <div class="nav-container">
      <div class="brand">
        <div class="brand-dot"></div>
        <h2>MEENA GROUPS</h2>
      </div>
      
      <div class="search-wrapper">
        <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search agents by name...">
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="header-text">
      <h1>Agent Guide</h1>
      <p>View all active agents and manage their draft collections.</p>
    </div>

    <div id="loadingState" style="text-align:center; padding: 80px 20px;">
      <div class="loading-spinner"></div>
      <p style="color:var(--text-muted);">Analyzing draft data...</p>
    </div>

    <div id="agentGrid" class="agent-grid">
      </div>
    
    <div id="emptyState" style="display:none; text-align:center; padding: 80px 20px; color:var(--text-muted);">
      <div style="font-size: 3rem; margin-bottom:15px; opacity:0.5;">🔍</div>
      <h3 style="margin:0; color:#fff;">No Agents Found</h3>
      <p>No agents have pending drafts matching your search.</p>
    </div>

    <div id="scrollObserver"></div>
  </div>

  <div class="bottom-sheet-overlay" id="agentModalOverlay">
    <div class="bottom-sheet">
      <div class="sheet-header">
        <div>
          <h3 class="sheet-title" id="modalAgentName">Agent Name</h3>
          <p class="sheet-subtitle" id="modalAgentStats">0 Drafts • ₹0</p>
        </div>
        <button class="btn-close" onclick="closeAgentModal()">✕</button>
      </div>
      
      <input type="hidden" id="modalAgentUid">

      <div class="form-group">
        <label>Update Display Name</label>
        <input type="text" id="editAgentNameInput" placeholder="Enter new name...">
      </div>

      <div class="action-row">
        <button class="btn-action btn-save-name" onclick="saveAgentName()">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16v16H4V4zm2 2v12h12V6H6zm2 2h8v2H8V8zm0 4h8v2H8v-2z"></path></svg>
          Save Name
        </button>
        <button class="btn-action btn-force-submit" onclick="forceSubmitAgent()">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
          Force Submit
        </button>
      </div>
    </div>
  </div>

  <div class="dialog-overlay" id="customDialogOverlay">
    <div class="dialog-box">
      <h3 id="customDialogTitle">Alert</h3>
      <p id="customDialogMessage">Message goes here.</p>
      <div class="dialog-actions">
        <button class="btn-dlg btn-dlg-cancel" id="customDialogCancel" style="display: none;" onclick="closeCustomDialog()">Cancel</button>
        <button class="btn-dlg btn-dlg-confirm" id="customDialogConfirm">OK</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "./config.js";
    import { 
      collection, query, where, getDocs, writeBatch, doc 
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    let allGroupedAgents = []; // Holds the master grouped data
    let filteredAgents = [];   // Holds search results
    let displayedCount = 0;    // For pagination
    const ITEMS_PER_PAGE = 10;
    
    // Avatar Color Palette
    const avatarColors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#a855f7', '#ec4899'];

    // --- 1. FETCH & GROUP DATA ---
    async function loadAgentData() {
      const grid = document.getElementById("agentGrid");
      const loader = document.getElementById("loadingState");
      
      try {
        // --- OPTIMIZED QUERY: Only fetch active drafts and pending items! ---
        const q = query(collection(db, "temp_entries"), where("status", "in", ["draft", "pending"])); 
        const snapshot = await getDocs(q);
        const map = {};

        // --- OPTIMIZED ADMIN FETCH: Costs practically zero reads ---
        const fetchSafely = async (colName) => {
          try { 
            return await getDocs(collection(db, colName)); 
          } catch(e) { 
            console.warn(`⚠️ Blocked from reading '${colName}':`, e.message); 
            return { forEach: () => {} }; 
          }
        };

        // Scan purely administrative collections to find users even with 0 entries
        const [usersSnap, staffSnap, agentsSnap] = await Promise.all([
          fetchSafely("users"), 
          fetchSafely("staff"),
          fetchSafely("agents")
          // fetchSafely("customers") // ⚠️ COMMENTED OUT TO PREVENT THOUSANDS OF READS & HIGH BILLING
        ]);
        const customersSnap = []; // Kept so the rest of your original code doesn't break!
        
        const processBaseUser = (uSnap) => {
          const uData = uSnap.data();
          const uUid = uData.uid || uSnap.id;
          // Aggressively find any recognizable name field
          const agentName = uData.name || uData.displayName || uData.firstName || uData.username || 'Agent';
          
          if (!map[uUid]) {
            map[uUid] = {
              uid: uUid,
              name: agentName,
              count: 0,
              amount: 0,
              docs: [],       
              draftDocs: []   
            };
          }
        };

        usersSnap.forEach(processBaseUser);
        staffSnap.forEach(processBaseUser);
        agentsSnap.forEach(processBaseUser);

        // DISABLED customer historical check to save massive billing costs.
        if (customersSnap && customersSnap.forEach) {
          customersSnap.forEach(cSnap => {
            const cData = cSnap.data();
            if (cData.products && Array.isArray(cData.products)) {
              cData.products.forEach(p => {
                if (p.payments && Array.isArray(p.payments)) {
                  p.payments.forEach(pay => {
                    if (pay.staffUid && !map[pay.staffUid]) {
                      map[pay.staffUid] = {
                        uid: pay.staffUid,
                        name: pay.staffName || 'Historical Agent',
                        count: 0,
                        amount: 0,
                        docs: [],
                        draftDocs: []
                      };
                    }
                  });
                }
              });
            }
          });
        }
        // --- END BASE USER FETCH ---

        snapshot.forEach(docSnap => {
          const d = docSnap.data();
          const uid = d.staffUid || 'unknown_uid';
          
          if (!map[uid]) {
            map[uid] = {
              uid: uid,
              name: d.staffName || 'Unknown Agent',
              count: 0,
              amount: 0,
              docs: [],       
              draftDocs: []   
            };
          }
          
          // Always push to docs array so we can rename them even if they are pending
          map[uid].docs.push({ id: docSnap.id, ...d });

          // ONLY increment amounts and draft counts if the status is actually a draft
          if (d.status === "draft") {
            map[uid].count++;
            map[uid].amount += parseFloat(d.amount || 0);
            map[uid].draftDocs.push({ id: docSnap.id, ...d }); 
          }
        });

        // Convert to array and sort by Highest Amount
        allGroupedAgents = Object.values(map).sort((a, b) => b.amount - a.amount);
        filteredAgents = [...allGroupedAgents];
        
        loader.style.display = "none";
        displayedCount = 0;
        grid.innerHTML = "";
        
        renderNextBatch();

      } catch (e) {
        console.error(e);
        loader.innerHTML = `<p style="color:var(--danger)">Error loading data: ${e.message}</p>`;
      }
    }

    // --- 2. RENDER CARDS (PAGINATION) ---
    function renderNextBatch() {
      const grid = document.getElementById("agentGrid");
      const emptyState = document.getElementById("emptyState");

      if (filteredAgents.length === 0) {
        grid.innerHTML = "";
        emptyState.style.display = "block";
        return;
      }
      
      emptyState.style.display = "none";

      const endIndex = Math.min(displayedCount + ITEMS_PER_PAGE, filteredAgents.length);
      
      let html = "";
      for (let i = displayedCount; i < endIndex; i++) {
        const agent = filteredAgents[i];
        
        // Generate Avatar Letter and Color
        const initial = agent.name.charAt(0).toUpperCase();
        const colorIndex = agent.uid.length % avatarColors.length;
        const bgColor = avatarColors[colorIndex];

        html += `
          <div class="agent-card" onclick="openAgentModal('${agent.uid}')">
            <div class="agent-avatar" style="background: ${bgColor};">
              ${initial}
            </div>
            <div class="agent-info">
              <h4 class="agent-name">${agent.name}</h4>
              <div class="agent-meta">
                <span class="draft-badge">${agent.count} Drafts</span>
              </div>
            </div>
            <div class="agent-amount">
              <span class="amount-label">Pending</span>
              <span class="amount-val">₹${agent.amount.toLocaleString('en-IN')}</span>
            </div>
          </div>
        `;
      }
      
      grid.insertAdjacentHTML('beforeend', html);
      displayedCount = endIndex;
    }

    // --- 3. INFINITE SCROLL OBSERVER ---
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && displayedCount < filteredAgents.length) {
        renderNextBatch();
      }
    }, { rootMargin: '100px' });
    
    observer.observe(document.getElementById("scrollObserver"));

    // --- 4. LIVE SEARCH ---
    document.getElementById("searchInput").addEventListener("input", (e) => {
      const term = e.target.value.toLowerCase().trim();
      
      filteredAgents = allGroupedAgents.filter(a => 
        a.name.toLowerCase().includes(term) || a.uid.toLowerCase().includes(term)
      );
      
      document.getElementById("agentGrid").innerHTML = "";
      displayedCount = 0;
      renderNextBatch();
    });

    // --- 5. MODAL LOGIC & MOBILE BACK BUTTON ---
    let currentAgentData = null;

    window.openAgentModal = (uid) => {
      if (navigator.vibrate) navigator.vibrate(40);
      
      currentAgentData = allGroupedAgents.find(a => a.uid === uid);
      if (!currentAgentData) return;

      document.getElementById("modalAgentName").innerText = currentAgentData.name;
      document.getElementById("modalAgentStats").innerText = `${currentAgentData.count} Drafts • ₹${currentAgentData.amount.toLocaleString('en-IN')}`;
      document.getElementById("modalAgentUid").value = currentAgentData.uid;
      document.getElementById("editAgentNameInput").value = currentAgentData.name;

      const sheet = document.getElementById("agentModalOverlay");
      sheet.style.display = "flex";
      setTimeout(() => sheet.classList.add("open"), 10);
      
      history.pushState({ modalOpen: 'agentModal' }, "");
    };

    window.closeAgentModal = () => {
      const sheet = document.getElementById("agentModalOverlay");
      sheet.classList.remove("open");
      setTimeout(() => sheet.style.display = "none", 300);
      
      if (history.state && history.state.modalOpen === 'agentModal') {
        history.back();
      }
    };

    // --- 6. ACTION: SAVE NAME ---
    window.saveAgentName = async () => {
      const newName = document.getElementById("editAgentNameInput").value.trim();
      if (!newName || newName === currentAgentData.name) return closeAgentModal();

      const btn = document.querySelector(".btn-save-name");
      const originalText = btn.innerHTML;
      btn.innerHTML = "Saving...";
      btn.disabled = true;

      try {
        const batch = writeBatch(db);
        let docsCount = 0;

        // UPGRADE: Update name in ALL docs (both draft and pending) for this agent
        currentAgentData.docs.forEach(docData => {
          const ref = doc(db, "temp_entries", docData.id);
          batch.update(ref, { staffName: newName });
          docsCount++;
        });

        if(docsCount > 0) await batch.commit();

        showCustomAlert("Success", `Agent name updated to ${newName} across ${docsCount} entries.`);
        closeAgentModal();
        loadAgentData(); // Refresh UI entirely

      } catch (e) {
        showCustomAlert("Error", "Update failed: " + e.message);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    };

    // --- 7. ACTION: FORCE SUBMIT ---
    window.forceSubmitAgent = async () => {
      if (!currentAgentData) return;
      
      // UPGRADE: Prevent submitting if they have 0 drafts
      if (currentAgentData.count === 0) {
          showCustomAlert("Empty", "This agent currently has 0 drafts to submit.");
          return;
      }

      showCustomConfirm(
        "Force Submit?", 
        `Are you sure you want to forcibly submit all ${currentAgentData.count} drafts for ${currentAgentData.name}? They will be sent to the Admin queue.`, 
        async () => {
          
          const btn = document.querySelector(".btn-force-submit");
          const originalText = btn.innerHTML;
          btn.innerHTML = "Submitting...";
          btn.disabled = true;

          try {
            const batch = writeBatch(db);
            
            // UPGRADE: Ensure we ONLY submit draftDocs, not ones already pending
            const draftsToSubmit = currentAgentData.draftDocs || [];
            draftsToSubmit.forEach(docData => {
              const ref = doc(db, "temp_entries", docData.id);
              batch.update(ref, { status: "pending" }); // Push to admin approval queue
            });

            if (draftsToSubmit.length > 0) await batch.commit();
            
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            
            showCustomAlert("Success", `Submitted ${currentAgentData.count} drafts to the pending queue successfully.`);
            closeAgentModal();
            loadAgentData(); // Refresh grid

          } catch (e) {
            showCustomAlert("Error", "Submit failed: " + e.message);
          } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
          }
      });
    };

    // --- 8. CUSTOM DIALOG LOGIC ---
    let activeConfirmCallback = null;

    window.openCustomDialog = (title, message, isConfirm, callback = null) => {
      if (navigator.vibrate) navigator.vibrate(40); 
      
      document.getElementById('customDialogTitle').innerText = title;
      document.getElementById('customDialogMessage').innerText = message;
      
      const cancelBtn = document.getElementById('customDialogCancel');
      const confirmBtn = document.getElementById('customDialogConfirm');
      
      if (isConfirm) {
        cancelBtn.style.display = 'block';
        confirmBtn.innerText = 'Yes, Proceed';
        confirmBtn.style.background = 'var(--secondary)';
        confirmBtn.style.color = '#000';
      } else {
        cancelBtn.style.display = 'none';
        confirmBtn.innerText = 'OK';
        confirmBtn.style.background = 'var(--primary)';
        confirmBtn.style.color = '#000';
      }
      
      activeConfirmCallback = callback;
      
      const overlay = document.getElementById('customDialogOverlay');
      overlay.style.display = 'flex';
      setTimeout(() => overlay.classList.add('open'), 10);
      
      history.pushState({ modalOpen: 'customDialog' }, "");
    };

    window.closeCustomDialog = () => {
      const overlay = document.getElementById('customDialogOverlay');
      overlay.classList.remove('open');
      setTimeout(() => overlay.style.display = 'none', 300);
      
      if (history.state && history.state.modalOpen === 'customDialog') {
        history.back();
      }
    };

    document.getElementById('customDialogConfirm').onclick = () => {
      closeCustomDialog();
      if (activeConfirmCallback) activeConfirmCallback();
    };

    window.showCustomAlert = (title, message) => openCustomDialog(title, message, false);
    window.showCustomConfirm = (title, message, callback) => openCustomDialog(title, message, true, callback);

    // Mobile Back Button Router
    window.addEventListener('popstate', (e) => {
      const agentModal = document.getElementById("agentModalOverlay");
      if (agentModal && agentModal.classList.contains("open")) {
        agentModal.classList.remove("open");
        setTimeout(() => agentModal.style.display = "none", 300);
      }
      
      const customDialog = document.getElementById("customDialogOverlay");
      if (customDialog && customDialog.classList.contains("open")) {
        customDialog.classList.remove("open");
        setTimeout(() => customDialog.style.display = "none", 300);
      }
    });

    // Initialize
    loadAgentData();

  </script>
</body>
</html>
