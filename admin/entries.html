<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Entries - MeenaGroups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">

  <style>
    /* --- 1. HIGH CONTRAST THEME --- */
    :root { 
      --bg: #000000; 
      --surface: #0a0a0a;
      --card: #141414; 
      --input-bg: #1a1a1a;
      --primary: #00e676; /* Neon Green */
      --secondary: #2979ff; /* Bright Blue */
      --danger: #ff1744; 
      --text: #ffffff; 
      --text-muted: #888888;
      --border: #333333; 
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
      margin: 0; padding: 0; 
      height: 100vh; 
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* --- 2. HEADER --- */
    header {
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 15px 20px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 50; flex-shrink: 0;
    }
    header h1 { margin: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.5px; }
    .nav-btn { background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; }

    /* --- 3. MAIN CONTAINER --- */
    .main-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex; flex-direction: column; gap: 20px;
    }

    /* Search Section */
    .search-box {
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      position: sticky; top: 0; z-index: 10;
    }

    .search-input-group {
      display: flex; gap: 10px;
    }

    input { 
      width: 100%; padding: 14px; background: var(--input-bg); border: 1px solid var(--border); 
      color: white; border-radius: 10px; font-size: 16px; transition: 0.2s;
    }
    input:focus { border-color: var(--primary); }

    .btn-search { 
      background: var(--secondary); color: white; border: none; padding: 0 25px; 
      border-radius: 10px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .btn-search:active { transform: scale(0.96); }

    /* Results Area */
    .result-grid { display: flex; flex-direction: column; gap: 20px; padding-bottom: 50px; }

    /* Customer Card */
    .cust-card { 
      background: var(--card); border-radius: 16px; border: 1px solid var(--border); 
      overflow: hidden; animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    
    .cust-header { 
      padding: 15px 20px; background: linear-gradient(to right, #111, #0a0a0a);
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .cust-info h3 { margin: 0; font-size: 1.1rem; color: white; font-weight: 700; }
    .cust-info small { color: var(--secondary); font-family: monospace; letter-spacing: 1px; }
    .cust-meta { text-align: right; color: var(--text-muted); font-size: 0.8rem; line-height: 1.4; }

    /* Product Section */
    .product-box { padding: 20px; border-bottom: 1px solid var(--border); }
    .product-box:last-child { border-bottom: none; }

    .prod-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .prod-name { font-size: 1rem; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }

    .badge { padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-due { background: rgba(255, 23, 68, 0.1); color: var(--danger); border: 1px solid rgba(255, 23, 68, 0.3); }
    .badge-paid { background: rgba(0, 230, 118, 0.1); color: var(--primary); border: 1px solid rgba(0, 230, 118, 0.3); }

    .stats-grid { 
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;
    }
    .stat-box { 
      background: #000; padding: 10px; border-radius: 8px; border: 1px solid #222; 
      text-align: center;
    }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
    .stat-val { font-size: 1rem; font-weight: 700; color: #fff; margin-top: 2px; }

    /* Payment Inputs */
    .payment-area { 
      background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid var(--border);
    }
    .pay-label { font-size: 0.8rem; color: var(--secondary); margin-bottom: 8px; display: block; font-weight: 600; }
    
    .pay-inputs { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; margin-bottom: 10px; }
    
    .btn-pay { 
      width: 100%; padding: 14px; background: var(--primary); color: #000; 
      font-weight: 800; border: none; border-radius: 10px; cursor: pointer; 
      font-size: 1rem; transition: 0.2s;
    }
    .btn-pay:active { transform: scale(0.98); opacity: 0.9; }
    
    /* Mobile Responsive */
    @media (max-width: 600px) {
      .search-input-group { flex-direction: column; }
      .btn-search { width: 100%; padding: 14px; }
      .pay-inputs { grid-template-columns: 1fr 1fr; }
    }

    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header>
    <h1>Payment Entries</h1>
    <a href="index.html" class="nav-btn" style="text-decoration:none;">🏠</a>
  </header>

  <div class="main-container">
    
    <div class="search-box">
      <div class="search-input-group">
        <input id="searchInput" placeholder="Search by ID or Name..." onkeypress="handleEnter(event)">
        <button class="btn-search" onclick="searchCustomer()">FIND USER</button>
      </div>
    </div>

    <div id="resultArea" class="result-grid">
      <div style="text-align: center; color: #333; padding: 40px;">
        <div style="font-size: 4rem; opacity: 0.3;">💸</div>
        <p style="color: var(--text-muted);">Search to manage payments</p>
      </div>
    </div>

  </div>

  <script type="module">
    import { db } from "./config.js";
    import { 
      collection, query, where, getDocs, doc, runTransaction, increment, limit 
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // --- 1. SMART SEARCH LOGIC ---
    window.searchCustomer = async () => {
      const term = document.getElementById("searchInput").value.trim();
      const div = document.getElementById("resultArea");
      
      if (term.length < 1) return;

      div.innerHTML = `<p style="color:#666; text-align:center; padding:20px;">Searching database...</p>`;

      try {
        const colRef = collection(db, "customers");
        let snapshot;

        // Strategy 1: Try ID Search First (Exact or Range)
        const idTerm = term.toUpperCase(); // Assume IDs are Upper e.g. "A20"
        const qID = query(
          colRef,
          where("id", ">=", idTerm),
          where("id", "<=", idTerm + '\uf8ff'),
          limit(5)
        );
        snapshot = await getDocs(qID);

        // Strategy 2: If ID returns nothing, Search by Name
        if (snapshot.empty) {
          // Note: Firestore is case-sensitive. This is a simple prefix search.
          // For best results, store a lowercase 'name_lower' field in DB. 
          // Here we assume standard capitalization or exact match.
          const qName = query(
            colRef,
            where("name", ">=", term),
            where("name", "<=", term + '\uf8ff'),
            limit(5)
          );
          snapshot = await getDocs(qName);
        }

        // Render Results
        div.innerHTML = "";
        if (snapshot.empty) {
          div.innerHTML = `
            <div style="text-align:center; padding:30px; border:1px dashed #333; border-radius:10px;">
              <p style="color:var(--danger); font-weight:bold;">No Customer Found</p>
              <p style="color:#666; font-size:0.9rem;">Tried searching ID "${idTerm}" and Name "${term}"</p>
            </div>`;
          return;
        }

        snapshot.forEach(docSnap => {
          renderCard(docSnap.data());
        });

      } catch (e) {
        console.error(e);
        div.innerHTML = `<p style="color:var(--danger); text-align:center;">Error: ${e.message}</p>`;
      }
    };

    window.handleEnter = (e) => {
      if(e.key === "Enter") searchCustomer();
    }

    // --- 2. RENDER CARD UI ---
    function renderCard(c) {
      const div = document.getElementById("resultArea");
      const card = document.createElement("div");
      card.className = "cust-card";

      let productsHtml = "";
      
      c.products.forEach((p, idx) => {
        // Calculations
        const balance = p.total - p.paid;
        
        // Next Due Logic
        const lastDue = (p.payments || []).length > 0 
          ? Math.max(...p.payments.map(x => x.dueNumber || 0)) 
          : 0;
        const nextDue = lastDue + 1;

        // Badge Logic
        const isPaid = balance <= 0;
        const badgeHTML = isPaid 
          ? `<span class="badge badge-paid">COMPLETED</span>` 
          : `<span class="badge badge-due">OUTSTANDING</span>`;

        // Payment Form HTML (Hidden if paid, optional)
        const paymentForm = isPaid ? '' : `
          <div class="payment-area">
            <label class="pay-label">ADD PAYMENT ENTRY (Due #${nextDue})</label>
            <div class="pay-inputs">
              <input type="number" id="amt_${c.id}_${idx}" placeholder="Amount ₹">
              <input type="date" id="date_${c.id}_${idx}" value="${new Date().toISOString().split('T')[0]}">
            </div>
            <button class="btn-pay" onclick="processPayment('${c.id}', ${idx})">CONFIRM PAYMENT</button>
          </div>
        `;

        productsHtml += `
          <div class="product-box">
            <div class="prod-title-row">
              <span class="prod-name">📦 ${p.name}</span>
              ${badgeHTML}
            </div>
            
            <div class="stats-grid">
              <div class="stat-box">
                <div class="stat-label">Total Cost</div>
                <div class="stat-val">₹${p.total.toLocaleString()}</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">Balance</div>
                <div class="stat-val" style="color:${balance > 0 ? 'var(--danger)' : 'var(--primary)'}">
                  ₹${balance.toLocaleString()}
                </div>
              </div>
            </div>

            ${paymentForm}
          </div>
        `;
      });

      card.innerHTML = `
        <div class="cust-header">
          <div class="cust-info">
            <h3>${c.name}</h3>
            <small>${c.id}</small>
          </div>
          <div class="cust-meta">
            ${c.place || 'No Location'}<br>
            ${c.phone || 'No Phone'}
          </div>
        </div>
        <div>${productsHtml}</div>
      `;
      div.appendChild(card);
    }

    // --- 3. PAYMENT TRANSACTION LOGIC ---
    window.processPayment = async (custId, prodIdx) => {
      const amtInput = document.getElementById(`amt_${custId}_${prodIdx}`);
      const dateInput = document.getElementById(`date_${custId}_${prodIdx}`);
      
      const amount = parseFloat(amtInput.value);
      const date = dateInput.value;

      if (!amount || amount <= 0) return alert("❌ Enter a valid positive amount");

      // Button State
      const btn = event.target;
      const originalText = btn.innerText;
      btn.innerText = "PROCESSING...";
      btn.disabled = true;
      btn.style.opacity = "0.7";

      try {
        await runTransaction(db, async (transaction) => {
          const custRef = doc(db, "customers", custId);
          const statsRef = doc(db, "metadata", "stats");

          const custDoc = await transaction.get(custRef);
          if (!custDoc.exists()) throw "Customer does not exist!";

          const data = custDoc.data();
          const product = data.products[prodIdx];

          // Calculate Due Number
          let maxDue = 0;
          if (product.payments && product.payments.length > 0) {
            maxDue = Math.max(...product.payments.map(p => p.dueNumber || 0));
          }

          const newPayment = {
            date: date,
            amount: amount,
            dueNumber: maxDue + 1,
            type: "Manual Entry"
          };

          product.payments.push(newPayment);
          product.paid += amount; // Update local total

          // Update DB
          transaction.update(custRef, { products: data.products });
          transaction.update(statsRef, {
            totalPaid: increment(amount),
            totalBalance: increment(-amount)
          });
        });

        alert("✅ Payment Recorded Successfully!");
        searchCustomer(); // Refresh UI

      } catch (e) {
        console.error(e);
        alert("Transaction Failed: " + e.message);
        btn.innerText = originalText;
        btn.disabled = false;
        btn.style.opacity = "1";
      }
    };
  </script>
</body>
</html>
