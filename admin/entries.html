<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Entries - MeenaGroups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">

  <style>
    /* --- 1. HIGH CONTRAST THEME --- */
    :root { 
      --bg: #000000; 
      --surface: #0a0a0a;
      --card: #141414; 
      --input-bg: #1a1a1a;
      --primary: #00e676; /* Neon Green */
      --secondary: #2979ff; /* Bright Blue */
      --danger: #ff1744; 
      --text: #ffffff; 
      --text-muted: #888888;
      --border: #333333; 
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
      margin: 0; padding: 0; 
      height: 100vh; 
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* --- 2. HEADER --- */
    header {
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 15px 20px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 50; flex-shrink: 0;
    }
    header h1 { margin: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.5px; }
    .nav-btn { background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; }

    /* --- 3. MAIN CONTAINER --- */
    .main-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex; flex-direction: column; gap: 20px;
    }

    /* Search Section */
    .search-box {
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      position: sticky; top: 0; z-index: 10;
    }

    .search-input-group {
      display: flex; gap: 10px;
    }

    input { 
      width: 100%; padding: 14px; background: var(--input-bg); border: 1px solid var(--border); 
      color: white; border-radius: 10px; font-size: 16px; transition: 0.2s;
    }
    input:focus { border-color: var(--primary); }

    .btn-search { 
      background: var(--secondary); color: white; border: none; padding: 0 25px; 
      border-radius: 10px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .btn-search:active { transform: scale(0.96); }

    /* Results Area */
    .result-grid { display: flex; flex-direction: column; gap: 20px; padding-bottom: 50px; }

    /* Customer Card */
    .cust-card { 
      background: var(--card); border-radius: 16px; border: 1px solid var(--border); 
      overflow: hidden; animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    
    .cust-header { 
      padding: 15px 20px; background: linear-gradient(to right, #111, #0a0a0a);
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .cust-info h3 { margin: 0; font-size: 1.1rem; color: white; font-weight: 700; }
    .cust-info small { color: var(--secondary); font-family: monospace; letter-spacing: 1px; }
    .cust-meta { text-align: right; color: var(--text-muted); font-size: 0.8rem; line-height: 1.4; }

    /* Product Section */
    .product-box { padding: 20px; border-bottom: 1px solid var(--border); }
    .product-box:last-child { border-bottom: none; }

    .prod-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .prod-name { font-size: 1rem; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }

    .badge { padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-due { background: rgba(255, 23, 68, 0.1); color: var(--danger); border: 1px solid rgba(255, 23, 68, 0.3); }
    .badge-paid { background: rgba(0, 230, 118, 0.1); color: var(--primary); border: 1px solid rgba(0, 230, 118, 0.3); }

    .stats-grid { 
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;
    }
    .stat-box { 
      background: #000; padding: 10px; border-radius: 8px; border: 1px solid #222; 
      text-align: center;
    }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
    .stat-val { font-size: 1rem; font-weight: 700; color: #fff; margin-top: 2px; }

    /* Payment Inputs */
    .payment-area { 
      background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid var(--border);
    }
    .pay-label { font-size: 0.8rem; color: var(--secondary); margin-bottom: 8px; display: block; font-weight: 600; }
    
    .pay-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    
    .btn-pay { 
      width: 100%; padding: 14px; background: var(--primary); color: #000; 
      font-weight: 800; border: none; border-radius: 10px; cursor: pointer; 
      font-size: 1rem; transition: 0.2s;
    }
    .btn-pay:active { transform: scale(0.98); opacity: 0.9; }
    
    /* Mobile Responsive */
    @media (max-width: 600px) {
      .search-input-group { flex-direction: column; }
      .btn-search { width: 100%; padding: 14px; }
      .pay-inputs { grid-template-columns: 1fr 1fr; }
    }

    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header>
    <h1>Payment Entries</h1>
    <a href="index.html" class="nav-btn" style="text-decoration:none;">🏠</a>
  </header>

  <div class="main-container">
    
    <div class="search-box">
      <div class="search-input-group">
        <input id="searchInput" placeholder="Search by ID or Name..." onkeypress="handleEnter(event)">
        <button class="btn-search" onclick="searchCustomer()">FIND USER</button>
      </div>
    </div>

    <div id="resultArea" class="result-grid">
      <div style="text-align: center; color: #333; padding: 40px;">
        <div style="font-size: 4rem; opacity: 0.3;">💸</div>
        <p style="color: var(--text-muted);">Search to manage payments</p>
      </div>
    </div>

  </div>

  <script type="module">
    import { db } from "./config.js";
    import { 
      collection, query, where, getDocs, doc, runTransaction, increment, limit 
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // --- 1. SMART SEARCH LOGIC ---
    window.searchCustomer = async () => {
      const term = document.getElementById("searchInput").value.trim();
      const div = document.getElementById("resultArea");
      
      if (term.length < 1) return;

      div.innerHTML = `<p style="color:#666; text-align:center; padding:20px;">Searching database...</p>`;

      try {
        const colRef = collection(db, "customers");
        
        // Prepare terms
        const idTerm = term.toUpperCase(); 
        const nameTerm = term; 

        // RUN BOTH SEARCHES
        const [idSnap, nameSnap] = await Promise.all([
          getDocs(query(colRef, where("id", ">=", idTerm), where("id", "<=", idTerm + '\uf8ff'), limit(5))),
          getDocs(query(colRef, where("name", ">=", nameTerm), where("name", "<=", nameTerm + '\uf8ff'), limit(5)))
        ]);

        const results = new Map();
        idSnap.forEach(doc => results.set(doc.id, doc.data()));
        nameSnap.forEach(doc => results.set(doc.id, doc.data()));

        div.innerHTML = "";
        if (results.size === 0) {
          div.innerHTML = `
            <div style="text-align:center; padding:30px; border:1px dashed #333; border-radius:10px;">
              <p style="color:var(--danger); font-weight:bold;">No Customer Found</p>
              <p style="color:#666; font-size:0.9rem;">Tried searching ID "${idTerm}" and Name "${nameTerm}"</p>
            </div>`;
          return;
        }

        // Iterate results and fetch Pending Dues for accurate calculation
        for (const [docId, data] of results) {
          await renderCardWithPending(docId, data);
        }

      } catch (e) {
        console.error(e);
        div.innerHTML = `<p style="color:var(--danger); text-align:center;">Error: ${e.message}</p>`;
      }
    };

    window.handleEnter = (e) => {
      if(e.key === "Enter") searchCustomer();
    }

    // --- 2. RENDER CARD WITH SMART DUE CALCULATION ---
    async function renderCardWithPending(docId, c) {
      const div = document.getElementById("resultArea");
      const card = document.createElement("div");
      card.className = "cust-card";

      // 1. Fetch Agent Drafts/Pending Entries for this Customer
      let pendingCounts = {}; // Key: productName, Value: count
      let pendingAmounts = {}; // Key: productName, Value: amount
      try {
        const qPending = query(
          collection(db, "temp_entries"),
          where("customerId", "==", c.id),
          where("status", "in", ["draft", "pending"])
        );
        const pendingSnap = await getDocs(qPending);
        pendingSnap.forEach(doc => {
          const d = doc.data();
          const pName = d.productName;
          if(!pendingCounts[pName]) { pendingCounts[pName] = 0; pendingAmounts[pName] = 0; }
          pendingCounts[pName]++;
          pendingAmounts[pName] += (parseFloat(d.amount) || 0);
        });
      } catch(e) { console.log("Pending fetch error", e); }

      let productsHtml = "";
      
      c.products.forEach((p, idx) => {
        // Calculations
        let totalPaid = 0;
        if(p.payments) p.payments.forEach(pay => totalPaid += parseFloat(pay.amount));
        if(p.paid !== undefined) totalPaid = Math.max(totalPaid, p.paid);
        
        // Add pending amount to visual balance? 
        // No, keep Balance as "Real DB Balance", but note pending below.
        
        const balance = p.total - totalPaid;
        
        // --- SMART DUE LOGIC ---
        // 1. Max due in Main DB
        const lastConfirmedDue = (p.payments || []).length > 0 
          ? Math.max(...p.payments.map(x => x.dueNumber || 0)) 
          : 0;
        
        // 2. Count Agent Pending Entries
        const pendingCount = pendingCounts[p.name] || 0;
        
        // 3. Calculated Next Due
        const nextDue = lastConfirmedDue + pendingCount + 1;

        // Badge Logic
        const isPaid = balance <= 1; 
        const badgeHTML = isPaid 
          ? `<span class="badge badge-paid">COMPLETED</span>` 
          : `<span class="badge badge-due">OUTSTANDING</span>`;

        // Payment Form HTML (Hidden if paid)
        const paymentForm = isPaid ? '' : `
          <div class="payment-area">
            <label class="pay-label">ADD PAYMENT / SPLIT DUES</label>
            <div class="pay-inputs">
               <div style="display:flex; flex-direction:column;">
                  <span style="font-size:0.7rem; color:#666;">Total Amount</span>
                  <input type="number" id="amt_${docId}_${idx}" placeholder="Total ₹">
               </div>
               <div style="display:flex; flex-direction:column;">
                  <span style="font-size:0.7rem; color:#666;">Target Due #</span>
                  <input type="number" id="dueTarget_${docId}_${idx}" value="${nextDue}">
               </div>
            </div>
            <div class="pay-inputs" style="margin-top:5px;">
               <div style="display:flex; flex-direction:column;">
                 <span style="font-size:0.7rem; color:#666;">Date</span>
                 <input type="date" id="date_${docId}_${idx}" value="${new Date().toISOString().split('T')[0]}">
               </div>
            </div>
            
            ${pendingCount > 0 ? `<p style="font-size:0.75rem; color:#f59e0b; margin:5px 0;">⚠️ ${pendingCount} agent entries pending approval.</p>` : ''}
            
            <p style="font-size:0.7rem; color:#888; margin:5px 0 10px 0;">
              *If you increase Target Due #, amount will be split.
            </p>
            <button class="btn-pay" onclick="processPayment('${docId}', ${idx})">CONFIRM & SPLIT</button>
          </div>
        `;

        productsHtml += `
          <div class="product-box">
            <div class="prod-title-row">
              <span class="prod-name">📦 ${p.name}</span>
              ${badgeHTML}
            </div>
            
            <div class="stats-grid">
              <div class="stat-box">
                <div class="stat-label">Total Cost</div>
                <div class="stat-val">₹${p.total.toLocaleString()}</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">Balance</div>
                <div class="stat-val" style="color:${balance > 0 ? 'var(--danger)' : 'var(--primary)'}">
                  ₹${balance.toLocaleString()}
                </div>
              </div>
            </div>
            
            <div style="margin-bottom:10px; font-size:0.8rem; color:#666; text-align:center;">
               Last Confirmed Paid: #${lastConfirmedDue} <br>
               (Next System Due: #${nextDue})
            </div>

            ${paymentForm}
          </div>
        `;
      });

      card.innerHTML = `
        <div class="cust-header">
          <div class="cust-info">
            <h3>${c.name}</h3>
            <small>${c.id}</small>
          </div>
          <div class="cust-meta">
            ${c.place || 'No Location'}<br>
            ${c.phone || 'No Phone'}
          </div>
        </div>
        <div>${productsHtml}</div>
      `;
      div.appendChild(card);
    }

    // --- 3. PAYMENT TRANSACTION LOGIC (WITH SPLIT) ---
    window.processPayment = async (custId, prodIdx) => {
      const amtInput = document.getElementById(`amt_${custId}_${prodIdx}`);
      const dueInput = document.getElementById(`dueTarget_${custId}_${prodIdx}`);
      const dateInput = document.getElementById(`date_${custId}_${prodIdx}`);
      
      const totalAmount = parseFloat(amtInput.value);
      const targetDue = parseInt(dueInput.value);
      const date = dateInput.value;

      if (!totalAmount || totalAmount <= 0) return alert("❌ Enter a valid positive amount");
      if (!targetDue || targetDue < 1) return alert("❌ Invalid Due Number");

      const btn = event.target;
      const originalText = btn.innerText;
      btn.innerText = "CALCULATING...";
      btn.disabled = true;
      btn.style.opacity = "0.7";

      try {
        await runTransaction(db, async (transaction) => {
          const custRef = doc(db, "customers", custId);
          const custDoc = await transaction.get(custRef);
          if (!custDoc.exists()) throw "Customer does not exist!";

          const data = custDoc.data();
          const product = data.products[prodIdx];

          // 1. Determine Start Due (Based only on Confirmed payments in DB, ignoring drafts for write safety)
          let maxDue = 0;
          if (product.payments && product.payments.length > 0) {
            maxDue = Math.max(...product.payments.map(p => p.dueNumber || 0));
          }
          
          // NOTE: If user sets Target Due #12, and maxDue is #10, we fill #11 and #12.
          // Even if there is a 'draft' #11, the Admin is overriding/confirming it here.
          
          const startDue = maxDue + 1;

          if (targetDue < startDue) {
            throw `Target Due (${targetDue}) cannot be less than next confirmed due (${startDue}).`;
          }

          // 2. Calculate Split
          const numberOfDues = (targetDue - startDue) + 1;
          const amountPerDue = totalAmount / numberOfDues;
          const roundedAmount = Math.floor(amountPerDue * 100) / 100; 

          // 3. Create Entries
          if(!product.payments) product.payments = [];
          
          for(let i = 0; i < numberOfDues; i++) {
             const currentDueNum = startDue + i;
             let finalAmt = roundedAmount;
             if(i === numberOfDues - 1) {
                finalAmt = totalAmount - (roundedAmount * (numberOfDues - 1));
             }

             product.payments.push({
               date: date,
               amount: parseFloat(finalAmt.toFixed(2)),
               dueNumber: currentDueNum,
               type: numberOfDues > 1 ? `Split Admin (${i+1}/${numberOfDues})` : "Manual Entry"
             });
          }

          // 4. Update Totals
          product.paid = (product.paid || 0) + totalAmount; 

          // 5. Commit
          transaction.update(custRef, { products: data.products });
        });

        alert(`✅ Success! Split ${totalAmount} into entries up to #${targetDue}.`);
        searchCustomer(); // Refresh UI

      } catch (e) {
        console.error(e);
        alert("Transaction Failed: " + e.message);
        btn.innerText = originalText;
        btn.disabled = false;
        btn.style.opacity = "1";
      }
    };
  </script>
</body>
</html>
