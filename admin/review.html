<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Review - MeenaGroups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">

  <style>
    /* --- 1. PROFESSIONAL HIGH CONTRAST THEME --- */
    :root { 
      --bg: #000000; 
      --surface: #0a0a0a;
      --card: #141414; 
      --input-bg: #1a1a1a;
      --primary: #00e676; /* Neon Green */
      --secondary: #2979ff; /* Bright Blue */
      --warning: #ffab00;
      --danger: #ff1744; 
      --text: #ffffff; 
      --text-muted: #888888;
      --border: #333333; 
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
      margin: 0; padding: 0; 
      height: 100vh; 
      display: flex; flex-direction: column;
      overflow: hidden; /* Fixes background bounce/scroll issues */
    }

    /* --- 2. HEADER --- */
    header {
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 15px 20px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 50; flex-shrink: 0;
    }
    header h1 { margin: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.5px; }
    .nav-btn { background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; text-decoration: none; }

    /* --- 3. DASHBOARD SUMMARY --- */
    .summary-bar {
      background: var(--card);
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0;
    }
    
    .stats-box { display: flex; flex-direction: column; }
    .stats-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .stats-value { font-size: 1.5rem; font-weight: 700; color: var(--primary); }

    .btn-approve-all {
      background: var(--text); color: #000; border: none;
      padding: 10px 20px; border-radius: 50px;
      font-weight: 700; font-size: 0.85rem; cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,255,255,0.1);
      transition: 0.2s;
    }
    .btn-approve-all:active { transform: scale(0.95); }
    .btn-approve-all:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

    /* --- 4. REVIEW LIST --- */
    .review-container {
      flex: 1;
      overflow-y: auto; /* Fixed scrolling */
      padding: 20px;
      display: flex; flex-direction: column; gap: 15px;
      padding-bottom: 80px; /* Space for FAB or footer clearance */
    }

    /* Entry Card */
    .entry-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden;
      animation: slideIn 0.3s ease-out;
      position: relative;
    }
    /* Vertical status bar */
    .entry-card::before { content:''; position: absolute; left:0; top:0; bottom:0; width:4px; background: var(--secondary); }

    .card-top {
      padding: 15px; border-bottom: 1px solid #222;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .user-info h3 { margin: 0; font-size: 1.1rem; color: white; font-weight: 600; }
    .user-info p { margin: 4px 0 0; color: var(--text-muted); font-size: 0.85rem; font-family: monospace; }
    
    .date-badge { 
      background: #111; padding: 4px 8px; border-radius: 4px; 
      font-size: 0.75rem; color: var(--text-muted); border: 1px solid #333;
    }

    .card-mid {
      padding: 15px;
      display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
    }
    
    .detail-row { display: flex; flex-direction: column; gap: 5px; }
    .product-tag { color: var(--secondary); font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .due-tag { 
      display: inline-block; background: rgba(255, 171, 0, 0.15); color: var(--warning); 
      font-size: 0.8rem; padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(255, 171, 0, 0.3); width: fit-content;
    }

    .amount-box { text-align: right; }
    .amount-lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
    .amount-val { font-size: 1.6rem; font-weight: 700; color: var(--primary); }

    .card-actions {
      display: grid; grid-template-columns: 1fr 1fr 2fr;
      border-top: 1px solid #222;
    }
    
    .action-btn {
      background: transparent; border: none; padding: 15px;
      font-size: 0.9rem; cursor: pointer; transition: 0.2s;
      border-right: 1px solid #222; color: var(--text-muted);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .action-btn:last-child { border-right: none; font-weight: 700; }
    
    .btn-edit:hover { background: #222; color: var(--warning); }
    .btn-reject:hover { background: rgba(255, 23, 68, 0.1); color: var(--danger); }
    .btn-approve { color: var(--primary); background: rgba(0, 230, 118, 0.05); }
    .btn-approve:hover { background: var(--primary); color: #000; }

    /* --- 5. EDIT MODAL --- */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    
    .modal-box {
      background: var(--card); width: 90%; max-width: 350px;
      border-radius: 16px; border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .modal-header {
      padding: 15px 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h3 { margin: 0; font-size: 1.1rem; }
    .close-modal { background: none; border: none; color: #666; font-size: 1.5rem; cursor: pointer; }

    .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    
    .input-group label { display: block; color: var(--text-muted); font-size: 0.8rem; margin-bottom: 6px; }
    .input-group input { 
      width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); 
      color: white; border-radius: 8px; font-size: 1rem;
    }

    .modal-footer { padding: 0 20px 20px 20px; }
    .btn-save {
      width: 100%; padding: 14px; background: var(--secondary); color: white;
      border: none; border-radius: 8px; font-weight: 700; cursor: pointer;
    }

    /* Animations & Responsive */
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

    @media (max-width: 600px) {
      .summary-bar { padding: 12px 15px; }
      .stats-value { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Review Entries</h1>
    <a href="index.html" class="nav-btn">🏠</a>
  </header>

  <div class="summary-bar">
    <div class="stats-box">
      <span class="stats-label">Pending Total</span>
      <span class="stats-value" id="totalPendingAmt">₹0</span>
    </div>
    <button class="btn-approve-all" onclick="approveAll()">✓ Approve All</button>
  </div>

  <div id="reviewList" class="review-container">
    <div style="text-align:center; padding: 60px; color: var(--text-muted);">
      <p>Loading Pending Entries...</p>
    </div>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Edit Entry Details</h3>
        <button class="close-modal" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editDocId">
        
        <div class="input-group">
          <label>Collected Amount (₹)</label>
          <input type="number" id="editAmount">
        </div>
        
        <div class="input-group">
          <label>Assign Due Number</label>
          <input type="number" id="editDueNumber" placeholder="Auto if empty">
        </div>

        <div class="input-group">
          <label>Collection Date</label>
          <input type="date" id="editDate">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-save" onclick="saveEdit()">SAVE CHANGES</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "./config.js";
    import { 
      collection, query, where, getDocs, doc, runTransaction, increment, deleteDoc, updateDoc 
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    let pendingEntries = [];

    // --- 1. LOAD DATA ---
    async function loadPending() {
      const listDiv = document.getElementById("reviewList");
      const totalDisplay = document.getElementById("totalPendingAmt");
      const approveAllBtn = document.querySelector(".btn-approve-all");

      try {
        const q = query(collection(db, "temp_entries"), where("status", "==", "pending"));
        const snapshot = await getDocs(q);
        
        pendingEntries = [];
        let totalAmt = 0;

        snapshot.forEach(docSnap => {
          const d = docSnap.data();
          d.docId = docSnap.id;
          d.jsDate = d.timestamp ? (d.timestamp.toDate ? d.timestamp.toDate() : new Date(d.timestamp)) : new Date();
          pendingEntries.push(d);
          totalAmt += parseFloat(d.amount || 0);
        });

        // Sort Newest First
        pendingEntries.sort((a, b) => b.jsDate - a.jsDate);

        totalDisplay.innerText = "₹" + totalAmt.toLocaleString();
        listDiv.innerHTML = "";

        if (pendingEntries.length === 0) {
          listDiv.innerHTML = `
            <div style="text-align:center; padding:60px; color:var(--text-muted); opacity:0.6;">
              <h2 style="margin:0; font-size:3rem;">🎉</h2>
              <p>All caught up! No pending reviews.</p>
            </div>`;
          approveAllBtn.disabled = true;
          return;
        }

        approveAllBtn.disabled = false;

        pendingEntries.forEach(d => {
          // Display Logic
          const dueDisplay = (d.dueNumber && d.dueNumber > 0) ? `Due #${d.dueNumber}` : 'Auto-Assign Due';

          const card = document.createElement("div");
          card.className = "entry-card";
          card.id = `card-${d.docId}`;
          
          card.innerHTML = `
            <div class="card-top">
              <div class="user-info">
                <h3>${d.customerName}</h3>
                <p>ID: ${d.customerId}</p>
              </div>
              <span class="date-badge">${d.date}</span>
            </div>

            <div class="card-mid">
              <div class="detail-row">
                <span class="product-tag">📦 ${d.productName}</span>
                <span class="due-tag">${dueDisplay}</span>
              </div>
              <div class="amount-box">
                <div class="amount-lbl">Collected</div>
                <div class="amount-val">₹${d.amount}</div>
              </div>
            </div>

            <div class="card-actions">
              <button class="action-btn btn-edit" onclick="openEdit('${d.docId}')">
                <span>✎</span> Edit
              </button>
              <button class="action-btn btn-reject" onclick="rejectEntry('${d.docId}')">
                <span>✕</span> Delete
              </button>
              <button class="action-btn btn-approve" onclick="approveEntry('${d.docId}')">
                <span>✓</span> APPROVE
              </button>
            </div>
          `;
          listDiv.appendChild(card);
        });

      } catch (e) {
        console.error(e);
        listDiv.innerHTML = `<p style="color:var(--danger); text-align:center;">Error: ${e.message}</p>`;
      }
    }

    // --- 2. EDIT MODAL LOGIC ---
    window.openEdit = (docId) => {
      const entry = pendingEntries.find(e => e.docId === docId);
      if (!entry) return;

      document.getElementById("editDocId").value = docId;
      document.getElementById("editAmount").value = entry.amount;
      document.getElementById("editDate").value = entry.date;
      document.getElementById("editDueNumber").value = entry.dueNumber || ""; 

      document.getElementById("editModal").style.display = "flex";
    };

    window.closeModal = () => {
      document.getElementById("editModal").style.display = "none";
    };

    window.saveEdit = async () => {
      const docId = document.getElementById("editDocId").value;
      const newAmt = parseFloat(document.getElementById("editAmount").value);
      const newDate = document.getElementById("editDate").value;
      const newDueInput = document.getElementById("editDueNumber").value;
      const newDue = newDueInput === "" ? 0 : parseInt(newDueInput);

      if(!newAmt || !newDate) return alert("Invalid inputs");

      const btn = document.querySelector(".btn-save");
      btn.innerText = "SAVING...";
      btn.disabled = true;

      try {
        const ref = doc(db, "temp_entries", docId);
        
        await updateDoc(ref, {
          amount: newAmt,
          date: newDate,
          dueNumber: newDue
        });

        closeModal();
        loadPending(); // Refresh list
        btn.innerText = "SAVE CHANGES";
        btn.disabled = false;

      } catch (e) {
        alert("Error updating: " + e.message);
        btn.innerText = "SAVE CHANGES";
        btn.disabled = false;
      }
    };

    // --- 3. APPROVE LOGIC ---
    window.approveEntry = async (docId) => {
      const entry = pendingEntries.find(e => e.docId === docId);
      if (!entry) return;

      const card = document.getElementById(`card-${docId}`);
      card.style.opacity = "0.4"; 
      card.style.pointerEvents = "none";

      try {
        await runTransaction(db, async (transaction) => {
          const custRef = doc(db, "customers", entry.customerId);
          const statsRef = doc(db, "metadata", "stats");
          const tempRef = doc(db, "temp_entries", docId);

          const custDoc = await transaction.get(custRef);
          if (!custDoc.exists()) throw `Customer ${entry.customerId} not found!`;

          const data = custDoc.data();
          
          let pIndex = entry.productIndex;
          if (!data.products[pIndex] || data.products[pIndex].name !== entry.productName) {
            pIndex = data.products.findIndex(p => p.name === entry.productName);
          }
          if (pIndex === -1) throw "Product mismatch.";

          const product = data.products[pIndex];

          let finalDue = entry.dueNumber; 
          if (!finalDue || finalDue <= 0) {
             const max = (product.payments || []).length > 0 
               ? Math.max(...product.payments.map(p => p.dueNumber || 0)) 
               : 0;
             finalDue = max + 1;
          }

          const newPayment = {
            date: entry.date,
            amount: entry.amount,
            dueNumber: parseInt(finalDue), 
            type: "Agent Collection",
            approvedAt: new Date().toISOString()
          };

          if (!product.payments) product.payments = [];
          product.payments.push(newPayment);
          product.paid += entry.amount;

          transaction.update(custRef, { products: data.products });
          transaction.update(statsRef, {
            totalPaid: increment(entry.amount),
            totalBalance: increment(-entry.amount)
          });
          transaction.delete(tempRef);
        });

        card.style.transform = "translateX(100px)";
        setTimeout(() => { 
          card.remove(); 
          checkEmpty(); 
        }, 300);

      } catch (e) {
        alert("Approval Failed: " + e);
        card.style.opacity = "1"; card.style.pointerEvents = "auto";
      }
    };

    // --- 4. REJECT / DELETE LOGIC ---
    window.rejectEntry = async (docId) => {
      if(!confirm("Permanently delete this pending entry?")) return;
      try {
        await deleteDoc(doc(db, "temp_entries", docId));
        const card = document.getElementById(`card-${docId}`);
        card.style.transform = "translateX(-100px)";
        card.style.opacity = "0";
        setTimeout(() => { 
           card.remove(); 
           checkEmpty();
        }, 300);
      } catch (e) {
        alert("Error: " + e.message);
      }
    };

    // --- 5. APPROVE ALL ---
    window.approveAll = async () => {
      if (pendingEntries.length === 0) return;
      if (!confirm(`Approve ALL ${pendingEntries.length} pending entries?`)) return;

      const btn = document.querySelector(".btn-approve-all");
      btn.innerText = "Processing...";
      btn.disabled = true;

      for (const entry of pendingEntries) {
        if(document.getElementById(`card-${entry.docId}`)) {
          await window.approveEntry(entry.docId);
        }
      }
      
      btn.innerText = "Done";
      setTimeout(() => loadPending(), 1000);
    };

    function checkEmpty() {
      const remaining = document.querySelectorAll(".entry-card");
      if(remaining.length === 0) loadPending();
    }

    // Init
    loadPending();
    
    // Exports
    window.openEdit = openEdit;
    window.closeModal = closeModal;
    window.saveEdit = saveEdit;
    window.rejectEntry = rejectEntry;
    window.approveEntry = approveEntry;
    window.approveAll = approveAll;
  </script>
</body>
</html>
