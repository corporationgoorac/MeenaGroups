<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Entries - Meena Groups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020617">
  <meta name="robots" content="noindex, nofollow">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

    :root { 
      --bg: #020617; 
      --surface: #0f172a;
      --card: #1e293b; 
      --primary: #10b981; 
      --primary-muted: rgba(16, 185, 129, 0.15);
      --secondary: #38bdf8; 
      --danger: #ef4444; 
      --warning: #f59e0b;
      --text: #f8fafc; 
      --text-muted: #94a3b8;
      --border: #334155; 
      --input-bg: #020617;
      --header-bg: rgba(15, 23, 42, 0.85);
    }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 0; 
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* --- TOP NAVIGATION BAR --- */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 15px var(--primary);
    }

    .brand h2 {
      margin: 0;
      font-size: 1.1rem; /* Sleek single line size */
      font-weight: 800;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 25px 20px 80px; }

    /* --- HEADER CONTROLS (Stats & Approve) --- */
    .header-controls { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 30px; 
      flex-wrap: wrap; 
      gap: 15px; 
    }

    .stats-wrapper {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .stats-card {
      background: var(--surface); 
      border: 1px solid var(--border); 
      padding: 15px 20px; 
      border-radius: 16px; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 130px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .stats-card span { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 4px; }
    .stats-card strong { font-size: 1.6rem; color: var(--text); font-weight: 800; letter-spacing: -0.5px; }
    .stats-card .val-cash { color: var(--primary); }
    .stats-card .val-online { color: var(--secondary); }

    .btn-approve-all {
      background: var(--primary); 
      color: #022c22; 
      border: none; 
      height: 100%;
      min-height: 70px; /* Matched to stat card height */
      padding: 0 30px;
      border-radius: 16px; 
      font-weight: 800; 
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
    }
    .btn-approve-all:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 15px 35px -5px rgba(16, 185, 129, 0.5); }
    .btn-approve-all:active { transform: translateY(0); }
    .btn-approve-all:disabled { opacity: 0.2; cursor: not-allowed; transform: none; box-shadow: none; }

    /* --- REVIEW LIST --- */
    .review-list { display: flex; flex-direction: column; gap: 18px; }

    .entry-item {
      background: var(--surface); 
      border: 1px solid var(--border); 
      border-radius: 20px;
      padding: 22px; 
      display: flex; 
      flex-direction: column;
      gap: 20px; 
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .entry-item:hover { 
      border-color: #475569; 
      background: var(--card);
      transform: scale(1.01);
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.4);
    }

    /* Professional Flex Layout for Cards */
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .col-info h4 { margin: 0; font-size: 1.3rem; color: #fff; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .col-info p { margin: 8px 0 0; color: var(--secondary); font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; font-weight: 600; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); padding: 4px 10px; border-radius: 6px; width: fit-content; }
    
    .col-amount { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
    .amount-display { font-size: 1.8rem; font-weight: 900; color: #fff; letter-spacing: -1px; display: flex; align-items: center; gap: 8px; }
    
    .card-mid { display: flex; justify-content: space-between; align-items: center; }
    .col-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    
    .tag { 
      background: #1e293b; 
      color: #cbd5e1; 
      padding: 6px 12px; 
      border-radius: 8px; 
      font-size: 0.8rem; 
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
    }
    
    .due-tag { 
      color: #fff; 
      font-weight: 700; 
      font-size: 0.8rem; 
      background: rgba(16, 185, 129, 0.2); 
      padding: 6px 12px; 
      border-radius: 8px; 
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .card-bottom { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-top: 1px solid rgba(255,255,255,0.05); 
      padding-top: 15px; 
    }
    
    .date-display { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }

    /* Actions */
    .col-actions { display: flex; gap: 12px; }
    .btn-icon {
      width: 44px; height: 44px; border-radius: 12px; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: 0.2s;
    }
    .btn-edit { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.2); }
    .btn-edit:hover { background: var(--warning); color: #000; box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }
    
    .btn-accept { background: var(--primary-muted); color: var(--primary); border: 1px solid rgba(16, 185, 129, 0.2); }
    .btn-accept:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
    
    .btn-reject { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
    .btn-reject:hover { background: var(--danger); color: white; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

    /* --- EDIT MODAL --- */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center; z-index: 1000;
      animation: modalFade 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: var(--surface); padding: 32px; border-radius: 24px; width: 90%; max-width: 420px;
      border: 1px solid var(--border); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      transform: translateY(0); transition: 0.3s;
    }
    .modal h3 { margin-top: 0; color: #fff; font-size: 1.5rem; margin-bottom: 24px; font-weight: 800; letter-spacing: -0.5px; }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; color: var(--text-muted); font-size: 0.8rem; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .form-group input { 
      width: 100%; padding: 16px; background: var(--input-bg); border: 1px solid var(--border); 
      color: white; border-radius: 14px; box-sizing: border-box; font-size: 1rem; font-weight: 600; transition: 0.2s;
      font-family: inherit;
    }
    .form-group input:focus { outline: none; border-color: var(--secondary); box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1); }
    
    .modal-actions { display: flex; gap: 12px; margin-top: 32px; }
    .btn-modal { flex: 1; padding: 16px; border-radius: 14px; border: none; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
    .btn-cancel { background: #1e293b; color: white; border: 1px solid var(--border); }
    .btn-cancel:hover { background: #334155; }
    .btn-save { background: var(--secondary); color: #020617; }
    .btn-save:hover { transform: scale(1.02); filter: brightness(1.1); box-shadow: 0 10px 20px rgba(56, 189, 248, 0.3); }

    /* Loading Spinner */
    .loading-spinner {
      width: 40px; height: 40px; border: 3px solid rgba(16, 185, 129, 0.1); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* NEW STYLES: Non-DB Card Styling */
    .entry-item.non-db { border: 2px dashed var(--warning); }
    .entry-item.non-db:hover { border-color: var(--warning); box-shadow: 0 10px 25px rgba(245, 158, 11, 0.15); }
    .non-db-badge { background: var(--warning); color: #000; font-size: 0.6rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-left: 8px; vertical-align: middle;}

    /* NEW STYLES: Cash/Online Badges */
    .mode-badge { font-size: 0.7rem; font-weight: 800; padding: 4px 8px; border-radius: 6px; vertical-align: middle;}
    .mode-badge.cash { color: var(--primary); background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); }
    .mode-badge.online { color: var(--secondary); background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); }

    /* NEW STYLES: Print Menu & Printing */
    .print-menu {
      position: absolute; top: 50px; right: 0; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; width: 220px; display: none; flex-direction: column; z-index: 210; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .print-menu.show { display: flex; }
    .print-menu button {
      background: transparent; border: none; color: white; padding: 16px 20px; text-align: left;
      font-size: 0.9rem; font-weight: 600; cursor: pointer; border-bottom: 1px solid var(--border); transition: 0.2s;
    }
    .print-menu button:hover { background: var(--primary); color: #000; }
    
    /* --- NEW STYLES ADDED FOR AGENT BADGE & FILTER MODAL --- */
    .agent-tiny-badge {
      font-size: 0.85rem; background: rgba(255,255,255,0.05); color: #cbd5e1;
      padding: 6px 12px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px;
      font-weight: 700; letter-spacing: 0.5px; border: 1px solid rgba(255,255,255,0.1);
    }

    .bottom-sheet-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(5px);
      display: none; align-items: flex-end; justify-content: center; z-index: 2000;
      opacity: 0; transition: opacity 0.3s;
    }
    .bottom-sheet-overlay.open { opacity: 1; }
    .bottom-sheet {
      background: var(--surface); width: 100%; max-width: 600px;
      border-radius: 28px 28px 0 0; padding: 30px 24px; border: 1px solid var(--border);
      border-bottom: none; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 80vh; overflow-y: auto; box-shadow: 0 -10px 50px rgba(0,0,0,0.8);
    }
    .bottom-sheet-overlay.open .bottom-sheet { transform: translateY(0); }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .sheet-title { font-size: 1.4rem; font-weight: 800; color: #fff; margin: 0; }
    .agent-filter-btn {
      width: 100%; text-align: left; padding: 18px 20px; background: var(--card);
      border: 1px solid var(--border); border-radius: 16px; color: #fff;
      font-size: 1rem; font-weight: 700; margin-bottom: 12px; cursor: pointer; transition: 0.2s;
      display: flex; justify-content: space-between; align-items: center;
    }
    .agent-filter-btn:hover, .agent-filter-btn.selected {
      border-color: var(--secondary); background: rgba(56, 189, 248, 0.1); box-shadow: 0 5px 15px rgba(56, 189, 248, 0.1);
    }
    .agent-badge-count { background: var(--primary); color: #000; padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; font-weight: 800; }

    /* NEW STYLES: Fixed Print showing blank papers by explicitly hiding everything else */
    @media print {
      body > :not(#printArea) { display: none !important; }
      #printArea { 
        display: block !important; 
        position: relative !important; 
        width: 100% !important; 
        background: #fff !important; 
        color: #000 !important; 
      }
      body, html { 
        background: #fff !important; 
        height: auto !important; 
        overflow: visible !important; 
      }
    }

    /* Mobile Responsive Updates */
    @media (max-width: 850px) {
      .container { padding: 25px 15px 100px; }
      .header-controls { flex-direction: column; align-items: stretch; gap: 20px; }
      .stats-wrapper { flex-wrap: nowrap; padding-bottom: 5px; }
      .stats-card { flex: 1; min-width: 110px; padding: 12px 15px; }
      .stats-card strong { font-size: 1.3rem; }
      .btn-approve-all { height: 60px; justify-content: center; width: 100%; }
      .card-bottom { flex-direction: column-reverse; align-items: flex-start; gap: 15px; }
      .col-actions { width: 100%; justify-content: space-between; }
      .btn-icon { flex: 1; height: 50px; }
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <div class="nav-container">
      <div class="brand">
        <div class="brand-dot"></div>
        <h2>MEENA GROUPS</h2>
      </div>
      <div style="display:flex; align-items:center; gap:15px;">
        <div id="status-tag" style="font-size: 0.7rem; font-weight: 800; background: var(--primary-muted); color: var(--primary); padding: 6px 12px; border-radius: 20px; letter-spacing: 0.5px;">SYSTEM ONLINE</div>
        
        <div style="position:relative; display:flex; gap:10px;">
          <button class="icon-btn" onclick="openAgentFilter()" title="Filter by Agent" style="background:transparent; border:1px solid var(--border); color:var(--text-muted); width:38px; height:38px; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:0.2s;">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
          </button>

          <button class="icon-btn" onclick="togglePrintMenu()" style="background:transparent; border:1px solid var(--border); color:var(--text-muted); width:38px; height:38px; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:0.2s;">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
          </button>
          <div class="print-menu" id="printMenu">
            <button onclick="printDB()">Print All Entries (DB)</button>
            <button onclick="printNonDB()">Print Non-DB Entries</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="header-controls">
      <div class="stats-wrapper">
        <div class="stats-card">
          <span>Pending Cash</span>
          <strong id="totalCashAmt" class="val-cash">₹0</strong>
        </div>
        <div class="stats-card">
          <span>Pending Online</span>
          <strong id="totalOnlineAmt" class="val-online">₹0</strong>
        </div>
        <div class="stats-card" style="background: rgba(255,255,255,0.02); border-color: rgba(255,255,255,0.1);">
          <span>Total Ready</span>
          <strong id="totalPendingAmt">₹0</strong>
        </div>
      </div>
      
      <button class="btn-approve-all" onclick="approveAll()">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
        Approve All
      </button>
    </div>

    <div id="reviewList" class="review-list">
      <div style="text-align:center; padding: 100px 20px; color:var(--text-muted);">
        <div class="loading-spinner"></div>
        <p style="font-weight: 600; letter-spacing: 0.5px;">Fetching pending entries...</p>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3>Edit Collection</h3>
      <input type="hidden" id="editDocId">
      
      <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" id="editAmount" placeholder="0.00">
      </div>
      
      <div class="form-group">
        <label>Due Number</label>
        <input type="number" id="editDueNumber" placeholder="Auto">
      </div>

      <div class="form-group">
        <label>Collection Date</label>
        <input type="date" id="editDate">
      </div>

      <div class="modal-actions">
        <button class="btn-modal btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-modal btn-save" onclick="saveEdit()">Update Entry</button>
      </div>
    </div>
  </div>

  <div class="bottom-sheet-overlay" id="agentFilterSheet">
    <div class="bottom-sheet">
      <div class="sheet-header">
        <h3 class="sheet-title">Filter by Agent</h3>
        <button onclick="closeAgentFilter()" style="background: transparent; border: none; color: var(--text-muted); font-size: 1.8rem; cursor: pointer; padding: 0;">✕</button>
      </div>
      <div id="agentFilterList">
        </div>
    </div>
  </div>

  <div class="modal-overlay" id="customDialogOverlay">
    <div class="modal" style="text-align: center; padding: 40px 30px;">
      <h3 id="customDialogTitle" style="margin-bottom: 10px;">Alert</h3>
      <p id="customDialogMessage" style="color: var(--text-muted); margin-bottom: 30px; font-size: 1rem; line-height: 1.5;"></p>
      <div class="modal-actions" style="margin-top: 0;">
        <button class="btn-modal btn-cancel" id="customDialogCancel" onclick="closeCustomDialog()" style="display: none;">Cancel</button>
        <button class="btn-modal btn-save" id="customDialogConfirm">OK</button>
      </div>
    </div>
  </div>

  <div id="printArea" style="display: none;"></div>

  <script type="module">
    import { db } from "./config.js";
    import { 
      collection, query, where, getDocs, doc, runTransaction, increment, deleteDoc, updateDoc, writeBatch, getDoc 
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    let pendingEntries = [];
    let currentAgentFilter = 'ALL'; 
    let activeConfirmCallback = null;

    // --- CUSTOM DIALOG LOGIC & MOBILE BACK BUTTON SUPPORT ---
    window.openCustomDialog = (title, message, isConfirm, callback = null) => {
      if (navigator.vibrate) navigator.vibrate(40); // Light haptic feedback
      
      document.getElementById('customDialogTitle').innerText = title;
      document.getElementById('customDialogMessage').innerText = message;
      
      const cancelBtn = document.getElementById('customDialogCancel');
      const confirmBtn = document.getElementById('customDialogConfirm');
      
      if (isConfirm) {
        cancelBtn.style.display = 'block';
        confirmBtn.innerText = 'Yes, Proceed';
        
        if(title.includes('Reject') || title.includes('Clear') || title.includes('Delete')) {
           confirmBtn.style.background = 'var(--danger)';
           confirmBtn.style.color = '#fff';
        } else {
           confirmBtn.style.background = 'var(--primary)';
           confirmBtn.style.color = '#022c22';
        }
      } else {
        cancelBtn.style.display = 'none';
        confirmBtn.innerText = 'OK';
        confirmBtn.style.background = 'var(--secondary)';
        confirmBtn.style.color = '#020617';
      }
      
      activeConfirmCallback = callback;
      
      const overlay = document.getElementById('customDialogOverlay');
      overlay.style.display = 'flex';
      setTimeout(() => overlay.style.opacity = '1', 10);
      
      history.pushState({ modalOpen: 'customDialog' }, "");
    };

    window.closeCustomDialog = () => {
      const overlay = document.getElementById('customDialogOverlay');
      overlay.style.opacity = '0';
      setTimeout(() => overlay.style.display = 'none', 300);
      
      if (history.state && history.state.modalOpen === 'customDialog') {
        history.back();
      }
    };

    document.getElementById('customDialogConfirm').onclick = () => {
      closeCustomDialog();
      if (activeConfirmCallback) activeConfirmCallback();
    };

    window.showCustomAlert = (title, message) => openCustomDialog(title, message, false);
    window.showCustomConfirm = (title, message, callback) => openCustomDialog(title, message, true, callback);

    // History API Listener for mobile back button for all modals
    window.addEventListener('popstate', (e) => {
      const editModal = document.getElementById("editModal");
      if (editModal.style.display === "flex") {
        editModal.style.opacity = "0";
        setTimeout(() => editModal.style.display = "none", 300);
      }
      
      const customDialog = document.getElementById("customDialogOverlay");
      if (customDialog.style.display === "flex") {
        customDialog.style.opacity = "0";
        setTimeout(() => customDialog.style.display = "none", 300);
      }

    // --- 1. LOAD DATA ---
    async function loadPending() {
      const listDiv = document.getElementById("reviewList");
      const approveAllBtn = document.querySelector(".btn-approve-all");

      try {
        const q = query(collection(db, "temp_entries"), where("status", "==", "pending"));
        const snapshot = await getDocs(q);
        
        pendingEntries = [];

        snapshot.forEach(docSnap => {
          const d = docSnap.data();
          d.docId = docSnap.id;
          d.jsDate = d.timestamp ? (d.timestamp.toDate ? d.timestamp.toDate() : new Date(d.timestamp)) : new Date();
          pendingEntries.push(d);
        });

        // Sort Newest First
        pendingEntries.sort((a, b) => b.jsDate - a.jsDate);

              <div class="card-mid">

              </div>

              <div class="card-bottom">

                <div class="col-actions">

                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    ${d.date}
                  </div>
                  <button class="btn-icon btn-edit" onclick="openEdit('${d.docId}')" title="Edit">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                  </button>
                  <button class="btn-icon btn-reject" onclick="rejectEntry('${d.docId}')" title="Reject">

                  <button class="btn-icon btn-accept" onclick="approveEntry('${d.docId}')" title="Approve">

      } catch (e) {

    // --- NEW: RENDER AGENT FILTER LIST MODAL ---
    function renderAgentFilterList() {
      const list = document.getElementById("agentFilterList");
      const agentCounts = { 'ALL': pendingEntries.length };
      
      pendingEntries.forEach(e => {
        const name = e.staffName || 'Unknown Agent';
        agentCounts[name] = (agentCounts[name] || 0) + 1;
      });

      let html = `<button class="agent-filter-btn ${currentAgentFilter==='ALL'?'selected':''}" onclick="applyAgentFilter('ALL')"><span>All Agents</span> <span class="agent-badge-count">${agentCounts['ALL']}</span></button>`;
      
      Object.keys(agentCounts).forEach(name => {
        if(name !== 'ALL') {
          html += `<button class="agent-filter-btn ${currentAgentFilter===name?'selected':''}" onclick="applyAgentFilter('${name}')"><span>${name}</span> <span class="agent-badge-count">${agentCounts[name]}</span></button>`;
        }
      });
      list.innerHTML = html;
    }

    // --- NEW: APPLY FILTER (INSTANT DOM MANIPULATION) ---
    window.applyAgentFilter = (name) => {
      currentAgentFilter = name;
      closeAgentFilter();
      
      let fTotal = 0, fCash = 0, fOnline = 0, visibleCount = 0;
      
      pendingEntries.forEach(d => {
        const card = document.getElementById(`card-${d.docId}`);
        if (!card) return; 
        const nameMatch = (d.staffName || 'Unknown Agent') === name;
        
        if (name === 'ALL' || nameMatch) {
          card.style.display = "flex"; // Restoring flex layout
          visibleCount++;
          
          let amount = parseFloat(d.amount || 0);
          fTotal += amount;
          let isOnline = (d.paymentMode || d.type || '').toLowerCase().includes('online') || (d.paymentMode || '').toLowerCase().includes('upi');
          if (isOnline) fOnline += amount; else fCash += amount;
        } else {
          card.style.display = "none"; // Hide card
        }
      });
      
      // Update DOM Totals
      document.getElementById("totalPendingAmt").innerText = "₹" + fTotal.toLocaleString('en-IN');
      document.getElementById("totalCashAmt").innerText = "₹" + fCash.toLocaleString('en-IN');
      document.getElementById("totalOnlineAmt").innerText = "₹" + fOnline.toLocaleString('en-IN');
      
      // Handle empty state gracefully without destroying existing cards
      const listDiv = document.getElementById("reviewList");
      let emptyMsg = document.getElementById("emptyFilterMsg");
      if (visibleCount === 0) {
        if(!emptyMsg) {
          listDiv.insertAdjacentHTML('beforeend', `<div id="emptyFilterMsg" style="text-align:center; padding:50px 20px; color:var(--text-muted); font-weight:600;">No entries found for this agent.</div>`);
        }
      } else {
        if(emptyMsg) emptyMsg.remove();
      }
      
      renderAgentFilterList(); // update selected state in modal
    };

    // --- NEW: OPEN/CLOSE AGENT FILTER MODAL ---
    window.openAgentFilter = () => {
      if (navigator.vibrate) navigator.vibrate(40);
      renderAgentFilterList(); // Ensure fresh counts before opening
      const sheet = document.getElementById("agentFilterSheet");
      sheet.style.display = "flex";
      setTimeout(() => sheet.classList.add("open"), 10);
      history.pushState({ modalOpen: 'agentFilter' }, "");
    };

    window.closeAgentFilter = () => {
      const sheet = document.getElementById("agentFilterSheet");
      sheet.classList.remove("open");
      setTimeout(() => sheet.style.display = "none", 300);
      if (history.state && history.state.modalOpen === 'agentFilter') {
        history.back();
      }
    };

    // --- 2. EDIT MODAL LOGIC ---
    window.openEdit = (docId) => {
      const entry = pendingEntries.find(e => e.docId === docId);
      if (!entry) return;

      if (navigator.vibrate) navigator.vibrate(40);

      document.getElementById("editDocId").value = docId;
      document.getElementById("editAmount").value = entry.amount;
      document.getElementById("editDate").value = entry.date;
      document.getElementById("editDueNumber").value = entry.dueNumber || 0;

      const modal = document.getElementById("editModal");
      modal.style.display = "flex";
      setTimeout(() => modal.style.opacity = '1', 10);
      history.pushState({ modalOpen: 'editModal' }, "");
    };

    window.closeModal = () => {
      const modal = document.getElementById("editModal");
      modal.style.opacity = '0';
      setTimeout(() => modal.style.display = "none", 300);
      if (history.state && history.state.modalOpen === 'editModal') {
        history.back();
      }
    };

    window.saveEdit = async () => {
      const docId = document.getElementById("editDocId").value;
      const newAmt = parseFloat(document.getElementById("editAmount").value);
      const newDate = document.getElementById("editDate").value;
      const newDue = parseInt(document.getElementById("editDueNumber").value);

      if(!newAmt || !newDate) return showCustomAlert("Invalid Input", "Please fill all required fields.");

      const btn = document.querySelector(".btn-save");
      btn.innerText = "Saving...";

      try {
        const ref = doc(db, "temp_entries", docId);
        await updateDoc(ref, {
          amount: newAmt,
          date: newDate,
          dueNumber: newDue
        });
        closeModal();
        loadPending();
        btn.innerText = "Update Entry";
      } catch (e) {
        showCustomAlert("Error", e.message);
        btn.innerText = "Update Entry";
      }
    };

    // --- 3. SINGLE APPROVE (TRANSACTION) ---
    window.approveEntry = async (docId) => {
      const entry = pendingEntries.find(e => e.docId === docId);
      if (!entry) return;

      const card = document.getElementById(`card-${docId}`);
      card.style.opacity = "0.5"; card.style.pointerEvents = "none";

      try {
        await runTransaction(db, async (transaction) => {
          const custRef = doc(db, "customers", entry.customerId);
          const statsRef = doc(db, "metadata", "stats");
          const tempRef = doc(db, "temp_entries", docId);

          const custDoc = await transaction.get(custRef);
          if (!custDoc.exists()) throw `Customer ${entry.customerId} not found!`;

          const data = custDoc.data();
          let pIndex = entry.productIndex;
          if (!data.products[pIndex] || data.products[pIndex].name !== entry.productName) {
            pIndex = data.products.findIndex(p => p.name === entry.productName);
          }
          if (pIndex === -1) throw "Product mismatch - cannot merge.";

          const product = data.products[pIndex];
          let finalDue = entry.dueNumber; 
          
          if (!finalDue || finalDue <= 0) {
             const max = (product.payments || []).length > 0 
               ? Math.max(...product.payments.map(p => p.dueNumber || 0)) 
               : 0;
             finalDue = max + 1;
          }

          const newPayment = {
            date: entry.date,
            amount: entry.amount,
            paymentMode: entry.paymentMode || 'Cash', 
            dueNumber: parseInt(finalDue),
            type: "Agent Collection",
            approvedAt: new Date().toISOString(),
            staffName: entry.staffName || 'Unknown Agent', // Audit injected
            staffUid: entry.staffUid || 'unknown'          // Audit injected
          };

          if (!product.payments) product.payments = [];
          product.payments.push(newPayment);
          product.paid += entry.amount;

          transaction.update(custRef, { products: data.products });
          transaction.update(statsRef, {
            totalPaid: increment(entry.amount),
            totalBalance: increment(-entry.amount)
          });
          transaction.delete(tempRef);
        });

        card.style.transform = "scale(0.9) translateX(50px)";
        card.style.opacity = "0";
        setTimeout(() => { card.remove(); checkEmpty(); }, 300);

      } catch (e) {
        showCustomAlert("Approval Failed", e.toString());
        card.style.opacity = "1"; card.style.pointerEvents = "auto";
      }
    };

    // --- 4. REJECT LOGIC ---
    window.rejectEntry = async (docId) => {
      showCustomConfirm("Reject Entry", "Permanently delete this entry? This action cannot be undone.", async () => {
        try {
          if (navigator.vibrate) navigator.vibrate([60, 50, 60]);
          await deleteDoc(doc(db, "temp_entries", docId));
          const card = document.getElementById(`card-${docId}`);
          card.style.opacity = "0";
          card.style.transform = "scale(0.8)";
          setTimeout(() => { card.remove(); checkEmpty(); }, 250);
        } catch (e) {
          showCustomAlert("Error", e.message);
        }
      });
    };

    // --- 5. BATCH APPROVE ALL (INSTANT & SECURE DELETION FOR NON-DB) ---
    window.approveAll = async () => {
      if (pendingEntries.length === 0) return;
      
      showCustomConfirm("Approve All", "Approve DB entries to server & clear non-DB entries securely?", async () => {
        const btn = document.querySelector(".btn-approve-all");
        const originalHtml = btn.innerHTML;
        btn.innerHTML = `<span class="loading-spinner" style="width:20px; height:20px; margin:0; border-width:3px; border-top-color:#022c22; border-right-color:rgba(2,44,34,0.2); border-bottom-color:rgba(2,44,34,0.2); border-left-color:rgba(2,44,34,0.2);"></span> <span style="margin-left:10px;">Processing...</span>`;
        btn.disabled = true;

        try {
          // Split arrays into Database and Non-Database segments
          const dbEntries = pendingEntries.filter(e => !e.isNonDatabase);
          const nonDbEntries = pendingEntries.filter(e => e.isNonDatabase);

          // 1. Fetch all affected DB customers to ensure data integrity
          const customerIds = [...new Set(dbEntries.map(e => e.customerId))];
          const customersSnapshot = await Promise.all(customerIds.map(id => getDoc(doc(db, "customers", id))));
          
          const customerMap = {};
          customersSnapshot.forEach(snap => {
            if (snap.exists()) customerMap[snap.id] = snap.data();
          });

          const batch = writeBatch(db);
          let totalBatchAmount = 0;

          // 2. Process each DB entry in memory
          dbEntries.forEach(entry => {
            const customerData = customerMap[entry.customerId];
            if (!customerData) {
              console.error(`Skipping entry ${entry.docId}, customer not found`);
              return;
            }

            // Find Product
            let pIndex = entry.productIndex;
            if (!customerData.products[pIndex] || customerData.products[pIndex].name !== entry.productName) {
              pIndex = customerData.products.findIndex(p => p.name === entry.productName);
            }

            if (pIndex > -1) {
              const product = customerData.products[pIndex];
              
              // Calculate Due
              let finalDue = entry.dueNumber;
              if (!finalDue || finalDue <= 0) {
                 const max = (product.payments || []).length > 0 
                   ? Math.max(...product.payments.map(p => p.dueNumber || 0)) 
                   : 0;
                 finalDue = max + 1;
              }

              const newPayment = {
                date: entry.date,
                amount: entry.amount,
                paymentMode: entry.paymentMode || 'Cash', 
                dueNumber: parseInt(finalDue),
                type: "Agent Collection",
                approvedAt: new Date().toISOString(),
                staffName: entry.staffName || 'Unknown Agent', // Audit injected
                staffUid: entry.staffUid || 'unknown'          // Audit injected
              };

              if (!product.payments) product.payments = [];
              product.payments.push(newPayment);
              product.paid += entry.amount;
              
              totalBatchAmount += entry.amount;

              // Mark temp entry for deletion
              const tempRef = doc(db, "temp_entries", entry.docId);
              batch.delete(tempRef);
            }
          });

          // 2.1 Process NON-DB Entries (Strict Delete / Clear Only without merging)
          nonDbEntries.forEach(entry => {
              const tempRef = doc(db, "temp_entries", entry.docId);
              batch.delete(tempRef); 
          });

          // 3. Stage Customer Updates (DB Only)
          Object.keys(customerMap).forEach(custId => {
            const custRef = doc(db, "customers", custId);
            batch.update(custRef, { products: customerMap[custId].products });
          });

          // 4. Stage Stats Update (DB Only calculations)
          if(totalBatchAmount > 0) {
            const statsRef = doc(db, "metadata", "stats");
            batch.update(statsRef, {
              totalPaid: increment(totalBatchAmount),
              totalBalance: increment(-totalBatchAmount)
            });
          }

          // 5. COMMIT EVERYTHING ONCE
          await batch.commit();

          // UI Reset
          if (navigator.vibrate) navigator.vibrate([400, 100, 400]); // Success buzz
          showCustomAlert("Success", "DB Approved, Non-DB cleared entirely.");
          btn.innerHTML = originalHtml;
          loadPending();

        } catch (e) {
          showCustomAlert("Batch Approval Error", e.message);
          btn.innerHTML = originalHtml;
          btn.disabled = false;
        }
      });
    };

    function checkEmpty() {
      const remaining = document.querySelectorAll(".entry-item[style*='display: flex'], .entry-item:not([style*='display: none'])");
      if(remaining.length === 0) loadPending();
    }

    // --- 6. PRINT SYSTEM & POPUP MENU ---
    window.togglePrintMenu = () => {

    loadPending();
    
    // Exports
    window.openEdit = openEdit;
