<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Entries - Meena Groups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020617">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

    :root { 
      --bg: #020617; 
      --surface: #0f172a;
      --card: #1e293b; 
      --primary: #10b981; 
      --primary-muted: rgba(16, 185, 129, 0.15);
      --secondary: #38bdf8; 
      --danger: #ef4444; 
      --warning: #f59e0b;
      --text: #f8fafc; 
      --text-muted: #94a3b8;
      --border: #334155; 
      --input-bg: #020617;
      --header-bg: rgba(15, 23, 42, 0.8);
    }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; 
      padding: 0; 
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* --- TOP NAVIGATION BAR --- */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 15px var(--primary);
    }

    .brand h2 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 30px 20px 80px; }

    /* --- HEADER SECTION --- */
    .header-section { 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-end; 
      margin-bottom: 40px; 
      flex-wrap: wrap; 
      gap: 24px;
    }
    
    .header-text h1 { 
      margin: 0; 
      font-size: 2.25rem; 
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #fff;
    }
    .header-text p { color: var(--text-muted); margin-top: 8px; font-size: 1rem; }
    
    .header-controls { display: flex; align-items: stretch; gap: 16px; flex-wrap: wrap; }

    .stats-card {
      background: var(--surface); 
      border: 1px solid var(--border); 
      padding: 10px 20px; 
      border-radius: 14px; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 120px;
    }
    .stats-card span { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; margin-bottom: 2px; }
    .stats-card strong { font-size: 1.4rem; color: var(--primary); font-weight: 800; }

    .btn-approve-all {
      background: var(--primary); 
      color: #064e3b; 
      border: none; 
      padding: 0 24px;
      border-radius: 14px; 
      font-weight: 700; 
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.3);
    }
    .btn-approve-all:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 15px 25px -5px rgba(16, 185, 129, 0.4); }
    .btn-approve-all:active { transform: translateY(0); }
    .btn-approve-all:disabled { opacity: 0.2; cursor: not-allowed; transform: none; box-shadow: none; }

    /* --- REVIEW LIST --- */
    .review-list { display: flex; flex-direction: column; gap: 16px; }

    .entry-item {
      background: var(--surface); 
      border: 1px solid var(--border); 
      border-radius: 20px;
      padding: 24px; 
      display: grid; 
      grid-template-columns: 1.5fr 1fr 1fr auto;
      align-items: center; 
      gap: 24px; 
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .entry-item:hover { 
      border-color: #475569; 
      background: var(--card);
      transform: scale(1.01);
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.4);
    }

    /* --- NON-DB CUSTOMER STYLES --- */
    .non-db-card {
      border: 2px dashed var(--warning) !important;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.05), rgba(15, 23, 42, 1)) !important;
    }
    .badge-container { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; border: 1px solid currentColor; display: inline-flex; align-items: center; justify-content: center; letter-spacing: 0.5px;}
    .badge-cash { color: var(--primary); background: rgba(16,185,129,0.1); }
    .badge-online { color: var(--secondary); background: rgba(56,189,248,0.1); }
    .badge-nondb { color: var(--warning); background: rgba(245,158,11,0.1); }

    /* Columns Detail */
    .col-info h4 { margin: 0; font-size: 1.25rem; color: #fff; font-weight: 700; display: flex; align-items: center; flex-wrap: wrap; gap: 10px;}
    .col-info p { margin: 6px 0 0; color: var(--text-muted); font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 6px; width: fit-content; }
    
    .col-meta { display: flex; flex-direction: column; gap: 10px; }
    .tag { 
      background: #1e293b; 
      color: #cbd5e1; 
      padding: 6px 12px; 
      border-radius: 8px; 
      font-size: 0.75rem; 
      font-weight: 600;
      width: fit-content; 
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
    }
    
    .due-tag { 
      color: var(--secondary); 
      font-weight: 700; 
      font-size: 0.8rem; 
      background: rgba(56, 189, 248, 0.1); 
      padding: 4px 10px; 
      border-radius: 6px; 
      width: fit-content;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .col-amount { text-align: right; }
    .amount-display { font-size: 1.85rem; font-weight: 800; color: #fff; letter-spacing: -0.03em; }
    .date-display { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; margin-top: 4px; display: flex; align-items: center; justify-content: flex-end; gap: 5px; }

    /* Actions */
    .col-actions { display: flex; gap: 12px; }
    .btn-icon {
      width: 46px; height: 46px; border-radius: 12px; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: 0.2s;
    }
    .btn-edit { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.2); }
    .btn-edit:hover { background: var(--warning); color: #000; box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }
    
    .btn-accept { background: var(--primary-muted); color: var(--primary); border: 1px solid rgba(16, 185, 129, 0.2); }
    .btn-accept:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
    
    .btn-reject { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
    .btn-reject:hover { background: var(--danger); color: white; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

    /* --- DROPDOWN MENU --- */
    .dropdown { position: relative; display: inline-block; }
    .dropdown-content {
      display: none; position: absolute; right: 0; top: 50px; background-color: var(--card); 
      min-width: 180px; box-shadow: 0px 10px 30px rgba(0,0,0,0.8); z-index: 200; 
      border-radius: 12px; border: 1px solid var(--border); overflow: hidden;
      animation: modalFade 0.2s ease;
    }
    .dropdown-content a {
      color: white; padding: 14px 16px; text-decoration: none; display: flex; align-items: center; 
      gap: 10px; font-size: 0.9rem; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .dropdown-content a:hover { background-color: rgba(255,255,255,0.05); color: var(--secondary); }
    .dropdown-content a:last-child { border-bottom: none; }
    .dropdown-content.show { display: block; }

    /* --- EDIT MODAL --- */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center; z-index: 1000;
      animation: modalFade 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: var(--surface); padding: 32px; border-radius: 24px; width: 90%; max-width: 420px;
      border: 1px solid var(--border); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      transform: translateY(0); transition: 0.3s;
    }
    .modal h3 { margin-top: 0; color: #fff; font-size: 1.5rem; margin-bottom: 24px; font-weight: 800; }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; color: var(--text-muted); font-size: 0.8rem; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .form-group input { 
      width: 100%; padding: 14px 18px; background: var(--input-bg); border: 1px solid var(--border); 
      color: white; border-radius: 12px; box-sizing: border-box; font-size: 1rem; transition: 0.2s;
      font-family: inherit;
    }
    .form-group input:focus { outline: none; border-color: var(--secondary); box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1); }
    
    .modal-actions { display: flex; gap: 12px; margin-top: 32px; }
    .btn-modal { flex: 1; padding: 16px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
    .btn-cancel { background: #334155; color: white; }
    .btn-cancel:hover { background: #475569; }
    .btn-save { background: var(--secondary); color: #020617; }
    .btn-save:hover { transform: scale(1.02); filter: brightness(1.1); }

    /* Loading Spinner */
    .loading-spinner {
      width: 40px; height: 40px; border: 3px solid rgba(16, 185, 129, 0.1); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- PRINT LAYOUT CSS --- */
    #printArea { display: none; }
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { 
        display: block; position: absolute; left: 0; top: 0; width: 100%; 
        background: #fff; color: #000; padding: 20px; box-sizing: border-box;
      }
      .print-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #000; padding-bottom: 10px; }
      .print-header h1 { font-size: 28px; margin: 0; font-weight: 800; color: #111; }
      .print-header p { font-size: 14px; margin: 5px 0 0 0; color: #444; }
      .print-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
      .print-table th, .print-table td { border: 1px solid #ccc; padding: 12px; text-align: left; font-size: 14px; }
      .print-table th { background: #f8f9fa; font-weight: bold; color: #333; text-transform: uppercase; font-size: 12px; }
      .print-table tr:nth-child(even) { background: #fcfcfc; }
      .print-badge { padding: 3px 6px; font-size: 10px; border-radius: 4px; border: 1px solid #000; font-weight: bold; margin-left: 5px; }
      .print-footer { margin-top: 40px; text-align: right; font-size: 18px; font-weight: bold; border-top: 2px solid #000; padding-top: 10px; }
    }

    /* Mobile Responsive Updates */
    @media (max-width: 850px) {
      .container { padding: 20px 15px 100px; }
      .header-section { margin-bottom: 30px; }
      .header-text h1 { font-size: 1.75rem; }
      .entry-item { grid-template-columns: 1fr; gap: 20px; padding: 20px; }
      .col-amount { text-align: left; display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid var(--border); padding-top: 20px; margin-top: -5px; }
      .amount-display { font-size: 1.6rem; }
      .date-display { justify-content: flex-start; }
      .col-actions { width: 100%; gap: 10px; }
      .btn-icon { flex: 1; height: 52px; border-radius: 14px; }
      .header-controls { width: 100%; flex-direction: column; }
      .stats-card { text-align: center; }
      .btn-approve-all { height: 56px; justify-content: center; }
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <div class="nav-container">
      <div class="brand">
        <div class="brand-dot"></div>
        <h2>MEENA GROUPS</h2>
      </div>
      <div style="display:flex; align-items:center; gap: 15px;">
        <div id="status-tag" style="font-size: 0.7rem; font-weight: 800; background: var(--primary-muted); color: var(--primary); padding: 4px 10px; border-radius: 20px;">SYSTEM ONLINE</div>
        
        <div class="dropdown">
          <button class="btn-icon" style="height:36px; width:36px; background:var(--surface); border:1px solid var(--border); color:white; font-size:1.2rem;" onclick="togglePrintMenu()">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
          </button>
          <div id="printDropdown" class="dropdown-content">
            <a href="#" onclick="printData('all')">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
              Print All Logs
            </a>
            <a href="#" onclick="printData('nondb')">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
              Print Non-DB Only
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="header-section">
      <div class="header-text">
        <h1>View Entries</h1>
        <p>Review and verify agent collections before syncing.</p>
      </div>
      <div class="header-controls">
        <div class="stats-card">
          <span>Cash Total</span>
          <strong id="totalCashAmt" style="color: var(--primary);">₹0</strong>
        </div>
        <div class="stats-card">
          <span>Online Total</span>
          <strong id="totalOnlineAmt" style="color: var(--secondary);">₹0</strong>
        </div>
        <div class="stats-card">
          <span>Grand Total</span>
          <strong id="totalPendingAmt" style="color: #fff;">₹0</strong>
        </div>
        <button class="btn-approve-all" onclick="approveAll()">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
          Approve All
        </button>
      </div>
    </div>

    <div id="reviewList" class="review-list">
      <div style="text-align:center; padding: 100px 20px; color:var(--text-muted);">
        <div class="loading-spinner"></div>
        <p>Fetching pending entries...</p>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3>Edit Collection</h3>
      <input type="hidden" id="editDocId">
      
      <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" id="editAmount" placeholder="0.00">
      </div>
      
      <div class="form-group">
        <label>Due Number</label>
        <input type="number" id="editDueNumber" placeholder="Auto">
      </div>

      <div class="form-group">
        <label>Collection Date</label>
        <input type="date" id="editDate">
      </div>

      <div class="modal-actions">
        <button class="btn-modal btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-modal btn-save" onclick="saveEdit()">Update Entry</button>
      </div>
    </div>
  </div>

  <div id="printArea"></div>

  <script type="module">
    import { db } from "./config.js";
    import { 
      collection, query, where, getDocs, doc, runTransaction, increment, deleteDoc, updateDoc, writeBatch, getDoc 
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    let pendingEntries = [];

    // --- 1. LOAD DATA ---
    async function loadPending() {
      const listDiv = document.getElementById("reviewList");
      const totalDisplay = document.getElementById("totalPendingAmt");
      const cashDisplay = document.getElementById("totalCashAmt");
      const onlineDisplay = document.getElementById("totalOnlineAmt");
      const approveAllBtn = document.querySelector(".btn-approve-all");

      try {
        const q = query(collection(db, "temp_entries"), where("status", "==", "pending"));
        const snapshot = await getDocs(q);
        
        pendingEntries = [];
        let totalAmt = 0;
        let cashAmt = 0;
        let onlineAmt = 0;

        snapshot.forEach(docSnap => {
          const d = docSnap.data();
          d.docId = docSnap.id;
          d.jsDate = d.timestamp ? (d.timestamp.toDate ? d.timestamp.toDate() : new Date(d.timestamp)) : new Date();
          pendingEntries.push(d);
          
          let amt = parseFloat(d.amount || 0);
          totalAmt += amt;
          
          // Separate cash vs online based on paymentMode or assumes cash as default
          let mode = (d.paymentMode || "cash").toLowerCase();
          if(mode === "online") {
              onlineAmt += amt;
          } else {
              cashAmt += amt;
          }
        });

        // Sort Newest First
        pendingEntries.sort((a, b) => b.jsDate - a.jsDate);

        totalDisplay.innerText = "₹" + totalAmt.toLocaleString('en-IN');
        cashDisplay.innerText = "₹" + cashAmt.toLocaleString('en-IN');
        onlineDisplay.innerText = "₹" + onlineAmt.toLocaleString('en-IN');
        
        listDiv.innerHTML = "";

        if (pendingEntries.length === 0) {
          listDiv.innerHTML = `
            <div style="text-align:center; padding:100px 20px; color:#64748b; background:var(--surface); border-radius:24px; border:1px dashed var(--border);">
              <div style="font-size: 4rem; margin-bottom:20px; filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.2));">✨</div>
              <h2 style="margin:0; color:#fff; font-weight:800;">All Caught Up!</h2>
              <p style="max-width:300px; margin: 10px auto;">No collections are waiting for approval. Great job!</p>
            </div>`;
          approveAllBtn.disabled = true;
          return;
        }

        approveAllBtn.disabled = false;

        pendingEntries.forEach(d => {
          // Identify Non-DB records
          const isNonDB = d.isNonDB === true || !d.customerId || d.customerId === "NON-DB" || d.customerId.includes("TEMP");
          const mode = (d.paymentMode || "cash").toLowerCase();
          
          const dueDisplay = (d.dueNumber && d.dueNumber > 0) ? `#${d.dueNumber}` : 'Auto (Next)';

          const card = document.createElement("div");
          card.className = `entry-item ${isNonDB ? 'non-db-card' : ''}`;
          card.id = `card-${d.docId}`;
          
          // Build Badges
          let badgeHTML = '';
          if(mode === 'online') {
              badgeHTML += `<span class="badge badge-online">ONLINE</span>`;
          } else {
              badgeHTML += `<span class="badge badge-cash">CASH</span>`;
          }
          if(isNonDB) {
              badgeHTML += `<span class="badge badge-nondb">NON-DB</span>`;
          }
          
          // Build Actions (Hide Accept for Non-DB)
          let actionButtons = `
              <button class="btn-icon btn-edit" onclick="openEdit('${d.docId}')" title="Edit">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
              </button>
              <button class="btn-icon btn-reject" onclick="rejectEntry('${d.docId}')" title="Reject">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
          `;
          
          if (!isNonDB) {
              actionButtons += `
              <button class="btn-icon btn-accept" onclick="approveEntry('${d.docId}')" title="Approve">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
              </button>`;
          }

          card.innerHTML = `
            <div class="col-info">
              <div class="badge-container">${badgeHTML}</div>
              <h4>${d.customerName}</h4>
              <p>${d.customerId || "No ID Linked"}</p>
            </div>
            
            <div class="col-meta">
              <span class="tag">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                ${d.productName || 'Unknown Product'}
              </span>
              <span class="due-tag">Due: ${dueDisplay}</span>
            </div>

            <div class="col-amount">
              <div class="amount-display">₹${d.amount}</div>
              <div class="date-display">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                ${d.date}
              </div>
            </div>

            <div class="col-actions">
              ${actionButtons}
            </div>
          `;
          listDiv.appendChild(card);
        });

      } catch (e) {
        console.error(e);
        listDiv.innerHTML = `<div style="text-align:center; color:#ef4444; background:rgba(239,68,68,0.1); padding:20px; border-radius:12px;">Error: ${e.message}</div>`;
      }
    }

    // --- 2. EDIT MODAL LOGIC ---
    window.openEdit = (docId) => {
      const entry = pendingEntries.find(e => e.docId === docId);
      if (!entry) return;

      document.getElementById("editDocId").value = docId;
      document.getElementById("editAmount").value = entry.amount;
      document.getElementById("editDate").value = entry.date;
      document.getElementById("editDueNumber").value = entry.dueNumber || 0;

      document.getElementById("editModal").style.display = "flex";
    };

    window.closeModal = () => {
      document.getElementById("editModal").style.display = "none";
    };

    window.saveEdit = async () => {
      const docId = document.getElementById("editDocId").value;
      const newAmt = parseFloat(document.getElementById("editAmount").value);
      const newDate = document.getElementById("editDate").value;
      const newDue = parseInt(document.getElementById("editDueNumber").value);

      if(!newAmt || !newDate) return alert("Invalid inputs");

      const btn = document.querySelector(".btn-save");
      btn.innerText = "Saving...";

      try {
        const ref = doc(db, "temp_entries", docId);
        await updateDoc(ref, {
          amount: newAmt,
          date: newDate,
          dueNumber: newDue
        });
        closeModal();
        loadPending();
        btn.innerText = "Update Entry";
      } catch (e) {
        alert("Error updating: " + e.message);
        btn.innerText = "Update Entry";
      }
    };

    // --- 3. SINGLE APPROVE (TRANSACTION) ---
    window.approveEntry = async (docId) => {
      const entry = pendingEntries.find(e => e.docId === docId);
      if (!entry) return;

      const card = document.getElementById(`card-${docId}`);
      card.style.opacity = "0.5"; card.style.pointerEvents = "none";

      try {
        await runTransaction(db, async (transaction) => {
          const custRef = doc(db, "customers", entry.customerId);
          const statsRef = doc(db, "metadata", "stats");
          const tempRef = doc(db, "temp_entries", docId);

          const custDoc = await transaction.get(custRef);
          if (!custDoc.exists()) throw `Customer ${entry.customerId} not found!`;

          const data = custDoc.data();
          let pIndex = entry.productIndex;
          if (!data.products[pIndex] || data.products[pIndex].name !== entry.productName) {
            pIndex = data.products.findIndex(p => p.name === entry.productName);
          }
          if (pIndex === -1) throw "Product mismatch - cannot merge.";

          const product = data.products[pIndex];
          let finalDue = entry.dueNumber; 
          
          if (!finalDue || finalDue <= 0) {
             const max = (product.payments || []).length > 0 
               ? Math.max(...product.payments.map(p => p.dueNumber || 0)) 
               : 0;
             finalDue = max + 1;
          }

          const newPayment = {
            date: entry.date,
            amount: entry.amount,
            dueNumber: parseInt(finalDue),
            type: "Agent Collection",
            approvedAt: new Date().toISOString()
          };

          if (!product.payments) product.payments = [];
          product.payments.push(newPayment);
          product.paid += entry.amount;

          transaction.update(custRef, { products: data.products });
          transaction.update(statsRef, {
            totalPaid: increment(entry.amount),
            totalBalance: increment(-entry.amount)
          });
          transaction.delete(tempRef);
        });

        card.style.transform = "scale(0.9) translateX(50px)";
        card.style.opacity = "0";
        setTimeout(() => { card.remove(); checkEmpty(); }, 300);

      } catch (e) {
        alert("Approval Failed: " + e);
        card.style.opacity = "1"; card.style.pointerEvents = "auto";
      }
    };

    // --- 4. REJECT LOGIC ---
    window.rejectEntry = async (docId) => {
      if(!confirm("Permanently delete this entry?")) return;
      try {
        await deleteDoc(doc(db, "temp_entries", docId));
        const card = document.getElementById(`card-${docId}`);
        card.style.opacity = "0";
        card.style.transform = "scale(0.8)";
        setTimeout(() => { card.remove(); checkEmpty(); }, 250);
      } catch (e) {
        alert("Error: " + e.message);
      }
    };

    // --- 5. BATCH APPROVE ALL (INSTANT & NON-DB WIPE) ---
    window.approveAll = async () => {
      if (pendingEntries.length === 0) return;
      if (!confirm(`Approve DB entries & Auto-delete non-DB entries?`)) return;

      const btn = document.querySelector(".btn-approve-all");
      const originalHtml = btn.innerHTML;
      btn.innerHTML = `<span class="loading-spinner" style="width:16px; height:16px; margin:0; border-width:2px;"></span> Processing Batch...`;
      btn.disabled = true;

      try {
        const batch = writeBatch(db);
        let totalBatchAmount = 0;
        
        // Isolate customer IDs that are valid (DB Customers)
        const validEntries = pendingEntries.filter(e => !(e.isNonDB === true || !e.customerId || e.customerId === "NON-DB" || e.customerId.includes("TEMP")));
        const nonDbEntries = pendingEntries.filter(e => (e.isNonDB === true || !e.customerId || e.customerId === "NON-DB" || e.customerId.includes("TEMP")));

        // Fetch valid customers to ensure data integrity
        const customerIds = [...new Set(validEntries.map(e => e.customerId))];
        const customersSnapshot = await Promise.all(customerIds.map(id => getDoc(doc(db, "customers", id))));
        
        const customerMap = {};
        customersSnapshot.forEach(snap => {
          if (snap.exists()) customerMap[snap.id] = snap.data();
        });

        // Process DB Entries
        validEntries.forEach(entry => {
          const customerData = customerMap[entry.customerId];
          if (!customerData) return;

          let pIndex = entry.productIndex;
          if (!customerData.products[pIndex] || customerData.products[pIndex].name !== entry.productName) {
            pIndex = customerData.products.findIndex(p => p.name === entry.productName);
          }

          if (pIndex > -1) {
            const product = customerData.products[pIndex];
            
            let finalDue = entry.dueNumber;
            if (!finalDue || finalDue <= 0) {
               const max = (product.payments || []).length > 0 ? Math.max(...product.payments.map(p => p.dueNumber || 0)) : 0;
               finalDue = max + 1;
            }

            const newPayment = {
              date: entry.date,
              amount: entry.amount,
              dueNumber: parseInt(finalDue),
              type: "Agent Collection",
              approvedAt: new Date().toISOString()
            };

            if (!product.payments) product.payments = [];
            product.payments.push(newPayment);
            product.paid += entry.amount;
            
            totalBatchAmount += entry.amount;

            // Mark temp entry for deletion
            const tempRef = doc(db, "temp_entries", entry.docId);
            batch.delete(tempRef);
          }
        });

        // Stage DB Customer Updates
        Object.keys(customerMap).forEach(custId => {
          const custRef = doc(db, "customers", custId);
          batch.update(custRef, { products: customerMap[custId].products });
        });

        // Stage Stats Update (ONLY for DB Entries)
        if (totalBatchAmount > 0) {
            const statsRef = doc(db, "metadata", "stats");
            batch.update(statsRef, {
              totalPaid: increment(totalBatchAmount),
              totalBalance: increment(-totalBatchAmount)
            });
        }
        
        // Silently Delete Non-DB entries from server
        nonDbEntries.forEach(entry => {
            const tempRef = doc(db, "temp_entries", entry.docId);
            batch.delete(tempRef);
        });

        // COMMIT EVERYTHING ONCE
        await batch.commit();

        alert("✅ Synced! Real entries approved and Non-DB entries cleared.");
        btn.innerHTML = originalHtml;
        loadPending();

      } catch (e) {
        alert("Batch Approval Error: " + e.message);
        btn.innerHTML = originalHtml;
        btn.disabled = false;
      }
    };

    // --- 6. PRINT FUNCTIONALITY ---
    window.togglePrintMenu = () => {
        document.getElementById("printDropdown").classList.toggle("show");
    }

    // Close menu if clicked outside
    window.onclick = function(event) {
        if (!event.target.matches('.btn-icon') && !event.target.closest('.dropdown')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                if (dropdowns[i].classList.contains('show')) {
                    dropdowns[i].classList.remove('show');
                }
            }
        }
    }

    window.printData = (type) => {
        document.getElementById("printDropdown").classList.remove("show");
        
        let toPrint = pendingEntries;
        if (type === 'nondb') {
            toPrint = pendingEntries.filter(d => d.isNonDB === true || !d.customerId || d.customerId === "NON-DB" || d.customerId.includes("TEMP"));
        }
        
        if (toPrint.length === 0) {
            alert("No data available to print for this category.");
            return;
        }
        
        const dateString = new Date().toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
        
        let html = `
            <div class="print-header">
                <h1>MEENA GROUPS</h1>
                <p><strong>${type === 'all' ? 'FULL DAILY COLLECTION REPORT' : 'NON-DATABASE COLLECTION REPORT'}</strong></p>
                <p>Generated: ${dateString} | Total Records: ${toPrint.length}</p>
            </div>
            <table class="print-table">
                <thead>
                    <tr>
                        <th>S.No</th>
                        <th>Customer / Mode</th>
                        <th>Customer ID</th>
                        <th>Product Details</th>
                        <th>Date</th>
                        <th style="text-align:right">Amount (₹)</th>
                    </tr>
                </thead>
                <tbody>
        `;
        
        let grandTotal = 0;
        let cTotal = 0;
        let oTotal = 0;

        toPrint.forEach((d, index) => {
            const amt = parseFloat(d.amount || 0);
            grandTotal += amt;
            
            const isNonDB = d.isNonDB === true || !d.customerId || d.customerId === "NON-DB" || d.customerId.includes("TEMP");
            const mode = (d.paymentMode || "cash").toUpperCase();
            
            if(mode === 'ONLINE') oTotal += amt;
            else cTotal += amt;

            html += `
                <tr>
                    <td>${index + 1}</td>
                    <td>
                        <strong>${d.customerName}</strong>
                        ${isNonDB ? '<span class="print-badge">NON-DB</span>' : ''}
                        <br><small style="color:#555">${mode}</small>
                    </td>
                    <td style="font-family:monospace;">${d.customerId || 'N/A'}</td>
                    <td>${d.productName || 'N/A'}</td>
                    <td>${d.date}</td>
                    <td style="text-align:right; font-weight:bold;">₹${amt.toLocaleString('en-IN')}</td>
                </tr>
            `;
        });
        
        html += `
                </tbody>
            </table>
            
            <div class="print-footer">
                <p style="margin:5px 0; font-size:14px; color:#555;">Cash Total: ₹${cTotal.toLocaleString('en-IN')}</p>
                <p style="margin:5px 0; font-size:14px; color:#555;">Online Total: ₹${oTotal.toLocaleString('en-IN')}</p>
                <p style="margin:10px 0 0 0; font-size:22px;">Grand Total: ₹${grandTotal.toLocaleString('en-IN')}</p>
            </div>
        `;
        
        document.getElementById('printArea').innerHTML = html;
        window.print();
    };

    function checkEmpty() {
      const remaining = document.querySelectorAll(".entry-item");
      if(remaining.length === 0) loadPending();
    }

    // Initialize
    loadPending();
    
    // Exports
    window.openEdit = openEdit;
    window.closeModal = closeModal;
    window.saveEdit = saveEdit;
    window.rejectEntry = rejectEntry;
    window.approveEntry = approveEntry;
    window.approveAll = approveAll;
    window.togglePrintMenu = togglePrintMenu;
    window.printData = printData;
  </script>
</body>
</html>
