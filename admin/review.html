<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Entries - Meena Groups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root { 
      --bg: #0f172a; 
      --card: #1e293b; 
      --primary: #10b981; 
      --secondary: #06b6d4; 
      --danger: #ef4444; 
      --warning: #f59e0b;
      --text: #f8fafc; 
      --text-muted: #94a3b8;
      --border: #334155; 
      --input-bg: #0f172a;
      --accent-glow: rgba(16, 185, 129, 0.1);
    }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Inter', sans-serif; 
      margin: 0; 
      padding: 0; 
      line-height: 1.5;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }

    /* --- HEADER SECTION --- */
    .header-section { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 40px; 
      flex-wrap: wrap; 
      gap: 20px;
    }
    
    .header-text h1 { 
      margin: 0; 
      font-size: 2rem; 
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(to right, #fff, var(--text-muted)); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
    }
    .header-text p { color: var(--text-muted); margin-top: 5px; font-size: 0.95rem; }
    
    .header-controls { display: flex; align-items: center; gap: 20px; }

    .stats-card {
      background: var(--card); 
      border: 1px solid var(--border); 
      padding: 12px 24px; 
      border-radius: 16px; 
      text-align: right;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .stats-card span { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .stats-card strong { font-size: 1.5rem; color: var(--primary); display: block; font-weight: 700; }

    .btn-approve-all {
      background: var(--primary); 
      color: #064e3b; 
      border: none; 
      padding: 14px 28px;
      border-radius: 12px; 
      font-weight: 700; 
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.2);
    }
    .btn-approve-all:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .btn-approve-all:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

    /* --- REVIEW LIST --- */
    .review-list { display: flex; flex-direction: column; gap: 16px; }

    .entry-item {
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 16px;
      padding: 24px; 
      display: grid; 
      grid-template-columns: 1.5fr 1fr 1fr auto;
      align-items: center; 
      gap: 24px; 
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .entry-item:hover { 
      border-color: var(--secondary); 
      background: #243147;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }

    /* Columns Detail */
    .col-info h4 { margin: 0; font-size: 1.2rem; color: #fff; font-weight: 600; }
    .col-info p { margin: 6px 0 0; color: var(--text-muted); font-size: 0.85rem; font-family: monospace; letter-spacing: 1px; }
    
    .col-meta { display: flex; flex-direction: column; gap: 8px; }
    .tag { 
      background: #334155; 
      color: #cbd5e1; 
      padding: 4px 10px; 
      border-radius: 6px; 
      font-size: 0.75rem; 
      font-weight: 600;
      width: fit-content; 
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .due-tag { 
      color: var(--secondary); 
      font-weight: 700; 
      font-size: 0.85rem; 
      background: rgba(6, 182, 212, 0.1); 
      padding: 4px 10px; 
      border-radius: 6px; 
      width: fit-content;
      border: 1px solid rgba(6, 182, 212, 0.2);
    }

    .col-amount { text-align: right; }
    .amount-display { font-size: 1.75rem; font-weight: 800; color: var(--primary); letter-spacing: -0.025em; }
    .date-display { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; margin-top: 4px; }

    /* Actions */
    .col-actions { display: flex; gap: 10px; }
    .btn-icon {
      width: 42px; height: 42px; border-radius: 10px; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: 0.2s;
    }
    .btn-edit { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.2); }
    .btn-edit:hover { background: var(--warning); color: #000; }
    
    .btn-accept { background: rgba(16, 185, 129, 0.1); color: var(--primary); border: 1px solid rgba(16, 185, 129, 0.2); }
    .btn-accept:hover { background: var(--primary); color: #000; }
    
    .btn-reject { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
    .btn-reject:hover { background: var(--danger); color: white; }

    /* --- EDIT MODAL --- */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 1000;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: var(--card); padding: 32px; border-radius: 20px; width: 90%; max-width: 400px;
      border: 1px solid var(--border); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .modal h3 { margin-top: 0; color: #fff; font-size: 1.5rem; margin-bottom: 20px; }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px; font-weight: 600; }
    .form-group input { 
      width: 100%; padding: 12px 16px; background: var(--input-bg); border: 1px solid var(--border); 
      color: white; border-radius: 10px; box-sizing: border-box; font-size: 1rem; transition: 0.2s;
    }
    .form-group input:focus { outline: none; border-color: var(--secondary); ring: 2px solid var(--secondary); }
    
    .modal-actions { display: flex; gap: 12px; margin-top: 30px; }
    .btn-modal { flex: 1; padding: 14px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-cancel { background: #334155; color: white; }
    .btn-cancel:hover { background: #475569; }
    .btn-save { background: var(--secondary); color: #000; }
    .btn-save:hover { filter: brightness(1.1); }

    /* Mobile Responsive */
    @media (max-width: 850px) {
      .entry-item { grid-template-columns: 1fr; gap: 20px; padding: 20px; }
      .col-amount { text-align: left; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 15px; }
      .col-actions { width: 100%; }
      .btn-icon { flex: 1; height: 50px; }
      .header-section { flex-direction: column; align-items: flex-start; }
      .header-controls { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-section">
      <div class="header-text">
        <h1>View Entries</h1>
        <p>Review and verify agent collections before syncing.</p>
      </div>
      <div class="header-controls">
        <div class="stats-card">
          <span>Pending Total</span>
          <strong id="totalPendingAmt">₹0</strong>
        </div>
        <button class="btn-approve-all" onclick="approveAll()">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
          Approve All
        </button>
      </div>
    </div>

    <div id="reviewList" class="review-list">
      <div style="text-align:center; padding: 80px; color:var(--text-muted);">
        <div class="loading-spinner"></div>
        <p>Fetching pending entries...</p>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3>Edit Collection</h3>
      <input type="hidden" id="editDocId">
      
      <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" id="editAmount" placeholder="0.00">
      </div>
      
      <div class="form-group">
        <label>Due Number</label>
        <input type="number" id="editDueNumber" placeholder="Auto">
      </div>

      <div class="form-group">
        <label>Collection Date</label>
        <input type="date" id="editDate">
      </div>

      <div class="modal-actions">
        <button class="btn-modal btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-modal btn-save" onclick="saveEdit()">Update Entry</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "./config.js";
    import { 
      collection, query, where, getDocs, doc, runTransaction, increment, deleteDoc, updateDoc 
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    let pendingEntries = [];

    // --- 1. LOAD DATA ---
    async function loadPending() {
      const listDiv = document.getElementById("reviewList");
      const totalDisplay = document.getElementById("totalPendingAmt");
      const approveAllBtn = document.querySelector(".btn-approve-all");

      try {
        const q = query(collection(db, "temp_entries"), where("status", "==", "pending"));
        const snapshot = await getDocs(q);
        
        pendingEntries = [];
        let totalAmt = 0;

        snapshot.forEach(docSnap => {
          const d = docSnap.data();
          d.docId = docSnap.id;
          d.jsDate = d.timestamp ? (d.timestamp.toDate ? d.timestamp.toDate() : new Date(d.timestamp)) : new Date();
          pendingEntries.push(d);
          totalAmt += parseFloat(d.amount || 0);
        });

        // Sort Newest First
        pendingEntries.sort((a, b) => b.jsDate - a.jsDate);

        totalDisplay.innerText = "₹" + totalAmt.toLocaleString('en-IN');
        listDiv.innerHTML = "";

        if (pendingEntries.length === 0) {
          listDiv.innerHTML = `
            <div style="text-align:center; padding:100px 20px; color:#64748b; background:var(--card); border-radius:20px; border:1px dashed var(--border);">
              <div style="font-size: 3rem; margin-bottom:10px;">✨</div>
              <h2 style="margin:0; color:#fff;">All Caught Up!</h2>
              <p>No collections are waiting for approval.</p>
            </div>`;
          approveAllBtn.disabled = true;
          return;
        }

        approveAllBtn.disabled = false;

        pendingEntries.forEach(d => {
          const dueDisplay = (d.dueNumber && d.dueNumber > 0) ? `#${d.dueNumber}` : 'Auto (Next)';

          const card = document.createElement("div");
          card.className = "entry-item";
          card.id = `card-${d.docId}`;
          
          card.innerHTML = `
            <div class="col-info">
              <h4>${d.customerName}</h4>
              <p>REF: ${d.customerId}</p>
            </div>
            
            <div class="col-meta">
              <span class="tag">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                ${d.productName}
              </span>
              <span class="due-tag">Due: ${dueDisplay}</span>
            </div>

            <div class="col-amount">
              <div class="amount-display">₹${d.amount}</div>
              <div class="date-display">📅 ${d.date}</div>
            </div>

            <div class="col-actions">
              <button class="btn-icon btn-edit" onclick="openEdit('${d.docId}')" title="Edit">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
              </button>
              <button class="btn-icon btn-reject" onclick="rejectEntry('${d.docId}')" title="Reject">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
              <button class="btn-icon btn-accept" onclick="approveEntry('${d.docId}')" title="Approve">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
              </button>
            </div>
          `;
          listDiv.appendChild(card);
        });

      } catch (e) {
        console.error(e);
        listDiv.innerHTML = `<p style="color:#ef4444; text-align:center;">Error: ${e.message}</p>`;
      }
    }

    // --- 2. EDIT MODAL LOGIC ---
    window.openEdit = (docId) => {
      const entry = pendingEntries.find(e => e.docId === docId);
      if (!entry) return;

      document.getElementById("editDocId").value = docId;
      document.getElementById("editAmount").value = entry.amount;
      document.getElementById("editDate").value = entry.date;
      document.getElementById("editDueNumber").value = entry.dueNumber || 0;

      document.getElementById("editModal").style.display = "flex";
    };

    window.closeModal = () => {
      document.getElementById("editModal").style.display = "none";
    };

    window.saveEdit = async () => {
      const docId = document.getElementById("editDocId").value;
      const newAmt = parseFloat(document.getElementById("editAmount").value);
      const newDate = document.getElementById("editDate").value;
      const newDue = parseInt(document.getElementById("editDueNumber").value);

      if(!newAmt || !newDate) return alert("Invalid inputs");

      const btn = document.querySelector(".btn-save");
      btn.innerText = "Saving...";

      try {
        const ref = doc(db, "temp_entries", docId);
        await updateDoc(ref, {
          amount: newAmt,
          date: newDate,
          dueNumber: newDue
        });
        closeModal();
        loadPending();
        btn.innerText = "Update Entry";
      } catch (e) {
        alert("Error updating: " + e.message);
        btn.innerText = "Update Entry";
      }
    };

    // --- 3. APPROVE LOGIC ---
    window.approveEntry = async (docId) => {
      const entry = pendingEntries.find(e => e.docId === docId);
      if (!entry) return;

      const card = document.getElementById(`card-${docId}`);
      card.style.opacity = "0.5"; card.style.pointerEvents = "none";

      try {
        await runTransaction(db, async (transaction) => {
          const custRef = doc(db, "customers", entry.customerId);
          const statsRef = doc(db, "metadata", "stats");
          const tempRef = doc(db, "temp_entries", docId);

          const custDoc = await transaction.get(custRef);
          if (!custDoc.exists()) throw `Customer ${entry.customerId} not found!`;

          const data = custDoc.data();
          let pIndex = entry.productIndex;
          if (!data.products[pIndex] || data.products[pIndex].name !== entry.productName) {
            pIndex = data.products.findIndex(p => p.name === entry.productName);
          }
          if (pIndex === -1) throw "Product mismatch - cannot merge.";

          const product = data.products[pIndex];
          let finalDue = entry.dueNumber; 
          
          if (!finalDue || finalDue <= 0) {
             const max = (product.payments || []).length > 0 
               ? Math.max(...product.payments.map(p => p.dueNumber || 0)) 
               : 0;
             finalDue = max + 1;
          }

          const newPayment = {
            date: entry.date,
            amount: entry.amount,
            dueNumber: parseInt(finalDue),
            type: "Agent Collection",
            approvedAt: new Date().toISOString()
          };

          if (!product.payments) product.payments = [];
          product.payments.push(newPayment);
          product.paid += entry.amount;

          transaction.update(custRef, { products: data.products });
          transaction.update(statsRef, {
            totalPaid: increment(entry.amount),
            totalBalance: increment(-entry.amount)
          });
          transaction.delete(tempRef);
        });

        card.style.transform = "scale(0.9) translateY(20px)";
        card.style.opacity = "0";
        setTimeout(() => { card.remove(); checkEmpty(); }, 300);

      } catch (e) {
        alert("Approval Failed: " + e);
        card.style.opacity = "1"; card.style.pointerEvents = "auto";
      }
    };

    // --- 4. REJECT LOGIC ---
    window.rejectEntry = async (docId) => {
      if(!confirm("Permanently delete this entry?")) return;
      try {
        await deleteDoc(doc(db, "temp_entries", docId));
        document.getElementById(`card-${docId}`).remove();
        checkEmpty();
      } catch (e) {
        alert("Error: " + e.message);
      }
    };

    // --- 5. APPROVE ALL ---
    window.approveAll = async () => {
      if (pendingEntries.length === 0) return;
      if (!confirm(`Approve all ${pendingEntries.length} entries?`)) return;

      const btn = document.querySelector(".btn-approve-all");
      const originalHtml = btn.innerHTML;
      btn.innerText = "Syncing...";
      btn.disabled = true;

      for (const entry of pendingEntries) {
        if(document.getElementById(`card-${entry.docId}`)) {
          await window.approveEntry(entry.docId);
        }
      }
      
      btn.innerHTML = originalHtml;
      setTimeout(() => loadPending(), 1000);
    };

    function checkEmpty() {
      const remaining = document.querySelectorAll(".entry-item");
      if(remaining.length === 0) loadPending();
    }

    // Initialize
    loadPending();
    
    // Exports
    window.openEdit = openEdit;
    window.closeModal = closeModal;
    window.saveEdit = saveEdit;
    window.rejectEntry = rejectEntry;
    window.approveEntry = approveEntry;
    window.approveAll = approveAll;
  </script>
</body>
</html>
