<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Customer Rewards - Meena Marketing</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;700;900&display=swap" rel="stylesheet" />

    <style>
        /* Shared Core Theme (App UI) */
        :root {
            --bg-color: #121212;
            --surface-color: #212121;
            --surface-light: #2a2a2a;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --meena-red: #ff3333;
            --accent-color: #0056b3;
            --success-color: #00c853;
            --warning-color: #ff9800;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Noto Sans Tamil', sans-serif;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            padding: 20px;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }

        .container { 
            background: var(--surface-color); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 20px; 
            width: 100%; 
            max-width: 500px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            margin-top: 10px;
        }

        .brand-header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .brand-header h1 {
            margin: 0;
            font-size: 1.5em;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .brand-header span.meena { color: var(--meena-red); }

        /* Skeleton Loading Styles */
        .skeleton-wrapper { display: block; }
        .skeleton {
            background: linear-gradient(90deg, #2a2a2a 25%, #333 50%, #2a2a2a 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 6px;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .sk-title { height: 24px; width: 60%; margin: 0 auto 15px auto; }
        .sk-box { height: 80px; width: 100%; margin-bottom: 20px; border-radius: 8px; }
        .sk-card { height: 100px; width: 100%; margin-bottom: 15px; border-radius: 12px; }

        /* Actual Content Styles */
        .content-wrapper { display: none; }

        .bill-summary {
            background: var(--surface-light);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .bill-summary h2 { margin: 0 0 5px 0; font-size: 1.2em; color: var(--success-color); }
        .bill-summary p { margin: 5px 0; color: var(--text-secondary); font-size: 0.95em; }
        .bill-summary .total { font-size: 1.3em; font-weight: bold; color: #fff; margin-top: 10px;}
        .bill-summary .discount-warning { color: var(--warning-color); font-size: 0.85em; margin-top: 5px; }

        .ai-alert {
            background: rgba(255, 152, 0, 0.1);
            border: 1px solid var(--warning-color);
            color: var(--warning-color);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85em;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
            text-align: left;
        }

        /* Voucher Cards Grid */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .voucher-card {
            background: linear-gradient(135deg, #2c2c2c, #1a1a1a);
            border: 1px dashed var(--warning-color);
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: slideUp 0.4s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .card-left { text-align: left; }
        .card-name { font-size: 1.1em; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .card-rules { font-size: 0.75em; color: var(--text-secondary); line-height: 1.4; }
        
        .card-right { text-align: right; }
        .card-value { font-size: 1.8em; font-weight: 900; color: var(--warning-color); text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }

        .no-voucher {
            text-align: center;
            padding: 20px;
            background: var(--surface-light);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .btn-back {
            background: var(--surface-light);
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 25px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-back:hover { background: #333; }

        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <h1><span class="meena">Meena</span> Marketing</h1>
        </div>

        <div class="skeleton-wrapper" id="skeletonLoader">
            <div class="skeleton sk-title"></div>
            <div class="skeleton sk-box"></div>
            <div class="skeleton sk-card"></div>
            <div class="skeleton sk-card"></div>
        </div>

        <div class="content-wrapper" id="mainContent">
            
            <div class="bill-summary">
                <h2 id="uiStatus">Reward Analysis</h2>
                <p id="uiCustomerName">Customer Name</p>
                <p id="uiInvoice">Inv: ---</p>
                <div class="total" id="uiTotal">₹0.00</div>
                <div class="discount-warning" id="uiDiscountInfo"></div>
            </div>

            <div class="ai-alert" id="aiAlertBox">
                <span class="material-symbols-outlined">smart_toy</span>
                <span id="aiAlertText"></span>
            </div>

            <h3 id="rewardTitle" style="display:none; font-size:1.1em; margin-bottom: 10px; text-align: center;">Vouchers Unlocked:</h3>
            <div class="cards-container" id="cardsContainer"></div>

            <div class="no-voucher" id="noVoucherBox" style="display:none;">
                <span class="material-symbols-outlined" style="font-size: 2.5em; color: #555; margin-bottom: 10px;">remove_shopping_cart</span>
                <br>No eligible rewards for this purchase.
            </div>

            <a href="bill.html" class="btn-back">
                <span class="material-symbols-outlined">arrow_back</span> Back to Billing
            </a>
        </div>
    </div>

    <script type="module">
        import { db } from './config.js';
        import { collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        // Define the cards array based on your exact amounts
        const VOUCHER_CARDS = [
            { name: "Card 1", amount: 150 },
            { name: "Card 2", amount: 200 },
            { name: "Card 3", amount: 250 },
            { name: "Card 4", amount: 300 }
        ];

        async function fetchLastBillAndProcess() {
            try {
                const q = query(collection(db, "sellings"), orderBy("timestamp", "desc"), limit(1));
                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    showError("No recent sales found.");
                    return;
                }

                const lastSale = snapshot.docs.data();
                processRewards(lastSale);

            } catch (error) {
                console.error("Firestore Error:", error);
                showError("Database connection failed.");
            }
        }

        function processRewards(saleData) {
            const customerName = saleData.customerName || "Walk-in Customer";
            const invoiceNo = saleData.invoiceNo || "N/A";
            const grandTotal = parseFloat(saleData.grandTotal) || 0;
            const billDiscount = parseFloat(saleData.discount) || 0;

            // Calculate original total to find discount percentage
            const subTotalBeforeDiscount = grandTotal + billDiscount;
            const discountPercentage = subTotalBeforeDiscount > 0 ? (billDiscount / subTotalBeforeDiscount) * 100 : 0;

            // Update UI with Bill Data
            document.getElementById('uiCustomerName').innerText = customerName;
            document.getElementById('uiInvoice').innerText = `Invoice: ${invoiceNo}`;
            document.getElementById('uiTotal').innerText = `₹${grandTotal.toFixed(2)}`;
            
            if (billDiscount > 0) {
                document.getElementById('uiDiscountInfo').innerText = `Counter Discount Given: ₹${billDiscount.toFixed(2)} (${discountPercentage.toFixed(1)}%)`;
            }

            // --- ADVANCED REWARD LOGIC ---
            let earnedCards = [];
            const aiAlertBox = document.getElementById('aiAlertBox');
            const aiAlertText = document.getElementById('aiAlertText');

            // 1. Initial Tier Calculation
            if (grandTotal >= 20000) {
                earnedCards = [VOUCHER_CARDS, VOUCHER_CARDS, VOUCHER_CARDS, VOUCHER_CARDS];
            } else if (grandTotal >= 15000) {
                earnedCards = [VOUCHER_CARDS, VOUCHER_CARDS, VOUCHER_CARDS];
            } else if (grandTotal >= 10000) {
                earnedCards = [VOUCHER_CARDS, VOUCHER_CARDS];
            } else if (grandTotal >= 2000) {
                earnedCards = [VOUCHER_CARDS];
            }

            // 2. The Discount Penalty Logic
            if (discountPercentage >= 10) {
                // If they got >= 10% discount, wipe out all cards.
                earnedCards = [];
                aiAlertText.innerHTML = "<strong>System Adjustment:</strong> Customer received maximum counter discount. Additional vouchers disabled to protect margins.";
                aiAlertBox.style.display = 'flex';
            } 
            else if (discountPercentage >= 5 && earnedCards.length > 0) {
                // If they got >= 5% discount, drop them to just Card 1 (₹150) no matter how much they spent.
                earnedCards = [VOUCHER_CARDS];
                aiAlertText.innerHTML = "<strong>System Adjustment:</strong> Existing counter discount detected. Reward scaled down to Base Tier (Card 1).";
                aiAlertBox.style.display = 'flex';
            }

            // Render the UI
            renderCards(earnedCards);
            
            // Hide Skeleton, Show Content
            document.getElementById('skeletonLoader').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }

        function renderCards(cardsArray) {
            const container = document.getElementById('cardsContainer');
            const noVoucherBox = document.getElementById('noVoucherBox');
            const rewardTitle = document.getElementById('rewardTitle');
            
            container.innerHTML = ''; // Clear previous

            if (cardsArray.length === 0) {
                noVoucherBox.style.display = 'block';
                return;
            }

            rewardTitle.style.display = 'block';

            cardsArray.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'voucher-card';
                cardDiv.style.animationDelay = `${index * 0.15}s`; // Stagger animation
                
                cardDiv.innerHTML = `
                    <div class="card-left">
                        <div class="card-name">${card.name}</div>
                        <div class="card-rules">
                            • Valid for 2 Months<br>
                            • One coupon per purchase
                        </div>
                    </div>
                    <div class="card-right">
                        <div class="card-value">₹${card.amount}</div>
                    </div>
                `;
                container.appendChild(cardDiv);
            });
        }

        function showError(msg) {
            document.getElementById('skeletonLoader').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('uiStatus').innerText = "System Error";
            document.getElementById('uiStatus').style.color = "var(--meena-red)";
            document.getElementById('uiCustomerName').innerText = msg;
            document.getElementById('uiTotal').style.display = 'none';
        }

        // Simulate network delay to show off the skeleton loading effect, then fetch data
        window.onload = () => {
            setTimeout(fetchLastBillAndProcess, 1000); 
        };
    </script>
</body>
</html>
