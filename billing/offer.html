<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Customer Rewards - Meena Marketing</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;700;900&display=swap" rel="stylesheet" />

    <style>
        * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }
        
        /* Shared Core Theme (Matching today.html) */
        :root {
            --bg-color: #121212;
            --surface-color: #212121;
            --surface-light: #2a2a2a;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --meena-red: #ff3333;
            --marketing-white: #ffffff;
            --accent-color: #0056b3;
            --success-color: #00c853;
            --warning-color: #ff9800;
            --nav-bg: #1a1a1a;
            --input-bg: #2a2a2a;
            --border-color: #333333;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
        
        body { 
            font-family: 'Segoe UI', 'Noto Sans Tamil', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            display: flex; 
            flex-direction: column; 
        }

        /* Standard App Header (Copied exactly from today.html) */
        header { 
            background-color: var(--surface-color); 
            padding: 12px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 500; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.5); 
            flex-shrink: 0; 
            width: 100%; 
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .back-btn { color: var(--text-color); cursor: pointer; display: flex; align-items: center; text-decoration: none; }
        .brand-container { display: flex; align-items: center; gap: 10px; }
        .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
        .brand-title { font-size: 1.2em; font-weight: bold; }
        .meena { color: var(--meena-red); }
        .marketing { color: var(--marketing-white); }
        .page-title { font-size: 0.75em; color: var(--success-color); text-transform: uppercase; letter-spacing: 1px;}
        
        .header-right { display: flex; align-items: center; }

        /* Main Center Container */
        .container { 
            padding: 20px; 
            max-width: 500px; /* Kept slim for the rewards cards layout */
            margin: 20px auto; 
            width: 100%; 
            background: var(--bg-color); 
            border-radius: 12px; 
        }

        /* Skeleton Loading Styles */
        .skeleton-wrapper { display: block; }
        .skeleton {
            background: linear-gradient(90deg, #2a2a2a 25%, #333 50%, #2a2a2a 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 6px;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .sk-title { height: 24px; width: 60%; margin: 0 auto 15px auto; }
        .sk-box { height: 110px; width: 100%; margin-bottom: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .sk-card { height: 90px; width: 100%; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border-color); }

        /* Actual Content Styles */
        .content-wrapper { display: none; }

        .bill-summary {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .bill-summary h2 { margin: 0 0 8px 0; font-size: 1.2em; color: var(--success-color); display: flex; align-items: center; justify-content: center; gap: 6px; }
        .bill-summary p { margin: 5px 0; color: var(--text-secondary); font-size: 0.95em; }
        .bill-summary .total { font-size: 1.5em; font-weight: 900; color: var(--marketing-white); margin-top: 10px; letter-spacing: 0.5px;}
        .bill-summary .discount-warning { color: var(--warning-color); font-size: 0.85em; margin-top: 5px; }

        .ai-alert {
            background: rgba(255, 152, 0, 0.1);
            border: 1px solid var(--warning-color);
            color: var(--warning-color);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.85em;
            margin-bottom: 25px;
            display: none;
            align-items: center;
            gap: 10px;
            text-align: left;
            line-height: 1.4;
        }

        /* Voucher Cards Grid */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .voucher-card {
            background: linear-gradient(135deg, #2c2c2c, #1a1a1a);
            border: 1px dashed var(--warning-color);
            border-radius: 12px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: slideUp 0.4s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .card-left { text-align: left; }
        .card-name { font-size: 1.2em; font-weight: bold; color: var(--marketing-white); margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
        .card-rules { font-size: 0.75em; color: var(--text-secondary); line-height: 1.5; }
        
        .card-right { text-align: right; }
        .card-value { font-size: 1.8em; font-weight: 900; color: var(--warning-color); text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }

        .no-voucher {
            text-align: center;
            padding: 30px 20px;
            background: var(--surface-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="bill.html" class="back-btn">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <div class="brand-container">
                <div class="brand-text">
                    <span class="brand-title"><span class="meena">Meena</span> <span class="marketing">Marketing</span></span>
                    <span class="page-title">Smart Rewards</span>
                </div>
            </div>
        </div>
        <div class="header-right">
            <span class="material-symbols-outlined" style="color: var(--warning-color);">workspace_premium</span>
        </div>
    </header>

    <div class="container">
        
        <div class="skeleton-wrapper" id="skeletonLoader">
            <div class="skeleton sk-box"></div>
            <div class="skeleton sk-title" style="margin-top: 20px;"></div>
            <div class="skeleton sk-card"></div>
            <div class="skeleton sk-card"></div>
        </div>

        <div class="content-wrapper" id="mainContent">
            
            <div class="bill-summary">
                <h2 id="uiStatus"><span class="material-symbols-outlined">check_circle</span> Analysis Complete</h2>
                <p id="uiCustomerName">Fetching Name...</p>
                <p id="uiInvoice">Inv: ---</p>
                <div class="total" id="uiTotal">₹0.00</div>
                <div class="discount-warning" id="uiDiscountInfo"></div>
            </div>

            <div class="ai-alert" id="aiAlertBox">
                <span class="material-symbols-outlined" style="font-size: 1.5em;">smart_toy</span>
                <span id="aiAlertText"></span>
            </div>

            <h3 id="rewardTitle" style="display:none; font-size:1em; margin-bottom: 12px; text-align: left; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px;">Vouchers Unlocked</h3>
            
            <div class="cards-container" id="cardsContainer"></div>

            <div class="no-voucher" id="noVoucherBox" style="display:none;">
                <span class="material-symbols-outlined" style="font-size: 2.5em; color: #555; margin-bottom: 10px;">block</span>
                <br>No eligible rewards available for this specific purchase.
            </div>

        </div>
    </div>

    <script type="module">
        import { db } from './config.js';
        import { collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        const VOUCHER_CARDS = [
            { name: "Card 1", amount: 150 },
            { name: "Card 2", amount: 200 },
            { name: "Card 3", amount: 250 },
            { name: "Card 4", amount: 300 }
        ];

        async function fetchLastBillAndProcess() {
            try {
                // Fetching the last bill accurately ordered by date descending
                const q = query(collection(db, "sellings"), orderBy("date", "desc"), limit(1));
                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    showError("No recent sales found.");
                    return;
                }

                // FIXED CRASH HERE: Extracted data from the first document object in the array
                const lastSale = snapshot.docs[0].data(); 
                
                processRewards(lastSale);

            } catch (error) {
                console.error("Firestore Error:", error);
                showError("Database connection failed.");
            }
        }

        function processRewards(saleData) {
            // Updated to accurately reflect the data structure built in bill.html
            const customerName = saleData.customer?.name || "Walk-in Customer";
            const invoiceNo = saleData.invoiceNo || "N/A";
            
            // Handles data nested in totals object
            let grandTotal = 0;
            if (saleData.totals && saleData.totals.grand) {
                grandTotal = parseFloat(saleData.totals.grand);
            } else {
                grandTotal = parseFloat(saleData.grandTotal || 0);
            }

            // Handle discount extraction
            let billDiscount = 0;
            if (saleData.totals && saleData.totals.discount) {
                billDiscount = parseFloat(saleData.totals.discount);
            } else {
                billDiscount = parseFloat(saleData.discount || 0);
            }

            const subTotalBeforeDiscount = grandTotal + billDiscount;
            const discountPercentage = subTotalBeforeDiscount > 0 ? (billDiscount / subTotalBeforeDiscount) * 100 : 0;

            // UI Update
            document.getElementById('uiCustomerName').innerText = customerName;
            document.getElementById('uiInvoice').innerText = `Invoice: ${invoiceNo}`;
            document.getElementById('uiTotal').innerText = `₹${grandTotal.toFixed(2)}`;
            
            if (billDiscount > 0) {
                document.getElementById('uiDiscountInfo').innerText = `Counter Discount: ₹${billDiscount.toFixed(2)} (${discountPercentage.toFixed(1)}%)`;
            }

            let earnedCards = [];
            const aiAlertBox = document.getElementById('aiAlertBox');
            const aiAlertText = document.getElementById('aiAlertText');

            // FIXED BLANK CARD BUG: Providing exact array items instead of nested arrays
            if (grandTotal >= 20000) {
                earnedCards = [VOUCHER_CARDS[0], VOUCHER_CARDS[1], VOUCHER_CARDS[2], VOUCHER_CARDS[3]];
            } else if (grandTotal >= 15000) {
                earnedCards = [VOUCHER_CARDS[0], VOUCHER_CARDS[1], VOUCHER_CARDS[2]];
            } else if (grandTotal >= 10000) {
                earnedCards = [VOUCHER_CARDS[0], VOUCHER_CARDS[1]];
            } else if (grandTotal >= 2000) {
                earnedCards = [VOUCHER_CARDS[0]];
            }

            // Discount Penalty Logic
            if (discountPercentage >= 10) {
                earnedCards = [];
                aiAlertText.innerHTML = "<strong>System Adjustment:</strong> Maximum counter discount detected. Additional vouchers disabled to protect margins.";
                aiAlertBox.style.display = 'flex';
            } 
            else if (discountPercentage >= 5 && earnedCards.length > 0) {
                earnedCards = [VOUCHER_CARDS[0]]; // FIXED BLANK CARD BUG: Accessing correct base tier object
                aiAlertText.innerHTML = "<strong>System Adjustment:</strong> Existing counter discount detected. Reward scaled down to Base Tier (Card 1).";
                aiAlertBox.style.display = 'flex';
            }

            renderCards(earnedCards);
            
            document.getElementById('skeletonLoader').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }

        function renderCards(cardsArray) {
            const container = document.getElementById('cardsContainer');
            const noVoucherBox = document.getElementById('noVoucherBox');
            const rewardTitle = document.getElementById('rewardTitle');
            
            container.innerHTML = ''; 

            if (cardsArray.length === 0) {
                noVoucherBox.style.display = 'block';
                return;
            }

            rewardTitle.style.display = 'block';

            cardsArray.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'voucher-card';
                cardDiv.style.animationDelay = `${index * 0.15}s`; 
                
                cardDiv.innerHTML = `
                    <div class="card-left">
                        <div class="card-name"><span class="material-symbols-outlined" style="font-size: 1.1em; color: var(--success-color);">redeem</span> ${card.name}</div>
                        <div class="card-rules">
                            • Valid for 2 Months<br>
                            • One coupon per purchase
                        </div>
                    </div>
                    <div class="card-right">
                        <div class="card-value">₹${card.amount}</div>
                    </div>
                `;
                container.appendChild(cardDiv);
            });
        }

        function showError(msg) {
            document.getElementById('skeletonLoader').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('uiStatus').innerHTML = '<span class="material-symbols-outlined">error</span> System Error';
            document.getElementById('uiStatus').style.color = "var(--meena-red)";
            document.getElementById('uiCustomerName').innerText = msg;
            document.getElementById('uiTotal').style.display = 'none';
        }

        // Slight network delay to simulate processing and trigger skeleton load perfectly
        window.onload = () => {
            setTimeout(fetchLastBillAndProcess, 800); 
        };
    </script>
</body>
</html>
