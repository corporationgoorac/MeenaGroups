<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- STRICT NO ZOOM VIEWPORT LOCK -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign in - Meena Marketing</title>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b111a;
            --surface-color: #131b26;
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --input-border: #334155;
            --input-focus: #3b82f6;
            --error-color: #ef4444;
        }

        /* --- GLOBAL ANTI-COPY, ANTI-ZOOM & NO-SCROLL RULES --- */
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none; /* Firefox */
            -ms-user-select: none; /* IE10+/Edge */
            user-select: none; /* Standard */
            -webkit-touch-callout: none; /* iOS Safari */
            -ms-overflow-style: none; /* IE and Edge scrollbar hiding */
            scrollbar-width: none; /* Firefox scrollbar hiding */
        }

        *::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera scrollbar hiding */
        }

        html, body {
            touch-action: manipulation; /* Prevent double-tap zoom */
            width: 100%;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Strictly prevents all side scrolling */
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Allow typing in inputs */
        input {
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }

        /* --- LOGIN CARD (Google/X Inspired) --- */
        .login-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background-color: var(--surface-color);
            width: 100%;
            max-width: 440px;
            padding: 48px 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .brand-title {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            margin: 0;
        }

        /* --- FORM ELEMENTS --- */
        .form-group {
            position: relative;
            margin-bottom: 20px;
            width: 100%;
        }

        .form-input {
            width: 100%;
            background: transparent;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 16px 16px;
            color: white;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 1px var(--input-focus);
        }

        .form-input::placeholder {
            color: transparent; /* For floating label effect */
        }

        /* Floating Label */
        .form-label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 16px;
            pointer-events: none;
            transition: 0.2s ease all;
            background-color: var(--surface-color);
            padding: 0 4px;
        }

        .form-input:focus ~ .form-label,
        .form-input:not(:placeholder-shown) ~ .form-label {
            top: 0;
            font-size: 12px;
            color: var(--accent-color);
        }

        /* --- BUTTONS --- */
        .btn-primary {
            width: 100%;
            background: var(--text-color);
            color: #000000;
            border: none;
            border-radius: 30px; /* X-style rounded buttons */
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:hover {
            background: #e2e8f0;
        }

        .btn-primary:disabled {
            background: #64748b;
            cursor: not-allowed;
            transform: none;
        }

        /* Error Message */
        .error-msg {
            color: var(--error-color);
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            min-height: 18px;
            font-weight: 500;
        }

        /* Spinner for loading state */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 480px) {
            .login-card {
                padding: 40px 24px;
                border: none;
                box-shadow: none;
                background: transparent;
            }
            .brand-header {
                margin-bottom: 40px;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            
            <div class="brand-header">
                <img src="icon.png" alt="Logo" class="brand-logo" onerror="this.src='https://via.placeholder.com/54/131b26/ffffff?text=App'">
                <h1 class="brand-title">Sign in</h1>
                <p class="brand-subtitle">to continue to Meena Soundbox</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <input type="email" id="email" class="form-input" placeholder="Email" required autocomplete="username">
                    <label for="email" class="form-label">Email address</label>
                </div>

                <div class="form-group">
                    <input type="password" id="password" class="form-input" placeholder="Password" required autocomplete="current-password">
                    <label for="password" class="form-label">Password</label>
                </div>

                <button type="submit" id="loginBtn" class="btn-primary">
                    <span id="btnText">Next</span>
                    <div class="spinner" id="btnSpinner"></div>
                </button>
            </form>

            <div class="error-msg" id="errorMsg"></div>

        </div>
    </div>

    <!-- Firebase Authentication Logic -->
    <script type="module">
        // Import Firebase configuration from your existing config.js
        import { auth } from './config.js';
        import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const errorMsg = document.getElementById('errorMsg');

        // Check if user is already logged in -> auto redirect
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.replace('index.html');
            }
        });

        // Form Submit Handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) return;

            // UI Loading State
            loginBtn.disabled = true;
            btnText.style.display = 'none';
            btnSpinner.style.display = 'block';
            errorMsg.textContent = ''; // Clear previous errors

            try {
                // Firebase Sign In
                await signInWithEmailAndPassword(auth, email, password);
                
                // On success, redirect to index
                window.location.replace('index.html');
                
            } catch (error) {
                console.error("Login Error:", error.code);
                
                // Handle common Firebase Auth errors professionally
                switch (error.code) {
                    case 'auth/invalid-credential':
                    case 'auth/user-not-found':
                    case 'auth/wrong-password':
                        errorMsg.textContent = 'Invalid email or password.';
                        break;
                    case 'auth/invalid-email':
                        errorMsg.textContent = 'Please enter a valid email format.';
                        break;
                    case 'auth/too-many-requests':
                        errorMsg.textContent = 'Too many attempts. Please try again later.';
                        break;
                    case 'auth/network-request-failed':
                        errorMsg.textContent = 'Network error. Check your connection.';
                        break;
                    default:
                        errorMsg.textContent = 'Authentication failed. Please try again.';
                }

                // Reset UI State
                loginBtn.disabled = false;
                btnText.style.display = 'block';
                btnSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
