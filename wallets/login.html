<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  
  <link rel="manifest" href="./manifest.json">
  
  <title>Meena Wallets - Login</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #ffffff;
      --text-main: #050505;
      --text-muted: #65676b;
      --primary: #10b981; /* Professional Finance Green */
      --primary-hover: #059669;
      --input-bg: #f0f2f5;
      --input-text: #050505;
      --google-btn-bg: #ffffff;
      --google-btn-border: #ced0d4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* Meta/Facebook style soft dark theme */
        --bg-color: #121212;
        --text-main: #e4e6eb;
        --text-muted: #a3a3a3;
        --primary: #2ea043;
        --primary-hover: #238636;
        --input-bg: #2d2d2d;
        --input-text: #e4e6eb;
        --google-btn-bg: #1e1e1e;
        --google-btn-border: #333333;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* No Box - Just a constrained container area */
    .app-container {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: 0 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand-title {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 16px;
      font-weight: 400;
      color: var(--text-muted);
      margin-bottom: 48px;
      line-height: 1.5;
    }

    .accent-dot {
      color: var(--primary);
    }

    button {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-google {
      background-color: var(--google-btn-bg);
      color: var(--text-main);
      border: 1px solid var(--google-btn-border);
    }

    .btn-google:hover {
      background-color: var(--input-bg);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      margin-top: 32px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.2);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    #onboarding-section {
      display: none; 
      animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-group {
      margin-top: 16px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    .input-group input {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 2px solid transparent;
      background-color: var(--input-bg);
      color: var(--input-text);
      font-size: 16px;
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-group input:focus {
      border-color: var(--primary);
      background-color: transparent;
    }

    .input-group input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Setup Service Worker */
    .pwa-script {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <h1 class="brand-title">Meena<br>Wallets<span class="accent-dot">.</span></h1>
    <p class="brand-subtitle">Streamlined business operations and real-time cash flow management.</p>

    <div id="login-section">
      <button id="google-btn" class="btn-google">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>
    </div>

    <div id="onboarding-section">
      <div class="input-group">
        <label for="display-name">Confirm your name</label>
        <input type="text" id="display-name" placeholder="E.g. Meena Marketing">
      </div>
      <button id="continue-btn" class="btn-primary">Initialize Wallets</button>
    </div>

  </div>

  <script type="module">
    import { db, loginWithGoogle } from './config.js';
    import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const loginSection = document.getElementById('login-section');
    const onboardingSection = document.getElementById('onboarding-section');
    const googleBtn = document.getElementById('google-btn');
    const continueBtn = document.getElementById('continue-btn');
    const nameInput = document.getElementById('display-name');

    let pendingUser = null;

    googleBtn.addEventListener('click', async () => {
      try {
        googleBtn.innerHTML = 'Connecting...';
        googleBtn.style.opacity = '0.5';
        googleBtn.disabled = true;

        pendingUser = await loginWithGoogle();

        const userRef = doc(db, 'users', pendingUser.uid);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
          window.location.href = 'index.html';
        } else {
          loginSection.style.display = 'none';
          onboardingSection.style.display = 'block';
          
          if (pendingUser.displayName) {
            nameInput.value = pendingUser.displayName;
          }
        }
      } catch (error) {
        console.error("Login failed:", error);
        googleBtn.innerHTML = 'Continue with Google';
        googleBtn.style.opacity = '1';
        googleBtn.disabled = false;
      }
    });

    continueBtn.addEventListener('click', async () => {
      const finalName = nameInput.value.trim();
      
      if (!finalName) return;

      try {
        continueBtn.innerHTML = 'Securing Data...';
        continueBtn.disabled = true;

        const userRef = doc(db, 'users', pendingUser.uid);
        
        await setDoc(userRef, {
          uid: pendingUser.uid,
          name: finalName,
          email: pendingUser.email,
          createdAt: serverTimestamp(),
          settings: { currency: '₹' }
        });

        window.location.href = 'index.html';

      } catch (error) {
        console.error("Setup failed:", error);
        continueBtn.innerHTML = 'Initialize Wallets';
        continueBtn.disabled = false;
      }
    });
  </script>

  <script class="pwa-script">
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }
  </script>

</body>
</html>
