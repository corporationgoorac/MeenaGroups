<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  
  <title>Meena Wallets - Login</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --primary: #10b981; /* Professional Green */
      --primary-hover: #059669;
      --input-border: #d1d5db;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --card-bg: #1e1e1e;
        --text-main: #ffffff;
        --text-muted: #9ca3af;
        --primary: #10b981;
        --primary-hover: #34d399;
        --input-border: #374151;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      transition: background-color 0.3s ease;
    }

    .login-card {
      background-color: var(--card-bg);
      padding: 40px 30px;
      border-radius: 24px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
      transition: background-color 0.3s ease;
    }

    .brand-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--primary), #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-google {
      background-color: var(--text-main);
      color: var(--bg-color);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      margin-top: 20px;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    #onboarding-section {
      display: none; /* Hidden by default */
      text-align: left;
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .input-group input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--input-border);
      background-color: transparent;
      color: var(--text-main);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input-group input:focus {
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h1 class="brand-title">Meena Wallets</h1>
    <p class="brand-subtitle">Manage your business operations & cash flow</p>

    <div id="login-section">
      <button id="google-btn" class="btn-google">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign in with Google
      </button>
    </div>

    <div id="onboarding-section">
      <div class="input-group">
        <label for="display-name">Confirm your name</label>
        <input type="text" id="display-name" placeholder="Enter your name">
      </div>
      <button id="continue-btn" class="btn-primary">Set Up My Wallets</button>
    </div>
  </div>

  <script type="module">
    // Import from your established config
    import { db, loginWithGoogle } from './config.js';
    
    // Import Firestore utilities directly via CDN matching your config version
    import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    // DOM Elements
    const loginSection = document.getElementById('login-section');
    const onboardingSection = document.getElementById('onboarding-section');
    const googleBtn = document.getElementById('google-btn');
    const continueBtn = document.getElementById('continue-btn');
    const nameInput = document.getElementById('display-name');

    // State variable to hold the user instance between steps
    let pendingUser = null;

    // Step 1: Handle Google Sign-in
    googleBtn.addEventListener('click', async () => {
      try {
        googleBtn.innerHTML = 'Connecting...';
        googleBtn.style.opacity = '0.7';
        googleBtn.disabled = true;

        pendingUser = await loginWithGoogle();

        // Check if user exists in the 'users' collection
        const userRef = doc(db, 'users', pendingUser.uid);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
          // User already exists, route immediately to app
          window.location.href = 'index.html';
        } else {
          // First-time user: Hide login button, show name input
          loginSection.style.display = 'none';
          onboardingSection.style.display = 'block';
          
          // Pre-fill the input with their Google display name
          if (pendingUser.displayName) {
            nameInput.value = pendingUser.displayName;
          }
        }
      } catch (error) {
        console.error("Login failed:", error);
        googleBtn.innerHTML = 'Sign in with Google';
        googleBtn.style.opacity = '1';
        googleBtn.disabled = false;
        alert("Authentication failed. Please check your connection and try again.");
      }
    });

    // Step 2: Handle First-Time User Creation
    continueBtn.addEventListener('click', async () => {
      const finalName = nameInput.value.trim();
      
      if (!finalName) {
        alert("Please enter a valid name to continue.");
        return;
      }

      try {
        continueBtn.innerHTML = 'Creating Profile...';
        continueBtn.disabled = true;

        const userRef = doc(db, 'users', pendingUser.uid);
        
        // Create the initial user document
        await setDoc(userRef, {
          uid: pendingUser.uid,
          name: finalName,
          email: pendingUser.email,
          createdAt: serverTimestamp(),
          settings: {
            currency: '₹' // Preparing default settings for future
          }
        });

        // Setup complete, route to main app
        window.location.href = 'index.html';

      } catch (error) {
        console.error("Error creating user profile:", error);
        continueBtn.innerHTML = 'Set Up My Wallets';
        continueBtn.disabled = false;
        alert("Failed to create profile. Please try again.");
      }
    });
  </script>
</body>
</html>
