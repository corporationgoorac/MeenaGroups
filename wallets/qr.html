<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="./manifest.json">
  
  <title>Meena Wallets - QR Code</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  
  <style>
    :root {
      --bg-color: #ffffff;
      --surface-color: #f9fafb;
      --text-main: #050505;
      --text-muted: #65676b;
      --primary: #10b981;
      --primary-hover: #059669;
      --danger: #e41e3f;
      --danger-bg: #ffe4e8;
      --border-color: #ced0d4;
      --input-bg: #f0f2f5;
      --input-text: #050505;
      --nav-bg: rgba(255, 255, 255, 0.85);
      --modal-overlay: rgba(0,0,0,0.4);
      --skeleton-bg: #e2e5e7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --surface-color: #1e1e1e;
        --text-main: #e4e6eb;
        --text-muted: #a3a3a3;
        --primary: #2ea043;
        --border-color: #333333;
        --input-bg: #2d2d2d;
        --input-text: #e4e6eb;
        --nav-bg: rgba(18, 18, 18, 0.85);
        --danger: #ff6b6b;
        --danger-bg: rgba(255, 107, 107, 0.1);
        --modal-overlay: rgba(0,0,0,0.7);
        --skeleton-bg: #2d2d2d;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      /* HIDE SCROLLBAR LOGIC START */
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
    
    /* Hide scrollbar for Chrome, Safari and Opera */
    *::-webkit-scrollbar {
      display: none;
    }
    /* HIDE SCROLLBAR LOGIC END */

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100dvh; /* Changed to 100dvh for better mobile keyboard handling */
      width: 100vw;
      overflow: hidden;
      transition: background-color 0.3s ease;
    }

    /* Top Navigation */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      background-color: var(--bg-color);
      z-index: 10;
      flex-shrink: 0;
    }

    .nav-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .back-btn, .header-icon-btn {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 8px 0;
      transition: transform 0.2s;
    }
    .header-icon-btn:active, .back-btn:active {
      transform: scale(0.9);
    }

    /* Main Container */
    .app-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 24px 30px 24px; /* Added more bottom padding */
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
    }

    .amount-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 5px;
      flex: 1; /* Makes it take up massive central space like GPay */
    }

    .amount-label {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }

    /* Upgraded Big Seamless Input - Google Pay Style */
    .big-amount-input {
      font-size: 72px; /* Adjusted slightly so big numbers fit mobile screens */
      font-weight: 800;
      text-align: center;
      padding: 10px 0;
      background: transparent;
      border: none;
      box-shadow: none;
      color: var(--text-main);
      width: 100%;
      outline: none;
      transition: opacity 0.2s, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      caret-color: var(--primary);
      -webkit-appearance: none;
    }
    .big-amount-input::placeholder {
      color: var(--border-color);
    }
    .big-amount-input:focus {
      transform: scale(1.03); /* Subtle pop on typing */
    }

    .input-group {
      margin-bottom: 4px;
    }
    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    /* Custom Dropdown Trigger Replacing Select */
    .custom-select-trigger {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 2px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--input-text);
      font-size: 16px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    input[type="text"], input[type="color"] {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 2px solid transparent;
      background-color: var(--input-bg);
      color: var(--input-text);
      font-size: 16px;
      font-weight: 600;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background-color: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(46, 160, 67, 0.2);
      transition: transform 0.2s;
    }
    
    /* Fixed Button to Bottom */
    #generate-btn {
      margin-top: auto;
    }
    
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-danger {
      background-color: var(--danger);
      color: white;
    }

    /* Modals */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--modal-overlay);
      opacity: 0; visibility: hidden;
      transition: opacity 0.3s ease; z-index: 2000;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }

    .modal-slide-side {
      position: fixed; top: 0; right: 0; bottom: 0; width: 100%; max-width: 400px;
      background-color: var(--bg-color);
      padding: 24px; overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2001;
      box-shadow: -5px 0 25px rgba(0,0,0,0.1);
    }
    .modal-slide-side.active { transform: translateX(0); }
    
    .modal-sheet {
      position: fixed; bottom: 0; left: 0; right: 0;
      background-color: var(--bg-color);
      border-top-left-radius: 24px; border-top-right-radius: 24px;
      padding: 24px; padding-bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2001;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
    }
    .modal-sheet.full-height { height: 90vh; }
    .modal-sheet.active { transform: translateY(0); }
    
    /* Top tier z-index for alerts */
    .modal-sheet.alert-level { z-index: 3000; }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .modal-title { font-size: 20px; font-weight: 700; }
    .close-modal {
      background: var(--input-bg); border: none; border-radius: 50%;
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      color: var(--text-main); cursor: pointer;
    }

    /* UPI Selector List */
    .upi-option-item {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
    }
    .upi-option-item:last-child { border-bottom: none; }
    .upi-option-name { font-weight: 700; font-size: 16px; }
    .upi-option-id { font-size: 13px; color: var(--text-muted); }

    /* UPI Management List */
    .upi-list {
      margin-top: 24px;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }
    .upi-item {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .upi-item-info { display: flex; flex-direction: column; gap: 4px; }
    .upi-item-name { font-weight: 700; font-size: 15px; }
    .upi-item-id { font-size: 13px; color: var(--text-muted); }
    .btn-remove {
      background: var(--danger-bg);
      color: var(--danger);
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    /* Google Pay Style QR UI */
    .qr-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--surface-color);
      border-radius: 24px;
      padding: 32px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
    }
    
    .qr-branding {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
      text-align: center;
    }
    .qr-amount-display {
      font-size: 42px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 24px;
      text-align: center;
    }
    
    .qr-box {
      background: #ffffff; 
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 24px;
      border: 2px solid #e2e5e7;
      position: relative;
    }
    .qr-box img {
      display: block;
      width: 240px;
      height: 240px;
    }

    .qr-powered {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: auto;
    }

    .btn-share {
      background: var(--surface-color);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }

  </style>
</head>
<body>

  <div class="top-nav">
    <div style="display: flex; align-items: center; gap: 8px;">
      <button class="back-btn" onclick="window.location.href='index.html'">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
    </div>

    <div class="nav-title">Receive Payment</div>
    
    <!-- Relocated icons to the right side -->
    <div style="display: flex; align-items: center; gap: 8px;">
      <button class="header-icon-btn" onclick="openModal('branding-modal')">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
      </button>
      <button class="header-icon-btn" onclick="openModal('manage-upi-modal')">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"></rect>
          <line x1="2" y1="10" x2="22" y2="10"></line>
          <line x1="7" y1="15" x2="7.01" y2="15"></line>
          <line x1="11" y1="15" x2="13" y2="15"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="app-container">
    <div class="amount-section">
      <div class="amount-label">Enter Amount to Receive</div>
      <input type="text" inputmode="numeric" id="receive-amount" class="big-amount-input" placeholder="₹0">
    </div>

    <div class="input-group">
      <label>Receive to Account</label>
      <div class="custom-select-trigger" onclick="openModal('select-upi-modal')">
        <span id="selected-upi-display">Select an Account...</span>
        <span>▼</span>
      </div>
    </div>
    
    <div class="input-group">
      <label>Payment Note (Optional)</label>
      <input type="text" id="payment-note" placeholder="e.g. Invoice #123" maxlength="50" style="padding: 16px; border-radius: 14px;">
    </div>

    <button class="btn-primary" id="generate-btn">Generate QR Code</button>
  </div>

  <div id="modal-overlay" class="modal-overlay" onclick="closeModal()"></div>

  <div id="custom-alert-modal" class="modal-sheet alert-level">
    <div class="modal-header">
      <div class="modal-title">Notice</div>
      <button class="close-modal" onclick="closeModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <p id="custom-alert-text" style="margin-bottom: 24px; line-height: 1.5;"></p>
    <button class="btn-primary" onclick="closeModal()">OK</button>
  </div>

  <div id="custom-confirm-modal" class="modal-sheet alert-level">
    <div class="modal-header">
      <div class="modal-title">Confirm Action</div>
      <button class="close-modal" onclick="closeModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <p id="custom-confirm-text" style="margin-bottom: 24px; line-height: 1.5; color: var(--danger); font-weight: 600;"></p>
    <div style="display: flex; gap: 12px;">
      <button class="btn-primary" style="background: var(--input-bg); color: var(--text-main);" onclick="closeModal()">Cancel</button>
      <button class="btn-primary btn-danger" id="custom-confirm-btn">Yes, Remove</button>
    </div>
  </div>

  <div id="select-upi-modal" class="modal-sheet">
    <div class="modal-header">
      <div class="modal-title">Select Account</div>
      <button class="close-modal" onclick="closeModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div id="upi-options-container" style="max-height: 50vh; overflow-y: auto;">
      <div style="color:var(--text-muted); font-size:14px; text-align:center;">Loading...</div>
    </div>
  </div>

  <div id="branding-modal" class="modal-slide-side">
    <div class="modal-header">
      <div class="modal-title">QR Customization</div>
      <button class="close-modal" onclick="closeModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    
    <div style="margin-bottom: 24px;">
      <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px;">Brand Name</label>
      <input type="text" id="brand-name-input" placeholder="e.g. Meena Groups" style="margin-bottom: 16px;">
      
      <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px;">To Text</label>
      <input type="text" id="to-text-input" placeholder="e.g. To: Meena Groups" style="margin-bottom: 16px;">
      
      <div style="display: flex; gap: 12px; margin-bottom: 16px;">
        <div style="flex: 1;">
          <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px;">Gradient Start</label>
          <input type="color" id="qr-color-input" value="#000000" style="padding: 0; border: none; height: 50px; cursor: pointer;">
        </div>
        <div style="flex: 1;">
          <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px;">Gradient End</label>
          <input type="color" id="qr-color-input-2" value="#10b981" style="padding: 0; border: none; height: 50px; cursor: pointer;">
        </div>
      </div>
      
      <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px;">QR Background Color</label>
      <input type="color" id="qr-bg-input" value="#ffffff" style="padding: 0; border: none; height: 50px; cursor: pointer; margin-bottom: 24px;">

      <button class="btn-primary" id="save-branding-btn" style="padding: 12px;">Save Configurations</button>
      <p style="font-size: 12px; color: var(--text-muted); margin-top: 12px; text-align: center;">Costs 0 extra reads. Saves directly alongside UPI Config.</p>
    </div>
  </div>

  <div id="manage-upi-modal" class="modal-slide-side">
    <div class="modal-header">
      <div class="modal-title">Manage UPI IDs</div>
      <button class="close-modal" onclick="closeModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    
    <div style="margin-bottom: 24px;">
      <input type="text" id="new-upi-name" placeholder="Display Name (e.g. HDFC Current)" style="margin-bottom: 12px;">
      <input type="text" id="new-upi-id" placeholder="UPI ID (e.g. you@bank)" style="margin-bottom: 12px;">
      <button class="btn-primary" id="add-upi-btn" style="padding: 12px;">Add Account</button>
    </div>

    <div class="upi-list" id="upi-list-container">
      <div style="color:var(--text-muted); font-size:14px; text-align:center;">Loading...</div>
    </div>
  </div>

  <div id="qr-display-modal" class="modal-sheet full-height">
    <div class="modal-header" style="margin-bottom: 16px;">
      <div class="modal-title">Scan to Pay</div>
      <button class="close-modal" onclick="closeModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    
    <div class="qr-container" id="qr-export-area">
      <div class="qr-branding" id="qr-branding-text">Meena Groups</div>
      <div class="qr-amount-display" id="display-qr-amount">₹0</div>
      
      <div class="qr-box">
        <img id="qr-image" src="" alt="QR Code">
      </div>
      
      <div id="qr-to-text" style="font-size:14px; font-weight:600; margin-bottom: 16px;">To: Meena Groups</div>
      
      <div class="qr-powered">Powered by Goorac Pay Infrastructure</div>
    </div>

    <button class="btn-share" id="share-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      Share via WhatsApp
    </button>
    
    <button class="btn-share" id="download-btn" style="margin-top: 12px; background: var(--primary); color: white; border: none;">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      Download QR Code
    </button>
  </div>

  <img id="center-qr-logo" src="qr-logo.png" style="display: none;" alt="logo">

  <script type="module">
    import { db, auth, onAuthStateChanged } from './config.js';
    import { doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    // Custom UI Alert/Confirm Replacement
    window.showCustomAlert = function(msg) {
      document.getElementById('custom-alert-text').textContent = msg;
      openModal('custom-alert-modal');
    };

    window.showCustomConfirm = function(msg, callback) {
      document.getElementById('custom-confirm-text').textContent = msg;
      const btn = document.getElementById('custom-confirm-btn');
      btn.onclick = () => {
        closeModal();
        setTimeout(callback, 300); // Wait for modal slide down
      };
      openModal('custom-confirm-modal');
    };

    // State
    let upiData = [];
    let selectedUpiId = '';
    let rawQrCanvasData = null; // Store base QR without logo for share export
    
    // Global Config State (1 read architecture)
    let globalBrandName = 'Meena Groups';
    let globalToText = 'To: Meena Groups';
    let globalQrColor = '#000000';
    let globalQrColor2 = '#10b981'; // Added secondary color for gradient
    let globalQrBgColor = '#ffffff'; 

    // Elements
    const amountInput = document.getElementById('receive-amount');
    const generateBtn = document.getElementById('generate-btn');
    const shareBtn = document.getElementById('share-btn');
    const downloadBtn = document.getElementById('download-btn');
    const selectedUpiDisplay = document.getElementById('selected-upi-display');
    const upiOptionsContainer = document.getElementById('upi-options-container');
    
    const newUpiName = document.getElementById('new-upi-name');
    const newUpiId = document.getElementById('new-upi-id');
    const addUpiBtn = document.getElementById('add-upi-btn');
    const upiListContainer = document.getElementById('upi-list-container');
    const qrImage = document.getElementById('qr-image');

    // Realtime INR Formatting and Enhanced Cursor Bug Fix
    amountInput.addEventListener('input', (e) => {
      let cursorPosition = e.target.selectionStart;
      let oldLength = e.target.value.length;
      
      let value = e.target.value.replace(/[^0-9]/g, '');
      if(value) {
          e.target.value = '₹' + parseInt(value, 10).toLocaleString('en-IN');
      } else {
          e.target.value = '';
      }
      
      let newLength = e.target.value.length;
      let newCursorPos = cursorPosition + (newLength - oldLength);
      
      // Ensure the cursor doesn't get trapped before the Rupee symbol
      if(newCursorPos < 1 && e.target.value.length > 0) newCursorPos = 1;
      
      try { e.target.setSelectionRange(newCursorPos, newCursorPos); } catch(err) {}
    });

    // Modal Handlers (History API)
    window.openModal = function(modalId) {
      history.pushState({ modalId: modalId }, "", `#${modalId}`);
      document.getElementById('modal-overlay').classList.add('active');
      document.getElementById(modalId).classList.add('active');
    };

    window.closeModal = function() {
      if (history.state && history.state.modalId) {
        history.back();
      } else {
        forceCloseModals();
      }
    };

    function forceCloseModals() {
      document.getElementById('modal-overlay').classList.remove('active');
      document.querySelectorAll('.modal-sheet, .modal-slide-side').forEach(m => m.classList.remove('active'));
    }

    window.addEventListener('popstate', (e) => {
      forceCloseModals();
      if (e.state && e.state.modalId) {
        document.getElementById('modal-overlay').classList.add('active');
        document.getElementById(e.state.modalId).classList.add('active');
      }
    });

    // Database Initialization
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      
      const userRef = doc(db, 'users', user.uid);
      const userSnap = await getDoc(userRef);

      if (userSnap.exists() && userSnap.data().admin === true) {
        loadUPIConfig();
      } else {
        showCustomAlert("Access Denied: Admins only.");
        setTimeout(() => window.location.href = 'index.html', 1500);
      }
    });

    // Integrated 1-Read Data Sync Structure 
    function loadUPIConfig() {
      const upiDocRef = doc(db, 'System', 'upiIDs');
      
      onSnapshot(upiDocRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          upiData = data.ids || [];
          globalBrandName = data.brandName || 'Meena Groups';
          globalToText = data.toText || 'To: Meena Groups';
          globalQrColor = data.qrColor || '#000000';
          globalQrColor2 = data.qrColor2 || globalQrColor; // Retrieve gradient end
          globalQrBgColor = data.qrBgColor || '#ffffff';
          
          // Populate Branding Settings Modal seamlessly
          document.getElementById('brand-name-input').value = globalBrandName;
          document.getElementById('to-text-input').value = globalToText;
          document.getElementById('qr-color-input').value = globalQrColor;
          document.getElementById('qr-color-input-2').value = globalQrColor2;
          document.getElementById('qr-bg-input').value = globalQrBgColor;

          // Propagate variables dynamically to Front-end UI
          document.getElementById('qr-branding-text').textContent = globalBrandName;
          document.getElementById('qr-to-text').textContent = globalToText;
          document.querySelector('.qr-box').style.backgroundColor = globalQrBgColor;

        } else {
          upiData = [];
          setDoc(upiDocRef, { ids: [], brandName: 'Meena Groups', toText: 'To: Meena Groups', qrColor: '#000000', qrColor2: '#10b981', qrBgColor: '#ffffff' }); 
        }
        renderUPIList();
      });
    }
    
    document.getElementById('save-branding-btn').addEventListener('click', async () => {
      const bName = document.getElementById('brand-name-input').value.trim();
      const tText = document.getElementById('to-text-input').value.trim();
      const qColor = document.getElementById('qr-color-input').value;
      const qColor2 = document.getElementById('qr-color-input-2').value;
      const qBgColor = document.getElementById('qr-bg-input').value;
      
      if (!bName || !tText) {
        showCustomAlert("Fields cannot be empty.");
        return;
      }

      const btn = document.getElementById('save-branding-btn');
      btn.textContent = 'Saving...';
      
      try {
        await setDoc(doc(db, 'System', 'upiIDs'), { 
           ids: upiData, 
           brandName: bName, 
           toText: tText, 
           qrColor: qColor,
           qrColor2: qColor2,
           qrBgColor: qBgColor 
        });
        showCustomAlert("Configurations Successfully Updated.");
        closeModal();
      } catch (e) {
        showCustomAlert("Failed to save settings.");
      }
      btn.textContent = 'Save Configurations';
    });

    window.selectUpi = function(upi, name) {
        selectedUpiId = upi;
        selectedUpiDisplay.textContent = `${name} (${upi})`;
        closeModal();
    };

    function renderUPIList() {
      // Custom Modal Dropdown UI
      upiOptionsContainer.innerHTML = upiData.length === 0 ? '<div style="color:var(--text-muted); font-size:14px; text-align:center; padding: 20px;">No accounts added. Manage UPI IDs first.</div>' : '';
      
      // Settings Management UI
      upiListContainer.innerHTML = upiData.length === 0 ? '<div style="color:var(--text-muted); font-size:14px; text-align:center;">No accounts saved yet.</div>' : '';

      upiData.forEach((item, index) => {
        // Dropdown Replacement
        const optDiv = document.createElement('div');
        optDiv.className = 'upi-option-item';
        optDiv.onclick = () => window.selectUpi(item.upi, item.name);
        optDiv.innerHTML = `
          <div class="upi-option-name">${item.name}</div>
          <div class="upi-option-id">${item.upi}</div>
        `;
        upiOptionsContainer.appendChild(optDiv);

        // List Item for Managing
        const div = document.createElement('div');
        div.className = 'upi-item';
        div.innerHTML = `
          <div class="upi-item-info">
            <div class="upi-item-name">${item.name}</div>
            <div class="upi-item-id">${item.upi}</div>
          </div>
          <button class="btn-remove" onclick="window.removeUPI(${index})">Remove</button>
        `;
        upiListContainer.appendChild(div);
      });
      
      // Auto-select first item if nothing is selected
      if(upiData.length > 0 && !selectedUpiId) {
          window.selectUpi(upiData[0].upi, upiData[0].name);
      } else if (upiData.length === 0) {
          selectedUpiId = '';
          selectedUpiDisplay.textContent = 'Select an Account...';
      }
    }

    // Advanced QR Generation with Gradient Color and Center Logo Canvas Merging
    async function createCompositeQR(intentStr) {
       return new Promise((resolve) => {
           // 1. Generate base transparent QR in pure black to act as mask for gradient
           const qr = new QRious({
               value: intentStr,
               size: 600, 
               level: 'H', 
               foreground: '#000000', 
               backgroundAlpha: 0 // Keep transparent to isolate QR code shapes
           });
           
           // 2. Setup Main Canvas
           const canvas = document.createElement('canvas');
           canvas.width = 600;
           canvas.height = 600;
           const ctx = canvas.getContext('2d');
           
           const qrBaseImg = new Image();
           qrBaseImg.src = qr.toDataURL('image/png');
           qrBaseImg.onload = () => {
               
               // A. Draw Main Background Color
               ctx.fillStyle = globalQrBgColor;
               ctx.fillRect(0, 0, 600, 600);
               
               // B. Apply Gradient Masked onto the Black QR Blocks using Temp Canvas
               const tempCanvas = document.createElement('canvas');
               tempCanvas.width = 600; tempCanvas.height = 600;
               const tCtx = tempCanvas.getContext('2d');
               
               tCtx.drawImage(qrBaseImg, 0, 0); // Draw the transparent black QR
               
               tCtx.globalCompositeOperation = 'source-in'; // Only color where QR is drawn
               
               const grad = tCtx.createLinearGradient(0, 0, 600, 600);
               grad.addColorStop(0, globalQrColor);
               grad.addColorStop(1, globalQrColor2);
               tCtx.fillStyle = grad;
               tCtx.fillRect(0, 0, 600, 600);
               
               // Draw the composited gradient QR on top of the main background
               ctx.drawImage(tempCanvas, 0, 0);
               
               // Update raw capture with newly stylized base 
               rawQrCanvasData = canvas.toDataURL('image/png');

               // C. Center Logo Cutout Logic
               const logoEl = document.getElementById('center-qr-logo');
               const logoSize = 130; 
               const center = (600 - logoSize) / 2;
               const circleRadius = (logoSize / 2) + 10;
               
               ctx.fillStyle = globalQrBgColor; 
               ctx.beginPath();
               ctx.arc(300, 300, circleRadius, 0, 2 * Math.PI);
               ctx.fill();

               if (logoEl.complete && logoEl.naturalHeight !== 0) {
                   ctx.drawImage(logoEl, center, center, logoSize, logoSize);
               } else {
                   ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#10b981'; 
                   ctx.font = 'bold 24px Inter';
                   ctx.textAlign = 'center';
                   ctx.textBaseline = 'middle';
                   ctx.fillText(globalBrandName.split(' ')[0].substring(0, 6).toUpperCase(), 300, 300);
               }
               
               resolve(canvas.toDataURL('image/png'));
           };
       });
    }

    addUpiBtn.addEventListener('click', async () => {
      const name = newUpiName.value.trim();
      const upi = newUpiId.value.trim();
      
      if (!name || !upi) {
        showCustomAlert("Please enter both Name and UPI ID.");
        return;
      }

      addUpiBtn.textContent = 'Saving...';
      const newArray = [...upiData, { name, upi }];
      
      try {
        await setDoc(doc(db, 'System', 'upiIDs'), { 
            ids: newArray, 
            brandName: globalBrandName, 
            toText: globalToText, 
            qrColor: globalQrColor,
            qrColor2: globalQrColor2,
            qrBgColor: globalQrBgColor
        });
        newUpiName.value = '';
        newUpiId.value = '';
      } catch (e) {
        showCustomAlert("Failed to save.");
      }
      addUpiBtn.textContent = 'Add Account';
    });

    window.removeUPI = async function(index) {
      showCustomConfirm("Are you sure you want to completely remove this UPI account?", async () => {
          const newArray = [...upiData];
          newArray.splice(index, 1);
          
          try {
            await setDoc(doc(db, 'System', 'upiIDs'), { 
                ids: newArray, 
                brandName: globalBrandName, 
                toText: globalToText, 
                qrColor: globalQrColor,
                qrColor2: globalQrColor2,
                qrBgColor: globalQrBgColor
            });
            if(selectedUpiId === upiData[index].upi) selectedUpiId = ''; // reset if active deleted
          } catch(e) {
            showCustomAlert("Failed to remove.");
          }
      });
    };

    generateBtn.addEventListener('click', async () => {
      const rawAmt = amountInput.value.replace(/[^0-9]/g, ''); 
      const noteInputVal = document.getElementById('payment-note').value.trim(); 

      if (!rawAmt || parseInt(rawAmt) <= 0) {
        showCustomAlert("Please enter a valid amount.");
        return;
      }
      if (!selectedUpiId) {
        showCustomAlert("Please select a receive account.");
        return;
      }

      const formattedAmt = parseInt(rawAmt).toLocaleString('en-IN');
      
      generateBtn.textContent = 'Generating...';

      const noteStr = noteInputVal ? `&tn=${encodeURIComponent(noteInputVal)}` : '';
      const intentStr = `upi://pay?pa=${selectedUpiId}&pn=${encodeURIComponent(globalBrandName)}&am=${rawAmt}&cu=INR${noteStr}`;

      const finalQrDataUrl = await createCompositeQR(intentStr);
      
      document.getElementById('display-qr-amount').textContent = `₹${formattedAmt}`;
      qrImage.src = finalQrDataUrl;

      generateBtn.textContent = 'Generate QR Code';
      openModal('qr-display-modal');
      
      try { if ('vibrate' in navigator) navigator.vibrate([200]); } catch(e) {}
    });

    async function createHighResPosterCanvas(rawAmt, formattedAmt) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1080;
        canvas.height = 1440;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = 'center';
        
        ctx.fillStyle = '#050505';
        ctx.font = 'bold 72px Inter, sans-serif';
        ctx.fillText(globalBrandName, canvas.width / 2, 250);

        const primeColor = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#10b981';
        ctx.fillStyle = primeColor;
        ctx.font = '900 130px Inter, sans-serif';
        ctx.fillText(`₹${formattedAmt}`, canvas.width / 2, 420);

        const qrImg = new Image();
        qrImg.src = qrImage.src; 
        
        await new Promise(resolve => qrImg.onload = resolve);
        
        const boxSize = 650;
        const boxX = (canvas.width - boxSize) / 2;
        const boxY = 550;
        
        ctx.fillStyle = globalQrBgColor; 
        ctx.shadowColor = 'rgba(0,0,0,0.1)';
        ctx.shadowBlur = 40;
        ctx.shadowOffsetY = 15;
        ctx.beginPath();
        ctx.roundRect(boxX, boxY, boxSize, boxSize, 40);
        ctx.fill();
        ctx.shadowColor = 'transparent';

        ctx.strokeStyle = '#e2e5e7';
        ctx.lineWidth = 4;
        ctx.stroke();

        const qrPadding = 50;
        ctx.drawImage(qrImg, boxX + qrPadding, boxY + qrPadding, boxSize - (qrPadding*2), boxSize - (qrPadding*2));

        ctx.fillStyle = '#65676b';
        ctx.font = 'bold 32px Inter, sans-serif';
        ctx.fillText('POWERED BY GOORAC PAY INFRASTRUCTURE', canvas.width / 2, 1350);
        
        return canvas;
    }

    shareBtn.addEventListener('click', async () => {
      const rawAmt = amountInput.value.replace(/[^0-9]/g, '');
      const formattedAmt = parseInt(rawAmt).toLocaleString('en-IN');
      
      shareBtn.innerHTML = 'Generating...';
      shareBtn.disabled = true;

      try {
        const canvas = await createHighResPosterCanvas(rawAmt, formattedAmt);

        canvas.toBlob(async (blob) => {
          const safeFileName = globalBrandName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
          const file = new File([blob], `${safeFileName}_Payment_₹${rawAmt}.png`, { type: 'image/png' });
          
          const shareData = {
            title: `${globalBrandName} Payment`,
            text: `Please complete the payment of ₹${formattedAmt} to ${globalBrandName} using the attached QR code.`,
            files: [file]
          };

          if (navigator.canShare && navigator.canShare(shareData)) {
            await navigator.share(shareData);
          } else {
            showCustomAlert("Your device doesn't support direct image sharing. Use the Download button instead.");
          }
          
          shareBtn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            Share via WhatsApp
          `;
          shareBtn.disabled = false;
        }, 'image/png');

      } catch (err) {
        console.error(err);
        showCustomAlert("Failed to generate sharing image.");
        shareBtn.innerHTML = `Share via WhatsApp`;
        shareBtn.disabled = false;
      }
    });
    
    downloadBtn.addEventListener('click', async () => {
      const rawAmt = amountInput.value.replace(/[^0-9]/g, '');
      const formattedAmt = parseInt(rawAmt).toLocaleString('en-IN');
      
      downloadBtn.innerHTML = 'Saving...';
      downloadBtn.disabled = true;

      try {
        const canvas = await createHighResPosterCanvas(rawAmt, formattedAmt);
        const dataURL = canvas.toDataURL('image/png');
        
        const a = document.createElement('a');
        const safeFileName = globalBrandName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
        a.download = `${safeFileName}_Payment_₹${rawAmt}.png`;
        a.href = dataURL;
        a.click();
        
      } catch (err) {
        console.error(err);
        showCustomAlert("Failed to download image.");
      } finally {
        downloadBtn.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Download QR Code
        `;
        downloadBtn.disabled = false;
      }
    });

  </script>
