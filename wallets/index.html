<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18191a" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="./manifest.json">
  
  <title>Goorac Wallets - Dashboard</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      --bg-color: #ffffff;
      --surface-color: #f9fafb;
      --text-main: #050505;
      --text-muted: #65676b;
      --primary: #10b981;
      --primary-hover: #059669;
      --danger: #e41e3f;
      --border-color: #ced0d4;
      --input-bg: #f0f2f5;
      --input-text: #050505;
      --nav-bg: rgba(255, 255, 255, 0.85);
      --modal-overlay: rgba(0,0,0,0.4);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #18191a;
        --surface-color: #242526;
        --text-main: #e4e6eb;
        --text-muted: #b0b3b8;
        --border-color: #3e4042;
        --input-bg: #3a3b3c;
        --input-text: #e4e6eb;
        --nav-bg: rgba(36, 37, 38, 0.85);
        --modal-overlay: rgba(0,0,0,0.7);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background-color: var(--bg-color);
      z-index: 10;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    
    .brand-title span { color: var(--primary); }

    .header-profile-pic {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid var(--border-color);
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 0 24px 120px 24px;
      display: flex;
      flex-direction: column;
    }

    .page-view {
      display: none;
      animation: fadeIn 0.3s ease forwards;
    }
    .page-view.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #view-denied {
      text-align: center;
      margin-top: 50px;
    }

    .net-worth-card { margin: 20px 0; }
    .net-worth-label { font-size: 14px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .net-worth-amount { font-size: 42px; font-weight: 800; letter-spacing: -1px; margin-top: 4px; }

    .bag-pills-container {
      display: flex;
      overflow-x: auto;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    .bag-pill {
      padding: 12px 20px;
      border-radius: 20px;
      color: white;
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
    }

    .chart-container {
      background-color: var(--surface-color);
      border-radius: 20px;
      padding: 16px;
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background-color: var(--nav-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 40px;
      display: flex;
      justify-content: space-around;
      padding: 8px 12px;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .nav-btn {
      background: none; border: none; color: var(--text-muted);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 8px 16px; border-radius: 30px; cursor: pointer;
    }
    .nav-btn.active { color: var(--primary); background-color: rgba(16, 185, 129, 0.1); }
    .nav-btn svg { width: 24px; height: 24px; }
    .nav-btn span { font-size: 11px; font-weight: 700; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--modal-overlay);
      opacity: 0; visibility: hidden; transition: opacity 0.3s; z-index: 2000;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }

    .modal-sheet {
      position: fixed; bottom: 0; left: 0; right: 0;
      background-color: var(--bg-color);
      border-top-left-radius: 24px; border-top-right-radius: 24px;
      padding: 24px; padding-bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2001;
    }
    .modal-sheet.active { transform: translateY(0); }

    .big-amount-input {
      font-size: 48px; font-weight: 800; text-align: center; width: 100%;
      padding: 20px; background: transparent; border: none; border-bottom: 2px solid var(--border-color);
      color: var(--text-main); outline: none; margin-bottom: 32px;
    }

    .btn-primary {
      width: 100%; padding: 16px; border-radius: 14px; border: none;
      background-color: var(--primary); color: #fff; font-size: 16px; font-weight: 700;
    }

    #gpay-animation {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-color); z-index: 3000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; transition: opacity 0.3s;
    }
    #gpay-animation.active { opacity: 1; visibility: visible; }

    .color-picker { display: flex; gap: 12px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 8px;}
    .color-swatch { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; border: 3px solid transparent; }
    .color-swatch.selected { border-color: var(--text-main); transform: scale(1.1); }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="brand-title">Goorac<span>.</span></div>
    <img id="header-profile-pic" class="header-profile-pic" src="" alt="Profile" onclick="window.location.href='settings.html'">
  </header>

  <main class="main-content">
    <div id="view-denied" class="page-view">
      <h2>Access Denied</h2>
      <p style="color: var(--text-muted);">Admin privileges required.</p>
    </div>

    <div id="view-home" class="page-view">
      <div class="net-worth-card">
        <div class="net-worth-label">Total Liquid Net Worth</div>
        <div class="net-worth-amount" id="total-net-worth">₹0</div>
      </div>
      <div class="bag-pills-container" id="home-bag-pills"></div>
      <div class="chart-container">
        <canvas id="cashFlowChart" height="200"></canvas>
      </div>
    </div>

    <div id="view-pay" class="page-view">
      <h2 style="margin-bottom: 24px;">Log Transaction</h2>
      <div id="pay-bag-list"></div>
    </div>

    <div id="view-manage" class="page-view">
      <div style="display:flex; justify-content:space-between; margin-bottom: 24px;">
        <h2>My Bags</h2>
        <button onclick="openModal('create-bag-modal')" style="background:var(--primary); color:white; border:none; padding:8px 16px; border-radius:20px;">+ New</button>
      </div>
      <div id="manage-bag-list"></div>
    </div>
  </main>

  <nav class="bottom-nav" id="main-nav" style="display:none;">
    <button class="nav-btn active" onclick="switchTab('home')"><span>Home</span></button>
    <button class="nav-btn" onclick="switchTab('pay')"><span>Pay</span></button>
    <button class="nav-btn" onclick="switchTab('manage')"><span>Manage</span></button>
  </nav>

  <div id="modal-overlay" class="modal-overlay" onclick="closeModal()"></div>

  <div id="create-bag-modal" class="modal-sheet">
    <input type="text" id="new-bag-name" placeholder="Bag Name">
    <input type="number" id="new-bag-balance" placeholder="Initial Balance">
    <div class="color-picker" id="bag-color-picker">
        <div class="color-swatch selected" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8);" data-color="linear-gradient(135deg, #3b82f6, #1d4ed8)"></div>
        <div class="color-swatch" style="background: linear-gradient(135deg, #10b981, #047857);" data-color="linear-gradient(135deg, #10b981, #047857)"></div>
        <div class="color-swatch" style="background: linear-gradient(135deg, #ef4444, #b91c1c);" data-color="linear-gradient(135deg, #ef4444, #b91c1c)"></div>
    </div>
    <button class="btn-primary" id="save-bag-btn">Create Bag</button>
  </div>

  <div id="pay-modal" class="modal-sheet">
    <input type="number" id="pay-amount" class="big-amount-input" placeholder="₹0">
    <input type="text" id="pay-note" placeholder="Note">
    <select id="pay-type">
      <option value="expense">Outcome</option>
      <option value="income">Income</option>
    </select>
    <button class="btn-primary" id="submit-pay-btn">Done</button>
  </div>

  <div id="gpay-animation">
    <div style="border: 4px solid var(--primary); border-radius:50%; width:80px; height:80px; display:flex; align-items:center; justify-content:center; color:var(--primary); font-size:40px;">✔</div>
    <h2 style="margin-top:24px;">Success</h2>
  </div>

  <script type="module">
    import { db, auth, onAuthStateChanged } from './config.js';
    import { doc, getDoc, collection, query, where, onSnapshot, writeBatch, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    let bagsData = [];
    let selectedBagIdForPay = null;
    let newBagColor = 'linear-gradient(135deg, #3b82f6, #1d4ed8)';

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      
      const savedPic = localStorage.getItem('gooracProfilePic') || user.photoURL;
      if (savedPic) document.getElementById('header-profile-pic').src = savedPic;

      const userSnap = await getDoc(doc(db, 'users', user.uid));
      if (userSnap.exists() && userSnap.data().admin === true) {
        document.getElementById('view-home').classList.add('active');
        document.getElementById('main-nav').style.display = 'flex';
        initApp();
      } else {
        document.getElementById('view-denied').classList.add('active');
      }
    });

    function initApp() {
      onSnapshot(query(collection(db, 'bags'), where('isActive', '==', true)), (snapshot) => {
        bagsData = [];
        let totalNW = 0;
        snapshot.forEach(d => {
          const b = {id: d.id, ...d.data()};
          bagsData.push(b);
          totalNW += b.currentBalance;
        });
        document.getElementById('total-net-worth').textContent = `₹${totalNW.toLocaleString('en-IN')}`;
        renderUI();
        renderChart();
      });
    }

    function renderUI() {
      const home = document.getElementById('home-bag-pills');
      const pay = document.getElementById('pay-bag-list');
      const manage = document.getElementById('manage-bag-list');
      home.innerHTML = ''; pay.innerHTML = ''; manage.innerHTML = '';

      bagsData.forEach(b => {
        home.innerHTML += `<div class="bag-pill" style="background:${b.color}">${b.name}</div>`;
        pay.innerHTML += `<div onclick="window.openPayModal('${b.id}')" style="background:${b.color}; color:white; padding:20px; border-radius:16px; margin-bottom:12px;">${b.name} (₹${b.currentBalance})</div>`;
        manage.innerHTML += `<div style="padding:16px; border-bottom:1px solid var(--border-color);">${b.name}</div>`;
      });
    }

    window.openPayModal = (id) => {
      selectedBagIdForPay = id;
      openModal('pay-modal');
    };

    document.getElementById('submit-pay-btn').onclick = async () => {
      const amount = parseInt(document.getElementById('pay-amount').value);
      const type = document.getElementById('pay-type').value;
      if (!amount || !selectedBagIdForPay) return;

      const batch = writeBatch(db);
      batch.set(doc(collection(db, 'transactions')), { bagId: selectedBagIdForPay, amount, type, timestamp: serverTimestamp() });
      batch.update(doc(db, 'bags', selectedBagIdForPay), { currentBalance: increment(type === 'expense' ? -amount : amount) });
      
      await batch.commit();
      closeModal();
      document.getElementById('gpay-animation').classList.add('active');
      if (navigator.vibrate) navigator.vibrate();
      setTimeout(() => { document.getElementById('gpay-animation').classList.remove('active'); switchTab('home'); }, 1500);
    };

    // Navigation and Modals
    window.switchTab = (id) => {
      document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`view-${id}`).classList.add('active');
      event.currentTarget.classList.add('active');
    };

    window.openModal = (id) => {
      document.getElementById('modal-overlay').classList.add('active');
      document.getElementById(id).classList.add('active');
    };

    window.closeModal = () => {
      document.getElementById('modal-overlay').classList.remove('active');
      document.querySelectorAll('.modal-sheet').forEach(m => m.classList.remove('active'));
    };

    function renderChart() {
      const ctx = document.getElementById('cashFlowChart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: { labels: ['M','T','W','T','F','S','S'], datasets: [{ label: 'Flow', data:, borderColor: '#10b981' }] },
        options: { plugins: { legend: { display: false } } }
      });
    }
  </script>
</body>
</html>
