<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f" />
  <link rel="manifest" href="manifest.json">
  <title>Payments - Meena Chitfunds</title>
  
  <style>
    /* Theme Variables */
    :root {
      --bg-color: #f8f9fa;
      --text-main: #111111;
      --text-muted: #6b7280;
      --surface-color: #ffffff;
      --surface-hover: #f1f3f5;
      --border-color: #e9ecef;
      --brand-accent: #065fd4;
      --brand-accent-light: #e6f0fa;
      --danger-color: #dc3545;
      --success-color: #0f9d58;
      --modal-overlay: rgba(0, 0, 0, 0.5);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f0f0f;
        --text-main: #f8f9fa;
        --text-muted: #adb5bd;
        --surface-color: #1a1a1a;
        --surface-hover: #2d2d2d;
        --border-color: #343a40;
        --brand-accent: #3ea6ff;
        --brand-accent-light: rgba(62, 166, 255, 0.1);
        --danger-color: #ff4e45;
        --success-color: #34a853;
        --modal-overlay: rgba(0, 0, 0, 0.8);
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Premium Header */
    header {
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 20px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background-color: rgba(var(--bg-color), 0.9);
    }

    .header-titles h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    /* Hero Action Button */
    .action-bar { padding: 20px; }
    .action-btn {
      width: 100%; background: linear-gradient(135deg, var(--brand-accent), #004ba0); color: #ffffff;
      border: none; padding: 18px; border-radius: 16px;
      font-size: 16px; font-weight: 700; cursor: pointer; display: flex;
      justify-content: center; align-items: center; gap: 10px; transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 20px rgba(6, 95, 212, 0.25);
    }
    @media (prefers-color-scheme: dark) {
      .action-btn { background: linear-gradient(135deg, #3ea6ff, #065fd4); box-shadow: 0 8px 20px rgba(6, 95, 212, 0.4); }
    }
    .action-btn:active { transform: scale(0.97); box-shadow: 0 4px 10px rgba(6, 95, 212, 0.2); }
    .action-btn svg { width: 22px; height: 22px; fill: currentColor; }

    /* List Container & Transactions */
    .list-container { padding: 0 20px 80px; }
    .section-title { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 16px; color: var(--text-muted); }

    .txn-card {
      background-color: var(--surface-color); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .txn-left { display: flex; align-items: center; gap: 12px; }
    .txn-icon { width: 40px; height: 40px; border-radius: 50%; background-color: var(--brand-accent-light); color: var(--brand-accent); display: flex; justify-content: center; align-items: center; font-weight: 700; font-size: 18px; }
    .txn-info h3 { margin: 0 0 4px 0; font-size: 16px; font-weight: 700; text-transform: uppercase; }
    .txn-meta { font-size: 12px; color: var(--text-muted); }
    .txn-amount { font-size: 18px; font-weight: 800; color: var(--success-color); text-align: right;}
    .txn-date { font-size: 11px; color: var(--text-muted); text-align: right; margin-top: 4px; font-weight: 500; }

    .load-more-btn { width: 100%; background: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .load-more-btn:active { background: var(--surface-hover); }

    /* Full Screen Side Modals */
    .modal {
      position: fixed; top: 0; right: 0; width: 100%; height: 100%;
      background-color: var(--bg-color); z-index: 100; transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); display: flex; flex-direction: column;
    }
    .modal.active { transform: translateX(0); }
    .modal-header { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border-color); background-color: var(--surface-color); }
    .back-btn { background: none; border: none; color: var(--text-main); padding: 8px; margin-left: -8px; cursor: pointer; }
    .back-btn svg { width: 24px; height: 24px; fill: currentColor; }
    .modal-title { font-size: 18px; font-weight: 700; margin-left: 12px; }
    .modal-body { padding: 24px 20px; flex: 1; overflow-y: auto; }

    /* Forms & Inputs */
    .input-group { margin-bottom: 24px; position: relative; }
    .input-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}
    .input-group input, .input-group select {
      width: 100%; background-color: var(--surface-color); border: 2px solid var(--border-color);
      color: var(--text-main); padding: 16px; border-radius: 12px; font-size: 16px; outline: none; appearance: none; font-weight: 600; transition: border-color 0.2s;
    }
    .input-group input:focus, .input-group select:focus { border-color: var(--brand-accent); }
    
    /* ID Input Specifics */
    #p-id { text-transform: uppercase; font-family: monospace; font-size: 18px; letter-spacing: 1px; }
    
    .validation-icon { position: absolute; right: 16px; bottom: 16px; font-size: 18px; }
    .valid { color: var(--success-color); }
    .invalid { color: var(--danger-color); }
    .loading-text { font-size: 11px; color: var(--brand-accent); position: absolute; right: 14px; top: 0; display: none; font-weight: 700; }

    /* Advanced Calculation Card */
    .calc-card { background: var(--surface-color); padding: 20px; border-radius: 20px; margin-bottom: 24px; border: 1px solid var(--border-color); display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    .calc-card.active { display: block; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .user-profile { display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 16px; }
    .profile-avatar { width: 50px; height: 50px; border-radius: 14px; background: linear-gradient(135deg, var(--brand-accent), #004ba0); color: white; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: 800; }
    .profile-details { flex: 1; }
    .user-name { font-size: 20px; font-weight: 800; margin: 0 0 4px 0; }
    .user-phone { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    
    /* Chit Progress Bar */
    .progress-container { margin-bottom: 20px; }
    .progress-labels { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
    .progress-track { width: 100%; height: 8px; background-color: var(--border-color); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background-color: var(--success-color); border-radius: 4px; transition: width 0.5s ease; }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .stat-box { background: var(--bg-color); padding: 14px; border-radius: 12px; text-align: left; }
    .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
    .stat-value { font-size: 18px; font-weight: 800; color: var(--text-main); }
    .stat-value.highlight { color: var(--brand-accent); }

    /* Neo-Banking Amount Display */
    .due-section { background: var(--bg-color); padding: 24px; border-radius: 16px; text-align: center; border: 2px solid var(--brand-accent-light); position: relative; overflow: hidden;}
    .due-section::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--brand-accent); }
    .due-label { font-size: 14px; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;}
    .due-calc-hint { font-size: 11px; color: var(--brand-accent); font-weight: 600; margin-bottom: 12px; background: var(--brand-accent-light); display: inline-block; padding: 4px 10px; border-radius: 20px;}
    .due-amount-wrapper { display: flex; justify-content: center; align-items: baseline; gap: 4px; }
    .currency-symbol { font-size: 24px; font-weight: 700; color: var(--text-muted); }
    .due-amount-input { width: 100%; max-width: 200px; font-size: 42px; font-weight: 800; color: var(--text-main); text-align: center; background: none; border: none; outline: none; padding: 0; letter-spacing: -1px;}

    .submit-btn { background: var(--success-color); color: #ffffff; border: none; width: 100%; padding: 18px; border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(15, 157, 88, 0.25); transition: 0.2s; margin-top: 20px;}
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
    .submit-btn:active:not(:disabled) { transform: scale(0.97); box-shadow: 0 4px 10px rgba(15, 157, 88, 0.2); }

    /* GPay Style Overlay */
    .gpay-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--bg-color); z-index: 300; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease-in-out;
    }
    .gpay-overlay.active { opacity: 1; pointer-events: all; }
    
    .gpay-circle {
      width: 120px; height: 120px; border-radius: 50%; background-color: #e5f4eb;
      display: flex; justify-content: center; align-items: center; margin-bottom: 24px;
      transform: scale(0); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @media (prefers-color-scheme: dark) { .gpay-circle { background-color: rgba(15, 157, 88, 0.15); } }
    .gpay-overlay.active .gpay-circle { transform: scale(1); }
    
    .gpay-check { width: 60px; height: 60px; fill: none; stroke: var(--success-color); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100; }
    .gpay-overlay.active .gpay-check { animation: drawCheck 0.6s ease forwards 0.3s; }
    @keyframes drawCheck { to { stroke-dashoffset: 0; } }

    .gpay-title { font-size: 24px; font-weight: 800; color: var(--text-main); margin: 0 0 8px 0; opacity: 0; transform: translateY(10px); transition: 0.4s ease 0.5s; }
    .gpay-amount { font-size: 48px; font-weight: 800; color: var(--text-main); margin: 0 0 32px 0; opacity: 0; transform: translateY(10px); transition: 0.4s ease 0.6s; letter-spacing: -1px;}
    .gpay-overlay.active .gpay-title, .gpay-overlay.active .gpay-amount, .gpay-overlay.active .gpay-footer { opacity: 1; transform: translateY(0); }

    .gpay-footer { position: absolute; bottom: 32px; font-size: 12px; color: var(--brand-accent); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0; transition: 0.4s ease 0.8s;}

    /* System Alert Modals */
    .center-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--modal-overlay); z-index: 200; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);}
    .center-modal.active { opacity: 1; pointer-events: all; }
    .mini-modal-content { background-color: var(--surface-color); width: 90%; max-width: 340px; border-radius: 24px; padding: 30px 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); transform: scale(0.95); transition: 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); border: 1px solid var(--border-color); text-align: center; }
    .center-modal.active .mini-modal-content { transform: scale(1); }
    .msg-icon { font-size: 48px; margin-bottom: 16px; }
    .mini-modal-title { font-size: 20px; font-weight: 800; margin: 0 0 12px 0; color: var(--text-main); }
    .mini-modal-text { font-size: 14px; color: var(--text-muted); margin: 0 0 28px 0; line-height: 1.5; font-weight: 500;}
    .mini-btn { padding: 16px; border-radius: 12px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; width: 100%; background-color: var(--brand-accent); color: #fff;}
  </style>
</head>
<body>

  <header>
    <div class="header-titles">
      <h1>Meena Chitfunds</h1>
    </div>
  </header>

  <main>
    <div class="action-bar">
      <button class="action-btn" onclick="openModal('payment-modal')">
        <svg viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
        Record New Payment
      </button>
    </div>

    <div class="list-container">
      <div class="section-title">Recent Ledger</div>
      <div id="txn-list">
        </div>
      <button id="load-more-btn" class="load-more-btn" style="display: none;">Load More Transactions</button>
    </div>
  </main>

  <aside id="payment-modal" class="modal">
    <div class="modal-header">
      <button class="back-btn" onclick="closeModal()"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <div class="modal-title">Payment Portal</div>
    </div>
    <div class="modal-body">
      
      <div class="input-group">
        <label>Participant ID (Search)</label>
        <span class="loading-text" id="p-id-loading">Searching...</span>
        <input type="text" id="p-id" placeholder="e.g., RAHUL_101" autocomplete="off">
        <span class="validation-icon" id="p-id-icon"></span>
      </div>

      <div id="calc-card" class="calc-card">
        <div class="user-profile">
          <div class="profile-avatar" id="u-avatar">?</div>
          <div class="profile-details">
            <h2 class="user-name" id="u-name">Loading...</h2>
            <div class="user-phone" id="u-phone">+91 XXXXX XXXXX</div>
          </div>
        </div>

        <div class="input-group" style="margin-bottom: 16px;">
          <label>Select Active Group</label>
          <select id="u-group-select">
            <option value="">-- Choose a group --</option>
          </select>
        </div>

        <div id="payment-details-view" style="display: none;">
          
          <div class="progress-container">
            <div class="progress-labels">
              <span>Chit Progress</span>
              <span id="d-progress-text">0 / 0 Months</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" id="d-progress-bar" style="width: 0%;"></div>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat-box">
              <div class="stat-label">Last Payment</div>
              <div class="stat-value highlight" id="d-last-paid">₹0</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Total Paid</div>
              <div class="stat-value" id="d-total-paid">₹0</div>
            </div>
          </div>

          <div class="due-section">
            <div class="due-label" id="d-month-label">Installment: Month --</div>
            <div class="due-calc-hint" id="d-calc-hint">Base + Increment</div>
            <div class="due-amount-wrapper">
              <span class="currency-symbol">₹</span>
              <input type="number" id="d-amount-due" class="due-amount-input">
            </div>
          </div>

          <button type="button" class="submit-btn" id="confirm-payment-btn">Approve Transaction</button>
        </div>
      </div>
      
    </div>
  </aside>

  <div id="gpay-overlay" class="gpay-overlay">
    <div class="gpay-circle">
      <svg class="gpay-check" viewBox="0 0 24 24">
        <path d="M4 12 l5 5 l11 -11" />
      </svg>
    </div>
    <div class="gpay-title">Payment Successful</div>
    <div class="gpay-amount" id="gpay-amount-text">₹0</div>
    <div class="gpay-footer">Secured by Goorac</div>
  </div>

  <aside id="message-modal" class="center-modal">
    <div class="mini-modal-content">
      <div id="msg-icon" class="msg-icon">⚠️</div>
      <h3 class="mini-modal-title" id="msg-title">Error</h3>
      <p class="mini-modal-text" id="msg-body">Something went wrong.</p>
      <div class="mini-modal-actions">
        <button class="mini-btn" onclick="closeMessageModal()">Understood</button>
      </div>
    </div>
  </aside>

  <script type="module">
    import { auth, db } from './config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { collection, query, orderBy, limit, getDocs, startAfter, doc, getDoc, writeBatch, increment, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    onAuthStateChanged(auth, (user) => { if (!user) window.location.replace('login.html'); });

    // --- Modal Navigation ---
    window.openModal = function(modalId) {
      document.getElementById(modalId).classList.add('active');
      history.pushState({ modalOpen: true }, '', `#${modalId}`);
    };
    
    window.closeModal = function() {
      if(history.state && history.state.modalOpen) history.back(); 
      else closeAllModals();
    };
    
    function closeAllModals() { 
      document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
      document.getElementById('calc-card').classList.remove('active');
      document.getElementById('p-id').value = '';
      document.getElementById('p-id-icon').innerHTML = '';
      document.getElementById('payment-details-view').style.display = 'none';
      activeGroupData = null;
      targetUserId = null;
    }
    
    window.addEventListener('popstate', closeAllModals);

    window.showMessage = function(title, body, type = 'error') {
      document.getElementById('msg-title').innerText = title;
      document.getElementById('msg-body').innerHTML = body; 
      document.getElementById('msg-icon').innerText = type === 'success' ? '✅' : '⚠️';
      document.getElementById('message-modal').classList.add('active');
    };
    window.closeMessageModal = function() {
      document.getElementById('message-modal').classList.remove('active');
    };

    // --- Global State for Calculation Engine ---
    let targetUserId = null;
    let targetUserName = "";
    let activeGroupData = null; 
    let currentCalcMonth = 0;
    let baselineLastAmount = 0;

    // --- ENFORCED UPPERCASE & Debounced ID Fetching ---
    let timeoutId;
    document.getElementById('p-id').addEventListener('input', (e) => {
      // Force Uppercase visually and logically
      let inputVal = e.target.value.trim().toUpperCase();
      e.target.value = inputVal;

      const icon = document.getElementById('p-id-icon');
      const loader = document.getElementById('p-id-loading');
      const card = document.getElementById('calc-card');

      icon.innerHTML = '';
      card.classList.remove('active');
      document.getElementById('payment-details-view').style.display = 'none';
      targetUserId = null;

      if(inputVal.length < 3) return;

      loader.style.display = 'block';
      clearTimeout(timeoutId);
      
      timeoutId = setTimeout(async () => {
        try {
          const docSnap = await getDoc(doc(db, "users", inputVal));
          loader.style.display = 'none';
          
          if (docSnap.exists()) {
            icon.innerHTML = '✔';
            icon.className = 'validation-icon valid';
            
            const userData = docSnap.data();
            targetUserId = inputVal;
            targetUserName = userData.name;
            
            document.getElementById('u-name').innerText = userData.name;
            document.getElementById('u-phone').innerText = userData.phone || "No phone provided";
            // Set Avatar Initial
            document.getElementById('u-avatar').innerText = userData.name.charAt(0).toUpperCase();
            
            // Populate Groups Dropdown
            const select = document.getElementById('u-group-select');
            select.innerHTML = '<option value="">-- Choose a group --</option>';
            
            if(userData.activeGroups && userData.activeGroups.length > 0) {
                userData.activeGroups.forEach(gId => {
                    const opt = document.createElement('option');
                    opt.value = gId;
                    opt.innerText = `@${gId}`;
                    select.appendChild(opt);
                });
            } else {
                select.innerHTML = '<option value="">No active groups found</option>';
            }

            card.classList.add('active');

          } else {
            icon.innerHTML = '❌';
            icon.className = 'validation-icon invalid';
          }
        } catch (err) {
          console.error(err);
          loader.style.display = 'none';
        }
      }, 600);
    });

    // --- ADVANCED CALCULATION ENGINE (Last Payment + Scheduled Increment) ---
    document.getElementById('u-group-select').addEventListener('change', async (e) => {
        const groupId = e.target.value;
        const detailsView = document.getElementById('payment-details-view');
        
        if(!groupId) {
            detailsView.style.display = 'none';
            return;
        }

        detailsView.style.display = 'none'; 
        
        try {
            // 1. Fetch Group Settings (1 Read)
            const groupSnap = await getDoc(doc(db, "groups", groupId));
            if(!groupSnap.exists()) {
                showMessage("Error", "Group data missing."); return;
            }
            activeGroupData = groupSnap.data();

            // 2. Fetch User's Past Transactions for THIS Group
            const qTxn = query(collection(db, "transactions"), 
                where("subscriberId", "==", targetUserId),
                where("groupId", "==", groupId)
            );
            
            const txnSnap = await getDocs(qTxn);
            let totalPaid = 0;
            let maxMonthPaid = 0;
            let lastAmountPaid = 0;

            txnSnap.forEach(tDoc => {
                let tData = tDoc.data();
                totalPaid += tData.amount;
                if(tData.monthAttributed > maxMonthPaid) {
                    maxMonthPaid = tData.monthAttributed;
                    lastAmountPaid = tData.amount;
                }
            });
            
            baselineLastAmount = lastAmountPaid; // Save globally for UI reference

            // 3. Determine Next Month
            currentCalcMonth = maxMonthPaid + 1;
            let totalMonths = activeGroupData.totalMonths || 0;

            if(currentCalcMonth > totalMonths) {
                showMessage("Chit Complete", "This user has completed all installments for this group!", "success");
                return;
            }

            // 4. BUSINESS LOGIC: Calculate Scheduled Increment 
            let scheduledIncrement = 0;
            let schedule = activeGroupData.installmentSchedule || [];
            
            for(let tier of schedule) {
                if(currentCalcMonth >= tier.start && currentCalcMonth <= tier.end) {
                    scheduledIncrement = tier.amount;
                    break;
                }
            }

            // FINAL MATH: If Month 1, amount is just the scheduled base. Else, Last Paid + Increment.
            let amountDue = 0;
            if (currentCalcMonth === 1) {
                amountDue = scheduledIncrement;
                document.getElementById('d-calc-hint').innerText = "Initial Base Amount";
            } else {
                amountDue = lastAmountPaid + scheduledIncrement;
                document.getElementById('d-calc-hint').innerText = `Last (₹${lastAmountPaid}) + Inc (₹${scheduledIncrement})`;
            }

            // Failsafe
            if(amountDue === 0 && lastAmountPaid > 0) amountDue = lastAmountPaid;

            // 5. Update UI Components
            document.getElementById('d-last-paid').innerText = `₹${Number(lastAmountPaid).toLocaleString('en-IN')}`;
            document.getElementById('d-total-paid').innerText = `₹${Number(totalPaid).toLocaleString('en-IN')}`;
            
            // Progress Bar Math
            document.getElementById('d-progress-text').innerText = `${maxMonthPaid} / ${totalMonths} Months`;
            let progressPercent = totalMonths > 0 ? (maxMonthPaid / totalMonths) * 100 : 0;
            document.getElementById('d-progress-bar').style.width = `${progressPercent}%`;

            document.getElementById('d-month-label').innerText = `Installment: Month ${currentCalcMonth}`;
            document.getElementById('d-amount-due').value = amountDue;

            detailsView.style.display = 'block';

        } catch (err) {
            console.error("Calculation Error:", err);
            showMessage("Calculation Error", "Failed to retrieve ledger math.");
        }
    });

    // --- Submit Payment Logic & GPay Animation ---
    document.getElementById('confirm-payment-btn').addEventListener('click', async () => {
        const btn = document.getElementById('confirm-payment-btn');
        const amountToPay = Number(document.getElementById('d-amount-due').value);
        const groupId = document.getElementById('u-group-select').value;

        if(!amountToPay || amountToPay <= 0) {
            showMessage("Invalid Amount", "Please enter a valid transaction amount."); return;
        }

        btn.innerText = "Processing Security..."; btn.disabled = true;

        try {
            const batch = writeBatch(db);

            // 1. Create Transaction Ledger Entry
            const newTxRef = doc(collection(db, "transactions"));
            batch.set(newTxRef, {
                subscriberId: targetUserId,
                groupId: groupId,
                amount: amountToPay,
                monthAttributed: currentCalcMonth,
                type: "Monthly Installment",
                date: serverTimestamp()
            });

            // 2. Update Group Document Snapshot (For 1-Read Dashboard Loading later)
            const groupRef = doc(db, "groups", groupId);
            
            let snapshotArray = activeGroupData.memberSnapshot || [];
            let userSnapIndex = snapshotArray.findIndex(m => m.id === targetUserId);
            
            if(userSnapIndex > -1) {
                snapshotArray[userSnapIndex].monthsPaid = currentCalcMonth;
            } else {
                snapshotArray.push({
                    id: targetUserId, name: targetUserName, monthsPaid: currentCalcMonth, balanceDue: 0, hasAdvance: false
                });
            }
            batch.update(groupRef, { 
                memberSnapshot: snapshotArray,
                totalPotCollected: increment(amountToPay) 
            });

            // Execute Database writes
            await batch.commit();

            // --- Trigger Premium GPay Success Flow ---
            
            if ("vibrate" in navigator) { navigator.vibrate([100, 50, 100]); }

            document.getElementById('gpay-amount-text').innerText = `₹${amountToPay.toLocaleString('en-IN')}`;
            const overlay = document.getElementById('gpay-overlay');
            overlay.classList.add('active');

            // Clean up and close after animation
            setTimeout(() => {
                overlay.classList.remove('active');
                closeModal();
                loadTransactions(); // Refresh list immediately
                btn.innerText = "Approve Transaction"; btn.disabled = false;
            }, 2500);

        } catch (err) {
            console.error("Payment failed", err);
            showMessage("Payment Failed", "Network error while saving transaction to ledger.");
            btn.innerText = "Approve Transaction"; btn.disabled = false;
        }
    });

    // --- Fetch Transaction History & Pagination ---
    const txnList = document.getElementById('txn-list');
    const loadMoreBtn = document.getElementById('load-more-btn');
    let lastVisibleTxn = null;

    async function loadTransactions(isLoadMore = false) {
      try {
        let q;
        if (isLoadMore && lastVisibleTxn) {
          q = query(collection(db, "transactions"), orderBy("date", "desc"), startAfter(lastVisibleTxn), limit(10));
        } else {
          txnList.innerHTML = ''; 
          q = query(collection(db, "transactions"), orderBy("date", "desc"), limit(10));
        }

        let querySnapshot;
        try {
          querySnapshot = await getDocs(q);
        } catch (err) {
          console.warn("Index missing for date sort. Falling back to basic fetch.");
          const fallbackQ = (isLoadMore && lastVisibleTxn) 
            ? query(collection(db, "transactions"), startAfter(lastVisibleTxn), limit(10)) 
            : query(collection(db, "transactions"), limit(10));
          querySnapshot = await getDocs(fallbackQ);
        }

        if (querySnapshot.empty) {
          if(!isLoadMore) txnList.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding: 20px;">No recent transactions.</div>';
          loadMoreBtn.style.display = 'none';
          return;
        }

        lastVisibleTxn = querySnapshot.docs[querySnapshot.docs.length - 1];

        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          
          let displayDate = "Just now";
          if(data.date) {
              const d = data.date.toDate();
              displayDate = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute:'2-digit' });
          }

          // Initial extraction for Avatar
          const userInitial = data.subscriberId ? data.subscriberId.charAt(0).toUpperCase() : '?';

          const card = document.createElement('div');
          card.className = 'txn-card';
          card.innerHTML = `
            <div class="txn-left">
              <div class="txn-icon">${userInitial}</div>
              <div class="txn-info">
                <h3>@${data.subscriberId}</h3>
                <div class="txn-meta">
                  Grp: ${data.groupId} • Mo. ${data.monthAttributed}
                </div>
              </div>
            </div>
            <div>
              <div class="txn-amount">₹${Number(data.amount).toLocaleString('en-IN')}</div>
              <div class="txn-date">${displayDate}</div>
            </div>
          `;
          txnList.appendChild(card);
        });

        loadMoreBtn.style.display = querySnapshot.docs.length === 10 ? 'block' : 'none';
      } catch (error) { 
        console.error(error); 
        if(!isLoadMore) txnList.innerHTML = `<div style="color:var(--danger-color); text-align:center; padding:20px;">Error loading ledger.</div>`;
      }
    }
    
    loadMoreBtn.addEventListener('click', () => loadTransactions(true));

    // Initialize Page
    loadTransactions();
  </script>
</body>
</html>
