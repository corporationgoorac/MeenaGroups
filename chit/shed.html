<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050505" />
  <title>Broadcast Server - Meena Chitfunds</title>
  
  <style>
    /* Ultra-Premium Fintech Theme Variables */
    :root {
      --bg-color: #f8f9fa;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --surface-color: #ffffff;
      --surface-hover: #f1f5f9;
      --border-color: #e2e8f0;
      --brand-accent: #2563eb;
      --brand-accent-light: #dbeafe;
      --danger-color: #ef4444;
      --danger-light: #fee2e2;
      --warning-color: #f59e0b;
      --warning-light: #fef3c7;
      --success-color: #10b981;
      --success-light: #d1fae5;
      --nav-height: 0px; /* No Nav Bar */
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      --card-shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #050505;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --surface-color: #111111;
        --surface-hover: #1e1e1e;
        --border-color: #262626;
        --brand-accent: #3b82f6;
        --brand-accent-light: rgba(59, 130, 246, 0.15);
        --danger-color: #f87171;
        --danger-light: rgba(248, 113, 113, 0.15);
        --warning-color: #fbbf24;
        --warning-light: rgba(251, 191, 36, 0.15);
        --success-color: #34d399;
        --success-light: rgba(52, 211, 153, 0.15);
        --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
        --card-shadow-hover: 0 20px 40px -5px rgba(0, 0, 0, 0.4);
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      padding-bottom: 40px; 
      background-image: radial-gradient(circle at 50% 0%, var(--surface-color) 0%, var(--bg-color) 100%);
      background-attachment: fixed;
    }

    /* Premium Header */
    header {
      position: sticky;
      top: 0;
      border-bottom: 1px solid rgba(226, 232, 240, 0.1);
      padding: 16px 20px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    @media (prefers-color-scheme: dark) { header { background-color: rgba(5, 5, 5, 0.7); border-bottom: 1px solid rgba(38, 38, 38, 0.5); } }

    .header-left { display: flex; align-items: center; gap: 12px; }
    
    .back-btn {
      color: var(--text-main); display: flex; align-items: center; justify-content: center;
      text-decoration: none; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 50%; padding: 8px;
    }
    .back-btn:active { transform: scale(0.85); background: var(--surface-hover); }
    .back-btn svg { width: 20px; height: 20px; fill: currentColor; }

    .header-titles h1 {
      margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text-main), var(--text-muted));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .refresh-btn {
      display: none !important; /* Hidden per advanced UI request, relies on load triggers */
      background: var(--brand-accent-light); color: var(--brand-accent); border: none;
      padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer;
      align-items: center; gap: 6px; transition: 0.2s;
    }
    .refresh-btn:active { transform: scale(0.9); }
    .refresh-btn svg { width: 14px; height: 14px; fill: currentColor; }

    /* Dashboard Content */
    .dashboard-container { padding: 24px 20px; }

    /* Ultimate Status Card */
    .status-card { 
      background: linear-gradient(135deg, #10b981, #059669); 
      border-radius: 24px; padding: 28px 24px; box-shadow: 0 12px 30px rgba(16, 185, 129, 0.3);
      color: white; margin-bottom: 24px; display: flex; flex-direction: column; gap: 12px;
      transition: all 0.3s ease;
    }
    @media (prefers-color-scheme: dark) { .status-card { background: linear-gradient(135deg, #065f46, #059669); box-shadow: 0 12px 30px rgba(5, 150, 105, 0.2);} }
    .status-card.sleeping { background: linear-gradient(135deg, #64748b, #475569); box-shadow: 0 12px 30px rgba(100, 116, 139, 0.3); }
    .status-card.depressed { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 12px 30px rgba(239, 68, 68, 0.3); }

    .agent-mood-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; }
    .agent-mood-text { font-size: 26px; font-weight: 800; letter-spacing: -1px; line-height: 1.2; }
    .agent-timer { background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 12px; font-size: 15px; font-weight: 700; display: inline-block; width: max-content; backdrop-filter: blur(10px); }

    /* Metrics Grid */
    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px; }
    .metric-box { 
      background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 20px; 
      padding: 20px; box-shadow: var(--card-shadow); display: flex; flex-direction: column; 
    }
    .m-label { font-size: 12px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .m-val { font-size: 28px; font-weight: 800; color: var(--text-main); }

    /* Action Buttons */
    .section-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; color: var(--text-main); }
    
    .danger-zone { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
    .action-btn { 
      background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 16px; 
      padding: 16px; font-weight: 700; font-size: 15px; color: var(--text-main); display: flex; 
      align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; box-shadow: var(--card-shadow);
    }
    .action-btn:active { transform: scale(0.98); background: var(--surface-hover); }
    .action-btn svg { width: 22px; height: 22px; }
    
    .btn-skip { color: var(--warning-color); border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.05); }
    .btn-skip svg { fill: var(--warning-color); }
    
    .btn-reset { color: var(--danger-color); border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.05); }
    .btn-reset svg { fill: var(--danger-color); }

    .btn-force { color: var(--brand-accent); border-color: rgba(37, 99, 235, 0.3); background: rgba(37, 99, 235, 0.05); }
    .btn-force svg { fill: var(--brand-accent); }

    /* Ledger & Queue Grids */
    .list-container { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 20px; padding: 16px; margin-bottom: 24px; box-shadow: var(--card-shadow); }
    
    .empty-state { text-align: center; color: var(--text-muted); font-size: 14px; font-weight: 600; padding: 20px 0; }
    
    .pill-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .id-pill { 
      background: var(--surface-hover); border: 1px solid var(--border-color); border-radius: 12px; 
      padding: 8px 12px; font-family: monospace; font-size: 13px; font-weight: 600; color: var(--text-main);
      display: flex; align-items: center; gap: 6px;
    }
    .id-pill.success { background: var(--success-light); color: #065f46; border-color: var(--success-color); }
    @media (prefers-color-scheme: dark) { .id-pill.success { color: var(--success-color); } }

    /* Dialog System */
    .dialog-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--modal-overlay);
      backdrop-filter: blur(5px); z-index: 200; opacity: 0; visibility: hidden; transition: 0.2s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .dialog-overlay.active { opacity: 1; visibility: visible; }
    .dialog-box {
      background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 24px;
      width: 85%; max-width: 350px; padding: 24px; transform: scale(0.9); transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .dialog-overlay.active .dialog-box { transform: scale(1); }
    .dialog-text { font-size: 16px; color: var(--text-main); margin-bottom: 24px; line-height: 1.5; font-weight: 600;}
    .dialog-buttons { display: flex; justify-content: flex-end; gap: 12px; }
    .dialog-btn { padding: 10px 18px; border-radius: 12px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s; }
    .dialog-btn:active { transform: scale(0.95); }
    .dialog-btn-cancel { background: var(--surface-hover); color: var(--text-muted); }
    .dialog-btn-confirm { background: var(--danger-color); color: white; }

  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="home.html" class="back-btn">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </a>
      <div class="header-titles">
        <h1>Broadcast Server</h1>
      </div>
    </div>
    <button class="refresh-btn" onclick="fetchServerState(true)">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      Sync
    </button>
  </header>

  <main class="dashboard-container">
    
    <div class="status-card" id="agent-card">
      <div class="agent-mood-title" id="ui-day-type">Work Day System Active</div>
      <div class="agent-mood-text" id="ui-mood">Connecting...</div>
      <div class="agent-timer" id="ui-timer">--:--</div>
    </div>

    <div class="metrics-grid">
      <div class="metric-box">
        <div class="m-label">Target Group</div>
        <div class="m-val" id="ui-group-idx">#--</div>
      </div>
      <div class="metric-box">
        <div class="m-label">System State</div>
        <div class="m-val" id="ui-sys-state" style="font-size: 18px; line-height: 1.5; color: var(--success-color);">--</div>
      </div>
    </div>

    <div class="section-title">Pending Queue (<span id="ui-queue-count">0</span>)</div>
    <div class="list-container" id="queue-grid">
      <div class="empty-state">No users in queue.</div>
    </div>

    <div class="section-title" style="color: var(--success-color);">Ledger: Sent Today (<span id="ui-sent-count">0</span>)</div>
    <div class="list-container" id="sent-grid">
      <div class="empty-state">No messages dispatched yet today.</div>
    </div>

    <div class="section-title" style="margin-top: 32px;">Engine Controls</div>
    <div class="danger-zone">
      
      <button class="action-btn btn-force" onclick="handleAction('force')">
        <svg viewBox="0 0 24 24"><path d="M13 3v6h8V3h-8zm0 18h8V11h-8v10zM3 21h8v-6H3v6zm0-8h8V3H3v10z"/></svg>
        Force Immediate Send (Skip Timer)
      </button>

      <button class="action-btn btn-skip" onclick="handleAction('skip')">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        Skip to Next Group Queue
      </button>

      <button class="action-btn btn-reset" onclick="handleAction('reset')">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11H7v-2h10v2z"/></svg>
        Emergency System Reset (Target 0)
      </button>

    </div>

  </main>

  <div class="dialog-overlay" id="dialog-overlay">
    <div class="dialog-box">
      <div class="dialog-text" id="dialog-text">Are you sure?</div>
      <div class="dialog-buttons">
        <button class="dialog-btn dialog-btn-cancel" onclick="closeDialog(false)">Cancel</button>
        <button class="dialog-btn dialog-btn-confirm" id="dialog-btn-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from './config.js';
    import { doc, getDocFromServer, updateDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    // CORE CONFIG
    const docRef = doc(db, 'system', 'scheduler_state');
    let currentState = null;

    // QUOTES
    const calculatingQuotes = ["Calculating month dues 🧮", "Building PDF breakdown 📄", "Checking penalty fees ⚖️", "Polishing ledger 📚"];
    const restingQuotes = ["Group fully notified. Resting 🏖️", "Ledgers balanced for today ✅", "Waiting for tomorrow 📅"];
    const depressedQuotes = ["Ghosted by Node Server 👻", "Connection lost to Engine 💔", "Staring into the void 🕳️"];
    const sleepQuotes = ["System cooling down ❄️", "Deep in REM sleep 🌙", "Out of Office till 6 AM 🚪"];

    // 1 READ ON LOAD - Fetch State directly from server bypass cache
    window.fetchServerState = async function(isManual = false) {
      if(isManual) {
        document.getElementById('ui-mood').innerText = "Querying Server...";
      }
      try {
        const snap = await getDocFromServer(docRef);
        if (snap.exists()) {
          currentState = snap.data();
          renderDashboard();
        } else {
          document.getElementById('ui-mood').innerText = "No Database Found.";
        }
      } catch (e) {
        console.error("Fetch Error:", e);
        document.getElementById('ui-mood').innerText = "Connection Failed ❌";
      }
    };

    // Load instantly on boot (1 Read directly to Cloud)
    fetchServerState();

    function renderDashboard() {
        if (!currentState) return;

        // Populate Metrics
        document.getElementById('ui-group-idx').innerText = `#${currentState.targetGroupIndex || 0}`;
        
        const qCount = currentState.queue ? currentState.queue.length : 0;
        const sCount = currentState.sentToday ? currentState.sentToday.length : 0;
        
        document.getElementById('ui-queue-count').innerText = qCount;
        document.getElementById('ui-sent-count').innerText = sCount;

        // Render Queue List
        const qGrid = document.getElementById('queue-grid');
        if (qCount > 0) {
            qGrid.innerHTML = `<div class="pill-grid">` + 
                currentState.queue.map(u => {
                    // Handle both object and string formats
                    const id = typeof u === 'object' ? u.id : u;
                    return `<div class="id-pill">⏳ ${id}</div>`;
                }).join('') + `</div>`;
        } else {
            qGrid.innerHTML = `<div class="empty-state">No users in queue.</div>`;
        }

        // Render Sent Ledger
        const sGrid = document.getElementById('sent-grid');
        if (sCount > 0) {
            sGrid.innerHTML = `<div class="pill-grid">` + 
                currentState.sentToday.map(id => `<div class="id-pill success">✅ ${id}</div>`).join('') + `</div>`;
        } else {
            sGrid.innerHTML = `<div class="empty-state">No messages dispatched yet today.</div>`;
        }

        // --- CALCULATE REST DAY & AGENT MOOD (IST) ---
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const istTime = new Date(utc + (330 * 60000));
        const currentHour = istTime.getHours();

        const card = document.getElementById('agent-card');
        const moodText = document.getElementById('ui-mood');
        const timerText = document.getElementById('ui-timer');
        const stateText = document.getElementById('ui-sys-state');
        const dayType = document.getElementById('ui-day-type');

        // Check if Rest Day / Idle
        const isResting = (qCount === 0 && currentState.isCompleted === true);

        if (isResting) {
            card.className = "status-card sleeping";
            moodText.innerText = restingQuotes[Math.floor(Date.now() / 600000) % restingQuotes.length];
            timerText.innerText = "Idle Mode";
            stateText.innerText = "Resting";
            stateText.style.color = "var(--text-muted)";
            dayType.innerText = "Rest Day Active";
        } 
        else if (currentHour >= 22 || currentHour < 6) {
            card.className = "status-card sleeping";
            moodText.innerText = sleepQuotes[Math.floor(Date.now() / 3600000) % sleepQuotes.length];
            timerText.innerText = "Offline until 6:00 AM";
            stateText.innerText = "Sleeping";
            stateText.style.color = "var(--text-muted)";
            dayType.innerText = "Night Time Locked";
        }
        else if (currentState.nextAllowedSendTime && currentState.nextAllowedSendTime > now.getTime()) {
            card.className = "status-card";
            moodText.innerText = calculatingQuotes[Math.floor(Date.now() / 180000) % calculatingQuotes.length];
            
            // Format Next Time Display
            const nextDate = new Date(currentState.nextAllowedSendTime);
            let h = nextDate.getHours();
            let m = nextDate.getMinutes() < 10 ? '0' + nextDate.getMinutes() : nextDate.getMinutes();
            let ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            
            timerText.innerText = `Sending next at ${h}:${m} ${ampm}`;
            stateText.innerText = "Drafting";
            stateText.style.color = "var(--brand-accent)";
            dayType.innerText = "Work Day Active";
        }
        else if (qCount > 0 && (now.getTime() - (currentState.nextAllowedSendTime || 0) > 300000)) {
            // Node server delayed by > 5 minutes
            card.className = "status-card depressed";
            moodText.innerText = depressedQuotes[Math.floor(Date.now() / 60000) % depressedQuotes.length];
            timerText.innerText = "Engine Disconnected";
            stateText.innerText = "Engine Down ⚠️";
            stateText.style.color = "var(--danger-color)";
            dayType.innerText = "Warning: Check Server";
        }
        else {
            card.className = "status-card";
            moodText.innerText = "Dispatching group ledger 📨";
            timerText.innerText = "Firing Now...";
            stateText.innerText = "Active";
            stateText.style.color = "var(--success-color)";
            dayType.innerText = "Work Day Active";
        }
    }

    // --- DIALOG & ADMIN ACTIONS ---
    let pendingAction = null;
    
    window.handleAction = function(actionType) {
        pendingAction = actionType;
        const msg = document.getElementById('dialog-text');
        
        if (actionType === 'force') {
            msg.innerHTML = "Force the bot to bypass the human delay timer and send the next message immediately?";
        } else if (actionType === 'skip') {
            msg.innerHTML = "Skip the current group? This will increment the group index and flush the current queue.";
        } else if (actionType === 'reset') {
            msg.innerHTML = "⚠️ EMERGENCY RESET<br><br>This will set Target Group back to 0, clear all memory, and restart the entire system. Proceed?";
        }

        document.getElementById('dialog-overlay').classList.add('active');
    };

    window.closeDialog = function(confirmed) {
        document.getElementById('dialog-overlay').classList.remove('active');
        if (!confirmed) { pendingAction = null; return; }
        
        executeAction(pendingAction);
        pendingAction = null;
    };

    document.getElementById('dialog-btn-confirm').addEventListener('click', () => closeDialog(true));

    async function executeAction(action) {
        if (!currentState) return;
        document.getElementById('ui-mood').innerText = "Updating Engine...";

        try {
            if (action === 'force') {
                await updateDoc(docRef, { nextAllowedSendTime: Date.now() });
            } 
            else if (action === 'skip') {
                await updateDoc(docRef, { 
                    targetGroupIndex: (currentState.targetGroupIndex || 0) + 1,
                    queue: [],
                    sentToday: [],
                    isCompleted: false,
                    nextAllowedSendTime: Date.now()
                });
            } 
            else if (action === 'reset') {
                await updateDoc(docRef, { 
                    targetGroupIndex: 0,
                    queue: [],
                    sentToday: [],
                    isCompleted: false,
                    nextAllowedSendTime: Date.now()
                });
            }
            
            // Re-fetch after action to guarantee sync (1 Read)
            setTimeout(() => fetchServerState(true), 500);

        } catch (e) {
            alert("Error updating server: " + e.message);
        }
    }

  </script>
</body>
</html>
