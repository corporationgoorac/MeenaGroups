<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f" />
  <link rel="manifest" href="manifest.json">
  <title>Manage - Meena Chitfunds</title>
  
  <style>
    /* Theme Variables */
    :root {
      --bg-color: #ffffff;
      --text-main: #0f0f0f;
      --text-muted: #606060;
      --surface-color: #f2f2f2;
      --surface-hover: #e5e5e5;
      --border-color: #e0e0e0;
      --brand-accent: #065fd4;
      --danger-color: #cc0000;
      --success-color: #0f9d58;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f0f0f;
        --text-main: #f1f1f1;
        --text-muted: #aaaaaa;
        --surface-color: #272727;
        --surface-hover: #3f3f3f;
        --border-color: #3f3f3f;
        --brand-accent: #3ea6ff;
        --danger-color: #ff4e45;
        --success-color: #34a853;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 20px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-titles h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    /* Action Buttons */
    .action-bar { padding: 20px; display: flex; gap: 12px; }
    .action-btn {
      flex: 1; background-color: var(--surface-color); color: var(--text-main);
      border: 1px solid var(--border-color); padding: 14px; border-radius: 12px;
      font-size: 14px; font-weight: 600; cursor: pointer; display: flex;
      justify-content: center; align-items: center; gap: 8px; transition: 0.2s;
    }
    .action-btn:active { transform: scale(0.98); }
    .action-btn svg { width: 18px; height: 18px; fill: currentColor; }

    /* List Container */
    .list-container { padding: 0 20px 80px; }
    .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: var(--text-muted); }

    /* Group Card */
    .group-card {
      background-color: var(--bg-color); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 12px;
    }
    .group-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .group-name { font-size: 18px; font-weight: 600; margin: 0; }
    .group-id-badge { font-size: 11px; background: var(--surface-color); padding: 2px 8px; border-radius: 6px; color: var(--text-muted); font-family: monospace; margin-top: 4px; display: inline-block;}
    .group-meta { font-size: 13px; color: var(--text-muted); display: flex; gap: 12px; margin-top: 8px; }
    
    .group-actions { display: flex; gap: 8px; border-top: 1px solid var(--border-color); padding-top: 12px; }
    .icon-btn { background: none; border: none; color: var(--text-muted); font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 6px 12px; border-radius: 8px; }
    .icon-btn.edit:active { background-color: var(--surface-color); }
    .icon-btn.delete { color: var(--danger-color); margin-left: auto; }

    .load-more-btn { width: 100%; background: none; border: 1px solid var(--border-color); color: var(--text-main); padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; }

    /* Side Modals */
    .modal {
      position: fixed; top: 0; right: 0; width: 100%; height: 100%;
      background-color: var(--bg-color); z-index: 100; transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); display: flex; flex-direction: column;
    }
    .modal.active { transform: translateX(0); }
    .modal-header { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border-color); }
    .back-btn { background: none; border: none; color: var(--text-main); padding: 8px; margin-left: -8px; cursor: pointer; }
    .back-btn svg { width: 24px; height: 24px; fill: currentColor; }
    .modal-title { font-size: 18px; font-weight: 600; margin-left: 12px; }
    .modal-body { padding: 24px 20px; flex: 1; overflow-y: auto; }

    /* Forms */
    .input-group { margin-bottom: 20px; position: relative; }
    .input-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
    .input-group input, .input-group select {
      width: 100%; background-color: var(--surface-color); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 14px; border-radius: 10px; font-size: 16px; outline: none; appearance: none;
    }
    .input-group input:focus, .input-group select:focus { border-color: var(--brand-accent); }
    
    /* Validation Icon for Unique IDs */
    .validation-icon { position: absolute; right: 14px; bottom: 14px; font-size: 16px; }
    .valid { color: var(--success-color); }
    .invalid { color: var(--danger-color); }
    .loading-text { font-size: 11px; color: var(--brand-accent); position: absolute; right: 14px; top: 0; display: none; }

    /* Schedule Builder */
    .schedule-container { background: var(--surface-color); padding: 12px; border-radius: 12px; margin-bottom: 20px;}
    .schedule-header { font-size: 13px; font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between;}
    .schedule-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .schedule-row input { padding: 10px; font-size: 14px; }
    .add-tier-btn { background: none; border: 1px dashed var(--border-color); color: var(--text-main); width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;}

    /* Togglable Section */
    .toggle-container { display: flex; align-items: center; justify-content: space-between; padding: 16px; border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 20px; }
    .toggle-label { font-size: 14px; font-weight: 500; }
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--brand-accent); }
    input:checked + .slider:before { transform: translateX(20px); }

    .hidden-section { display: none; background: var(--surface-color); padding: 16px; border-radius: 12px; margin-bottom: 20px; }
    .hidden-section.active { display: block; }

    .submit-btn { background-color: var(--text-main); color: var(--bg-color); border: none; width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="header-titles">
      <h1>Meena Chitfunds</h1>
    </div>
  </header>

  <main>
    <div class="action-bar">
      <button class="action-btn" onclick="openParticipantModal()">
        <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        Add Participant
      </button>
      <button class="action-btn" onclick="openModal('group-modal')">
        <svg viewBox="0 0 24 24"><path d="M13 7h-2v4H7v2h4v4h2v-4h4v-2h-4V7zm-1-5C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
        Create Group
      </button>
    </div>

    <div class="list-container">
      <div class="section-title">Active Groups</div>
      <div id="groups-list"></div>
      <button id="load-more-btn" class="load-more-btn" style="display: none;">Load More</button>
    </div>
  </main>

  <aside id="participant-modal" class="modal">
    <div class="modal-header">
      <button class="back-btn" onclick="closeModal()"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <div class="modal-title">New Participant</div>
    </div>
    <div class="modal-body">
      <form id="participant-form">
        <div class="input-group">
          <label>Participant ID (Unique)</label>
          <span class="loading-text" id="p-id-loading">Checking...</span>
          <input type="text" id="p-id" placeholder="e.g., rahul_101" required autocomplete="off">
          <span class="validation-icon" id="p-id-icon"></span>
        </div>
        <div class="input-group">
          <label>Full Name</label>
          <input type="text" id="p-name" required>
        </div>
        <div class="input-group">
          <label>Phone Number</label>
          <input type="tel" id="p-phone" required>
        </div>

        <div class="input-group">
          <label>Assign to Group (Optional)</label>
          <select id="p-group">
            <option value="">-- Do not assign yet --</option>
            </select>
        </div>

        <div class="toggle-container">
          <span class="toggle-label">Mid-way Join (Log initial transaction)</span>
          <label class="switch">
            <input type="checkbox" id="midway-toggle">
            <span class="slider"></span>
          </label>
        </div>

        <div id="midway-section" class="hidden-section">
          <div class="input-group">
            <label>Joining Month (e.g., 5)</label>
            <input type="number" id="p-join-month" placeholder="Month number">
          </div>
          <div class="input-group">
            <label>Total Amount Paid Upfront (₹)</label>
            <input type="number" id="p-join-amount" placeholder="Total initial payment">
          </div>
        </div>

        <button type="submit" class="submit-btn" id="p-submit-btn" disabled>Save Participant</button>
      </form>
    </div>
  </aside>

  <aside id="group-modal" class="modal">
    <div class="modal-header">
      <button class="back-btn" onclick="closeModal()"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <div class="modal-title">New Chit Group</div>
    </div>
    <div class="modal-body">
      <form id="group-form">
        <div class="input-group">
          <label>Group ID (Unique Username)</label>
          <span class="loading-text" id="g-id-loading">Checking...</span>
          <input type="text" id="g-id" placeholder="e.g., gold_50k_2026" required autocomplete="off">
          <span class="validation-icon" id="g-id-icon"></span>
        </div>
        <div class="input-group">
          <label>Display Name (e.g., 50K Gold Scheme)</label>
          <input type="text" id="g-name" required>
        </div>
        <div style="display:flex; gap:10px;">
          <div class="input-group" style="flex:1;">
            <label>Total Pot (₹)</label>
            <input type="number" id="g-value" required>
          </div>
          <div class="input-group" style="flex:1;">
            <label>Total Months</label>
            <input type="number" id="g-months" required>
          </div>
        </div>

        <div class="schedule-container">
          <div class="schedule-header">Installment Schedule (Tiers)</div>
          <div id="schedule-rows">
            <div class="schedule-row">
              <input type="number" placeholder="Start Mo." class="s-start" required min="1">
              <input type="number" placeholder="End Mo." class="s-end" required min="1">
              <input type="number" placeholder="Amount (₹)" class="s-amt" required min="1">
            </div>
          </div>
          <button type="button" class="add-tier-btn" onclick="addScheduleRow()">+ Add Schedule Tier</button>
        </div>

        <button type="submit" class="submit-btn" id="g-submit-btn" disabled>Create Group</button>
      </form>
    </div>
  </aside>

  <script type="module">
    import { auth, db } from './config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { collection, query, orderBy, limit, getDocs, startAfter, setDoc, doc, getDoc, deleteDoc, updateDoc, writeBatch, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    onAuthStateChanged(auth, (user) => { if (!user) window.location.replace('login.html'); });

    // --- Modal Navigation ---
    window.openModal = function(modalId) {
      document.getElementById(modalId).classList.add('active');
      history.pushState({ modalOpen: true }, '', `#${modalId}`);
    };
    window.closeModal = function() {
      if(history.state && history.state.modalOpen) history.back(); 
      else closeAllModals();
    };
    function closeAllModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }
    window.addEventListener('popstate', closeAllModals);

    // --- Schedule Builder Logic ---
    window.addScheduleRow = function() {
      const container = document.getElementById('schedule-rows');
      const row = document.createElement('div');
      row.className = 'schedule-row';
      row.innerHTML = `
        <input type="number" placeholder="Start Mo." class="s-start" required min="1">
        <input type="number" placeholder="End Mo." class="s-end" required min="1">
        <input type="number" placeholder="Amount (₹)" class="s-amt" required min="1">
      `;
      container.appendChild(row);
    };

    // --- UI Toggles ---
    document.getElementById('midway-toggle').addEventListener('change', (e) => {
      const section = document.getElementById('midway-section');
      if(e.target.checked) section.classList.add('active');
      else {
        section.classList.remove('active');
        document.getElementById('p-join-month').value = '';
        document.getElementById('p-join-amount').value = '';
      }
    });

    // --- Live ID Validation (Debounced) ---
    let timeoutId;
    async function validateUniqueId(collectionName, inputId, iconElementId, loadingElementId, submitBtnId) {
      const inputVal = document.getElementById(inputId).value.trim();
      const icon = document.getElementById(iconElementId);
      const loader = document.getElementById(loadingElementId);
      const btn = document.getElementById(submitBtnId);

      icon.innerHTML = '';
      btn.disabled = true;

      if(inputVal.length < 3) return; // Wait for at least 3 chars

      loader.style.display = 'block';
      clearTimeout(timeoutId);
      
      timeoutId = setTimeout(async () => {
        try {
          // 1 Read Cost per check
          const docRef = doc(db, collectionName, inputVal);
          const docSnap = await getDoc(docRef);
          
          loader.style.display = 'none';
          if (docSnap.exists()) {
            icon.innerHTML = '❌';
            icon.className = 'validation-icon invalid';
            btn.disabled = true;
          } else {
            icon.innerHTML = '✔';
            icon.className = 'validation-icon valid';
            btn.disabled = false;
          }
        } catch (e) {
          console.error(e);
          loader.style.display = 'none';
        }
      }, 500); // 500ms debounce
    }

    document.getElementById('g-id').addEventListener('input', () => validateUniqueId('groups', 'g-id', 'g-id-icon', 'g-id-loading', 'g-submit-btn'));
    document.getElementById('p-id').addEventListener('input', () => validateUniqueId('users', 'p-id', 'p-id-icon', 'p-id-loading', 'p-submit-btn'));

    // --- Group Fetching & Pagination ---
    const groupsList = document.getElementById('groups-list');
    const loadMoreBtn = document.getElementById('load-more-btn');
    let lastVisibleDoc = null;

    async function loadGroups(isLoadMore = false) {
      try {
        let q;
        if (isLoadMore && lastVisibleDoc) {
          q = query(collection(db, "groups"), orderBy("createdAt", "desc"), startAfter(lastVisibleDoc), limit(5));
        } else {
          groupsList.innerHTML = ''; 
          q = query(collection(db, "groups"), orderBy("createdAt", "desc"), limit(5));
        }

        const querySnapshot = await getDocs(q);
        if (querySnapshot.empty) {
          if(!isLoadMore) groupsList.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding: 20px;">No groups found.</div>';
          loadMoreBtn.style.display = 'none';
          return;
        }

        lastVisibleDoc = querySnapshot.docs[querySnapshot.docs.length - 1];

        querySnapshot.forEach((document) => {
          const data = document.data();
          const groupId = document.id;
          
          // Generate schedule preview
          let schedulePreview = data.installmentSchedule ? 
            data.installmentSchedule.map(s => `${s.start}-${s.end}M:₹${s.amount}`).join(', ') : 'Fixed';

          const card = document.createElement('div');
          card.className = 'group-card';
          card.innerHTML = `
            <div class="group-header">
              <div>
                <h3 class="group-name">${data.groupName}</h3>
                <span class="group-id-badge">@${groupId}</span>
                <div class="group-meta">
                  <span>₹${data.totalPot.toLocaleString()}</span>
                  <span>•</span>
                  <span>${data.totalMonths} Months</span>
                </div>
                <div class="group-meta" style="margin-top:4px; font-size:11px;">
                  Schedule: [${schedulePreview}]
                </div>
              </div>
            </div>
            <div class="group-actions">
              <button class="icon-btn delete" onclick="deleteGroup('${groupId}')">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg> Delete
              </button>
            </div>
          `;
          groupsList.appendChild(card);
        });

        loadMoreBtn.style.display = querySnapshot.docs.length === 5 ? 'block' : 'none';
      } catch (error) { console.error(error); }
    }
    loadMoreBtn.addEventListener('click', () => loadGroups(true));

    // --- Participant Modal Setup ---
    window.openParticipantModal = async function() {
      // Fetch active groups for the dropdown
      const select = document.getElementById('p-group');
      select.innerHTML = '<option value="">-- Do not assign yet --</option>'; // Reset
      try {
        const q = query(collection(db, "groups"), limit(50)); // Fetch up to 50 active groups
        const snap = await getDocs(q);
        snap.forEach(doc => {
          const opt = document.createElement('option');
          opt.value = doc.id;
          opt.innerText = `${doc.data().groupName} (@${doc.id})`;
          select.appendChild(opt);
        });
      } catch(e) { console.error("Error fetching groups for dropdown", e); }
      openModal('participant-modal');
    };

    // --- Create Group Form Submission ---
    document.getElementById('group-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('g-submit-btn');
      const groupId = document.getElementById('g-id').value.trim();
      
      // Build Schedule Array
      const scheduleRows = document.querySelectorAll('.schedule-row');
      let installmentSchedule = [];
      scheduleRows.forEach(row => {
        installmentSchedule.push({
          start: parseInt(row.querySelector('.s-start').value),
          end: parseInt(row.querySelector('.s-end').value),
          amount: parseInt(row.querySelector('.s-amt').value)
        });
      });

      btn.innerText = "Creating..."; btn.disabled = true;

      try {
        // Use setDoc to use the custom Unique ID
        await setDoc(doc(db, "groups", groupId), {
          groupName: document.getElementById('g-name').value,
          totalPot: Number(document.getElementById('g-value').value),
          totalMonths: Number(document.getElementById('g-months').value),
          installmentSchedule: installmentSchedule,
          participantCount: 0,
          createdAt: serverTimestamp()
        });
        
        e.target.reset();
        document.getElementById('g-id-icon').innerHTML = ''; // Clear icon
        document.getElementById('schedule-rows').innerHTML = `
          <div class="schedule-row">
            <input type="number" placeholder="Start Mo." class="s-start" required min="1">
            <input type="number" placeholder="End Mo." class="s-end" required min="1">
            <input type="number" placeholder="Amount (₹)" class="s-amt" required min="1">
          </div>`; // Reset schedule UI
        
        closeModal();
        loadGroups(); 
      } catch (error) {
        alert("Error creating group"); console.error(error);
      } finally {
        btn.innerText = "Create Group";
      }
    });

    // --- Add Participant Form Submission (With Batched Writes) ---
    document.getElementById('participant-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('p-submit-btn');
      const userId = document.getElementById('p-id').value.trim();
      const selectedGroupId = document.getElementById('p-group').value;
      const isMidway = document.getElementById('midway-toggle').checked;
      
      btn.innerText = "Saving..."; btn.disabled = true;

      try {
        const batch = writeBatch(db);

        // 1. Create User Document
        const userRef = doc(db, "users", userId);
        let userData = {
          name: document.getElementById('p-name').value,
          phone: document.getElementById('p-phone').value,
          activeGroups: selectedGroupId ? [selectedGroupId] : [],
          joinedAt: serverTimestamp()
        };
        batch.set(userRef, userData);

        // 2. If Assigned to a Group, increment group count
        if (selectedGroupId) {
          const groupRef = doc(db, "groups", selectedGroupId);
          batch.update(groupRef, { participantCount: increment(1) });
          
          // 3. If Mid-way join, record the transaction
          if (isMidway) {
            const joinMonth = Number(document.getElementById('p-join-month').value);
            const amountPaid = Number(document.getElementById('p-join-amount').value);
            
            if (joinMonth && amountPaid) {
              const txRef = doc(collection(db, "transactions")); // Auto-ID for transaction
              batch.set(txRef, {
                subscriberId: userId,
                groupId: selectedGroupId,
                amount: amountPaid,
                monthAttributed: joinMonth,
                type: "Initial Catch-up Payment",
                date: serverTimestamp()
              });
            }
          }
        }

        // Commit all changes atomically
        await batch.commit();
        
        e.target.reset();
        document.getElementById('p-id-icon').innerHTML = ''; // Clear icon
        document.getElementById('midway-section').classList.remove('active');
        closeModal();
        alert("Participant added successfully!");

      } catch (error) {
        alert("Error adding participant"); console.error(error);
      } finally {
        btn.innerText = "Save Participant";
      }
    });

    // Global Delete Function
    window.deleteGroup = async function(id) {
      if (confirm(`Delete group @${id}? This action cannot be undone.`)) {
        try {
          await deleteDoc(doc(db, "groups", id));
          loadGroups();
        } catch(e) { console.error("Error deleting", e); }
      }
    };

    // Initialize
    loadGroups();
  </script>
</body>
</html>
