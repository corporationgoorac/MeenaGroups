<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f" />
  <link rel="manifest" href="manifest.json">
  <title>Login | Meena Chitfunds</title>
  
  <style>
    :root {
      --bg-color: #f9f9f9;
      --text-color: #0f0f0f;
      --surface-color: #ffffff;
      --border-color: #e5e5e5;
      --accent-blue: #065fd4;
      --sub-text: #606060;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f0f0f;
        --text-color: #f1f1f1;
        --surface-color: #1e1e1e;
        --border-color: #3f3f3f;
        --accent-blue: #3ea6ff;
        --sub-text: #aaaaaa;
      }
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: "Roboto", -apple-system, sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .login-card {
      background-color: var(--surface-color);
      padding: 48px 40px;
      border-radius: 24px;
      border: 1px solid var(--border-color);
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .logo-area { margin-bottom: 40px; }

    .logo-area h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo-area p {
      margin: 8px 0 0;
      font-size: 14px;
      color: var(--accent-blue);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    .welcome-text {
      margin-bottom: 32px;
    }

    .welcome-text h2 {
      font-size: 22px;
      margin: 0;
      font-weight: 500;
    }

    .welcome-text span {
      font-size: 14px;
      color: var(--sub-text);
    }

    /* Professional Google Button */
    .google-btn {
      background-color: var(--text-color); /* Contrastive background */
      color: var(--bg-color);
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 50px; /* Modern pill shape */
      cursor: pointer;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      transition: transform 0.2s, opacity 0.2s;
    }

    .google-btn:active {
      transform: scale(0.98);
    }

    .google-btn svg {
      width: 20px;
      height: 20px;
    }

    .footer-text {
      margin-top: 40px;
      font-size: 12px;
      color: var(--sub-text);
    }

    /* Loader */
    .loader {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-area">
      <h1>Meena Chitfunds</h1>
      <p>Goorac</p>
    </div>

    <div class="welcome-text">
      <h2>Sign in</h2>
      <span>Use your Google Account to continue</span>
    </div>
    
    <button id="google-login-btn" class="google-btn">
      <svg viewBox="0 0 48 48" id="google-icon">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
      </svg>
      <span id="btn-text">Continue with Google</span>
      <div id="loader" class="loader"></div>
    </button>

    <div class="footer-text">
      Secure portal managed by Goorac Systems
    </div>
  </div>

  <script type="module">
    import { auth } from './config.js';
    import { 
      GoogleAuthProvider, 
      signInWithPopup, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

    const provider = new GoogleAuthProvider();
    const loginBtn = document.getElementById('google-login-btn');
    const btnText = document.getElementById('btn-text');
    const loader = document.getElementById('loader');
    const googleIcon = document.getElementById('google-icon');

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.replace('home.html');
    });

    loginBtn.addEventListener('click', async () => {
      btnText.style.display = 'none';
      googleIcon.style.display = 'none';
      loader.style.display = 'block';
      loginBtn.disabled = true;

      try {
        await signInWithPopup(auth, provider);
        window.location.replace('home.html');
      } catch (error) {
        console.error(error);
        alert("Authentication failed.");
        btnText.style.display = 'block';
        googleIcon.style.display = 'block';
        loader.style.display = 'none';
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
