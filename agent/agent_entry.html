<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent App - Collection Entry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">

  <style>
    /* * ==========================================
     * 1. CORE THEME & VARIABLES
     * ==========================================
     */
    :root { 
      /* Dark Mode Palette */
      --bg: #020617; 
      --surface: #0f172a; 
      --card: #1e293b; 
      --input: #1e293b;
      
      /* Neon Accents for High Visibility */
      --primary: #10b981; /* Success Green */
      --primary-dim: rgba(16, 185, 129, 0.1);
      
      --accent: #3b82f6;  /* Action Blue */
      --accent-dim: rgba(59, 130, 246, 0.1);
      
      --danger: #ef4444;  /* Alert Red */
      --danger-dim: rgba(239, 68, 68, 0.1);
      
      --warn: #f59e0b;    /* Warning Orange */
      --warn-dim: rgba(245, 158, 11, 0.1);
      
      --secondary: #0ea5e9; /* Print Blue */

      /* Typography */
      --text: #f1f5f9; 
      --text-muted: #64748b;
      --border: #334155; 
      
      /* Shadows */
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      --glow-primary: 0 0 15px rgba(16, 185, 129, 0.3);
    }
    
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
      outline: none; 
    }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      margin: 0; 
      padding: 0; 
      padding-bottom: 20px; 
      height: 100vh;
      overflow-y: auto;
    }

    /* * ==========================================
     * 2. HEADER SECTION
     * ==========================================
     */
    header {
      background: rgba(15, 23, 42, 0.9); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 15px 20px; 
      border-bottom: 1px solid var(--border);
      position: sticky; 
      top: 0; 
      z-index: 50; 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }
    
    header h1 { 
      margin: 0; 
      font-size: 1.1rem; 
      font-weight: 700; 
      color: #fff; 
      letter-spacing: 0.5px; 
      text-transform: uppercase;
    }
    
    .agent-status { 
      font-size: 0.75rem; 
      color: var(--primary); 
      background: var(--primary-dim); 
      padding: 4px 12px; 
      border-radius: 20px; 
      font-weight: 600; 
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .status-dot {
      width: 8px; height: 8px; background: var(--primary); border-radius: 50%;
      box-shadow: 0 0 5px var(--primary);
    }

    /* * ==========================================
     * 3. SEARCH SECTION
     * ==========================================
     */
    .search-wrapper { 
      padding: 20px 20px 10px 20px; 
      position: relative; 
      z-index: 40; 
    }
    
    .input-group { 
      position: relative; 
      display: flex; 
      align-items: center; 
    }
    
    .search-input {
      width: 100%; 
      padding: 14px 50px 14px 15px; 
      background: var(--card); 
      border: 1px solid var(--border);
      color: white; 
      border-radius: 14px; 
      font-size: 1rem;
      transition: all 0.3s ease; 
      box-shadow: var(--shadow-sm);
    }
    
    .search-input:focus { 
      border-color: var(--accent); 
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); 
    }
    
    .search-btn { 
      position: absolute; 
      right: 8px; 
      top: 50%; 
      transform: translateY(-50%); 
      background: var(--accent); 
      border: none; 
      color: white;
      width: 36px; 
      height: 36px; 
      border-radius: 10px; 
      cursor: pointer;
      display: flex; 
      align-items: center; 
      justify-content: center;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4); 
      transition: all 0.2s;
    }
    
    .search-btn:active { 
      transform: translateY(-50%) scale(0.9); 
    }
    
    .search-btn svg { 
      width: 20px; 
      height: 20px; 
      fill: white; 
    }

    /* Suggestions List */
    #suggestions {
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 12px;
      margin-top: 8px; 
      max-height: 300px; 
      overflow-y: auto;
      position: absolute; 
      width: calc(100% - 40px); 
      left: 20px; 
      z-index: 100;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
      display: none; 
    }
    
    .suggestion-item { 
      padding: 15px; 
      border-bottom: 1px solid var(--border); 
      cursor: pointer; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      transition: background 0.2s;
    }
    
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:active { background: #334155; }
    
    .s-name { 
      font-weight: 600; 
      color: #fff; 
      display: block; 
      font-size: 0.95rem;
    }
    
    .s-id { 
      font-size: 0.8rem; 
      color: var(--accent); 
      font-family: monospace; 
      background: var(--accent-dim); 
      padding: 4px 8px; 
      border-radius: 4px; 
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    /* * ==========================================
     * 4. MAIN CONTENT (CUSTOMER CARD)
     * ==========================================
     */
    .main-content { 
      padding: 10px 20px; 
    }
    
    .customer-card { 
      background: var(--card); 
      border-radius: 18px; 
      border: 1px solid var(--border); 
      overflow: hidden; 
      animation: slideUp 0.4s ease-out; 
      box-shadow: var(--shadow-lg);
    }
    
    .hidden { 
      display: none !important; 
    }

    .card-header { 
      padding: 20px; 
      background: linear-gradient(to right, rgba(255,255,255,0.03), transparent); 
      border-bottom: 1px solid var(--border);
    }
    
    .cust-name { 
      margin: 0; 
      font-size: 1.3rem; 
      font-weight: 700; 
      color: #fff; 
    }
    
    .cust-meta { 
      margin-top: 8px; 
      font-size: 0.9rem; 
      color: var(--text-muted); 
      display: flex; 
      gap: 15px; 
      font-family: monospace;
    }

    .card-body { 
      padding: 20px; 
    }

    /* Form Fields */
    label { 
      display: block; 
      color: var(--text-muted); 
      font-size: 0.85rem; 
      margin-bottom: 8px; 
      font-weight: 500; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .custom-select {
      width: 100%; 
      padding: 14px; 
      background: #0f172a; 
      border: 1px solid var(--border);
      color: white; 
      border-radius: 10px; 
      font-size: 1rem; 
      margin-bottom: 20px; 
      appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23007CB2%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 15px top 50%;
      background-size: 12px auto;
    }
    
    .custom-select:focus { border-color: var(--accent); }

    /* Info Grid */
    .stats-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 12px; 
      margin-bottom: 25px;
    }
    
    .stat-box { 
      background: #0f172a; 
      padding: 15px; 
      border-radius: 12px; 
      border: 1px solid var(--border);
      display: flex; 
      flex-direction: column; 
      align-items: center;
      text-align: center;
    }
    
    .stat-label { 
      font-size: 0.7rem; 
      color: var(--text-muted); 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
      margin-bottom: 5px;
    }
    
    .stat-val { 
      font-size: 1.2rem; 
      font-weight: 700; 
      color: #fff; 
      font-family: monospace;
    }
    
    /* Dynamic Colors for Stats */
    .val-due { color: var(--warn); text-shadow: 0 0 10px rgba(245, 158, 11, 0.2); }
    .val-bal { color: var(--danger); text-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
    .val-paid { color: var(--primary); text-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }

    /* Input Row */
    .input-row { 
      display: grid; 
      grid-template-columns: 1.5fr 1fr; 
      gap: 15px; 
      margin-bottom: 25px; 
    }
    
    .input-field {
      width: 100%; 
      padding: 14px; 
      background: #0f172a; 
      border: 1px solid var(--border);
      color: white; 
      border-radius: 10px; 
      font-size: 1.1rem; 
      font-weight: 600;
      transition: 0.2s;
    }
    
    .input-field:focus { 
      border-color: var(--primary); 
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); 
    }

    /* * ==========================================
     * 5. BUTTONS & ACTIONS
     * ==========================================
     */
    .btn-save {
      width: 100%; 
      padding: 16px; 
      background: var(--primary); 
      color: #000;
      border: none; 
      border-radius: 12px; 
      font-weight: 800; 
      font-size: 1rem;
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px;
      box-shadow: var(--glow-primary); 
      transition: transform 0.1s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .btn-save:active { transform: scale(0.98); }
    .btn-save:disabled { background: var(--text-muted); opacity: 0.5; box-shadow: none; }

    /* Action Buttons Row */
    .action-row { 
      display: grid;
      grid-template-columns: 1fr 1fr 1fr; /* UPDATED: 3 Columns for Copy, Print, Download */
      gap: 10px; 
      margin-top: 20px; 
      padding-top: 20px;
      border-top: 1px dashed var(--border);
      animation: fadeIn 0.5s ease-out;
    }
    
    .btn-action { 
      padding: 15px 5px; 
      border-radius: 12px; 
      border: none; 
      font-weight: 700; 
      cursor: pointer;
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center; 
      gap: 5px; 
      font-size: 0.8rem;
      transition: 0.2s;
      text-align: center;
    }
    
    .btn-download { 
      background: var(--surface); 
      border: 1px solid var(--border); 
      color: var(--text); 
      background: linear-gradient(145deg, #1e293b, #0f172a);
    }
    
    .btn-print { 
      background: var(--secondary);
      color: #fff;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
    }

    .btn-copy {
      background: var(--warn);
      color: #000;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }
    
    .btn-download:active, .btn-copy:active, .btn-print:active { transform: translateY(2px); }

    /* * ==========================================
     * 7. UTILITIES & ANIMATIONS
     * ==========================================
     */
    .toast {
      position: fixed; 
      bottom: 50px; 
      left: 50%; 
      transform: translateX(-50%) translateY(20px);
      background: #10b981; 
      color: #000; 
      padding: 12px 24px; 
      border-radius: 50px;
      font-weight: bold; 
      opacity: 0; 
      pointer-events: none; 
      transition: 0.3s; 
      z-index: 200;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes slideUp { 
      from { opacity: 0; transform: translateY(20px); } 
      to { opacity: 1; transform: translateY(0); } 
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Collection Entry</h1>
    <div class="agent-status">
      <div class="status-dot"></div>
      Online
    </div>
  </header>

  <div class="search-wrapper">
    <div class="input-group">
      <input type="text" id="searchBox" class="search-input" placeholder="Search ID or Name..." autocomplete="off">
      <button class="search-btn" onclick="executeSearch()">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
    <div id="suggestions"></div>
  </div>

  <main class="main-content">
    
    <div id="customerInfo" class="customer-card hidden">
      
      <div class="card-header">
        <h2 class="cust-name" id="custName">Customer Name</h2>
        <div class="cust-meta">
          <span id="custId">ID: --</span>
          <span>•</span>
          <span id="custPhone">Ph: --</span>
        </div>
      </div>

      <div class="card-body">
        
        <label>Select Product / Loan</label>
        <select id="productDropdown" class="custom-select"></select>

        <div class="stats-grid">
          <div class="stat-box">
            <span class="stat-label">Total Value</span>
            <span class="stat-val" id="dispTotal">-</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Paid So Far</span>
            <span class="stat-val val-paid" id="dispPaid">-</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Next Due #</span>
            <span class="stat-val val-due" id="dispDue">-</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Balance</span>
            <span class="stat-val val-bal" id="dispBal">-</span>
          </div>
        </div>

        <div class="input-row">
          <div>
            <label>Amount (₹)</label>
            <input type="number" id="amount" class="input-field" placeholder="0">
          </div>
          <div>
            <label>Date</label>
            <input type="date" id="date" class="input-field">
          </div>
        </div>

        <button id="btnSave" class="btn-save" onclick="saveToTempCollection()">
          <svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
          CONFIRM & SAVE
        </button>

        <div id="postSaveActions" class="action-row hidden">
          <button class="btn-action btn-copy" onclick="copyReceiptText()">
             <svg style="width:24px;height:24px;fill:currentColor" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
             <span>Copy Txt</span>
          </button>
          
          <button class="btn-action btn-print" onclick="printReceipt()">
            <svg style="width:24px;height:24px;fill:currentColor" viewBox="0 0 24 24"><path d="M19 8h-1V3H6v5H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zM8 5h8v3H8V5zm8 12v2H8v-4h8v2zm2-2v-2H6v2H4v-4c0-.55.45-1 1-1h14c.55 0 1 .45 1 1v4h-2z"/></svg>
            <span>Print</span>
          </button>

          <button class="btn-action btn-download" onclick="downloadLastReceipt()">
            <svg style="width:24px;height:24px;fill:currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            <span>Download</span>
          </button>
        </div>

      </div>
    </div>
  </main>

  <div id="toast" class="toast">Entry Saved Successfully!</div>

  <canvas id="downloadCanvas" style="display:none;"></canvas>

  <script type="module">
    import { db } from "./config.js";
    import { 
      collection, query, where, getDocs, limit, addDoc, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // --- STATE VARIABLES ---
    let selectedCustomer = null;
    let selectedProductIndex = 0;
    let calculatedNextDue = 0;
    let existingPaid = 0;
    let pendingLogsPaid = 0;
    
    // Receipt Data
    let lastReceiptData = null;
    let lastBalance = 0;
    let lastTotalPaid = 0;

    // --- 1. SMART SEARCH LOGIC ---
    const searchBox = document.getElementById("searchBox");
    const suggestionBox = document.getElementById("suggestions");

    searchBox.addEventListener("keypress", (e) => {
      if (e.key === "Enter") executeSearch();
    });

    window.executeSearch = async () => {
      const term = searchBox.value.trim();
      if (term.length < 2) { 
        alert("Please enter at least 2 characters."); 
        return; 
      }

      suggestionBox.innerHTML = '<div style="padding:15px; color:#aaa;">Searching Database...</div>';
      suggestionBox.style.display = "block";

      const colRef = collection(db, "customers");
      let snapshot;

      try {
        const qId = query(colRef, where("id", ">=", term.toUpperCase()), where("id", "<=", term.toUpperCase() + '\uf8ff'), limit(5));
        snapshot = await getDocs(qId);

        if (snapshot.empty) {
          const qName = query(colRef, where("name", ">=", term), where("name", "<=", term + '\uf8ff'), limit(5));
          snapshot = await getDocs(qName);
        }

        suggestionBox.innerHTML = "";
        
        if (snapshot.empty) {
          suggestionBox.innerHTML = '<div style="padding:15px; color:#ef4444;">No customer found.</div>';
          return;
        }

        snapshot.forEach(docSnap => {
          const c = docSnap.data();
          const div = document.createElement("div");
          div.className = "suggestion-item";
          div.innerHTML = `
            <span class="s-name">${c.name}</span> 
            <span class="s-id">${c.id}</span>
          `;
          div.onclick = () => loadCustomer(c);
          suggestionBox.appendChild(div);
        });
      } catch (e) {
        suggestionBox.innerHTML = `<div style="padding:15px; color:red;">Error: ${e.message}</div>`;
      }
    };

    // --- 2. LOAD CUSTOMER ---
    async function loadCustomer(c) {
      selectedCustomer = c;
      
      document.getElementById("custName").innerText = c.name;
      document.getElementById("custId").innerText = `ID: ${c.id}`;
      document.getElementById("custPhone").innerText = `Ph: ${c.phone || 'N/A'}`;
      
      searchBox.value = "";
      suggestionBox.style.display = "none";
      document.getElementById("customerInfo").classList.remove("hidden");
      document.getElementById("postSaveActions").classList.add("hidden"); 

      const dropdown = document.getElementById("productDropdown");
      dropdown.innerHTML = "";
      
      c.products.forEach((p, idx) => {
        const option = document.createElement("option");
        option.value = idx;
        option.text = p.name;
        dropdown.appendChild(option);
      });
      
      await updateProductDetails(0);
      dropdown.onchange = (e) => updateProductDetails(e.target.value);
    }

    // --- 3. CALCULATE STATS ---
    async function updateProductDetails(index) {
      selectedProductIndex = parseInt(index);
      const p = selectedCustomer.products[index];
      
      const dbPaid = (p.payments || []).reduce((sum, pay) => sum + pay.amount, 0);
      
      pendingLogsPaid = 0;
      let pendingLogsCount = 0;

      try {
        const logsQ = query(
          collection(db, "temp_entries"), 
          where("customerId", "==", selectedCustomer.id),
          where("productName", "==", p.name),
          where("status", "in", ["pending", "draft"])
        );
        const logSnap = await getDocs(logsQ);
        logSnap.forEach(doc => {
          pendingLogsPaid += parseFloat(doc.data().amount || 0);
          pendingLogsCount++;
        });
      } catch(e) {
        console.warn("Log check failed:", e);
      }

      existingPaid = dbPaid + pendingLogsPaid;
      const balance = p.total - existingPaid;
      
      const dbMaxDue = (p.payments || []).length > 0 
        ? Math.max(...p.payments.map(x => x.dueNumber || 0)) 
        : 0;
      
      calculatedNextDue = dbMaxDue + pendingLogsCount + 1; 

      document.getElementById("dispTotal").innerText = `₹${p.total}`;
      document.getElementById("dispPaid").innerText = `₹${existingPaid}`;
      document.getElementById("dispBal").innerText = `₹${balance}`;
      document.getElementById("dispDue").innerText = `#${calculatedNextDue}`;
    }

    // --- 4. SAVE ENTRY & VOICE FEEDBACK ---
    window.saveToTempCollection = async () => {
      const amount = parseFloat(document.getElementById("amount").value);
      const date = document.getElementById("date").value;

      if (!amount || amount <= 0) return alert("❌ Enter valid amount");
      if (!date) return alert("❌ Select date");

      const btn = document.getElementById("btnSave");
      btn.disabled = true;
      btn.innerHTML = "Processing...";

      try {
        const p = selectedCustomer.products[selectedProductIndex];
        
        const entryData = {
          customerId: selectedCustomer.id,
          customerName: selectedCustomer.name,
          customerPhone: selectedCustomer.phone,
          productName: p.name,
          productIndex: selectedProductIndex, 
          amount: amount,
          date: date,
          dueNumber: calculatedNextDue, 
          status: "draft", 
          timestamp: serverTimestamp(), 
          agentEntry: true
        };

        await addDoc(collection(db, "temp_entries"), entryData);

        showToast("Entry Saved Successfully!");
        
        // Prepare Receipt Data
        lastBalance = p.total - (existingPaid + amount);
        lastTotalPaid = existingPaid + amount;
        lastReceiptData = entryData;
        
        // --- VOICE: READ ALOUD AMOUNT ---
        speakAmount(amount);

        document.getElementById("amount").value = "";
        btn.innerHTML = "✅ SAVED";
        
        document.getElementById("postSaveActions").classList.remove("hidden");

        await updateProductDetails(selectedProductIndex);

      } catch (e) {
        console.error(e);
        alert("Error saving: " + e.message);
      } finally {
        setTimeout(() => {
          btn.disabled = false;
          btn.innerHTML = `
            <svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
            CONFIRM & SAVE`;
        }, 2000);
      }
    };

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    // --- 5. TEXT-TO-SPEECH (TTS) FUNCTION ---
    function speakAmount(amount) {
      if ('speechSynthesis' in window) {
        // Cancel any current speech
        window.speechSynthesis.cancel();
        
        const text = `Received amount, ${amount} rupees.`;
        const utterance = new SpeechSynthesisUtterance(text);
        
        // Optional: Set voice properties (rate, pitch)
        utterance.rate = 1; 
        utterance.pitch = 1;
        
        window.speechSynthesis.speak(utterance);
      } else {
        console.log("Browser does not support TTS");
      }
    }

    // --- 6. OPTIMIZED IMAGE GENERATION (FOR THERMAL PRINT) ---
    // NO ITALICS, VERY COMPACT HEIGHT FOR PAPER SAVING
    function drawDownloadImage(data, balance, totalPaid) {
      const canvas = document.getElementById('downloadCanvas');
      // 384px is the standard printable width for 58mm thermal printers
      const width = 384; 
      // DRASTICALLY REDUCED HEIGHT for paper saving (450px)
      const height = 450; 
      
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      // 1. Background (White)
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);

      // 2. Text Settings (Black, High Contrast)
      ctx.fillStyle = "#000000";
      
      // Start very high up to save top roll
      let y = 30; 

      // --- HEADER ---
      ctx.textAlign = "center";
      ctx.font = "bold 26px Arial"; 
      ctx.fillText("MEENA GROUPS", width/2, y);
      y += 22; 
      
      ctx.font = "bold 14px Arial"; // No Italic
      ctx.fillText("PAYMENT RECEIPT", width/2, y);
      y += 10; 

      // Divider
      drawDashedLine(ctx, 5, y, width-5, y);
      y += 20;

      // --- DETAILS ---
      ctx.textAlign = "left";
      ctx.font = "bold 16px Courier New"; // Monospace for alignment
      
      const xLeft = 10;
      const gap = 22; // Tight line height

      ctx.fillText(`Date : ${data.date}`, xLeft, y);
      y += gap;
      ctx.fillText(`ID   : ${data.customerId}`, xLeft, y);
      y += gap;
      ctx.fillText(`Due #: ${data.dueNumber}`, xLeft, y);
      y += gap;
      
      // Handle long names
      let nameStr = data.customerName;
      if(nameStr.length > 20) nameStr = nameStr.substring(0,20) + "..";
      ctx.fillText(`Name : ${nameStr}`, xLeft, y);
      y += gap + 5;

      // Divider
      drawDashedLine(ctx, 5, y, width-5, y);
      y += 25;

      // --- AMOUNT (CENTERED) ---
      ctx.textAlign = "center";
      ctx.font = "bold 18px Arial";
      ctx.fillText("RECEIVED AMOUNT", width/2, y);
      y += 30;
      
      ctx.font = "bold 45px Arial"; // Big Impact
      ctx.fillText(`₹${data.amount}`, width/2, y);
      y += 30;

      // Divider
      drawDashedLine(ctx, 5, y, width-5, y);
      y += 20;

      // --- SUMMARY ---
      ctx.font = "16px Courier New";
      
      // Line 1: Total Paid
      ctx.textAlign = "left";
      ctx.fillText("Total Paid:", xLeft, y);
      ctx.textAlign = "right";
      ctx.fillText(`₹${totalPaid}`, width - 10, y);
      y += gap;

      // Line 2: Balance (Bold)
      ctx.font = "bold 18px Courier New";
      ctx.textAlign = "left";
      ctx.fillText("Balance:", xLeft, y);
      ctx.textAlign = "right";
      ctx.fillText(`₹${balance}`, width - 10, y);
      y += 35;

      // --- FOOTER (Compact & No Italic) ---
      ctx.textAlign = "center";
      ctx.font = "bold 14px Arial"; // Removed Italic
      ctx.fillText("Thank you!", width/2, y);
      y += 18;
      ctx.font = "bold 12px Arial";
      ctx.fillText("Visit meena.goorac.biz", width/2, y);
      y += 14;
      ctx.fillText("to see your eCard", width/2, y);
    }

    // Helper for thermal style dashed lines
    function drawDashedLine(ctx, x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.setLineDash([4, 4]); // Tighter dashes
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = "#000000";
      ctx.stroke();
      ctx.setLineDash([]); // Reset
    }

    // --- 7. NEW COPY TEXT (ALIGNED WITH SPACE BARS) ---
    window.copyReceiptText = () => {
      if(!lastReceiptData) return alert("No receipt data");
      
      // LINE WIDTH FIXED to 30 for Thermal Safety
      const LINE_WIDTH = 30;

      // Helper to align text: "Label" + spaces + "Value"
      const formatLine = (label, value) => {
        let strVal = String(value);
        let strLab = String(label);
        let spacesNeeded = LINE_WIDTH - (strLab.length + strVal.length);
        if (spacesNeeded < 1) spacesNeeded = 1; 
        return strLab + " ".repeat(spacesNeeded) + strVal;
      };

      const centerText = (text) => {
        let spaces = Math.floor((LINE_WIDTH - text.length) / 2);
        if(spaces < 0) spaces = 0;
        return " ".repeat(spaces) + text;
      };

      const separator = "-".repeat(LINE_WIDTH);

      // Construct aligned text (NO extra newlines at bottom for paper saving)
      const txt = 
`${centerText("MEENA GROUPS")}
${centerText("Payment Receipt")}
${separator}
${formatLine("Date:", lastReceiptData.date)}
${formatLine("ID:", lastReceiptData.customerId)}
${formatLine("Due No:", "#" + lastReceiptData.dueNumber)}
Name: ${lastReceiptData.customerName}
${separator}
${centerText("RECEIVED AMOUNT")}
${centerText("Rs. " + lastReceiptData.amount)}
${separator}
${formatLine("Total Paid:", "Rs." + lastTotalPaid)}
${formatLine("Balance:", "Rs." + lastBalance)}
${separator}
${centerText("Thank You!")}
${centerText("Visit meena.goorac.biz")}
${centerText("to see your eCard")}`; 
      
      navigator.clipboard.writeText(txt).then(() => {
        showToast("Receipt Copied to Clipboard!");
      }).catch(err => {
        alert("Failed to copy text");
      });
    };

    // --- 8. DOWNLOAD ACTION ---
    window.downloadLastReceipt = () => {
      if(!lastReceiptData) return;
      
      drawDownloadImage(lastReceiptData, lastBalance, lastTotalPaid);
      const canvas = document.getElementById('downloadCanvas');
      
      // Create filename
      const filename = `REC_${lastReceiptData.customerId}_${lastReceiptData.dueNumber}.png`;

      // Trigger download
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL("image/png");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    // --- 9. PRINT ACTION (MOBILE BLUETOOTH FRIENDLY) ---
    window.printReceipt = () => {
      if(!lastReceiptData) return alert("No receipt to print");
      
      // Update canvas first to ensure latest data
      drawDownloadImage(lastReceiptData, lastBalance, lastTotalPaid);
      const canvas = document.getElementById('downloadCanvas');
      const imgData = canvas.toDataURL("image/png");

      const printWindow = window.open('', '', 'width=384,height=600');
      if(!printWindow) return alert("Allow popups to print");

      // Forces strict 58mm width layout for printing
      // Added margins: 0mm to remove headers/footers from browser print
      printWindow.document.write(`
        <html>
        <head>
          <title>Print Receipt</title>
          <style>
            @page { size: auto; margin: 0mm; }
            body { margin: 0; padding: 0; display: flex; justify-content: center; background: #fff; }
            img { width: 384px; max-width: 100%; height: auto; display: block; }
          </style>
        </head>
        <body>
          <img src="${imgData}" onload="window.print(); setTimeout(() => window.close(), 1000);" />
        </body>
        </html>
      `);
      printWindow.document.close();
    };

    // Set Today's Date
    document.getElementById("date").value = new Date().toISOString().split("T")[0];

  </script>
</body>
</html>
