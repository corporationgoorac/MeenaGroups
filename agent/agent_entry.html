<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent App - Add Collection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">

  <style>
    /* --- PREMIUM DARK AGENT THEME --- */
    :root { 
      --bg: #020617; 
      --surface: #0f172a; 
      --card: #1e293b; 
      --input: #1e293b;
      
      --primary: #10b981; /* Success Green */
      --accent: #3b82f6;  /* Action Blue */
      --danger: #ef4444;  /* Alert Red */
      --warn: #f59e0b;    /* Warning Orange */
      
      --text: #f1f5f9; 
      --text-muted: #64748b;
      --border: #334155; 
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      background: var(--bg); color: var(--text); 
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
      margin: 0; padding: 0; 
      padding-bottom: 90px; /* Space for Bottom Nav */
    }

    /* --- GLASS HEADER --- */
    header {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
      padding: 15px 20px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    .agent-status { font-size: 0.75rem; color: var(--primary); background: rgba(16, 185, 129, 0.15); padding: 4px 10px; border-radius: 20px; font-weight: 600; }

    /* --- SEARCH SECTION --- */
    .search-wrapper { padding: 20px; position: relative; z-index: 40; }
    
    .input-group { position: relative; display: flex; align-items: center; }
    
    .search-input {
      width: 100%; padding: 14px 50px 14px 15px; /* Added padding right for button */
      background: var(--card); border: 1px solid var(--border);
      color: white; border-radius: 14px; font-size: 1rem;
      transition: 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
    
    .search-btn { 
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%); 
      background: var(--accent); border: none; color: white;
      width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4); transition: 0.2s;
    }
    .search-btn:active { transform: translateY(-50%) scale(0.9); }
    .search-btn svg { width: 20px; height: 20px; fill: white; }

    /* Suggestions List */
    #suggestions {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      margin-top: 8px; max-height: 300px; overflow-y: auto;
      position: absolute; width: calc(100% - 40px); left: 20px; z-index: 100;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: none;
    }
    .suggestion-item { 
      padding: 15px; border-bottom: 1px solid var(--border); 
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .suggestion-item:active { background: #334155; }
    .s-name { font-weight: 600; color: #fff; display: block; }
    .s-id { font-size: 0.8rem; color: var(--accent); font-family: monospace; background: rgba(59, 130, 246, 0.1); padding: 2px 6px; border-radius: 4px; }

    /* --- CUSTOMER CARD --- */
    .main-content { padding: 0 20px; }
    
    .customer-card { 
      background: var(--card); border-radius: 18px; border: 1px solid var(--border); 
      overflow: hidden; animation: slideUp 0.4s ease-out; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .hidden { display: none; }

    .card-header { 
      padding: 20px; background: linear-gradient(to right, rgba(255,255,255,0.03), transparent); 
      border-bottom: 1px solid var(--border);
    }
    .cust-name { margin: 0; font-size: 1.3rem; font-weight: 700; color: #fff; }
    .cust-meta { margin-top: 5px; font-size: 0.9rem; color: var(--text-muted); display: flex; gap: 10px; font-family: monospace; }

    .card-body { padding: 20px; }

    /* Form Fields */
    label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px; font-weight: 500; }
    
    .custom-select {
      width: 100%; padding: 14px; background: #0f172a; border: 1px solid var(--border);
      color: white; border-radius: 10px; font-size: 1rem; margin-bottom: 20px; appearance: none;
    }

    /* Info Grid */
    .stats-grid { 
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;
    }
    .stat-box { 
      background: #0f172a; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      display: flex; flex-direction: column; 
    }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-val { font-size: 1.1rem; font-weight: 700; margin-top: 4px; color: #fff; }
    
    .val-due { color: var(--warn); }
    .val-bal { color: var(--danger); }
    .val-paid { color: var(--primary); }

    /* Input Row */
    .input-row { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; margin-bottom: 20px; }
    
    .input-field {
      width: 100%; padding: 14px; background: #0f172a; border: 1px solid var(--border);
      color: white; border-radius: 10px; font-size: 1.1rem; font-weight: 600;
    }
    .input-field:focus { border-color: var(--primary); }

    /* Save Button */
    .btn-save {
      width: 100%; padding: 16px; background: var(--primary); color: #000;
      border: none; border-radius: 12px; font-weight: 800; font-size: 1rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); transition: transform 0.1s;
    }
    .btn-save:active { transform: scale(0.98); }
    .btn-save:disabled { background: var(--text-muted); opacity: 0.5; }

    /* Action Buttons (Print/Download) */
    .action-row { display: flex; gap: 10px; margin-top: 15px; }
    .btn-action { 
      flex: 1; padding: 14px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem;
    }
    .btn-print { background: var(--secondary); color: #000; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3); }
    .btn-download { background: var(--card); border: 1px solid var(--border); color: var(--text); }

    /* --- BOTTOM NAV --- */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 10px 0; z-index: 100;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }
    
    .nav-item {
      text-decoration: none; color: var(--text-muted); font-size: 0.7rem;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 5px; width: 33%;
    }
    .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
    .nav-item.active { color: var(--accent); }
    .nav-item.active svg { fill: var(--accent); filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.5)); }

    /* --- TOAST --- */
    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #10b981; color: #000; padding: 12px 24px; border-radius: 50px;
      font-weight: bold; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 200;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header>
    <h1>New Collection</h1>
    <div class="agent-status">● Online</div>
  </header>

  <div class="search-wrapper">
    <div class="input-group">
      <input type="text" id="searchBox" class="search-input" placeholder="Search ID or Name..." autocomplete="off">
      <button class="search-btn" onclick="executeSearch()">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
    <div id="suggestions"></div>
  </div>

  <main class="main-content">
    <div id="customerInfo" class="customer-card hidden">
      
      <div class="card-header">
        <h2 class="cust-name" id="custName">Customer Name</h2>
        <div class="cust-meta">
          <span id="custId">ID: --</span>
          <span>|</span>
          <span id="custPhone">Ph: --</span>
        </div>
      </div>

      <div class="card-body">
        
        <label>Select Product / Loan</label>
        <select id="productDropdown" class="custom-select"></select>

        <div class="stats-grid">
          <div class="stat-box">
            <span class="stat-label">Total Value</span>
            <span class="stat-val" id="dispTotal">-</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Paid So Far</span>
            <span class="stat-val val-paid" id="dispPaid">-</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Next Due #</span>
            <span class="stat-val val-due" id="dispDue">-</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Balance</span>
            <span class="stat-val val-bal" id="dispBal">-</span>
          </div>
        </div>

        <div class="input-row">
          <div>
            <label>Amount (₹)</label>
            <input type="number" id="amount" class="input-field" placeholder="0">
          </div>
          <div>
            <label>Date</label>
            <input type="date" id="date" class="input-field">
          </div>
        </div>

        <button id="btnSave" class="btn-save" onclick="saveToTempCollection()">
          <svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
          SAVE ENTRY
        </button>

        <div id="postSaveActions" class="action-row hidden">
          <button class="btn-action btn-print" onclick="printLastReceipt()">
            <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24"><path d="M19 8h-1V3H6v5H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zM8 5h8v3H8V5zm8 12v2H8v-4h8v2zm2-2v-2H6v2H4v-4c0-.55.45-1 1-1h14c.55 0 1 .45 1 1v4h-2z"/><circle cx="18" cy="11.5" r="1"/></svg>
            PRINT
          </button>
          <button class="btn-action btn-download" onclick="downloadLastReceipt()">
            <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            IMG
          </button>
        </div>

      </div>
    </div>
  </main>

  <div id="toast" class="toast">Entry Saved Successfully!</div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </a>
    <a href="agent_entry.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M13 7h-2v4H7v2h4v4h2v-4h4v-2h-4V7zm-1-5C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
      <span>Collect</span>
    </a>
    <a href="agent_view.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      <span>Logs</span>
    </a>
  </nav>

  <canvas id="receiptCanvas" style="display:none;"></canvas>

  <script type="module">
    import { db } from "./config.js";
    import { 
      collection, query, where, getDocs, limit, addDoc, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    let selectedCustomer = null;
    let selectedProductIndex = 0;
    let calculatedNextDue = 0;
    let existingPaid = 0;
    let pendingLogsPaid = 0;
    
    // Data for Receipt
    let lastReceiptData = null;
    let lastBalance = 0;

    // --- 1. SMART SEARCH LOGIC (Optimized Reads) ---
    const searchBox = document.getElementById("searchBox");
    const suggestionBox = document.getElementById("suggestions");

    // Allow Enter key to trigger search
    searchBox.addEventListener("keypress", (e) => {
      if (e.key === "Enter") executeSearch();
    });

    window.executeSearch = async () => {
      const term = searchBox.value.trim();
      if (term.length < 2) { 
        alert("Please enter at least 2 characters."); 
        return; 
      }

      suggestionBox.innerHTML = '<div style="padding:15px; color:#aaa;">Searching...</div>';
      suggestionBox.style.display = "block";

      const colRef = collection(db, "customers");
      let snapshot;

      try {
        // Strategy 1: Search by ID
        const qId = query(colRef, where("id", ">=", term.toUpperCase()), where("id", "<=", term.toUpperCase() + '\uf8ff'), limit(5));
        snapshot = await getDocs(qId);

        // Strategy 2: If no ID found, Search by Name
        if (snapshot.empty) {
          const qName = query(colRef, where("name", ">=", term), where("name", "<=", term + '\uf8ff'), limit(5));
          snapshot = await getDocs(qName);
        }

        suggestionBox.innerHTML = "";
        
        if (snapshot.empty) {
          suggestionBox.innerHTML = '<div style="padding:15px; color:#ef4444;">No customer found.</div>';
          return;
        }

        snapshot.forEach(docSnap => {
          const c = docSnap.data();
          const div = document.createElement("div");
          div.className = "suggestion-item";
          div.innerHTML = `
            <span class="s-name">${c.name}</span> 
            <span class="s-id">${c.id}</span>
          `;
          div.onclick = () => loadCustomer(c);
          suggestionBox.appendChild(div);
        });
      } catch (e) {
        suggestionBox.innerHTML = `<div style="padding:15px; color:red;">Error: ${e.message}</div>`;
      }
    };

    // --- 2. LOAD CUSTOMER & CHECK PENDING LOGS ---
    async function loadCustomer(c) {
      selectedCustomer = c;
      
      document.getElementById("custName").innerText = c.name;
      document.getElementById("custId").innerText = `ID: ${c.id}`;
      document.getElementById("custPhone").innerText = `Ph: ${c.phone || 'N/A'}`;
      
      searchBox.value = "";
      suggestionBox.style.display = "none";
      document.getElementById("customerInfo").classList.remove("hidden");
      document.getElementById("postSaveActions").classList.add("hidden"); // Hide actions on new load

      const dropdown = document.getElementById("productDropdown");
      dropdown.innerHTML = "";
      
      c.products.forEach((p, idx) => {
        const option = document.createElement("option");
        option.value = idx;
        option.text = p.name;
        dropdown.appendChild(option);
      });
      
      await updateProductDetails(0);
      dropdown.onchange = (e) => updateProductDetails(e.target.value);
    }

    // --- 3. CALCULATE STATS (DB + PENDING LOGS) ---
    async function updateProductDetails(index) {
      selectedProductIndex = parseInt(index);
      const p = selectedCustomer.products[index];
      
      // 1. Paid in Database
      const dbPaid = (p.payments || []).reduce((sum, pay) => sum + pay.amount, 0);
      
      // 2. Paid in Pending Agent Logs
      pendingLogsPaid = 0;
      let pendingLogsCount = 0;

      try {
        const logsQ = query(
          collection(db, "temp_entries"), 
          where("customerId", "==", selectedCustomer.id),
          where("productName", "==", p.name),
          where("status", "==", "pending")
        );
        const logSnap = await getDocs(logsQ);
        logSnap.forEach(doc => {
          pendingLogsPaid += parseFloat(doc.data().amount || 0);
          pendingLogsCount++;
        });
      } catch(e) {
        console.warn("Could not check pending logs:", e);
      }

      // 3. Final Calculations
      existingPaid = dbPaid + pendingLogsPaid;
      const balance = p.total - existingPaid;
      
      // Due Logic: Max DB Due + Count of Pending Entries
      const dbMaxDue = (p.payments || []).length > 0 
        ? Math.max(...p.payments.map(x => x.dueNumber || 0)) 
        : 0;
      
      calculatedNextDue = dbMaxDue + pendingLogsCount + 1; 

      document.getElementById("dispTotal").innerText = `₹${p.total}`;
      document.getElementById("dispPaid").innerText = `₹${existingPaid}`;
      document.getElementById("dispBal").innerText = `₹${balance}`;
      document.getElementById("dispDue").innerText = `#${calculatedNextDue}`;
    }

    // --- 4. SAVE ENTRY ---
    window.saveToTempCollection = async () => {
      const amount = parseFloat(document.getElementById("amount").value);
      const date = document.getElementById("date").value;

      if (!amount || amount <= 0) return alert("❌ Enter valid amount");
      if (!date) return alert("❌ Select date");

      const btn = document.getElementById("btnSave");
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = "Processing...";

      try {
        const p = selectedCustomer.products[selectedProductIndex];
        
        const entryData = {
          customerId: selectedCustomer.id,
          customerName: selectedCustomer.name,
          customerPhone: selectedCustomer.phone,
          productName: p.name,
          productIndex: selectedProductIndex, 
          amount: amount,
          date: date,
          dueNumber: calculatedNextDue, 
          status: "pending", 
          timestamp: serverTimestamp(), 
          agentEntry: true
        };

        await addDoc(collection(db, "temp_entries"), entryData);

        showToast("Entry Saved!");
        
        // Prepare Receipt Data
        lastBalance = p.total - (existingPaid + amount);
        lastReceiptData = entryData;
        
        // Render Receipt on Hidden Canvas immediately for future use
        drawReceiptToCanvas(lastReceiptData, lastBalance);

        // UI Updates
        document.getElementById("amount").value = "";
        btn.innerHTML = "✅ Saved";
        
        // Show Print/Download Options
        document.getElementById("postSaveActions").classList.remove("hidden");

        // Reload data to update due count
        await updateProductDetails(selectedProductIndex);

      } catch (e) {
        console.error(e);
        alert("Error saving: " + e.message);
      } finally {
        setTimeout(() => {
          btn.disabled = false;
          btn.innerHTML = originalText;
        }, 2000);
      }
    };

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    // --- 5. RECEIPT LOGIC (CANVAS) ---
    function drawReceiptToCanvas(data, balance) {
      const canvas = document.getElementById('receiptCanvas');
      const size = 800; // Square format
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // 1. Background (White)
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, size, size);

      // 2. Borders & Decoration (Brand Green)
      ctx.strokeStyle = "#10b981"; 
      ctx.lineWidth = 15;
      ctx.strokeRect(0, 0, size, size);

      // 3. Header
      ctx.font = "bold 50px Arial";
      ctx.fillStyle = "#000000";
      ctx.textAlign = "center";
      ctx.fillText("Meena Groups", size/2, 100);

      ctx.font = "30px Arial";
      ctx.fillStyle = "#10b981"; 
      ctx.fillText("PAYMENT RECEIPT", size/2, 150);

      // 4. Details
      const startX = 80;
      let currentY = 250;
      const gap = 55;

      ctx.textAlign = "left";
      ctx.font = "bold 32px Courier New";
      
      function drawRow(label, value, valueColor="#000") {
        ctx.fillStyle = "#555"; 
        ctx.fillText(label, startX, currentY);
        ctx.fillStyle = valueColor;
        ctx.textAlign = "right";
        ctx.fillText(value, size - 80, currentY);
        ctx.textAlign = "left";
        currentY += gap;
      }

      drawRow("Date:", data.date);
      drawRow("Customer:", data.customerName.substring(0, 15));
      drawRow("ID:", data.customerId, "#3b82f6"); 
      currentY += 10;
      drawRow("Due No:", `#${data.dueNumber}`);
      
      // Amount Highlight
      ctx.fillStyle = "rgba(16, 185, 129, 0.1)"; 
      ctx.fillRect(50, currentY - 35, size - 100, 80);
      ctx.strokeStyle = "#10b981";
      ctx.lineWidth = 2;
      ctx.strokeRect(50, currentY - 35, size - 100, 80);
      
      ctx.fillStyle = "#000";
      ctx.fillText("PAID AMOUNT:", 70, currentY+15);
      ctx.textAlign = "right";
      ctx.font = "bold 45px Courier New";
      ctx.fillStyle = "#10b981"; 
      ctx.fillText(`Rs.${data.amount}`, size - 70, currentY+15);
      ctx.textAlign = "left";
      currentY += 100;

      ctx.font = "bold 32px Courier New";
      drawRow("Balance:", `Rs.${balance}`, "#ef4444");

      // 5. Signature & Footer
      currentY += 80;
      ctx.font = "italic bold 35px Brush Script MT";
      ctx.fillStyle = "#3b82f6";
      ctx.textAlign = "center";
      ctx.fillText("Goorac Digital Verified", size/2, currentY);

      currentY += 60;
      ctx.font = "20px Arial";
      ctx.fillStyle = "#666";
      ctx.fillText("Visit meena.goorac.biz for live status", size/2, currentY);
    }

    // --- 6. DOWNLOAD / PRINT ACTIONS ---
    window.downloadLastReceipt = () => {
      const canvas = document.getElementById('receiptCanvas');
      const link = document.createElement('a');
      link.download = `Receipt_${lastReceiptData.customerId}_${lastReceiptData.dueNumber}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    };

    window.printLastReceipt = () => {
      const canvas = document.getElementById('receiptCanvas');
      const dataUrl = canvas.toDataURL('image/png');
      
      // Open Image in New Window
      const win = window.open('');
      win.document.write(`
        <html>
