<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent App - Collection Entry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">

  <style>
    /* * ==========================================
     * 1. CORE THEME & VARIABLES
     * ==========================================
     */
    :root { 
      /* Dark Mode Palette */
      --bg: #020617; 
      --surface: #0f172a; 
      --card: #1e293b; 
      --input: #1e293b;
      
      /* Neon Accents for High Visibility */
      --primary: #10b981; /* Success Green */
      --primary-dim: rgba(16, 185, 129, 0.1);
      
      --accent: #3b82f6;  /* Action Blue */
      --accent-dim: rgba(59, 130, 246, 0.1);
      
      --danger: #ef4444;  /* Alert Red */
      --danger-dim: rgba(239, 68, 68, 0.1);
      
      --warn: #f59e0b;    /* Warning Orange */
      
      /* Typography */
      --text: #f1f5f9; 
      --text-muted: #64748b;
      --border: #334155; 
      
      /* Shadows */
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      --glow-primary: 0 0 15px rgba(16, 185, 129, 0.3);
    }
    
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
      outline: none; 
    }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      margin: 0; 
      padding: 0; 
      /* Changed from 90px to 20px since Nav is removed */
      padding-bottom: 20px; 
      height: 100vh;
      overflow-y: auto;
    }

    /* * ==========================================
     * 2. HEADER SECTION
     * ==========================================
     */
    header {
      background: rgba(15, 23, 42, 0.9); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 15px 20px; 
      border-bottom: 1px solid var(--border);
      position: sticky; 
      top: 0; 
      z-index: 50; 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }
    
    header h1 { 
      margin: 0; 
      font-size: 1.1rem; 
      font-weight: 700; 
      color: #fff; 
      letter-spacing: 0.5px; 
      text-transform: uppercase;
    }
    
    .agent-status { 
      font-size: 0.75rem; 
      color: var(--primary); 
      background: var(--primary-dim); 
      padding: 4px 12px; 
      border-radius: 20px; 
      font-weight: 600; 
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .status-dot {
      width: 8px; height: 8px; background: var(--primary); border-radius: 50%;
      box-shadow: 0 0 5px var(--primary);
    }

    /* * ==========================================
     * 3. SEARCH SECTION
     * ==========================================
     */
    .search-wrapper { 
      padding: 20px 20px 10px 20px; 
      position: relative; 
      z-index: 40; 
    }
    
    .input-group { 
      position: relative; 
      display: flex; 
      align-items: center; 
    }
    
    .search-input {
      width: 100%; 
      padding: 14px 50px 14px 15px; /* Right padding for button */
      background: var(--card); 
      border: 1px solid var(--border);
      color: white; 
      border-radius: 14px; 
      font-size: 1rem;
      transition: all 0.3s ease; 
      box-shadow: var(--shadow-sm);
    }
    
    .search-input:focus { 
      border-color: var(--accent); 
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); 
    }
    
    .search-btn { 
      position: absolute; 
      right: 8px; 
      top: 50%; 
      transform: translateY(-50%); 
      background: var(--accent); 
      border: none; 
      color: white;
      width: 36px; 
      height: 36px; 
      border-radius: 10px; 
      cursor: pointer;
      display: flex; 
      align-items: center; 
      justify-content: center;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4); 
      transition: all 0.2s;
    }
    
    .search-btn:active { 
      transform: translateY(-50%) scale(0.9); 
    }
    
    .search-btn svg { 
      width: 20px; 
      height: 20px; 
      fill: white; 
    }

    /* Suggestions List */
    #suggestions {
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 12px;
      margin-top: 8px; 
      max-height: 300px; 
      overflow-y: auto;
      position: absolute; 
      width: calc(100% - 40px); 
      left: 20px; 
      z-index: 100;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
      display: none; /* Hidden by default */
    }
    
    .suggestion-item { 
      padding: 15px; 
      border-bottom: 1px solid var(--border); 
      cursor: pointer; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      transition: background 0.2s;
    }
    
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:active { background: #334155; }
    
    .s-name { 
      font-weight: 600; 
      color: #fff; 
      display: block; 
      font-size: 0.95rem;
    }
    
    .s-id { 
      font-size: 0.8rem; 
      color: var(--accent); 
      font-family: monospace; 
      background: var(--accent-dim); 
      padding: 4px 8px; 
      border-radius: 4px; 
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    /* * ==========================================
     * 4. MAIN CONTENT (CUSTOMER CARD)
     * ==========================================
     */
    .main-content { 
      padding: 10px 20px; 
    }
    
    .customer-card { 
      background: var(--card); 
      border-radius: 18px; 
      border: 1px solid var(--border); 
      overflow: hidden; 
      animation: slideUp 0.4s ease-out; 
      box-shadow: var(--shadow-lg);
    }
    
    .hidden { 
      display: none !important; 
    }

    .card-header { 
      padding: 20px; 
      background: linear-gradient(to right, rgba(255,255,255,0.03), transparent); 
      border-bottom: 1px solid var(--border);
    }
    
    .cust-name { 
      margin: 0; 
      font-size: 1.3rem; 
      font-weight: 700; 
      color: #fff; 
    }
    
    .cust-meta { 
      margin-top: 8px; 
      font-size: 0.9rem; 
      color: var(--text-muted); 
      display: flex; 
      gap: 15px; 
      font-family: monospace;
    }

    .card-body { 
      padding: 20px; 
    }

    /* Form Fields */
    label { 
      display: block; 
      color: var(--text-muted); 
      font-size: 0.85rem; 
      margin-bottom: 8px; 
      font-weight: 500; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .custom-select {
      width: 100%; 
      padding: 14px; 
      background: #0f172a; 
      border: 1px solid var(--border);
      color: white; 
      border-radius: 10px; 
      font-size: 1rem; 
      margin-bottom: 20px; 
      appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23007CB2%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 15px top 50%;
      background-size: 12px auto;
    }
    
    .custom-select:focus { border-color: var(--accent); }

    /* Info Grid */
    .stats-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 12px; 
      margin-bottom: 25px;
    }
    
    .stat-box { 
      background: #0f172a; 
      padding: 15px; 
      border-radius: 12px; 
      border: 1px solid var(--border);
      display: flex; 
      flex-direction: column; 
      align-items: center;
      text-align: center;
    }
    
    .stat-label { 
      font-size: 0.7rem; 
      color: var(--text-muted); 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
      margin-bottom: 5px;
    }
    
    .stat-val { 
      font-size: 1.2rem; 
      font-weight: 700; 
      color: #fff; 
      font-family: monospace;
    }
    
    /* Dynamic Colors for Stats */
    .val-due { color: var(--warn); text-shadow: 0 0 10px rgba(245, 158, 11, 0.2); }
    .val-bal { color: var(--danger); text-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
    .val-paid { color: var(--primary); text-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }

    /* Input Row */
    .input-row { 
      display: grid; 
      grid-template-columns: 1.5fr 1fr; 
      gap: 15px; 
      margin-bottom: 25px; 
    }
    
    .input-field {
      width: 100%; 
      padding: 14px; 
      background: #0f172a; 
      border: 1px solid var(--border);
      color: white; 
      border-radius: 10px; 
      font-size: 1.1rem; 
      font-weight: 600;
      transition: 0.2s;
    }
    
    .input-field:focus { 
      border-color: var(--primary); 
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); 
    }

    /* * ==========================================
     * 5. BUTTONS & ACTIONS
     * ==========================================
     */
    .btn-save {
      width: 100%; 
      padding: 16px; 
      background: var(--primary); 
      color: #000;
      border: none; 
      border-radius: 12px; 
      font-weight: 800; 
      font-size: 1rem;
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px;
      box-shadow: var(--glow-primary); 
      transition: transform 0.1s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .btn-save:active { transform: scale(0.98); }
    .btn-save:disabled { background: var(--text-muted); opacity: 0.5; box-shadow: none; }

    /* Action Buttons (Print/Download) - Hidden by default */
    .action-row { 
      display: flex; 
      gap: 12px; 
      margin-top: 20px; 
      padding-top: 20px;
      border-top: 1px dashed var(--border);
      animation: fadeIn 0.5s ease-out;
    }
    
    .btn-action { 
      flex: 1; 
      padding: 14px; 
      border-radius: 12px; 
      border: none; 
      font-weight: 700; 
      cursor: pointer;
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
      font-size: 0.9rem;
      transition: 0.2s;
    }
    
    .btn-print { 
      background: var(--secondary); 
      color: white; 
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3); 
    }
    
    .btn-download { 
      background: var(--surface); 
      border: 1px solid var(--border); 
      color: var(--text); 
    }
    .btn-download:hover { border-color: var(--text-muted); }

    /* * ==========================================
     * 7. UTILITIES & ANIMATIONS
     * ==========================================
     */
    .toast {
      position: fixed; 
      bottom: 50px; /* Adjusted since Nav is gone */
      left: 50%; 
      transform: translateX(-50%) translateY(20px);
      background: #10b981; 
      color: #000; 
      padding: 12px 24px; 
      border-radius: 50px;
      font-weight: bold; 
      opacity: 0; 
      pointer-events: none; 
      transition: 0.3s; 
      z-index: 200;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes slideUp { 
      from { opacity: 0; transform: translateY(20px); } 
      to { opacity: 1; transform: translateY(0); } 
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Collection Entry</h1>
    <div class="agent-status">
      <div class="status-dot"></div>
      Online
    </div>
  </header>

  <div class="search-wrapper">
    <div class="input-group">
      <input type="text" id="searchBox" class="search-input" placeholder="Search ID or Name..." autocomplete="off">
      <button class="search-btn" onclick="executeSearch()">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
    <div id="suggestions"></div>
  </div>

  <main class="main-content">
    
    <div id="customerInfo" class="customer-card hidden">
      
      <div class="card-header">
        <h2 class="cust-name" id="custName">Customer Name</h2>
        <div class="cust-meta">
          <span id="custId">ID: --</span>
          <span>•</span>
          <span id="custPhone">Ph: --</span>
        </div>
      </div>

      <div class="card-body">
        
        <label>Select Product / Loan</label>
        <select id="productDropdown" class="custom-select"></select>

        <div class="stats-grid">
          <div class="stat-box">
            <span class="stat-label">Total Value</span>
            <span class="stat-val" id="dispTotal">-</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Paid So Far</span>
            <span class="stat-val val-paid" id="dispPaid">-</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Next Due #</span>
            <span class="stat-val val-due" id="dispDue">-</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Balance</span>
            <span class="stat-val val-bal" id="dispBal">-</span>
          </div>
        </div>

        <div class="input-row">
          <div>
            <label>Amount (₹)</label>
            <input type="number" id="amount" class="input-field" placeholder="0">
          </div>
          <div>
            <label>Date</label>
            <input type="date" id="date" class="input-field">
          </div>
        </div>

        <button id="btnSave" class="btn-save" onclick="saveToTempCollection()">
          <svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
          CONFIRM & SAVE
        </button>

        <div id="postSaveActions" class="action-row hidden">
          <button class="btn-action btn-print" onclick="printLastReceipt()">
            <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24"><path d="M19 8h-1V3H6v5H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zM8 5h8v3H8V5zm8 12v2H8v-4h8v2zm2-2v-2H6v2H4v-4c0-.55.45-1 1-1h14c.55 0 1 .45 1 1v4h-2z"/><circle cx="18" cy="11.5" r="1"/></svg>
            Print Receipt
          </button>
          <button class="btn-action btn-download" onclick="downloadLastReceipt()">
            <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Save IMG
          </button>
        </div>

      </div>
    </div>
  </main>

  <div id="toast" class="toast">Entry Saved Successfully!</div>

  <canvas id="receiptCanvas" style="display:none;"></canvas>

  <script type="module">
    import { db } from "./config.js";
    import { 
      collection, query, where, getDocs, limit, addDoc, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // --- STATE VARIABLES ---
    let selectedCustomer = null;
    let selectedProductIndex = 0;
    let calculatedNextDue = 0;
    let existingPaid = 0;
    let pendingLogsPaid = 0;
    
    // Receipt Data
    let lastReceiptData = null;
    let lastBalance = 0;

    // --- 1. SMART SEARCH LOGIC (Manual Trigger) ---
    const searchBox = document.getElementById("searchBox");
    const suggestionBox = document.getElementById("suggestions");

    // Allow Enter key to trigger search
    searchBox.addEventListener("keypress", (e) => {
      if (e.key === "Enter") executeSearch();
    });

    window.executeSearch = async () => {
      const term = searchBox.value.trim();
      if (term.length < 2) { 
        alert("Please enter at least 2 characters."); 
        return; 
      }

      suggestionBox.innerHTML = '<div style="padding:15px; color:#aaa;">Searching Database...</div>';
      suggestionBox.style.display = "block";

      const colRef = collection(db, "customers");
      let snapshot;

      try {
        // Strategy 1: Search by ID (Exact or Range)
        const qId = query(colRef, where("id", ">=", term.toUpperCase()), where("id", "<=", term.toUpperCase() + '\uf8ff'), limit(5));
        snapshot = await getDocs(qId);

        // Strategy 2: If no ID found, Search by Name
        if (snapshot.empty) {
          const qName = query(colRef, where("name", ">=", term), where("name", "<=", term + '\uf8ff'), limit(5));
          snapshot = await getDocs(qName);
        }

        suggestionBox.innerHTML = "";
        
        if (snapshot.empty) {
          suggestionBox.innerHTML = '<div style="padding:15px; color:#ef4444;">No customer found.</div>';
          return;
        }

        snapshot.forEach(docSnap => {
          const c = docSnap.data();
          const div = document.createElement("div");
          div.className = "suggestion-item";
          div.innerHTML = `
            <span class="s-name">${c.name}</span> 
            <span class="s-id">${c.id}</span>
          `;
          div.onclick = () => loadCustomer(c);
          suggestionBox.appendChild(div);
        });
      } catch (e) {
        suggestionBox.innerHTML = `<div style="padding:15px; color:red;">Error: ${e.message}</div>`;
      }
    };

    // --- 2. LOAD CUSTOMER ---
    async function loadCustomer(c) {
      selectedCustomer = c;
      
      document.getElementById("custName").innerText = c.name;
      document.getElementById("custId").innerText = `ID: ${c.id}`;
      document.getElementById("custPhone").innerText = `Ph: ${c.phone || 'N/A'}`;
      
      searchBox.value = "";
      suggestionBox.style.display = "none";
      document.getElementById("customerInfo").classList.remove("hidden");
      document.getElementById("postSaveActions").classList.add("hidden"); // Ensure actions hidden on new load

      // Populate Products
      const dropdown = document.getElementById("productDropdown");
      dropdown.innerHTML = "";
      
      c.products.forEach((p, idx) => {
        const option = document.createElement("option");
        option.value = idx;
        option.text = p.name;
        dropdown.appendChild(option);
      });
      
      await updateProductDetails(0);
      dropdown.onchange = (e) => updateProductDetails(e.target.value);
    }

    // --- 3. CALCULATE STATS (With Pending Logic) ---
    async function updateProductDetails(index) {
      selectedProductIndex = parseInt(index);
      const p = selectedCustomer.products[index];
      
      // 1. Paid in Database
      const dbPaid = (p.payments || []).reduce((sum, pay) => sum + pay.amount, 0);
      
      // 2. Check for Pending Entries in Agent Log to avoid duplicate dues
      pendingLogsPaid = 0;
      let pendingLogsCount = 0;

      try {
        const logsQ = query(
          collection(db, "temp_entries"), 
          where("customerId", "==", selectedCustomer.id),
          where("productName", "==", p.name),
          where("status", "==", "pending")
        );
        const logSnap = await getDocs(logsQ);
        logSnap.forEach(doc => {
          pendingLogsPaid += parseFloat(doc.data().amount || 0);
          pendingLogsCount++;
        });
      } catch(e) {
        console.warn("Log check failed:", e);
      }

      // 3. Final Calculations
      existingPaid = dbPaid + pendingLogsPaid;
      const balance = p.total - existingPaid;
      
      // Due Logic: Max DB Due + Count of Pending Entries
      const dbMaxDue = (p.payments || []).length > 0 
        ? Math.max(...p.payments.map(x => x.dueNumber || 0)) 
        : 0;
      
      calculatedNextDue = dbMaxDue + pendingLogsCount + 1; 

      // Update UI Stats
      document.getElementById("dispTotal").innerText = `₹${p.total}`;
      document.getElementById("dispPaid").innerText = `₹${existingPaid}`;
      document.getElementById("dispBal").innerText = `₹${balance}`;
      document.getElementById("dispDue").innerText = `#${calculatedNextDue}`;
    }

    // --- 4. SAVE ENTRY ---
    window.saveToTempCollection = async () => {
      const amount = parseFloat(document.getElementById("amount").value);
      const date = document.getElementById("date").value;

      if (!amount || amount <= 0) return alert("❌ Enter valid amount");
      if (!date) return alert("❌ Select date");

      const btn = document.getElementById("btnSave");
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = "Processing...";

      try {
        const p = selectedCustomer.products[selectedProductIndex];
        
        const entryData = {
          customerId: selectedCustomer.id,
          customerName: selectedCustomer.name,
          customerPhone: selectedCustomer.phone,
          productName: p.name,
          productIndex: selectedProductIndex, 
          amount: amount,
          date: date,
          dueNumber: calculatedNextDue, 
          status: "pending", 
          timestamp: serverTimestamp(), 
          agentEntry: true
        };

        await addDoc(collection(db, "temp_entries"), entryData);

        showToast("Entry Saved Successfully!");
        
        // Prepare Receipt Data
        lastBalance = p.total - (existingPaid + amount);
        lastReceiptData = entryData;
        
        // Render Receipt on Hidden Canvas (Pre-load)
        drawReceiptToCanvas(lastReceiptData, lastBalance);

        // Update UI
        document.getElementById("amount").value = "";
        btn.innerHTML = "✅ SAVED";
        
        // Show Print/Download Buttons ONLY NOW
        document.getElementById("postSaveActions").classList.remove("hidden");

        // Refresh stats (increment due number locally)
        await updateProductDetails(selectedProductIndex);

      } catch (e) {
        console.error(e);
        alert("Error saving: " + e.message);
      } finally {
        setTimeout(() => {
          btn.disabled = false;
          btn.innerHTML = `
            <svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
            CONFIRM & SAVE`;
        }, 2000);
      }
    };

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    // --- 5. THERMAL RECEIPT LOGIC (Pocket Printer 58mm) ---
    function drawReceiptToCanvas(data, balance) {
      const canvas = document.getElementById('receiptCanvas');
      
      // 58mm printer width usually maps to approx 384px at standard DPI
      const width = 384; 
      const height = 650; // Dynamic height based on content
      
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      // 1. Background: Pure White (Critical for Thermal)
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);

      // 2. Text Settings: Pure Black
      ctx.fillStyle = "#000000";
      ctx.textAlign = "center";

      // 3. Header
      ctx.font = "bold 26px monospace"; // Adjusted for narrower width
      ctx.fillText("MEENA GROUPS", width/2, 40);
      
      ctx.font = "18px monospace";
      ctx.fillText("PAYMENT RECEIPT", width/2, 70);
      
      // Separator Line
      ctx.beginPath();
      ctx.moveTo(10, 85);
      ctx.lineTo(width-10, 85);
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 2;
      ctx.stroke();

      // 4. Details (Left Aligned)
      ctx.textAlign = "left";
      ctx.font = "bold 18px monospace"; // Readable on small paper
      let y = 115;
      const gap = 35; // Tighter vertical spacing

      // Helper for rows
      function drawRow(label, value) {
        ctx.fillText(label, 15, y);
        ctx.textAlign = "right";
        ctx.fillText(value, width-15, y);
        ctx.textAlign = "left";
        y += gap;
      }

      drawRow("DATE:", data.date);
      drawRow("ID:", data.customerId);
      // Truncate name further for 58mm width
      drawRow("NAME:", data.customerName.substring(0, 10).toUpperCase()); 
      drawRow("DUE#:", `#${data.dueNumber}`);
      
      // Separator
      y += 10;
      ctx.beginPath();
      ctx.moveTo(10, y);
      ctx.lineTo(width-10, y);
      ctx.stroke();
      y += 40;

      // 5. Amount (Big & Bold)
      ctx.textAlign = "center";
      ctx.font = "bold 20px monospace";
      ctx.fillText("RECEIVED AMOUNT", width/2, y);
      y += 40;
      
      ctx.font = "bold 42px monospace"; // Big for visibility
      ctx.fillText(`Rs.${data.amount}`, width/2, y);
      y += 50;
      
      ctx.font = "bold 20px monospace";
      ctx.fillText(`BAL: Rs.${balance}`, width/2, y);
      y += 60;

      // 6. Footer
      ctx.font = "italic 16px monospace";
      ctx.fillText("Goorac Digital Verified", width/2, y);
      y += 25;
      ctx.font = "14px monospace";
      ctx.fillText("meena.goorac.biz", width/2, y);
      
      // End padding for tear-off
    }

    // --- 6. PRINT & DOWNLOAD ACTIONS ---
    window.downloadLastReceipt = () => {
      const canvas = document.getElementById('receiptCanvas');
      const link = document.createElement('a');
      link.download = `Receipt_${lastReceiptData.customerId}_${lastReceiptData.dueNumber}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    };

    window.printLastReceipt = () => {
      const canvas = document.getElementById('receiptCanvas');
      const dataUrl = canvas.toDataURL('image/png');
      
      // Open Image in New Window for System Print Dialog
      // Optimized for mobile: renders image at 100% width
      const win = window.open('');
      win.document.write(`
        <html>
          <head>
            <title>Print Receipt</title>
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <style>
              body { margin: 0; padding: 0; display: flex; justify-content: center; background: #eee; }
              /* Force image to fit 58mm paper visually on phone screen, but print actual size */
              img { width: 100%; max-width: 384px; height: auto; }
            </style>
          </head>
          <body>
            <img src="${dataUrl}" onload="setTimeout(function(){window.print();}, 500);">
          </body>
        </html>
      `);
    };

    // Set Today's Date
    document.getElementById("date").value = new Date().toISOString().split("T")[0];

  </script>
</body>
</html>
