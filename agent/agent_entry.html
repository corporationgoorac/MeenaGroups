<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent App - Add Collection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">

  <style>
    /* --- PREMIUM DARK AGENT THEME --- */
    :root { 
      --bg: #020617; 
      --surface: #0f172a; 
      --card: #1e293b; 
      --input: #1e293b;
      
      --primary: #10b981; /* Success Green */
      --accent: #3b82f6;  /* Action Blue */
      --danger: #ef4444;  /* Alert Red */
      --warn: #f59e0b;    /* Warning Orange */
      
      --text: #f1f5f9; 
      --text-muted: #64748b;
      --border: #334155; 
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      background: var(--bg); color: var(--text); 
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
      margin: 0; padding: 0; 
      padding-bottom: 90px; /* Space for Bottom Nav */
    }

    /* --- GLASS HEADER --- */
    header {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
      padding: 15px 20px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    .agent-status { font-size: 0.75rem; color: var(--primary); background: rgba(16, 185, 129, 0.15); padding: 4px 10px; border-radius: 20px; font-weight: 600; }

    /* --- SEARCH SECTION --- */
    .search-wrapper { padding: 20px; position: relative; z-index: 40; }
    
    .input-group { position: relative; }
    .search-input {
      width: 100%; padding: 14px 15px 14px 45px;
      background: var(--card); border: 1px solid var(--border);
      color: white; border-radius: 14px; font-size: 1rem;
      transition: 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
    .search-icon { 
      position: absolute; left: 15px; top: 50%; transform: translateY(-50%); 
      color: var(--text-muted); font-size: 1.2rem; pointer-events: none;
    }

    /* Suggestions List */
    #suggestions {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      margin-top: 8px; max-height: 300px; overflow-y: auto;
      position: absolute; width: calc(100% - 40px); left: 20px; z-index: 100;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: none;
    }
    .suggestion-item { 
      padding: 15px; border-bottom: 1px solid var(--border); 
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .suggestion-item:active { background: #334155; }
    .s-name { font-weight: 600; color: #fff; display: block; }
    .s-id { font-size: 0.8rem; color: var(--accent); font-family: monospace; background: rgba(59, 130, 246, 0.1); padding: 2px 6px; border-radius: 4px; }

    /* --- CUSTOMER CARD --- */
    .main-content { padding: 0 20px; }
    
    .customer-card { 
      background: var(--card); border-radius: 18px; border: 1px solid var(--border); 
      overflow: hidden; animation: slideUp 0.4s ease-out; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .hidden { display: none; }

    .card-header { 
      padding: 20px; background: linear-gradient(to right, rgba(255,255,255,0.03), transparent); 
      border-bottom: 1px solid var(--border);
    }
    .cust-name { margin: 0; font-size: 1.3rem; font-weight: 700; color: #fff; }
    .cust-meta { margin-top: 5px; font-size: 0.9rem; color: var(--text-muted); display: flex; gap: 10px; font-family: monospace; }

    .card-body { padding: 20px; }

    /* Form Fields */
    label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px; font-weight: 500; }
    
    .custom-select {
      width: 100%; padding: 14px; background: #0f172a; border: 1px solid var(--border);
      color: white; border-radius: 10px; font-size: 1rem; margin-bottom: 20px; appearance: none;
    }

    /* Info Grid */
    .stats-grid { 
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;
    }
    .stat-box { 
      background: #0f172a; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      display: flex; flex-direction: column; 
    }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-val { font-size: 1.1rem; font-weight: 700; margin-top: 4px; color: #fff; }
    
    .val-due { color: var(--warn); }
    .val-bal { color: var(--danger); }
    .val-paid { color: var(--primary); }

    /* Input Row */
    .input-row { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; margin-bottom: 20px; }
    
    .input-field {
      width: 100%; padding: 14px; background: #0f172a; border: 1px solid var(--border);
      color: white; border-radius: 10px; font-size: 1.1rem; font-weight: 600;
    }
    .input-field:focus { border-color: var(--primary); }

    /* Save Button */
    .btn-save {
      width: 100%; padding: 16px; background: var(--primary); color: #000;
      border: none; border-radius: 12px; font-weight: 800; font-size: 1rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); transition: transform 0.1s;
    }
    .btn-save:active { transform: scale(0.98); }
    .btn-save:disabled { background: var(--text-muted); opacity: 0.5; }

    /* --- BOTTOM NAV --- */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 10px 0; z-index: 100;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }
    
    .nav-item {
      text-decoration: none; color: var(--text-muted); font-size: 0.7rem;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 5px; width: 33%;
    }
    .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
    .nav-item.active { color: var(--accent); }
    .nav-item.active svg { fill: var(--accent); filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.5)); }

    /* --- TOAST --- */
    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #10b981; color: #000; padding: 12px 24px; border-radius: 50px;
      font-weight: bold; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 200;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header>
    <h1>New Collection</h1>
    <div class="agent-status">● Online</div>
  </header>

  <div class="search-wrapper">
    <div class="input-group">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchBox" class="search-input" placeholder="Search ID or Name..." autocomplete="off">
    </div>
    <div id="suggestions"></div>
  </div>

  <main class="main-content">
    <div id="customerInfo" class="customer-card hidden">
      
      <div class="card-header">
        <h2 class="cust-name" id="custName">Customer Name</h2>
        <div class="cust-meta">
          <span id="custId">ID: --</span>
          <span>|</span>
          <span id="custPhone">Ph: --</span>
        </div>
      </div>

      <div class="card-body">
        
        <label>Select Product / Loan</label>
        <select id="productDropdown" class="custom-select"></select>

        <div class="stats-grid">
          <div class="stat-box">
            <span class="stat-label">Total Value</span>
            <span class="stat-val" id="dispTotal">-</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Paid So Far</span>
            <span class="stat-val val-paid" id="dispPaid">-</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Next Due #</span>
            <span class="stat-val val-due" id="dispDue">-</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Balance</span>
            <span class="stat-val val-bal" id="dispBal">-</span>
          </div>
        </div>

        <div class="input-row">
          <div>
            <label>Amount (₹)</label>
            <input type="number" id="amount" class="input-field" placeholder="0">
          </div>
          <div>
            <label>Date</label>
            <input type="date" id="date" class="input-field">
          </div>
        </div>

        <button id="btnSave" class="btn-save" onclick="saveToTempCollection()">
          <svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
          SAVE ENTRY
        </button>

      </div>
    </div>
  </main>

  <div id="toast" class="toast">Entry Saved Successfully!</div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </a>
    <a href="agent_entry.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M13 7h-2v4H7v2h4v4h2v-4h4v-2h-4V7zm-1-5C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
      <span>Collect</span>
    </a>
    <a href="agent_view.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      <span>Logs</span>
    </a>
  </nav>

  <script type="module">
    import { db } from "./config.js";
    import { 
      collection, query, where, getDocs, limit, addDoc, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    let selectedCustomer = null;
    let selectedProductIndex = 0;
    let calculatedNextDue = 0;

    // --- 1. SMART SEARCH LOGIC (ID & NAME) ---
    const searchBox = document.getElementById("searchBox");
    const suggestionBox = document.getElementById("suggestions");

    searchBox.addEventListener("input", async (e) => {
      const term = e.target.value.trim();
      if (term.length < 2) { suggestionBox.style.display = "none"; return; }

      const colRef = collection(db, "customers");
      let snapshot;

      // Strategy 1: Search by ID
      const qId = query(colRef, where("id", ">=", term.toUpperCase()), where("id", "<=", term.toUpperCase() + '\uf8ff'), limit(5));
      snapshot = await getDocs(qId);

      // Strategy 2: If no ID found, Search by Name (Case sensitive in Firestore, assumes Capitalized)
      if (snapshot.empty) {
        const qName = query(colRef, where("name", ">=", term), where("name", "<=", term + '\uf8ff'), limit(5));
        snapshot = await getDocs(qName);
      }

      suggestionBox.innerHTML = "";
      
      if (snapshot.empty) {
        suggestionBox.style.display = "none";
        return;
      }

      snapshot.forEach(docSnap => {
        const c = docSnap.data();
        const div = document.createElement("div");
        div.className = "suggestion-item";
        div.innerHTML = `
          <span class="s-name">${c.name}</span> 
          <span class="s-id">${c.id}</span>
        `;
        div.onclick = () => loadCustomer(c);
        suggestionBox.appendChild(div);
      });
      suggestionBox.style.display = "block";
    });

    // --- 2. LOAD CUSTOMER ---
    function loadCustomer(c) {
      selectedCustomer = c;
      
      // UI Update
      document.getElementById("custName").innerText = c.name;
      document.getElementById("custId").innerText = `ID: ${c.id}`;
      document.getElementById("custPhone").innerText = `Ph: ${c.phone || 'N/A'}`;
      
      // Cleanup
      searchBox.value = "";
      suggestionBox.style.display = "none";
      document.getElementById("customerInfo").classList.remove("hidden");

      // Product Dropdown
      const dropdown = document.getElementById("productDropdown");
      dropdown.innerHTML = "";
      
      c.products.forEach((p, idx) => {
        const option = document.createElement("option");
        option.value = idx;
        option.text = p.name;
        dropdown.appendChild(option);
      });
      
      updateProductDetails(0); // Trigger Calc
      dropdown.onchange = (e) => updateProductDetails(e.target.value);
    }

    // --- 3. CALCULATE STATS ---
    function updateProductDetails(index) {
      selectedProductIndex = parseInt(index);
      const p = selectedCustomer.products[index];
      
      const paid = (p.payments || []).reduce((sum, pay) => sum + pay.amount, 0);
      const balance = p.total - paid;
      
      // Due Number Logic
      const lastDue = (p.payments || []).length > 0 
        ? Math.max(...p.payments.map(x => x.dueNumber || 0)) 
        : 0;
      
      calculatedNextDue = lastDue + 1; 

      document.getElementById("dispTotal").innerText = `₹${p.total}`;
      document.getElementById("dispPaid").innerText = `₹${paid}`;
      document.getElementById("dispBal").innerText = `₹${balance}`;
      document.getElementById("dispDue").innerText = `#${calculatedNextDue}`;
    }

    // --- 4. SAVE ENTRY ---
    window.saveToTempCollection = async () => {
      const amount = parseFloat(document.getElementById("amount").value);
      const date = document.getElementById("date").value;

      if (!amount || amount <= 0) return alert("❌ Enter valid amount");
      if (!date) return alert("❌ Select date");

      const btn = document.getElementById("btnSave");
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = "Saving...";

      try {
        const p = selectedCustomer.products[selectedProductIndex];
        
        const entryData = {
          customerId: selectedCustomer.id,
          customerName: selectedCustomer.name,
          customerPhone: selectedCustomer.phone,
          productName: p.name,
          productIndex: selectedProductIndex, 
          amount: amount,
          date: date,
          dueNumber: calculatedNextDue, 
          status: "pending", 
          timestamp: serverTimestamp(), 
          agentEntry: true
        };

        await addDoc(collection(db, "temp_entries"), entryData);

        showToast("Entry Saved Successfully!");
        
        // Reset
        document.getElementById("customerInfo").classList.add("hidden");
        document.getElementById("amount").value = "";
        selectedCustomer = null;

      } catch (e) {
        console.error(e);
        alert("Error saving: " + e.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    };

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    // Set Today's Date
    document.getElementById("date").value = new Date().toISOString().split("T")[0];

  </script>
</body>
</html>
