<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings - Meena Groups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="manifest" href="manifest.json">
  <meta name="robots" content="noindex, nofollow">

  <style>
    /* --- YOUTUBE DARK MATERIAL THEME --- */
    :root { 
      --bg: #0f0f0f; 
      --surface: #0f0f0f; 
      --surface-light: #212121;
      --primary: #ff4e45; /* Meena Groups Red */
      --text-main: #ffffff; 
      --text-sec: #aaaaaa;
      --border: #333333; 
      --accent: #3ea6ff; /* YouTube Blue */
      --glass: #1a1a1a;
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      background: var(--bg); 
      color: var(--text-main); 
      font-family: 'Roboto', 'Segoe UI', sans-serif; 
      margin: 0; padding: 0; 
      padding-bottom: 80px;
      overflow-x: hidden;
    }

    /* --- APP BAR --- */
    header { 
      background: #0f0f0f;
      padding: 15px 20px; 
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid var(--border);
    }
    
    .brand { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.5px; }
    .brand span:first-child { color: #ffffff; }
    .brand span:last-child { color: var(--primary); }

    /* --- SETTINGS CONTENT --- */
    .settings-container { 
      padding: 15px; 
      max-width: 500px; 
      margin: 0 auto;
    }

    .profile-hero {
      background: #000000;
      border-radius: 0px; /* Sharp, flat look */
      padding: 40px 20px;
      text-align: center;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .user-avatar {
      width: 90px; height: 90px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      margin-bottom: 15px;
      object-fit: cover;
      background: var(--surface-light);
      font-size: 0;
    }

    .user-name { font-size: 1.6rem; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
    .user-email { color: var(--text-sec); font-size: 0.9rem; font-weight: 400; }

    /* --- FORM SECTION --- */
    .settings-group {
      background: #0f0f0f;
      padding: 20px 5px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .group-title {
      font-size: 0.8rem; color: #ffffff;
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 20px; display: block; font-weight: 700;
    }

    label { display: block; color: var(--text-sec); font-size: 0.75rem; margin-bottom: 10px; font-weight: 700; text-transform: uppercase; }

    .input-field {
      width: 100%;
      background: #121212;
      border: 1px solid #333333;
      color: #fff;
      padding: 16px;
      border-radius: 4px; /* YouTube Style Square Input */
      font-size: 1rem;
      margin-bottom: 20px;
    }

    .input-field:focus { 
      border-color: var(--accent); 
    }

    .btn-save {
      width: 100%;
      background: var(--accent);
      color: #0f0f0f;
      border: none;
      padding: 12px;
      border-radius: 20px; /* YouTube Capsule Style */
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-transform: none;
    }

    .btn-logout {
      width: 100%;
      background: transparent;
      color: #ffffff;
      border: 1px solid #333333;
      padding: 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 10px;
    }

    /* --- BOTTOM NAV --- */
    .bottom-nav { 
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: #0f0f0f; 
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; 
      padding: 10px 0; z-index: 1000;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }
    
    .nav-item { 
      display: flex; flex-direction: column; align-items: center; 
      text-decoration: none; color: #aaaaaa; font-size: 0.65rem; gap: 5px;
      padding: 5px; width: 25%;
    }
    .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
    .nav-item.active { color: #ffffff; }
    .nav-item.active svg { fill: #ffffff; }

    .toast {
      position: fixed; bottom: 80px; left: 0; right: 0;
      background: #212121; color: #ffffff; padding: 15px;
      text-align: center; font-size: 0.9rem; font-weight: 400;
      display: none; z-index: 2000;
      border-top: 1px solid var(--accent);
    }
  </style>
</head>
<body>

  <script>
    const cachedUser = JSON.parse(localStorage.getItem('goorac_staff_user') || '{}');
    window.addEventListener('DOMContentLoaded', () => {
      if (cachedUser.name) {
        document.getElementById('displayName').innerText = cachedUser.name;
        document.getElementById('displayEmail').innerText = cachedUser.email;
        document.getElementById('nameInput').value = cachedUser.name;
        const pic = document.getElementById('displayPic');
        pic.src = cachedUser.photo || 'https://www.gstatic.com/images/branding/product/2x/avatar_circle_blue_120dp.png';
      }
    });
  </script>

  <header>
    <div class="brand">
      <span>Meena</span><span>Groups</span>
    </div>
    <div style="font-size: 0.75rem; font-weight: 700; color: #ffffff; text-transform: uppercase;">Settings</div>
  </header>

  <div class="settings-container">
    
    <div class="profile-hero">
      <img src="https://www.gstatic.com/images/branding/product/2x/avatar_circle_blue_120dp.png" id="displayPic" class="user-avatar" alt="Profile" onerror="this.src='https://www.gstatic.com/images/branding/product/2x/avatar_circle_blue_120dp.png'">
      <div class="user-name" id="displayName">Loading profile...</div>
      <div class="user-email" id="displayEmail">---</div>
    </div>

    <div class="settings-group">
      <span class="group-title">Account</span>
      
      <label>Display Name</label>
      <input type="text" id="nameInput" class="input-field" placeholder="Full name">
      
      <button class="btn-save" id="btnUpdate">Update name</button>
    </div>

    <div class="settings-group">
      <span class="group-title">Session</span>
      <button class="btn-logout" id="btnLogout">Sign out</button>
    </div>

    <div style="text-align: center; color: #333333; font-size: 0.65rem; font-weight: 700; margin-top: 20px; text-transform: uppercase; letter-spacing: 2px;">
      v2.1.0 • GOORAC SYSTEMS
    </div>

  </div>

  <div id="toast" class="toast">Profile updated successfully</div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </a>
    <a href="agent_entry.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M13 7h-2v4H7v2h4v4h2v-4h4v-2h-4V7zm-1-5C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
      <span>Collect</span>
    </a>
    <a href="agent_view.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      <span>Logs</span>
    </a>
    <a href="settings.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7-4.42 1.79-1.43c.16-.13.21-.36.1-.55l-1.71-2.96c-.1-.19-.33-.25-.52-.18l-2.11.85c-.44-.34-.92-.62-1.44-.83l-.32-2.24c-.03-.2-.2-.34-.4-.34h-3.42c-.2 0-.37.14-.4.34l-.32 2.24c-.52.21-1 .49-1.44.83l-2.11-.85c-.19-.07-.42-.01-.52.18L4.11 9.1c-.11.19-.06.42.1.55L6 11.08c-.06.3-.08.62-.08.92 0 .3.02.62.08.92l-1.79 1.43c-.16.13-.21.36-.1.55l1.71 2.96c.1.19.33.25.52.18l2.11-.85c.44.34.92.62 1.44.83l.32 2.24c.03.2.2.34.4.34h3.42c.2 0 .37.14.4.34l.32-2.24c.52-.21 1-.49 1.44-.83l2.11.85c.19.07.42.01.52-.18l1.71-2.96c.1-.19.06-.42-.1-.55L18 12.92c.06-.3.08-.62.08-.92 0-.3-.02-.62-.08-.92z"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <script type="module">
    import { auth } from "./config.js";
    import { onAuthStateChanged, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

    const nameInput = document.getElementById('nameInput');
    const updateBtn = document.getElementById('btnUpdate');
    const logoutBtn = document.getElementById('btnLogout');
    const displayPic = document.getElementById('displayPic');

    // --- ENHANCED AUTH LISTENER WITH CACHING ---
    onAuthStateChanged(auth, (user) => {
      if (user) {
        const photo = user.photoURL || 'https://www.gstatic.com/images/branding/product/2x/avatar_circle_blue_120dp.png';
        const name = user.displayName || 'Staff Member';
        
        displayPic.src = photo;
        document.getElementById('displayName').innerText = name;
        document.getElementById('displayEmail').innerText = user.email;
        nameInput.value = name;

        // Save to LocalStorage for instant next-load
        localStorage.setItem('goorac_staff_user', JSON.stringify({
          name: name,
          email: user.email,
          photo: photo
        }));

      } else {
        // Clear cache on logout
        localStorage.removeItem('goorac_staff_user');
        window.location.href = "login.html";
      }
    });

    // Update Profile
    updateBtn.addEventListener('click', async () => {
      const newName = nameInput.value.trim();
      if (!newName) return alert("Enter a name");

      updateBtn.disabled = true;
      const originalText = updateBtn.innerText;
      updateBtn.innerText = "Syncing...";

      try {
        await updateProfile(auth.currentUser, { displayName: newName });
        document.getElementById('displayName').innerText = newName;
        
        // Update local cache immediately
        const cached = JSON.parse(localStorage.getItem('goorac_staff_user') || '{}');
        cached.name = newName;
        localStorage.setItem('goorac_staff_user', JSON.stringify(cached));

        // Success Toast
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);

      } catch (e) {
        alert("Sync Error: " + e.message);
      } finally {
        updateBtn.disabled = false;
        updateBtn.innerText = originalText;
      }
    });

    // Logout logic
    logoutBtn.addEventListener('click', async () => {
      if(confirm("Sign out from this device?")) {
        localStorage.removeItem('goorac_staff_user');
        await signOut(auth);
        window.location.href = "login.html";
      }
    });
  </script>
</body>
</html>
