<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent Dashboard - Meena Groups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="manifest" href="manifest.json">
 
  <meta name="robots" content="noindex, nofollow">

  <style>
    /* --- YOUTUBE DARK MATERIAL THEME --- */
    :root { 
      --bg: #0f0f0f; 
      --surface: #272727; 
      --surface-light: #3f3f3f;
      --primary: #3ea6ff; /* YouTube Blue */
      --text-main: #f1f1f1; 
      --text-sec: #aaaaaa;
      --border: #3f3f3f; 
      --danger: #ff4e45;
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      background: var(--bg); 
      color: var(--text-main); 
      font-family: Roboto, 'Segoe UI', sans-serif; 
      margin: 0; padding: 0; 
      padding-bottom: 80px; /* Space for bottom nav */
    }

    /* --- APP BAR --- */
    header { 
      background: rgba(15, 15, 15, 0.98);
      padding: 15px 20px; 
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo-circle { 
      width: 32px; height: 32px; background: var(--primary); 
      border-radius: 50%; display: flex; align-items: center; justify-content: center; 
      font-weight: bold; color: #000; font-size: 1.2rem;
    }
    .app-name { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.5px; }
    .agent-badge { 
      font-size: 0.7rem; background: var(--surface-light); 
      color: var(--text-sec); padding: 4px 8px; border-radius: 4px; 
      font-weight: 500; text-transform: uppercase;
    }

    /* --- NEW HEADER PROFILE PIC --- */
    .profile-pic-header {
      width: 34px; height: 34px; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--primary);
      font-size: 0; background: var(--surface-light);
      cursor: pointer; transition: transform 0.2s;
    }
    .profile-pic-header:active { transform: scale(0.9); }

    /* --- ANALYTICS CARD (Hero) --- */
    .dashboard-container { padding: 20px; }

    .hero-card { 
      background: var(--surface); 
      border-radius: 16px; 
      padding: 25px; 
      display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 25px;
      position: relative; overflow: hidden;
    }
    
    .hero-label { font-size: 0.9rem; color: var(--text-sec); margin-bottom: 5px; }
    .hero-amount { font-size: 2.8rem; font-weight: 700; color: var(--text-main); letter-spacing: -1px; }
    
    /* --- NEW CSS FOR SPLIT STATS --- */
    .split-stats {
      display: flex; width: 100%; justify-content: space-around;
      margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);
    }
    .stat-col { text-align: center; }
    .stat-title { font-size: 0.8rem; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .stat-value-cash { font-size: 1.3rem; font-weight: 700; color: #2ba640; } /* Green for Cash */
    .stat-value-online { font-size: 1.3rem; font-weight: 700; color: #3ea6ff; } /* Blue for Online */

    .hero-sub { 
      margin-top: 15px; font-size: 0.8rem; color: var(--primary); 
      background: rgba(62, 166, 255, 0.1); padding: 5px 12px; border-radius: 20px;
    }

    /* --- QUICK ACTIONS GRID --- */
    .section-title { 
      font-size: 1rem; font-weight: 700; margin-bottom: 15px; 
      color: var(--text-main); padding: 0 5px;
    }

    .grid-actions { 
      display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
    }
    
    .action-tile { 
      background: var(--surface); 
      border-radius: 12px; 
      padding: 20px; 
      text-decoration: none; 
      display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
      height: 110px; 
      transition: background 0.2s;
      border: 1px solid transparent;
    }
    .action-tile:active { background: var(--surface-light); }
    
    .tile-icon { 
      width: 40px; height: 40px; border-radius: 50%; 
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 10px;
    }
    .tile-icon svg { width: 22px; height: 22px; fill: #000; }
    
    /* Icon Colors */
    .icon-add { background: #2ba640; /* Green */ }
    .icon-view { background: #3ea6ff; /* Blue */ }
    .icon-rep { background: #f4b400; /* Yellow */ }
    .icon-adm { background: #ff4e45; /* Red */ }

    .tile-text { font-size: 0.95rem; font-weight: 500; color: var(--text-main); }

    /* --- INSTALL TOAST --- */
    #installPrompt {
      position: fixed; bottom: 85px; left: 15px; right: 15px;
      background: var(--primary); color: #000;
      padding: 15px 20px; border-radius: 8px; 
      display: none; align-items: center; justify-content: space-between;
      z-index: 2000; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      animation: slideUp 0.4s ease-out;
    }
    #installPrompt span { font-weight: 600; font-size: 0.9rem; }
    #installPrompt button {
      background: #000; color: #fff; border: none;
      padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer;
    }

    /* --- BOTTOM NAV --- */
    .bottom-nav { 
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: var(--bg); border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; 
      padding: 8px 0; z-index: 1000;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }
    
    .nav-item { 
      display: flex; flex-direction: column; align-items: center; 
      text-decoration: none; color: var(--text-sec); font-size: 0.7rem; gap: 4px;
      padding: 5px; width: 25%;
    }
    .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
    .nav-item.active { color: #fff; }
    
    /* Footer Credit */
    .footer-credit { text-align: center; margin-top: 30px; color: #444; font-size: 0.8rem; }

    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* * ==========================================
     * NEW: SUPPORT MODAL & ACTION OVERLAYS 
     * ==========================================
     */
    .support-modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); backdrop-filter: blur(5px);
      display: none; align-items: center; justify-content: center; z-index: 3000;
      opacity: 0; transition: 0.3s;
    }
    .support-modal-overlay.active { display: flex; opacity: 1; }

    .support-card {
      background: var(--surface); width: 85%; max-width: 320px;
      padding: 30px 20px; border-radius: 20px; text-align: center;
      transform: translateY(20px); transition: 0.3s;
    }
    .support-modal-overlay.active .support-card { transform: translateY(0); }

    .support-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 25px; }
    .support-options { display: flex; flex-direction: column; gap: 15px; }

    .btn-support-action {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 15px; border-radius: 12px; border: none; font-weight: 700;
      font-size: 1rem; cursor: pointer; color: #fff; width: 100%;
    }
    .btn-call { background: #2ba640; }
    .btn-whatsapp { background: #25d366; }
    .btn-close-support { background: var(--surface-light); margin-top: 10px; color: var(--text-sec); }

    /* Fullscreen Delay Overlay */
    .action-loading-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: radial-gradient(circle, #272727 0%, #0f0f0f 100%);
      z-index: 4000; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 20px;
    }
    .action-loading-overlay.active { display: flex; }
    .loading-text { font-size: 1.4rem; font-weight: 800; color: #fff; margin-bottom: 20px; line-height: 1.4; }
    
    .spinner {
      width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
      border-top: 4px solid var(--primary); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* * ==========================================
     * 10. NEW: ADVANCED SHIMMER & PROGRESS UI
     * ==========================================
     */
    .shimmer {
      background: linear-gradient(90deg, #333 25%, #444 50%, #333 75%);
      background-size: 200% 100%;
      animation: shimmerEffect 1.5s infinite linear;
      border-radius: 12px;
      color: transparent !important;
      pointer-events: none;
      min-width: 120px;
    }

    @keyframes shimmerEffect {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .shimmer-small { height: 24px; min-width: 60px; display: inline-block; vertical-align: middle; }
    .shimmer-large { height: 48px; min-width: 180px; margin: 10px 0; }

    /* Powerful Progress Bar */
    .powerful-progress-container {
      width: 70%;
      height: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      margin-top: 40px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .powerful-progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #ffffff);
      box-shadow: 0 0 15px var(--primary);
      transition: width 4s linear; /* Explicit 4s match */
    }

    /* Connection Pulse Icon */
    .connection-pulse {
      width: 80px; height: 80px; border-radius: 50%;
      background: rgba(62, 166, 255, 0.1);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 30px; position: relative;
    }
    .connection-pulse::after {
      content: ''; position: absolute; width: 100%; height: 100%;
      border-radius: 50%; border: 2px solid var(--primary);
      animation: pulseIn 1.5s infinite;
    }
    @keyframes pulseIn { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }

    /* MONEY COIN ANIMATION */
    .money-loader {
      position: absolute; width: 100%; height: 100%;
      top: 0; left: 0; pointer-events: none; display: flex;
      justify-content: center; align-items: center;
    }
    .coin {
      width: 15px; height: 15px; background: #ffd700; border-radius: 50%;
      position: absolute; opacity: 0; border: 1px solid #b8860b;
      box-shadow: 0 0 5px rgba(255,215,0,0.5);
    }
    .c1 { animation: floatCoin 2s infinite ease-in; left: 30%; }
    .c2 { animation: floatCoin 2s infinite ease-in 0.5s; left: 50%; }
    .c3 { animation: floatCoin 2s infinite ease-in 1s; left: 70%; }

    @keyframes floatCoin {
      0% { transform: translateY(50px) rotateY(0deg); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-50px) rotateY(360deg); opacity: 0; }
    }

  </style>
</head>

  <script type="module">
    import { db, auth } from "./config.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

    // --- AUTHENTICATION LISTENER ---
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Ensure photo is updated/cached dynamically
        const currentPic = user.photoURL || 'https://www.gstatic.com/images/branding/product/2x/avatar_circle_blue_120dp.png';
        document.getElementById('headerProfilePic').src = currentPic;
        localStorage.setItem('goorac_user_pic', currentPic);
        
        // Pass the user's UID to load ONLY their stats
        loadTodayStats(user.uid);
      } else {
        // Kick them out if not logged in
        window.location.href = "login.html";
      }
    });

    // --- FETCH ALL DRAFTS FOR LOGGED IN STAFF (IGNORES DATE) ---
    async function loadTodayStats(uid) {
      const display = document.getElementById("todayTotal");
      const cashDisp = document.getElementById("todayCash");
      const onlineDisp = document.getElementById("todayOnline");
      const moneyAnim = document.getElementById("moneyAnim");
      
      try {
        // UPDATED: Now showing ALL drafts collection, removing the date filter
        const q = query(
          collection(db, "temp_entries"),
          where("status", "==", "draft"),
          where("staffUid", "==", uid) // <--- SECURE FILTER REMAINS
        );

        const snapshot = await getDocs(q);
        
        let total = 0;
        let cashTotal = 0;   // NEW LINE: Variables to store separated totals
        let onlineTotal = 0; // NEW LINE

        snapshot.forEach(doc => {
          // Safety check to ensure valid number
          const data = doc.data(); // NEW LINE: extract data object
          const amt = parseFloat(data.amount || 0);
          const paymentMode = data.paymentMode || "Cash"; // NEW LINE: Extract mode, default to Cash

          if(!isNaN(amt)) {
             total += amt;
             
             // NEW LINE: Increment the respective counters
             if (paymentMode.toLowerCase() === "online") {
                 onlineTotal += amt;
             } else {
                 cashTotal += amt;
             }
          }
        });

        // REMOVE SHIMMERS AND SHOW DATA
        display.classList.remove('shimmer', 'shimmer-large');
        cashDisp.classList.remove('shimmer', 'shimmer-small');
        onlineDisp.classList.remove('shimmer', 'shimmer-small');
        moneyAnim.style.display = 'none'; // Hide coins after load

        display.innerText = "₹" + total.toLocaleString();
        cashDisp.innerText = "₹" + cashTotal.toLocaleString();
        onlineDisp.innerText = "₹" + onlineTotal.toLocaleString();

      } catch (e) {
        console.error("Stats Error:", e);
        display.innerText = "Error";
        display.style.color = "#ff4e45";
      }
    }

    // --- NEW: SUPPORT MODAL & POWERFUL DELAY LOGIC ---
    const supportOverlay = document.getElementById('supportOverlay');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const supportBtn = document.getElementById('supportBtn');
    const pBar = document.getElementById('pBar');
    const actionIcon = document.getElementById('actionIcon');
    
    const PHONE_SVG = '<path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 1.25 0 2.45.2 3.57.57.35.13.46.52.24 1.02l-2.2 2.2z"/>';
    const WA_SVG = '<path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.539 2.016 2.126-.54c1.029.563 2.025.873 3.162.873h.001c3.181 0 5.767-2.586 5.768-5.766 0-3.18-2.587-5.766-5.769-5.766zm3.426 8.313c-.145.411-.833.748-1.159.794-.325.046-.733.076-1.159-.076-.27-.099-.617-.233-1.06-.42-1.884-.794-3.11-2.703-3.203-2.826-.094-.123-.765-.966-.765-1.841 0-.875.456-1.302.619-1.474.162-.171.353-.214.47-.214.118 0 .235 0 .338.005.112.005.254-.042.398.283.144.325.487 1.181.529 1.265.042.085.071.184.015.3-.056.115-.085.187-.17.283-.085.097-.177.214-.254.283-.085.085-.177.177-.076.354.102.177.452.748.966 1.211.662.595 1.226.78 1.403.87.177.085.283.071.382-.042.102-.115.438-.512.556-.685.118-.171.235-.145.398-.085.162.059 1.026.484 1.203.573.177.085.294.129.338.204.045.071.045.414-.1.825z"/>';

    // BACK BUTTON SUPPORT
    supportBtn.onclick = (e) => {
      e.preventDefault();
      supportOverlay.classList.add('active');
      history.pushState({ supportOpen: true }, ""); // Adds state for back button
    };

    function closeSupport() {
      supportOverlay.classList.remove('active');
    }

    document.getElementById('btnCloseSupport').onclick = () => {
       if (history.state && history.state.supportOpen) history.back();
       else closeSupport();
    };

    window.onpopstate = (e) => {
      if (supportOverlay.classList.contains('active')) closeSupport();
    };

    // CALL ACTION (4 SECONDS)
    document.getElementById('btnCallAction').onclick = () => {
      supportOverlay.classList.remove('active');
      loadingOverlay.classList.add('active');
      actionIcon.innerHTML = PHONE_SVG;
      loadingText.innerHTML = "Establishing secure connection with<br><b>Goorac Support Desk...</b>";
      
      pBar.style.width = '100%'; // Start 4s transition

      setTimeout(() => {
        loadingOverlay.classList.remove('active');
        pBar.style.width = '0%'; // Reset for next time
        window.location.href = "tel:9443042733";
      }, 4000);
    };

    // WHATSAPP ACTION (4 SECONDS)
    document.getElementById('btnWhatsAppAction').onclick = () => {
      supportOverlay.classList.remove('active');
      loadingOverlay.classList.add('active');
      actionIcon.innerHTML = WA_SVG;
      loadingText.innerHTML = "Redirecting to encrypted chat with<br><b>Goorac Corporation...</b>";
      
      pBar.style.width = '100%'; // Start 4s transition

      setTimeout(() => {
        loadingOverlay.classList.remove('active');
        pBar.style.width = '0%'; // Reset for next time
        window.location.href = "https://wa.me/919443042733";
      }, 4000);
    };

    // --- PWA INSTALLATION LOGIC ---
    let deferredPrompt;
    const installBtn = document.getElementById('btnInstall');
    const installPromptDiv = document.getElementById('installPrompt');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installPromptDiv.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('User accepted the install prompt');
        }
        deferredPrompt = null;
        installPromptDiv.style.display = 'none';
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registered'))
          .catch(err => console.log('SW Registration Failed', err));
      });
    }
  </script>
</body>
