<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent Dashboard - Meena Groups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="manifest" href="manifest.json">
  <style>
    /* --- YOUTUBE DARK MATERIAL THEME --- */
    :root { 
      --bg: #0f0f0f; 
      --surface: #272727; 
      --surface-light: #3f3f3f;
      --primary: #3ea6ff; /* YouTube Blue */
      --text-main: #f1f1f1; 
      --text-sec: #aaaaaa;
      --border: #3f3f3f; 
      --danger: #ff4e45;
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      background: var(--bg); 
      color: var(--text-main); 
      font-family: Roboto, 'Segoe UI', sans-serif; 
      margin: 0; padding: 0; 
      padding-bottom: 80px; /* Space for bottom nav */
    }

    /* --- APP BAR --- */
    header { 
      background: rgba(15, 15, 15, 0.98);
      padding: 15px 20px; 
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo-circle { 
      width: 32px; height: 32px; background: var(--primary); 
      border-radius: 50%; display: flex; align-items: center; justify-content: center; 
      font-weight: bold; color: #000; font-size: 1.2rem;
    }
    .app-name { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.5px; }
    .agent-badge { 
      font-size: 0.7rem; background: var(--surface-light); 
      color: var(--text-sec); padding: 4px 8px; border-radius: 4px; 
      font-weight: 500; text-transform: uppercase;
    }

    /* --- ANALYTICS CARD (Hero) --- */
    .dashboard-container { padding: 20px; }

    .hero-card { 
      background: var(--surface); 
      border-radius: 16px; 
      padding: 25px; 
      display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 25px;
    }
    
    .hero-label { font-size: 0.9rem; color: var(--text-sec); margin-bottom: 5px; }
    .hero-amount { font-size: 2.8rem; font-weight: 700; color: var(--text-main); letter-spacing: -1px; }
    .hero-sub { 
      margin-top: 10px; font-size: 0.8rem; color: var(--primary); 
      background: rgba(62, 166, 255, 0.1); padding: 5px 12px; border-radius: 20px;
    }

    /* --- NEW CSS FOR CASH & ONLINE SPLIT --- */
    .split-stats {
      display: flex; width: 100%; justify-content: space-between; align-items: center;
      margin-top: 25px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);
    }
    .split-stat { display: flex; flex-direction: column; align-items: center; width: 45%; }
    .split-label { font-size: 0.75rem; color: var(--text-sec); font-weight: 600; letter-spacing: 1px; margin-bottom: 5px; text-transform: uppercase; }
    .split-val { font-size: 1.3rem; font-weight: 700; color: var(--text-main); font-family: monospace; }
    .split-divider { width: 1px; height: 35px; background: rgba(255,255,255,0.1); }
    .split-val.cash { color: #2ba640; } /* Green for cash */
    .split-val.online { color: #3ea6ff; } /* Blue for online */

    /* --- QUICK ACTIONS GRID --- */
    .section-title { 
      font-size: 1rem; font-weight: 700; margin-bottom: 15px; 
      color: var(--text-main); padding: 0 5px;
    }

    .grid-actions { 
      display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
    }
    
    .action-tile { 
      background: var(--surface); 
      border-radius: 12px; 
      padding: 20px; 
      text-decoration: none; 
      display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
      height: 110px; 
      transition: background 0.2s;
      border: 1px solid transparent;
    }
    .action-tile:active { background: var(--surface-light); }
    
    .tile-icon { 
      width: 40px; height: 40px; border-radius: 50%; 
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 10px;
    }
    .tile-icon svg { width: 22px; height: 22px; fill: #000; }
    
    /* Icon Colors */
    .icon-add { background: #2ba640; /* Green */ }
    .icon-view { background: #3ea6ff; /* Blue */ }
    .icon-rep { background: #f4b400; /* Yellow */ }
    .icon-adm { background: #ff4e45; /* Red */ }

    .tile-text { font-size: 0.95rem; font-weight: 500; color: var(--text-main); }

    /* --- INSTALL TOAST --- */
    #installPrompt {
      position: fixed; bottom: 85px; left: 15px; right: 15px;
      background: var(--primary); color: #000;
      padding: 15px 20px; border-radius: 8px; 
      display: none; align-items: center; justify-content: space-between;
      z-index: 2000; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      animation: slideUp 0.4s ease-out;
    }
    #installPrompt span { font-weight: 600; font-size: 0.9rem; }
    #installPrompt button {
      background: #000; color: #fff; border: none;
      padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer;
    }

    /* --- BOTTOM NAV --- */
    .bottom-nav { 
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: var(--bg); border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; 
      padding: 8px 0; z-index: 1000;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }
    
    .nav-item { 
      display: flex; flex-direction: column; align-items: center; 
      text-decoration: none; color: var(--text-sec); font-size: 0.7rem; gap: 4px;
      padding: 5px; width: 25%;
    }
    .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
    .nav-item.active { color: #fff; }
    
    /* Footer Credit */
    .footer-credit { text-align: center; margin-top: 30px; color: #444; font-size: 0.8rem; }

    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo-circle">M</div>
      <span class="app-name">Meena Groups</span>
    </div>
    <span class="agent-badge">Agent Mode</span>
  </header>

  <div id="installPrompt">
    <span>Install App for easier access</span>
    <button id="btnInstall">Get</button>
  </div>

  <div class="dashboard-container">
    
    <div class="hero-card">
      <span class="hero-label">Today's Collection</span>
      <div class="hero-amount" id="todayTotal">Loading...</div>
      <div class="hero-sub">Synced with Server</div>

      <div class="split-stats">
        <div class="split-stat">
          <span class="split-label">Cash</span>
          <span class="split-val cash" id="todayCash">₹0</span>
        </div>
        <div class="split-divider"></div>
        <div class="split-stat">
          <span class="split-label">Online</span>
          <span class="split-val online" id="todayOnline">₹0</span>
        </div>
      </div>
      </div>

    <div class="section-title">Quick Actions</div>
    <div class="grid-actions">
      
      <a href="agent_entry.html" class="action-tile">
        <div class="tile-icon icon-add">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </div>
        <span class="tile-text">New Entry</span>
      </a>
      
      <a href="agent_view.html" class="action-tile">
        <div class="tile-icon icon-view">
          <svg viewBox="0 0 24 24"><path d="M14 17H4v2h10v-2zm6-8H4v2h16V9zM4 15h16v-2H4v2zM4 5v2h16V5H4z"/></svg>
        </div>
        <span class="tile-text">My Log</span>
      </a>

      <a href="agent_customer_report.html" class="action-tile">
        <div class="tile-icon icon-rep">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
        </div>
        <span class="tile-text">Reports</span>
      </a>

      <a href="#" class="action-tile" onclick="alert('Admin Contact: +91-XXXXXXXXXX')">
        <div class="tile-icon icon-adm">
          <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 1.25 0 2.45.2 3.57.57.35.13.46.52.24 1.02l-2.2 2.2z"/></svg>
        </div>
        <span class="tile-text">Support</span>
      </a>

    </div>

    <div class="footer-credit">Powered by Goorac Systems</div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </a>
    <a href="agent_entry.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M13 7h-2v4H7v2h4v4h2v-4h4v-2h-4V7zm-1-5C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
      <span>Entry</span>
    </a>
    <a href="agent_view.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      <span>History</span>
    </a>
    <a href="agent_customer_report.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M11.5 9C10.12 9 9 10.12 9 11.5s1.12 2.5 2.5 2.5 2.5-1.12 2.5-2.5S12.88 9 11.5 9zM20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-3.21 14.21l-2.91-2.91c-.69.44-1.51.7-2.39.7C9.01 16 7 13.99 7 11.5S9.01 7 11.5 7 16 9.01 16 11.5c0 .88-.26 1.69-.7 2.39l2.91 2.9-1.42 1.42z"/></svg>
      <span>Report</span>
    </a>
  </nav>

  <script type="module">
    import { db } from "./config.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // --- FETCH TODAY'S TOTAL (DRAFTS ONLY) ---
    async function loadTodayStats() {
      const display = document.getElementById("todayTotal");
      
      try {
        const todayStr = new Date().toISOString().split('T')[0];

        // Correctly filtering for "draft" status as requested
        const q = query(
          collection(db, "temp_entries"),
          where("date", "==", todayStr),
          where("status", "==", "draft") 
        );

        const snapshot = await getDocs(q);
        
        let total = 0;
        let cashTotal = 0;   // NEW VARIABLE
        let onlineTotal = 0; // NEW VARIABLE
        
        snapshot.forEach(doc => {
          // Safety check to ensure valid number
          const amt = parseFloat(doc.data().amount || 0);
          if(!isNaN(amt)) {
             total += amt;

             // NEW LOGIC TO SPLIT CASH AND ONLINE
             const mode = doc.data().paymentMode || "Cash"; // Fallback to Cash if mode is missing
             if(mode === "Online" || mode === "ONLINE / UPI") {
                onlineTotal += amt;
             } else {
                cashTotal += amt;
             }
          }
        });

        display.innerText = "₹" + total.toLocaleString();

        // NEW LOGIC TO UPDATE DOM WITH SPLIT AMOUNTS
        document.getElementById("todayCash").innerText = "₹" + cashTotal.toLocaleString();
        document.getElementById("todayOnline").innerText = "₹" + onlineTotal.toLocaleString();

      } catch (e) {
        console.error("Stats Error:", e);
        display.innerText = "Error";
        display.style.color = "#ff4e45";
      }
    }

    loadTodayStats();

    // --- PWA INSTALLATION LOGIC ---
    let deferredPrompt;
    const installBtn = document.getElementById('btnInstall');
    const installPromptDiv = document.getElementById('installPrompt');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installPromptDiv.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('User accepted the install prompt');
        }
        deferredPrompt = null;
        installPromptDiv.style.display = 'none';
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registered'))
          .catch(err => console.log('SW Registration Failed', err));
      });
    }
  </script>
</body>
</html>
