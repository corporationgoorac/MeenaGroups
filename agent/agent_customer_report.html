<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Report - Agent App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <link rel="manifest" href="manifest.json">
  
  <style>
    /* --- PREMIUM DARK AGENT THEME --- */
    :root { 
      --bg: #020617; 
      --surface: #0f172a; 
      --surface-light: #1e293b;
      --card: #1e293b; 
      --input: #1e293b;
      
      --primary: #10b981; /* Success Green */
      --secondary: #0ea5e9; /* Sky Blue */
      --accent: #3b82f6;  /* Action Blue */
      --danger: #ef4444;  /* Alert Red */
      --brand-red: #ff4e45; /* Goorac Brand Red */
      
      --text: #f1f5f9; 
      --text-muted: #64748b;
      --border: #334155; 
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      background: var(--bg); color: var(--text); 
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
      margin: 0; padding: 0; 
      padding-bottom: 90px; /* Space for Bottom Nav */
    }

    /* --- GLASS HEADER & LOGO --- */
    header {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
      padding: 15px 20px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    .report-badge { font-size: 0.7rem; color: var(--secondary); background: rgba(14, 165, 233, 0.15); padding: 4px 10px; border-radius: 20px; font-weight: 600; text-transform: uppercase; }

    /* New Brand Styles */
    .brand { display: flex; align-items: center; gap: 10px; }
    .app-name { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.5px; }
    .profile-pic-header {
      width: 34px; height: 34px; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--secondary);
      font-size: 0; background: var(--surface-light);
      cursor: pointer; transition: transform 0.2s;
    }
    .profile-pic-header:active { transform: scale(0.9); }

    /* --- SEARCH SECTION --- */
    .search-wrapper { padding: 20px; position: relative; z-index: 40; }
    
    .input-group { position: relative; display: flex; gap: 10px; }
    
    .search-input {
      width: 100%; padding: 14px 15px 14px 45px;
      background: var(--card); border: 1px solid var(--border);
      color: white; border-radius: 14px; font-size: 1rem;
      transition: 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .search-input:focus { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2); }
    
    .search-icon { 
      position: absolute; left: 15px; top: 50%; transform: translateY(-50%); 
      color: var(--text-muted); font-size: 1.2rem; pointer-events: none;
    }

    .btn-search {
      background: var(--secondary); color: white; border: none;
      padding: 0 20px; border-radius: 14px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3); transition: 0.2s;
    }
    .btn-search:active { transform: scale(0.95); }

    /* --- REPORT CONTAINER --- */
    .report-container { 
      display: none; padding: 0 20px; animation: slideUp 0.4s ease-out; 
    }

    /* Customer Profile Card */
    .profile-card {
      background: linear-gradient(135deg, var(--card) 0%, #0f172a 100%);
      border: 1px solid var(--border); border-radius: 16px; padding: 20px;
      margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    .profile-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
    .profile-name { font-size: 1.3rem; font-weight: 700; color: #fff; margin: 0; }
    .profile-id { font-size: 0.9rem; color: var(--secondary); font-family: monospace; background: rgba(14, 165, 233, 0.1); padding: 4px 8px; border-radius: 6px; }

    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .info-item { display: flex; flex-direction: column; }
    .info-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .info-val { font-size: 0.95rem; color: #eee; font-weight: 500; }

    /* Product & Ledger Cards */
    .product-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      margin-bottom: 20px; overflow: hidden;
    }
    
    .prod-header { 
      padding: 15px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .prod-title { font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    .prod-val { font-size: 0.85rem; color: var(--text-muted); }

    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    
    th { text-align: left; color: var(--text-muted); padding: 10px 15px; border-bottom: 1px solid var(--border); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; background: #151f32; }
    td { padding: 12px 15px; border-bottom: 1px solid #222; color: #ccc; }
    tr:last-child td { border-bottom: none; }
    
    /* Summary Strip */
    .summary-strip {
      padding: 12px 15px; background: #111; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;
    }
    .bal-text { color: var(--danger); font-weight: 700; font-size: 1rem; }
    .paid-text { color: var(--primary); font-weight: 600; }

    /* Download FAB */
    .fab-container { 
      position: fixed; bottom: 100px; right: 20px; z-index: 90;
    }
    .btn-pdf {
      background: var(--danger); color: white; border: none;
      padding: 14px 24px; border-radius: 50px; font-weight: 700; font-size: 0.95rem;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4); cursor: pointer;
      display: flex; align-items: center; gap: 8px; transition: transform 0.2s;
    }
    .btn-pdf:active { transform: scale(0.95); }

    /* Loading State */
    #loading { margin-top: 50px; }
    .spinner {
      width: 40px; height: 40px; border: 4px solid rgba(14, 165, 233, 0.3);
      border-radius: 50%; border-top-color: var(--secondary); margin: 0 auto 15px;
      animation: spin 1s ease-in-out infinite;
    }

    /* --- BOTTOM NAV --- */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 10px 0; z-index: 100;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }
    .nav-item {
      text-decoration: none; color: var(--text-muted); font-size: 0.7rem;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 5px; width: 25%;
    }
    .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
    .nav-item.active { color: var(--secondary); }
    .nav-item.active svg { fill: var(--secondary); filter: drop-shadow(0 0 8px rgba(14, 165, 233, 0.5)); }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <script>
    const cachedPic = localStorage.getItem('goorac_user_pic');
  </script>

  <header>
    <div class="brand">
      <span class="app-name"><span style="color: #ffffff;">Meena</span> <span style="color: var(--brand-red);">Groups</span></span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <div class="report-badge">Statement View</div>
      <a href="settings.html" style="display: flex; align-items: center;">
        <img id="headerProfilePic" class="profile-pic-header" alt="Profile" onerror="this.src='https://www.gstatic.com/images/branding/product/2x/avatar_circle_blue_120dp.png'">
        <script>
          if (cachedPic) {
            document.getElementById('headerProfilePic').src = cachedPic;
          } else {
            document.getElementById('headerProfilePic').src = 'https://www.gstatic.com/images/branding/product/2x/avatar_circle_blue_120dp.png';
          }
        </script>
      </a>
    </div>
  </header>

  <div class="search-wrapper">
    <div class="input-group">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchId" class="search-input" placeholder="Enter Customer ID...">
      <button class="btn-search" onclick="fetchCustomer()">Find</button>
    </div>
  </div>

  <div id="loading" style="display:none; text-align:center;">
    <div class="spinner"></div>
    <p style="color:#64748b; font-size:0.9rem;">Fetching Customer Data...</p>
  </div>

  <div id="reportArea" class="report-container">
    
    <div class="profile-card">
      <div class="profile-header">
        <h2 class="profile-name" id="rName">--</h2>
        <span class="profile-id" id="rId">--</span>
      </div>
      <div class="profile-grid">
        <div class="info-item">
          <span class="info-label">Phone Number</span>
          <span class="info-val" id="rPhone">--</span>
        </div>
        <div class="info-item">
          <span class="info-label">Location</span>
          <span class="info-val" id="rPlace">--</span>
        </div>
      </div>
    </div>

    <div id="productsArea"></div>

    <div class="fab-container">
      <button class="btn-pdf" onclick="downloadPDF()">
        <svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v2.5zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm10 5.5h1v-3h-1v3z"/></svg>
        Download PDF
      </button>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </a>
    <a href="agent_entry.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M13 7h-2v4H7v2h4v4h2v-4h4v-2h-4V7zm-1-5C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
      <span>Collect</span>
    </a>
    <a href="agent_view.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      <span>History</span>
    </a>
    <a href="agent_customer_report.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M11.5 9C10.12 9 9 10.12 9 11.5s1.12 2.5 2.5 2.5 2.5-1.12 2.5-2.5S12.88 9 11.5 9zM20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-3.21 14.21l-2.91-2.91c-.69.44-1.51.7-2.39.7C9.01 16 7 13.99 7 11.5S9.01 7 11.5 7 16 9.01 16 11.5c0 .88-.26 1.69-.7 2.39l2.91 2.9-1.42 1.42z"/></svg>
      <span>Report</span>
    </a>
  </nav>

  <script type="module">
    // IMPORT AUTH FROM CONFIG
    import { db, auth } from "./config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

    // --- 0. AUTHENTICATION LOGIC ADDED ---
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Securely update profile pic in background
        const currentPic = user.photoURL || 'https://www.gstatic.com/images/branding/product/2x/avatar_circle_blue_120dp.png';
        document.getElementById('headerProfilePic').src = currentPic;
        localStorage.setItem('goorac_user_pic', currentPic);
      } else {
        window.location.href = "login.html"; // Kick unauthenticated users out
      }
    });

    let currentCustomer = null;

    // --- 1. SEARCH CUSTOMER ---
    window.fetchCustomer = async () => {
      const id = document.getElementById("searchId").value.trim().toUpperCase();
      if (!id) return alert("Please enter a Customer ID");

      const loading = document.getElementById("loading");
      const reportArea = document.getElementById("reportArea");
      
      loading.style.display = "block";
      reportArea.style.display = "none";

      try {
        const docRef = doc(db, "customers", id);
        const docSnap = await getDoc(docRef);

        loading.style.display = "none";

        if (!docSnap.exists()) {
          alert("❌ Customer not found!");
          return;
        }

        currentCustomer = docSnap.data();
        renderReport(currentCustomer);

      } catch (e) {
        console.error(e);
        loading.style.display = "none";
        alert("Error: " + e.message);
      }
    };

    // --- 2. RENDER HTML REPORT ---
    function renderReport(c) {
      document.getElementById("rId").innerText = c.id;
      document.getElementById("rName").innerText = c.name;
      document.getElementById("rPhone").innerText = c.phone || 'N/A';
      document.getElementById("rPlace").innerText = c.place || 'N/A';

      const prodArea = document.getElementById("productsArea");
      prodArea.innerHTML = "";

      c.products.forEach(p => {
        let rows = "";
        let paidTotal = 0;
        
        // Sort payments by date
        const payments = (p.payments || []).sort((a,b) => new Date(a.date) - new Date(b.date));

        // Calculate running balance logic
        let runningBalance = p.total;

        payments.forEach(pay => {
          runningBalance -= pay.amount;
          paidTotal += pay.amount;
          
          rows += `
            <tr>
              <td style="color:#888;">#${pay.dueNumber || '-'}</td>
              <td>${pay.date}</td>
              <td style="color:var(--primary); font-weight:bold;">₹${pay.amount}</td>
              <td>₹${runningBalance}</td>
            </tr>
          `;
        });

        const currentBalance = p.total - paidTotal;

        const html = `
          <div class="product-card">
            <div class="prod-header">
              <span class="prod-title">
                <svg style="width:18px;height:18px;fill:#64748b" viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
                ${p.name}
              </span>
              <span class="prod-val">Val: ₹${p.total}</span>
            </div>
            
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr><th>Due</th><th>Date</th><th>Paid</th><th>Bal</th></tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>

            <div class="summary-strip">
              <span class="paid-text">Paid: ₹${paidTotal}</span>
              <span class="bal-text">Bal: ₹${currentBalance}</span>
            </div>
          </div>
        `;
        prodArea.innerHTML += html;
      });

      document.getElementById("reportArea").style.display = "block";
    }

    // --- 3. GENERATE PDF ---
    window.downloadPDF = () => {
      if (!currentCustomer) return;

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      // Brand Header
      doc.setFillColor(15, 23, 42); 
      doc.rect(0, 0, 210, 40, 'F');
      
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(22);
      doc.text("Meena Groups", 105, 20, { align: "center" });
      
      doc.setFontSize(10);
      doc.setTextColor(100);
      doc.text("Agent Report", 105, 28, { align: "center" });

      // Customer Info
      doc.setTextColor(0);
      doc.setFontSize(12);
      doc.text(`Customer ID: ${currentCustomer.id}`, 14, 50);
      doc.text(`Name: ${currentCustomer.name}`, 14, 56);
      doc.text(`Phone: ${currentCustomer.phone || '-'}`, 14, 62);
      doc.text(`Place: ${currentCustomer.place || '-'}`, 14, 68);

      let finalY = 75;

      currentCustomer.products.forEach(p => {
        let runningBalance = p.total;
        const bodyData = (p.payments || []).map(pay => {
          runningBalance -= pay.amount;
          return [
            `#${pay.dueNumber || '-'}`,
            pay.date,
            `Rs. ${pay.amount}`,
            `Rs. ${runningBalance}`
          ];
        });

        // Product Title
        doc.setFontSize(14);
        doc.setTextColor(14, 165, 233); // Secondary Color
        doc.text(`${p.name} (Total: Rs. ${p.total})`, 14, finalY);
        finalY += 5;

        // Table
        doc.autoTable({
          startY: finalY,
          head: [['Due', 'Date', 'Paid', 'Balance']],
          body: bodyData,
          theme: 'striped',
          headStyles: { fillColor: [15, 23, 42] },
          styles: { fontSize: 10 },
          margin: { left: 14, right: 14 }
        });

        finalY = doc.lastAutoTable.finalY + 15;
      });

      doc.save(`Report_${currentCustomer.id}.pdf`);
    };
  </script>
</body>
</html>
